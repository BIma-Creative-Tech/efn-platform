target-version = "py312"
line-length = 120
extend-exclude = ["services/odoo/oca"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[lint.per-file-ignores]
"services/odoo/addons/**/__manifest__.py" = ["B018"]
"services/odoo/addons/**/__init__.py" = ["F401"]
"**/tests/**" = ["S105", "S106", "S608"]

# Deploy ke staging (otomatis setelah build di main) dan prod (tag v*, dengan approval di GitHub Environment "production").
# Mekanisme: verifikasi signature cosign per image -> resolve DIGEST -> SSH ke host via WireGuard/bastion ->
# tulis secrets ke file -> compose pull & up BY DIGEST (SEC-10, R-S07/R-S08).
# Semua `uses:` dipin ke commit SHA 40 karakter (komentar = versi). Bump lewat Dependabot (github-actions).
name: Deploy

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: input = pilihan environment + tag image yang SUDAH dibangun/ditandatangani; tidak memengaruhi build (cosign verify).
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: "Image tag: sha-<7 hex> (build main) atau X.Y.Z / vX.Y.Z (rilis)"
        required: true

# Minimal: cosign verify keyless tidak butuh id-token; pull GHCR butuh packages:read. Job deploy menambah
# id-token: write untuk menandatangani bundel rilis (SEC-36).
permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve target
    # Deploy otomatis ke staging hanya bila host staging sudah disiapkan Superadmin (variable STAGING_DEPLOY_ENABLED=true);
    # tanpa itu setiap push ke main akan gagal di SSH/verifikasi (G16). Tag v* dan workflow_dispatch tidak terpengaruh.
    # SEC-82 (r9): workflow_run hanya dari run `push` ke main di repo ini (bukan pull_request / fork ber-branch `main`).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    # Tag v*: menunggu Build & Push commit yang sama (yang sendiri menunggu CI + Security, SEC-80) selesai.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read   # scripts/verify-commit-gates.sh (Actions API)
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      image_tag: ${{ steps.r.outputs.image_tag }}
      signer_ref: ${{ steps.r.outputs.signer_ref }}
      git_sha: ${{ steps.r.outputs.git_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # Input pengguna TIDAK diinterpolasi ke skrip; lewat env lalu divalidasi regex (SEC-10).
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          IN_ENV: ${{ inputs.environment }}
          IN_TAG: ${{ inputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) env_name="$IN_ENV"; tag="$IN_TAG"; sha="" ;;
            push)              env_name="production"; tag="$REF_NAME"; sha="$PUSH_SHA" ;;
            *)                 env_name="staging"; tag="sha-${RUN_SHA:0:7}"; sha="$RUN_SHA" ;;
          esac
          [[ "$env_name" =~ ^(staging|production)$ ]] || { echo "::error::environment tidak valid"; exit 1; }
          if [[ "$tag" =~ ^sha-([0-9a-f]{7})$ ]]; then
            # Build dari main: identitas penanda tangan = build-push.yml @ refs/heads/main
            signer_ref="refs/heads/main"
            ref_for_sha="${BASH_REMATCH[1]}"; build_branch="main"
          elif [[ "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            # Rilis: tag image = X.Y.Z (metadata-action semver), penanda tangan = build-push.yml @ refs/tags/vX.Y.Z
            tag="${BASH_REMATCH[1]}"
            signer_ref="refs/tags/v${tag}"
            ref_for_sha="v${tag}"; build_branch="v${tag}"
          else
            echo "::error::image_tag harus sha-<7 hex> atau X.Y.Z / vX.Y.Z"; exit 1
          fi
          if [[ "$env_name" == "production" && "$signer_ref" != refs/tags/v* ]]; then
            echo "::error::production hanya menerima image rilis bertanda tangan dari tag v*"; exit 1
          fi
          # SEC-82: SHA PENUH commit yang dideploy. workflow_run/push: dari event; dispatch: resolusi prefix/tag lewat
          # API (prefix ambigu -> API menolak -> gagal). Digest diikat ke SHA ini di cosign verify
          # (--certificate-github-workflow-sha): tabrakan prefix 7 hex tidak bisa memilih image commit lain.
          if [[ -z "$sha" ]]; then
            sha=$(gh api "repos/${REPO}/commits/${ref_for_sha}" --jq .sha) \
              || { echo "::error::commit untuk ${ref_for_sha} tidak ditemukan/ambigu"; exit 1; }
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA commit tidak valid"; exit 1; }
          if [[ "$signer_ref" == refs/heads/main && "$sha" != "${ref_for_sha}"* ]]; then
            echo "::error::SHA commit tidak cocok dengan tag image"; exit 1
          fi
          {
            echo "environment=$env_name"
            echo "image_tag=$tag"
            echo "signer_ref=$signer_ref"
            echo "git_sha=$sha"
            echo "build_branch=$build_branch"
          } >> "$GITHUB_OUTPUT"
      # SEC-80 (pertahanan berlapis, juga untuk workflow_dispatch): CI + Security commit yang dideploy = success, dan
      # Build & Push commit itu selesai success (tag v*: deploy dipicu bersamaan dengan build -> ditunggu di sini).
      - name: Gerbang rilis (CI, Security, Build & Push = success untuk commit ini)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.r.outputs.git_sha }}
          WAIT_MIN: ${{ github.event_name == 'push' && '110' || '5' }}
          # SEC-94: run Build & Push dengan ref yang tepat (main untuk sha-*, vX.Y.Z untuk rilis), bukan run apa pun
          BUILD_BRANCH: ${{ steps.r.outputs.build_branch }}
        run: >-
          bash scripts/verify-commit-gates.sh --sha "$SHA" --preset release --require "build-push.yml@${BUILD_BRANCH}"
          --timeout-min "$WAIT_MIN" --absent-min "$WAIT_MIN"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.environment }} (${{ needs.resolve.outputs.image_tag }})
    needs: resolve
    runs-on: ubuntu-24.04
    # id-token: write HANYA untuk cosign sign-blob keyless atas bundel rilis (SEC-36); diverifikasi efn-deploy di host.
    permissions:
      contents: read
      packages: read
      id-token: write
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: https://app.${{ vars.TRAEFIK_DOMAIN }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      # Package GHCR privat (repo privat): cosign verify butuh kredensial baca registry (GITHUB_TOKEN, packages: read).
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verifikasi signature lalu ambil DIGEST yang terverifikasi; host mem-pull digest itu (bukan tag) -> tidak ada
      # TOCTOU antara verifikasi dan pull (SEC-10). Identitas dikunci ke workflow + ref spesifik (bukan @.*) dan ke SHA
      # commit penuh (ekstensi sertifikat Fulcio "GitHub Workflow SHA", SEC-82 r9).
      - name: Verifikasi signature & resolve digest (R-S08)
        id: digests
        env:
          TAG: ${{ needs.resolve.outputs.image_tag }}
          SIGNER_REF: ${{ needs.resolve.outputs.signer_ref }}
          GIT_SHA: ${{ needs.resolve.outputs.git_sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153  # OWNER berasal dari env step, bukan salah ketik `owner`
          owner="${OWNER,,}"
          identity="https://github.com/${REPO}/.github/workflows/build-push.yml@${SIGNER_REF}"
          for svc in postgres odoo api-gateway superapp-web ai-ocr-worker etl minio metabase; do
            ref="ghcr.io/${owner}/${svc}:${TAG}"
            digest=$(cosign verify \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-sha "$GIT_SHA" \
                --certificate-github-workflow-repository "$REPO" \
                --output json "$ref" \
              | jq -r '[.[].critical.image."docker-manifest-digest"] | unique | if length == 1 then .[0] else error("digest ganda") end')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::digest tidak valid untuk $svc"; exit 1; }
            var="IMAGE_$(echo "$svc" | tr 'a-z-' 'A-Z_')"
            echo "${var}=ghcr.io/${owner}/${svc}@${digest}" >> "$GITHUB_OUTPUT"
            echo "OK ${svc} -> ${digest}"
          done

      # Kunci SSH ditulis ke file 0600 di runner (tanpa action pihak ketiga; webfactory/ssh-agent dihapus, SEC-10).
      - name: Kunci SSH & known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/efn_deploy )
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # SEC-36 (gelombang 9): TIDAK ada lagi rsync sebagai user deploy maupun `sudo bash -s`. Satu-satunya perintah
      # yang bisa dijalankan kunci SSH CI adalah wrapper root /usr/local/sbin/efn-deploy (forced command di
      # authorized_keys + sudoers tanpa argumen). Wrapper menerima arsip rilis yang DITANDATANGANI cosign keyless oleh
      # workflow ini (identitas deploy.yml @ ref yang diizinkan, dikonfigurasi root di /etc/efn/deploy.conf), lalu
      # menjalankan deploy.sh dari salinan milik root. Lihat scripts/host/efn-deploy, docs/runbooks/key-custody.md §4.
      # SEC-42 (gelombang 11): manifest efn-release.json DI DALAM arsip bertanda tangan: 7 digest image (hasil
      # verifikasi di atas), versi + seq monoton (run_number, anti-replay/downgrade di host), git sha, dan sidik jari
      # trust anchor PKI. Host (efn-deploy) mengambil IMAGE_* HANYA dari manifest, menjalankan `cosign verify` sendiri,
      # dan mencocokkan sidik jari dengan pin di /etc/efn/deploy.conf.
      - name: Bundel rilis (infra + scripts + etl-sql + manifest) & tanda tangan keyless
        env:
          APP_ENV: ${{ needs.resolve.outputs.environment }}
          VERSION: ${{ needs.resolve.outputs.image_tag }}
          SIGNER_REF: ${{ needs.resolve.outputs.signer_ref }}
          SEQ: ${{ github.run_number }}
          GIT_SHA: ${{ needs.resolve.outputs.git_sha }}
          EFN_PKI_ROOT_CRT: ${{ secrets.EFN_PKI_ROOT_CRT }}
          EFN_PKI_EXTRA_TRUST: ${{ secrets.EFN_PKI_EXTRA_TRUST }}
          IMAGE_POSTGRES: ${{ steps.digests.outputs.IMAGE_POSTGRES }}
          IMAGE_ODOO: ${{ steps.digests.outputs.IMAGE_ODOO }}
          IMAGE_API_GATEWAY: ${{ steps.digests.outputs.IMAGE_API_GATEWAY }}
          IMAGE_SUPERAPP_WEB: ${{ steps.digests.outputs.IMAGE_SUPERAPP_WEB }}
          IMAGE_AI_OCR_WORKER: ${{ steps.digests.outputs.IMAGE_AI_OCR_WORKER }}
          IMAGE_ETL: ${{ steps.digests.outputs.IMAGE_ETL }}
          IMAGE_MINIO: ${{ steps.digests.outputs.IMAGE_MINIO }}
          IMAGE_METABASE: ${{ steps.digests.outputs.IMAGE_METABASE }}
          # SEC-50: konfigurasi non-rahasia ikut DITANDATANGANI (manifest `config`); host menolaknya dari stdin.
          # Topologi host (TRAEFIK_DOMAIN, EFN_PUBLIC_BIND, EFN_WG_*, COMPOSE_PROFILES) TIDAK dari CI: dipin Superadmin
          # di /etc/efn/deploy.conf (docs/runbooks/key-custody.md §4c). Validasi: scripts/lib/deploy-validate.sh.
          CFG_ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          # Wajib eksplisit (tanpa default): production menolak mock (docs/04 §8.3)
          CFG_PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          CFG_PG_SUPERUSER: ${{ vars.PG_SUPERUSER || 'postgres' }}
          CFG_ETL_LOYALTY_RECON_NOT_BEFORE: ${{ vars.ETL_LOYALTY_RECON_NOT_BEFORE }}
          CFG_WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED || 'false' }}
          CFG_WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          CFG_WHATSAPP_OTP_TEMPLATE: ${{ vars.WHATSAPP_OTP_TEMPLATE || 'efn_otp' }}
          CFG_ACME_DNS_PROVIDER: ${{ vars.ACME_DNS_PROVIDER || 'cloudflare' }}
          CFG_ACME_DNS_TOKEN_ENV: ${{ vars.ACME_DNS_TOKEN_ENV || 'CF_DNS_API_TOKEN' }}
          # SEC-37: kosong = Let's Encrypt produksi; isi URL staging LE untuk uji perdana service acme-dns
          CFG_ACME_SERVER: ${{ vars.ACME_SERVER }}
          # production menolak false kecuali EFN_ALLOW_CONTROL_OFF di deploy.conf host
          CFG_RABBITMQ_STRICT_PERMISSIONS: ${{ vars.RABBITMQ_STRICT_PERMISSIONS || 'true' }}
          CFG_MARKET_SCOUT_PHOTO_RETENTION_DAYS: ${{ vars.MARKET_SCOUT_PHOTO_RETENTION_DAYS || '90' }}
          # W-19 (10 Okt 2026): baris mart 10 th, kolom pseudonim 5 th, koordinat Price Hunter 90 h, riwayat query Metabase 10 th
          CFG_CH_MART_RETENTION_YEARS: ${{ vars.CH_MART_RETENTION_YEARS || '10' }}
          CFG_CH_PSEUDONYM_RETENTION_YEARS: ${{ vars.CH_PSEUDONYM_RETENTION_YEARS }}
          CFG_CH_GEO_RETENTION_DAYS: ${{ vars.CH_GEO_RETENTION_DAYS }}
          CFG_MB_AUDIT_MAX_RETENTION_DAYS: ${{ vars.MB_AUDIT_MAX_RETENTION_DAYS }}
          # Teks consent aktif (docs/04 §8.9): versi = superapp-web lib/consent.ts, sha256 = UTF-8 body persis. Kosong -> grant consent 503.
          CFG_CONSENT_LOCATION_VERSION: ${{ vars.CONSENT_LOCATION_VERSION }}
          CFG_CONSENT_LOCATION_TEXT_SHA256: ${{ vars.CONSENT_LOCATION_TEXT_SHA256 }}
          CFG_CONSENT_MARKETING_VERSION: ${{ vars.CONSENT_MARKETING_VERSION }}
          CFG_CONSENT_MARKETING_TEXT_SHA256: ${{ vars.CONSENT_MARKETING_TEXT_SHA256 }}
          CFG_DSAR_DELETE_GRACE_DAYS: ${{ vars.DSAR_DELETE_GRACE_DAYS || '7' }}
          # R5/G12: kosong = job aktif otomatis setelah grant di DB Odoo sukses (deploy.sh)
          CFG_ETL_ENABLE_ODOO: ${{ vars.ETL_ENABLE_ODOO }}
          CFG_ETL_ENABLE_GL: ${{ vars.ETL_ENABLE_GL }}
          # production menolak false kecuali EFN_ALLOW_CONTROL_OFF di deploy.conf host
          CFG_ETL_AUDIT_COPY_ENABLED: ${{ vars.ETL_AUDIT_COPY_ENABLED }}
          CFG_OLLAMA_VISION_MODEL: ${{ vars.OLLAMA_VISION_MODEL }}
          # K-7: endpoint migrasi BFF; hanya `true` sementara selama jendela migrasi (default false)
          CFG_MIGRATION_ENABLED: ${{ vars.MIGRATION_ENABLED || 'false' }}
          CFG_METABASE_ADMIN_EMAIL: ${{ vars.METABASE_ADMIN_EMAIL }}
          # G17 penjualan online (docs/04 §10.13). Default MATI; production ONLINE_ENABLED=true butuh PAYMENT_PROVIDER
          # xendit|midtrans + API key kanal nyata (deploy-validate / deploy.sh). Kosong = default compose (PLACEHOLDER).
          CFG_ONLINE_ENABLED: ${{ vars.ONLINE_ENABLED || 'false' }}
          CFG_ONLINE_CATALOG_ENABLED: ${{ vars.ONLINE_CATALOG_ENABLED || 'false' }}
          CFG_LOYALTY_EARN_EXCLUDE_POINT_PAYMENT: ${{ vars.LOYALTY_EARN_EXCLUDE_POINT_PAYMENT || 'true' }}
          CFG_LOYALTY_POINT_VALUE_IDR: ${{ vars.LOYALTY_POINT_VALUE_IDR }}
          CFG_LOYALTY_RESTORE_TOLERANCE_PCT: ${{ vars.LOYALTY_RESTORE_TOLERANCE_PCT }}   # r11: kosong = 10 (0..50)
          CFG_LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS: ${{ vars.LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS }}   # kosong = 3650 (3650..7300)
          CFG_ETL_LOYALTY_POINTS_MODE: ${{ vars.ETL_LOYALTY_POINTS_MODE || 'payment' }}   # SEC-114: product ditolak di production
          CFG_ETL_AUDIT_EPOCH_ANCHORS: ${{ vars.ETL_AUDIT_EPOCH_ANCHORS }}   # G18 epoch salinan audit: kosong = 20 (1..1000)
          # G20 (docs/04 §12.1): kode kanal = kode PT (GL,PB,BCR,BCF); RTL/FNB/kanal G19 ditolak deploy-validate
          CFG_ONLINE_CHANNELS: ${{ vars.ONLINE_CHANNELS || 'GL' }}
          CFG_ONLINE_FULFILMENTS: ${{ vars.ONLINE_FULFILMENTS || 'pickup' }}
          CFG_ONLINE_PAYMENT_TIMEOUT_SECONDS: ${{ vars.ONLINE_PAYMENT_TIMEOUT_SECONDS }}
          CFG_ONLINE_QUOTE_TTL_SECONDS: ${{ vars.ONLINE_QUOTE_TTL_SECONDS }}
          CFG_ONLINE_MAX_OPEN_ORDERS_PER_MEMBER: ${{ vars.ONLINE_MAX_OPEN_ORDERS_PER_MEMBER }}
          # G20 W-30: kosong = 1 (1..10, <= ONLINE_MAX_OPEN_ORDERS_PER_MEMBER)
          CFG_ONLINE_MAX_OPEN_COUNTER_ORDERS_PER_MEMBER: ${{ vars.ONLINE_MAX_OPEN_COUNTER_ORDERS_PER_MEMBER }}
          CFG_ONLINE_PAYMENT_METHODS: ${{ vars.ONLINE_PAYMENT_METHODS }}
          CFG_ONLINE_CATALOG_SYNC_SECONDS: ${{ vars.ONLINE_CATALOG_SYNC_SECONDS }}
          CFG_ONLINE_PICKUP_CODE_MAX_DAYS: ${{ vars.ONLINE_PICKUP_CODE_MAX_DAYS }}
          CFG_ONLINE_ORDER_MEMBER_LINK_DAYS: ${{ vars.ONLINE_ORDER_MEMBER_LINK_DAYS }}
          CFG_ONLINE_EVENT_RETENTION_DAYS: ${{ vars.ONLINE_EVENT_RETENTION_DAYS }}
          CFG_ONLINE_ADMIN_AUDIT_RETENTION_DAYS: ${{ vars.ONLINE_ADMIN_AUDIT_RETENTION_DAYS }}
          CFG_ODOO_RPC_TIMEOUT_MS: ${{ vars.ODOO_RPC_TIMEOUT_MS }}
          # SEC-96 / L-16b: koneksi gateway -> Odoo = worker Odoo yang disisihkan untuk online (kosong = 4)
          CFG_ODOO_RPC_MAXCONN: ${{ vars.ODOO_RPC_MAXCONN }}
          # Sizing pilot opsi B (10 Okt 2026): kosong = default overlay prod (maxconn 2, pool publik 1 + saga 1).
          # deploy-validate menolak PUBLIC + SAGA > MAXCONN.
          CFG_ODOO_RPC_PUBLIC_MAX_CONCURRENCY: ${{ vars.ODOO_RPC_PUBLIC_MAX_CONCURRENCY }}
          CFG_ODOO_RPC_SAGA_MAX_CONCURRENCY: ${{ vars.ODOO_RPC_SAGA_MAX_CONCURRENCY }}
          # W-18/W-19 (keputusan 10 Okt 2026, PDP v7). Kosong = default compose (14 / 365 / 17 / 90); rentang divalidasi
          # scripts/lib/deploy-validate.sh (defer 1..14, suppression 0..730, usia 17..21, geo 1..3650).
          CFG_DSAR_OPEN_ORDER_MAX_DEFER_DAYS: ${{ vars.DSAR_OPEN_ORDER_MAX_DEFER_DAYS }}
          CFG_ERASURE_SUPPRESSION_DAYS: ${{ vars.ERASURE_SUPPRESSION_DAYS }}
          CFG_MEMBER_MIN_AGE: ${{ vars.MEMBER_MIN_AGE }}
          CFG_PRICE_HUNTER_GEO_RETENTION_DAYS: ${{ vars.PRICE_HUNTER_GEO_RETENTION_DAYS }}
          # G21 AC-13 (docs/04 §13.2): kunci PII Odoo (dibuat Superadmin DI HOST, bukan secret GitHub) di-mount ke odoo
          # hanya bila true. Production true wajib EFN_ODOO_PII_REQUIRED=true (deploy-validate); default MATI (L-59).
          CFG_EFN_ODOO_PII_ENABLED: ${{ vars.EFN_ODOO_PII_ENABLED || 'false' }}
          CFG_EFN_ODOO_PII_REQUIRED: ${{ vars.EFN_ODOO_PII_REQUIRED }}
          # G22 (docs/04 §14). Kosong = default compose (semua MATI, angka kontrak). QR meja: true butuh
          # FNB_QR_BASE_URL_<PT> https + API key QR host:* nyata (deploy.sh). LOYALTY_EXPIRY_ENABLED /
          # LOYALTY_INACTIVE_ANONYMIZE = true di production DITOLAK kecuali Superadmin mencantumkannya di
          # EFN_ALLOW_FEATURE_ON (/etc/efn/deploy.conf, L-73). LOYALTY_POINT_EXPIRY_DAYS dihapus (D-22-18): jangan ditambah.
          CFG_FNB_QR_ENABLED: ${{ vars.FNB_QR_ENABLED || 'false' }}
          CFG_FNB_QR_COMPANIES: ${{ vars.FNB_QR_COMPANIES }}
          CFG_FNB_QR_BASE_URL_PB: ${{ vars.FNB_QR_BASE_URL_PB }}
          CFG_FNB_QR_BASE_URL_BCF: ${{ vars.FNB_QR_BASE_URL_BCF }}
          CFG_FNB_QR_POINTS_ENABLED: ${{ vars.FNB_QR_POINTS_ENABLED || 'false' }}
          CFG_FNB_TABLE_SESSION_TTL_SECONDS: ${{ vars.FNB_TABLE_SESSION_TTL_SECONDS }}
          CFG_FNB_MAX_SUBMISSIONS_PER_SESSION: ${{ vars.FNB_MAX_SUBMISSIONS_PER_SESSION }}
          CFG_FNB_MAX_ITEMS_PER_SESSION: ${{ vars.FNB_MAX_ITEMS_PER_SESSION }}
          CFG_FNB_MAX_LINES: ${{ vars.FNB_MAX_LINES }}
          CFG_FNB_MAX_LINE_QTY: ${{ vars.FNB_MAX_LINE_QTY }}
          CFG_FNB_CAPTCHA_MODE: ${{ vars.FNB_CAPTCHA_MODE }}
          CFG_FNB_MENU_SYNC_SECONDS: ${{ vars.FNB_MENU_SYNC_SECONDS }}
          CFG_FNB_SESSION_RETENTION_DAYS: ${{ vars.FNB_SESSION_RETENTION_DAYS }}
          CFG_FNB_SESSION_MEMBER_LINK_DAYS: ${{ vars.FNB_SESSION_MEMBER_LINK_DAYS }}
          CFG_ONLINE_LOYALTY_REDEEM_ENABLED: ${{ vars.ONLINE_LOYALTY_REDEEM_ENABLED || 'false' }}
          CFG_ONLINE_LOYALTY_EARN_ENABLED: ${{ vars.ONLINE_LOYALTY_EARN_ENABLED || 'false' }}
          CFG_LOYALTY_EXPIRY_ENABLED: ${{ vars.LOYALTY_EXPIRY_ENABLED || 'false' }}
          CFG_LOYALTY_EXPIRY_DRY_RUN: ${{ vars.LOYALTY_EXPIRY_DRY_RUN }}
          CFG_LOYALTY_INACTIVITY_EXPIRY_MONTHS: ${{ vars.LOYALTY_INACTIVITY_EXPIRY_MONTHS }}
          CFG_LOYALTY_EXPIRY_NOTICE_DAYS: ${{ vars.LOYALTY_EXPIRY_NOTICE_DAYS }}
          CFG_LOYALTY_EXPIRY_RUN_HOUR_WIB: ${{ vars.LOYALTY_EXPIRY_RUN_HOUR_WIB }}
          CFG_LOYALTY_EXPIRY_NOTICE_HOUR_WIB: ${{ vars.LOYALTY_EXPIRY_NOTICE_HOUR_WIB }}
          CFG_LOYALTY_EXPIRY_BATCH_SIZE: ${{ vars.LOYALTY_EXPIRY_BATCH_SIZE }}
          CFG_LOYALTY_EXPIRY_MAX_PER_RUN: ${{ vars.LOYALTY_EXPIRY_MAX_PER_RUN }}
          CFG_LOYALTY_ACTIVITY_EPOCH: ${{ vars.LOYALTY_ACTIVITY_EPOCH }}
          CFG_LOYALTY_POINT_MAX_AGE_DAYS: ${{ vars.LOYALTY_POINT_MAX_AGE_DAYS }}
          CFG_LOYALTY_INACTIVE_ANONYMIZE: ${{ vars.LOYALTY_INACTIVE_ANONYMIZE || 'false' }}
          CFG_LOYALTY_INACTIVE_ANONYMIZE_GRACE_DAYS: ${{ vars.LOYALTY_INACTIVE_ANONYMIZE_GRACE_DAYS }}
          # SEC-171 (r15): filter consent marketing untuk notice hangus. Production `false` DITOLAK kecuali Superadmin
          # mencantumkan LOYALTY_EXPIRY_NOTICE_REQUIRE_CONSENT di EFN_ALLOW_FEATURE_ON (deploy.conf) setelah keputusan Legal.
          CFG_LOYALTY_EXPIRY_NOTICE_REQUIRE_CONSENT: ${{ vars.LOYALTY_EXPIRY_NOTICE_REQUIRE_CONSENT || 'true' }}
          # G21/G22 job ETL opsional (QA G22 P2-3). Default MATI; prasyarat ETL_ENABLE_ODOO + grant terbaru (deploy-validate)
          CFG_ETL_PARTNER_REGION_ENABLED: ${{ vars.ETL_PARTNER_REGION_ENABLED || 'false' }}
          CFG_ETL_LOYALTY_RECON_ONLINE_ENABLED: ${{ vars.ETL_LOYALTY_RECON_ONLINE_ENABLED || 'false' }}
          CFG_ETL_ENABLE_KDS: ${{ vars.ETL_ENABLE_KDS || 'false' }}
          CFG_ETL_KDS_ONLINE_ENABLED: ${{ vars.ETL_KDS_ONLINE_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/efn-release"
          [ "$APP_ENV" = "staging" ] || APP_ENV=production
          # Versi manifest: X.Y.Z (rilis) atau sha-<7 hex> (main); sama dengan aturan efn-deploy
          ver="$VERSION"
          fps() { # PEM (stdin) -> sidik jari SHA-256 hex huruf kecil per sertifikat, satu per baris
            mkdir -p "$RUNNER_TEMP/pem"
            awk -v d="$RUNNER_TEMP/pem" '/-----BEGIN CERTIFICATE-----/{n++; f=d "/" n ".pem"} n && f {print > f} /-----END CERTIFICATE-----/{close(f); f=""}'
            for f in "$RUNNER_TEMP"/pem/*.pem; do
              [ -e "$f" ] || continue
              openssl x509 -in "$f" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f'
            done
            rm -rf "$RUNNER_TEMP/pem"
          }
          root_fp="$(printf '%s\n' "$EFN_PKI_ROOT_CRT" | fps)"
          [[ "$root_fp" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::EFN_PKI_ROOT_CRT harus tepat 1 sertifikat"; exit 1; }
          extra_json="$(printf '%s\n' "${EFN_PKI_EXTRA_TRUST:-}" | fps | jq -R . | jq -sc .)"
          # config: semua CFG_* -> objek {NAMA: "nilai"} (string; "" = default deploy.sh). Ditolak di sini bila
          # memuat karakter kontrol (host juga menolak) agar kegagalan terlihat di CI, bukan di host.
          config_json="$(jq -nc '$ENV | with_entries(select(.key | startswith("CFG_")) | .key |= ltrimstr("CFG_"))')"
          jq -e 'all(.[]; test("[[:cntrl:]]") | not)' <<< "$config_json" > /dev/null \
            || { echo "::error::vars konfigurasi memuat karakter kontrol/multi-baris (SEC-50)"; exit 1; }
          jq -n --arg env "$APP_ENV" --arg ver "$ver" --argjson seq "$SEQ" --arg git "$GIT_SHA" --arg ref "$SIGNER_REF" \
             --arg root "$root_fp" --argjson extra "$extra_json" --argjson config "$config_json" \
             --arg pg "$IMAGE_POSTGRES" --arg odoo "$IMAGE_ODOO" --arg api "$IMAGE_API_GATEWAY" \
             --arg web "$IMAGE_SUPERAPP_WEB" --arg ocr "$IMAGE_AI_OCR_WORKER" --arg etl "$IMAGE_ETL" --arg minio "$IMAGE_MINIO" --arg mb "$IMAGE_METABASE" \
             '{schema: 2, app_env: $env, version: $ver, seq: $seq, git_sha: $git, signer_ref: $ref,
               images: {IMAGE_POSTGRES: $pg, IMAGE_ODOO: $odoo, IMAGE_API_GATEWAY: $api, IMAGE_SUPERAPP_WEB: $web,
                        IMAGE_AI_OCR_WORKER: $ocr, IMAGE_ETL: $etl, IMAGE_MINIO: $minio,
                        IMAGE_METABASE: $mb},
               pki: {root_sha256: $root, extra_trust_sha256: $extra}, config: $config}' > efn-release.json
          cat efn-release.json
          paths=(infra scripts efn-release.json)
          [ -d services/etl/sql ] && paths+=(services/etl/sql)
          # mtime/owner tetap -> arsip deterministik untuk commit + manifest yang sama
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01 00:00Z' \
              --exclude='infra/compose/.env' -cf - "${paths[@]}" | gzip -n > "$RUNNER_TEMP/efn-release/release.tar.gz"
          rm -f efn-release.json
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/efn-release/release.sigstore.json" \
            "$RUNNER_TEMP/efn-release/release.tar.gz"
          sha256sum "$RUNNER_TEMP/efn-release/release.tar.gz"

      # Secret & variabel dikirim lewat stdin (bukan argumen ssh), di-encode base64 per baris (tanpa eval di host).
      # Daftar secret = scripts/secrets.list; nilai diambil dari toJSON(secrets) (GitHub Environment, UPPERCASE),
      # sehingga menambah secret tidak butuh mengedit workflow ini. Jenis `pki`/`derived:*`/`host:*` (W-11, dikelola
      # di host: API key Odoo kanal online, efn-rotate-online-key) TIDAK dikirim.
      - name: Deploy (efn-deploy di host -> compose pull & up by digest)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          EFN_PKI_INTERMEDIATE_KEY: ${{ secrets.EFN_PKI_INTERMEDIATE_KEY }}
          EFN_PKI_INTERMEDIATE_CRT: ${{ secrets.EFN_PKI_INTERMEDIATE_CRT }}
          EFN_PKI_ROOT_CRT: ${{ secrets.EFN_PKI_ROOT_CRT }}
          EFN_PKI_EXTRA_TRUST: ${{ secrets.EFN_PKI_EXTRA_TRUST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # IMAGE_* TIDAK dikirim lewat env (SEC-42): host mengambilnya dari manifest bertanda tangan.
        # SEC-50: APP_ENV, topologi, dan konfigurasi non-rahasia juga TIDAK dikirim (host menolaknya dari stdin).
        run: |
          set -euo pipefail
          vars=(GHCR_USER GHCR_TOKEN EFN_PKI_INTERMEDIATE_KEY EFN_PKI_INTERMEDIATE_CRT EFN_PKI_ROOT_CRT EFN_PKI_EXTRA_TRUST)
          rel="$RUNNER_TEMP/efn-release"
          umask 077
          {
            for v in "${vars[@]}"; do
              # Variabel opsional yang kosong tidak dikirim (deploy.sh memakai default-nya)
              [ -n "${!v}" ] || continue
              printf '%s=%s\n' "$v" "$(printf '%s' "${!v}" | base64 -w0)"
            done
            while read -r name kind _; do
              [ -z "$name" ] && continue
              case "$name" in \#*) continue ;; esac
              case "$kind" in pki|derived:*|host:*) continue ;; esac
              up="$(echo "$name" | tr '[:lower:]' '[:upper:]')"
              val="$(jq -r --arg k "$up" '.[$k] // empty' <<< "$ALL_SECRETS")"
              printf '%s=%s\n' "$up" "$(printf '%s' "$val" | base64 -w0)"
            done < scripts/secrets.list
          } > "$rel/env.b64"
          # forced command di host = sudo -n /usr/local/sbin/efn-deploy (perintah yang dikirim di sini diabaikan)
          tar -C "$rel" -cf - release.tar.gz release.sigstore.json env.b64 \
            | ssh -i "$HOME/.ssh/efn_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "${DEPLOY_USER}@${HOST}" efn-deploy
          rm -f "$rel/env.b64"

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.TRAEFIK_DOMAIN }}
        run: |
          for url in "https://api.${DOMAIN}/health" "https://app.${DOMAIN}/api/health"; do
            for i in $(seq 1 20); do
              if curl -fsS --max-time 10 "$url" > /dev/null; then echo "OK $url"; break; fi
              sleep 10
              [ "$i" -eq 20 ] && { echo "FAIL $url"; exit 1; }
            done
          done

      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/efn_deploy

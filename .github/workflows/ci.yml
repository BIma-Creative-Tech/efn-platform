# CI: lint, test, validasi compose/observability & Dockerfile. Berjalan di setiap PR dan push ke main.
# Supply chain (SEC-10): semua `uses:` dipin ke commit SHA 40 karakter + komentar versi; bump lewat Dependabot.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default tanpa izin; setiap job meminta yang dibutuhkan saja.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Daftar modul Odoo yang di-install + diuji (--test-tags efn), dipakai BERSAMA job odoo-test dan odoo-test-pii (G21
# AC-4) agar run gabungan ber-PII selalu mencakup modul yang sama; yang belum ada di repo dilewati otomatis.
# efn_setup_* = modul konfigurasi data-only (efn-odoo-functional): ikut di-install agar test efn berjalan di
# atas konfigurasi nyata (4 company, POS, MRP/FEFO, aturan audit). Tanpa modul OCA/vendor (ADR-031):
# hanya Odoo CE 19 + efn_* (gerbang check-odoo-deps di job odoo-test).
# efn_privacy menarik privacy_lookup (CE, depends manifest) otomatis; tidak didaftarkan di sini
# karena pick() hanya menerima modul di services/odoo/addons. Sama: efn_online_pos_sale menarik pos_sale
# (+ sale_management) agar jalur POS SEC-105 teruji di CI.
# G17 (docs/04 §10.15): efn_online_order menarik sale_stock (CE) lewat depends -> auto-install
# sale_loyalty/pos_sale ikut terpasang di DB test yang sama, sehingga regresi POS teruji bersama modul online.
# EFN_INSTALL_ONLY_MODULES di-install SETELAH test, tanpa test: efn_setup_security menaikkan
# auth_password_policy.minlength ke 12, sedangkan fixture test Odoo (mis. user `accountman` di
# AccountTestInvoicingCommon) memakai password < 12 karakter -> setUpClass test POS akan gagal bila modul ini
# terpasang lebih dulu. Langkah terpisah tetap membuktikan modul bisa di-install di DB yang sama.
env:
  EFN_TEST_MODULES: >-
    efn_core efn_audit efn_pos_otp_gate efn_kitting
    efn_pos_payment_gateway efn_pos_loyalty_ledger efn_privacy efn_pos_kds
    efn_setup_company efn_setup_pos efn_setup_mrp efn_setup_audit
    efn_online_order efn_setup_online efn_online_pos_sale efn_pos_refund_origin efn_online_pos_counter
    efn_setup_org efn_loyalty_accounting efn_l10n_id_coretax_rounding efn_role efn_region
  EFN_INSTALL_ONLY_MODULES: efn_setup_security

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter membaca daftar file PR via API
    # SEC-89 (r9): filter path HANYA untuk pull_request. Pada push ke main SEMUA job berjalan, sehingga `CI gate` sebuah
    # commit = hasil uji seluruh kode di commit itu (bukan delta push). Tanpa ini commit merah/dibatalkan bisa ikut
    # dirilis lewat commit berikutnya yang hanya mengubah dokumen. Biaya menit: docs/runbooks/ci-github-free-plan.md §1.
    outputs:
      api: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      odoo: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.odoo }}
      python: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.python }}
      pyservices: ${{ github.event_name == 'push' && '["ai-ocr-worker","etl","text2sql"]' || steps.filter.outputs.changes }}
      infra: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.infra }}
    steps:
      # Tanpa checkout: pada pull_request paths-filter membaca daftar file lewat API (pull-requests: read); pada push
      # langkah ini dilewati. Tidak ada kredensial git tersimpan di job mana pun (SEC-88).
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        if: github.event_name == 'pull_request'
        id: filter
        # Perubahan ci.yml sendiri menjalankan SEMUA job di PR: workflow baru terbukti sebelum merge manual.
        with:
          filters: |
            api:    ['services/api-gateway/**', '.github/workflows/ci.yml']
            web:    ['services/superapp-web/**', '.github/workflows/ci.yml']
            odoo:   ['services/odoo/**', 'scripts/check-odoo-deps.sh', '.github/workflows/ci.yml']
            python: ['services/ai-ocr-worker/**', 'services/etl/**', 'services/text2sql/**', '.github/workflows/ci.yml']
            ai-ocr-worker: ['services/ai-ocr-worker/**', '.github/workflows/ci.yml']
            etl:           ['services/etl/**', '.github/workflows/ci.yml']
            text2sql:      ['services/text2sql/**', '.github/workflows/ci.yml']
            infra:  ['infra/**', 'services/**/Dockerfile', '.github/workflows/**', 'scripts/**', 'Makefile']

  node:
    name: Node (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, superapp-web]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        # Lockfile ada di kedua service (SEC-88): cache npm aktif; `npm ci` satu-satunya jalur install (gagal bila
        # package-lock.json hilang/tidak sinkron, tidak ada fallback `npm install`).
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present   # CI=true di-set runner; Jest & Vitest membacanya (vitest tidak menerima --ci)
      - name: Build
        run: npm run build
      - name: Audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

  python:
    name: Python (ruff, compile, pip-audit)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.odoo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/**/requirements*.txt"
      - name: Install tooling
        run: pip install ruff==0.16.10 pip-audit==2.10.1   # pin: ruff = hasil format; pip-audit = gate (SEC-88)
      - name: Daftar direktori Python yang ada
        id: dirs
        run: |
          dirs=""
          for d in services/ai-ocr-worker services/etl services/text2sql services/odoo/addons; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"
      - name: Ruff (lint + format check)
        run: |
          ruff check ${{ steps.dirs.outputs.dirs }}
          ruff format --check ${{ steps.dirs.outputs.dirs }}
      - name: Byte-compile
        run: python -m compileall -q ${{ steps.dirs.outputs.dirs }}
      - name: pip-audit
        run: |
          for f in services/ai-ocr-worker/requirements.txt services/etl/requirements.txt \
                   services/text2sql/requirements.txt services/odoo/requirements.txt; do
            [ -f "$f" ] || continue
            pip-audit -r "$f" --strict || exit 1
          done

  pytest:
    name: pytest (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [ai-ocr-worker, etl, text2sql]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      CHANGED: ${{ contains(fromJSON(needs.changes.outputs.pyservices), matrix.service) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: env.CHANGED == 'true'
        with:
          persist-credentials: false
      - name: Lewati bila service belum ada
        id: exists
        if: env.CHANGED == 'true'
        working-directory: .
        run: |
          if [ -d "services/${{ matrix.service }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::services/${{ matrix.service }} belum ada, dilewati"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.exists.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/${{ matrix.service }}/requirements*.txt"
      - name: Dependensi sistem (tesseract untuk ai-ocr-worker)
        if: steps.exists.outputs.ok == 'true' && matrix.service == 'ai-ocr-worker'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-ind
      - name: Install
        if: steps.exists.outputs.ok == 'true'
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
      - name: pytest
        if: steps.exists.outputs.ok == 'true'
        run: |
          set +e
          python -m pytest -q --junitxml=pytest-report.xml tests
          rc=$?
          # 5 = tidak ada test terkumpul: peringatan, bukan gagal (service baru)
          if [ "$rc" -eq 5 ]; then echo "::warning::tidak ada test di services/${{ matrix.service }}/tests"; exit 0; fi
          exit "$rc"

  odoo-addons:
    name: Odoo addons (pylint-odoo, manifest)
    needs: changes
    if: needs.changes.outputs.odoo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # Dipin (SEC-88). Informatif saja (`|| true`), BUKAN gate: gate Odoo = odoo-test + check-odoo-deps.
      - run: pip install pylint-odoo==10.0.11
      - name: pylint-odoo (informatif, bukan gate)
        run: |
          pylint --load-plugins=pylint_odoo -d all -e odoolint --rcfile=/dev/null \
            --valid-odoo-versions=19.0 services/odoo/addons || true

  odoo-test:
    name: Odoo addon tests (Odoo 19 + PostgreSQL)
    needs: changes
    if: needs.changes.outputs.odoo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo-ci-only   # kredensial DB sementara CI, bukan secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # EFN_TEST_MODULES / EFN_INSTALL_ONLY_MODULES: env tingkat workflow (di atas), dipakai juga odoo-test-pii.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: "Build image Odoo dari services/odoo/Dockerfile (BuildKit: COPY --chmod)"
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t efn-odoo:ci services/odoo
      - name: Gerbang dependency addons (hanya Odoo CE 19 + efn_*, ADR-031)
        run: |
          # Daftar modul CE diambil dari image yang sama dengan test (bukan daftar statis).
          docker run --rm --entrypoint ls efn-odoo:ci /usr/lib/python3/dist-packages/odoo/addons \
            > "$RUNNER_TEMP/ce-modules.txt"
          bash scripts/check-odoo-deps.sh "$RUNNER_TEMP/ce-modules.txt"
      - name: Tentukan modul
        id: mods
        run: |
          pick() {
            local out="" m
            for m in "$@"; do
              if [ ! -f "services/odoo/addons/$m/__manifest__.py" ]; then
                echo "::notice::modul $m belum ada, dilewati" >&2; continue
              fi
              out="${out:+$out,}$m"
            done
            echo "$out"
          }
          # shellcheck disable=SC2086  # daftar modul dipisah spasi
          mods=$(pick $EFN_TEST_MODULES)
          # shellcheck disable=SC2086
          later=$(pick $EFN_INSTALL_ONLY_MODULES)
          [ -n "$mods" ] || { echo "::error::tidak ada modul efn untuk diuji"; exit 1; }
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "later=$later" >> "$GITHUB_OUTPUT"
      - name: Install + test (--test-tags efn)
        run: |
          set -o pipefail
          # Entrypoint resmi dilewati (--entrypoint odoo) agar argumen DB eksplisit. Nama DB efn_* sesuai dbfilter.
          docker run --rm --network host --entrypoint odoo efn-odoo:ci \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo-ci-only \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d efn_test -i "${{ steps.mods.outputs.modules }}" \
            --test-tags efn --stop-after-init --log-level=test --workers=0 --max-cron-threads=0 \
            2>&1 | tee odoo-test.log
      - name: Install modul tanpa test (efn_setup_security) di DB yang sama
        if: steps.mods.outputs.later != ''
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint odoo efn-odoo:ci \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo-ci-only \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d efn_test -i "${{ steps.mods.outputs.later }}" \
            --stop-after-init --workers=0 --max-cron-threads=0 \
            2>&1 | tee -a odoo-test.log
      - name: Periksa log (ERROR/CRITICAL/FAIL = gagal)
        if: always()
        run: |
          if grep -E '^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL) ' odoo-test.log; then
            echo "::error::Odoo test/instalasi melaporkan ERROR"; exit 1
          fi
          grep -E 'tests? (when loading|in [0-9.]+s)|Ran [0-9]+ test' odoo-test.log || true
      # G16: log diagnostik hanya saat gagal, retensi 2 hari, kegagalan upload (mis. kuota storage 500 MB paket
      # gratis habis) TIDAK menggagalkan job -- hasil test ditentukan langkah "Periksa log" di atas.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        continue-on-error: true
        with:
          name: odoo-test-log
          path: odoo-test.log
          retention-days: 2
          if-no-files-found: ignore

  # G21 AC-4 (docs/04 §13.2, ADR-036 §0, SEC-153): run GABUNGAN efn_pii* + semua EFN_TEST_MODULES dengan 3 kunci uji
  # acak. efn_pii melindungi partner perorangan sejak dibuat -> setiap modul/test yang membuat partner perorangan butuh
  # ketiga kunci; job ini membuktikan modul lain tetap lulus saat PII aktif (gerbang aktivasi produksi, L-59).
  # Kunci dibuat DI JOB (openssl rand, folder RUNNER_TEMP sekali pakai), tidak di repo, tidak di log/artefak/GITHUB_ENV;
  # dihapus di akhir job. Log diperiksa: ERROR/CRITICAL = gagal; test efn_pii harus benar-benar berjalan; nilai kunci
  # yang muncul di log = gagal (tanpa mencetaknya).
  odoo-test-pii:
    name: Odoo addon tests + PII (efn_pii*, 3 kunci uji)
    needs: changes
    if: needs.changes.outputs.odoo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo-ci-only   # kredensial DB sementara CI, bukan secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # WAJIB ada (gagal bila hilang): kontrak AC-4. Modul efn_pii_* lain di repo (mis. efn_pii_base_vat, efn_pii_l10n_id)
      # ikut otomatis (penemuan direktori) agar modul PII baru tidak lolos tanpa diuji.
      EFN_PII_MODULES: efn_pii efn_pii_pos efn_pii_hr efn_pii_account
      # Path kunci DI DALAM container (folder, bukan file per kunci): efn_pii membaca <dir>/odoo_pii_{key_v1,bidx_key,name_key}
      EFN_PII_KEY_MOUNT: /run/efn-pii-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: "Build image Odoo dari services/odoo/Dockerfile (BuildKit: COPY --chmod)"
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t efn-odoo:ci services/odoo
      - name: Tentukan modul (EFN_TEST_MODULES + efn_pii*)
        id: mods
        run: |
          set -euo pipefail
          pick() {
            local out="" m
            for m in "$@"; do
              if [ ! -f "services/odoo/addons/$m/__manifest__.py" ]; then
                echo "::notice::modul $m belum ada, dilewati" >&2; continue
              fi
              case ",$out," in *",$m,"*) continue ;; esac
              out="${out:+$out,}$m"
            done
            echo "$out"
          }
          for m in $EFN_PII_MODULES; do
            [ -f "services/odoo/addons/$m/__manifest__.py" ] || { echo "::error::modul PII wajib $m tidak ada (AC-4)"; exit 1; }
          done
          extra=$(find services/odoo/addons -mindepth 2 -maxdepth 2 -path 'services/odoo/addons/efn_pii_*/__manifest__.py' \
            | awk -F/ '{print $4}' | sort | tr '\n' ' ')
          # shellcheck disable=SC2086  # daftar modul dipisah spasi
          mods=$(pick $EFN_PII_MODULES $extra $EFN_TEST_MODULES)
          # shellcheck disable=SC2086
          later=$(pick $EFN_INSTALL_ONLY_MODULES)
          echo "modul: $mods"
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "later=$later" >> "$GITHUB_OUTPUT"
      - name: Kunci PII uji acak (3 x 32 byte, hanya di job ini)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/efn-pii-keys"
          rm -rf "$d"; mkdir -m 0755 "$d"
          for k in odoo_pii_key_v1 odoo_pii_bidx_key odoo_pii_name_key; do
            # tr -d: satu baris tanpa newline; nilai TIDAK pernah di-echo. 0644: uid user odoo di image != runner,
            # mount read-only; VM runner sekali pakai.
            ( umask 022; openssl rand -base64 32 | tr -d '\r\n' > "$d/$k" )
          done
          test "$(sort -u "$d"/* | wc -l)" -eq 3   # ketiga kunci berbeda
          ls -l "$d" | awk 'NR > 1 {print $1, $NF}'
      - name: Install + test (--test-tags efn) dengan kunci PII
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint odoo \
            -e EFN_ODOO_PII_KEY_DIR="$EFN_PII_KEY_MOUNT" -v "$RUNNER_TEMP/efn-pii-keys:$EFN_PII_KEY_MOUNT:ro" \
            efn-odoo:ci \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo-ci-only \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d efn_test_pii -i "${{ steps.mods.outputs.modules }}" \
            --test-tags efn --stop-after-init --log-level=test --workers=0 --max-cron-threads=0 \
            2>&1 | tee odoo-test-pii.log
      - name: Install modul tanpa test (efn_setup_security) di DB yang sama, dengan kunci PII
        if: steps.mods.outputs.later != ''
        run: |
          set -o pipefail
          docker run --rm --network host --entrypoint odoo \
            -e EFN_ODOO_PII_KEY_DIR="$EFN_PII_KEY_MOUNT" -v "$RUNNER_TEMP/efn-pii-keys:$EFN_PII_KEY_MOUNT:ro" \
            efn-odoo:ci \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo-ci-only \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d efn_test_pii -i "${{ steps.mods.outputs.later }}" \
            --stop-after-init --workers=0 --max-cron-threads=0 \
            2>&1 | tee -a odoo-test-pii.log
      - name: Periksa log (ERROR/CRITICAL = gagal, test efn_pii berjalan, kunci tidak bocor)
        if: always()
        run: |
          set -euo pipefail
          [ -s odoo-test-pii.log ] || { echo "::error::log test PII kosong"; exit 1; }
          if grep -E '^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL) ' odoo-test-pii.log; then
            echo "::error::Odoo test/instalasi ber-PII melaporkan ERROR/CRITICAL"; exit 1
          fi
          # Test efn_pii di-skip diam-diam (modul tidak ter-install / tag salah) = gagal
          grep -q 'odoo\.addons\.efn_pii\.tests\.' odoo-test-pii.log \
            || { echo "::error::test efn_pii tidak berjalan (AC-4)"; exit 1; }
          # Nilai kunci uji tidak boleh muncul di log (grep -qF -f: satu kunci per baris, tanpa mencetak isi). File kunci
          # tanpa newline -> digabung per baris lewat loop (cat saja = 3 kunci jadi satu pola).
          if [ -d "$RUNNER_TEMP/efn-pii-keys" ]; then
            pat="$RUNNER_TEMP/efn-pii-patterns"
            for f in "$RUNNER_TEMP"/efn-pii-keys/*; do cat "$f"; echo; done > "$pat"
            leak=0; grep -qF -f "$pat" odoo-test-pii.log && leak=1
            rm -f "$pat"
            [ "$leak" -eq 0 ] || { echo "::error::nilai kunci PII uji muncul di log Odoo"; exit 1; }
          fi
          grep -E 'tests? (when loading|in [0-9.]+s)|Ran [0-9]+ test' odoo-test-pii.log || true
      - name: Hapus kunci PII uji
        if: always()
        run: rm -rf "$RUNNER_TEMP/efn-pii-keys" "$RUNNER_TEMP/efn-pii-patterns"
      # Log diagnostik hanya saat gagal, retensi 2 hari (pola odoo-test); log tidak memuat kunci (diperiksa di atas).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        continue-on-error: true
        with:
          name: odoo-test-pii-log
          path: odoo-test-pii.log
          retention-days: 2
          if-no-files-found: ignore

  odoo-tour:
    # Gelombang 12: test UI POS (OWL) nyata — HttpCase + tour di Chrome headless (tag efn_tour): OTP gate
    # (online, tanpa pelanggan, offline) dan QRIS efn_gateway (paid, cancel). BFF di-mock server-side di test.
    # Image = target `test` dari Dockerfile yang sama (runtime + Google Chrome); image produksi (target default)
    # tidak memuat browser. DB terpisah dengan modul minimum: fixture TestPointOfSaleHttpCommon tidak cocok
    # dengan 4 company efn_setup_company (user uji tidak punya akses pajak company lain).
    name: Odoo POS UI tours (Chrome headless)
    needs: changes
    if: needs.changes.outputs.odoo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo-ci-only   # kredensial DB sementara CI, bukan secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EFN_TOUR_MODULES: efn_pos_otp_gate,efn_pos_payment_gateway,efn_pos_loyalty_ledger,efn_pos_kds,efn_online_order,efn_pos_refund_origin,efn_online_pos_counter
      # Jumlah test tour yang WAJIB berjalan (HttpCase di-skip diam-diam bila Chrome/websocket tidak ada).
      # 5 (OTP gate 3 + gateway 2) + 4 Poin EFN (Gelombang 13b) + 4 KDS efn_pos_kds (Gelombang 14)
      # + 1 KDS cetak cadangan saat tiket gagal (Gelombang 15, SEC-76). Total terhitung runner 20.
      EFN_TOUR_MIN_TESTS: "29"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build image target test (runtime + Chrome headless)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --target test -t efn-odoo:ci-test services/odoo
      - name: Install + tour (--test-tags efn_tour)
        run: |
          set -o pipefail
          # --init: reaping proses Chrome; --no-healthcheck: curl HEALTHCHECK image tidak relevan saat test.
          docker run --rm --init --no-healthcheck --shm-size=1g --network host --entrypoint odoo efn-odoo:ci-test \
            --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo-ci-only \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d efn_tour -i "$EFN_TOUR_MODULES" \
            --test-tags efn_tour --stop-after-init --log-level=test --workers=0 --max-cron-threads=0 \
            2>&1 | tee odoo-tour.log
      - name: Periksa log (ERROR/CRITICAL, skip, jumlah test)
        if: always()
        run: |
          if grep -E '^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL) ' odoo-tour.log; then
            echo "::error::Tour POS melaporkan ERROR"; exit 1
          fi
          if grep -E 'Chrome executable not found|websocket-client module is not installed|Failed to detect chrome' \
            odoo-tour.log; then
            echo "::error::Tour di-skip (browser tidak tersedia)"; exit 1
          fi
          ran=$(grep -oE 'odoo.tests.result: 0 failed, 0 error\(s\) of [0-9]+ tests' odoo-tour.log \
            | grep -oE '[0-9]+ tests' | grep -oE '[0-9]+' | tail -1)
          if [ -z "$ran" ] || [ "$ran" -lt "$EFN_TOUR_MIN_TESTS" ]; then
            echo "::error::hanya ${ran:-0} test tour berjalan (minimal $EFN_TOUR_MIN_TESTS)"; exit 1
          fi
          echo "tour: $ran test lolos"
      # G16: log diagnostik hanya saat gagal, retensi 2 hari, kegagalan upload (mis. kuota storage 500 MB paket
      # gratis habis) TIDAK menggagalkan job -- hasil test ditentukan langkah "Periksa log" di atas.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        continue-on-error: true
        with:
          name: odoo-tour-log
          path: odoo-tour.log
          retention-days: 2
          if-no-files-found: ignore

  # G15 (SEC-72/73/78): uji regresi redaksi PII/rahasia Promtail. Pipeline produksi (promtail.yml + promtail-journal.yml,
  # disalin yq ke kerangka uji) dijalankan `promtail -dry-run` atas fixture fiktif lalu dibandingkan dengan expected.txt;
  # nilai SENTINEL* yang lolos atau perbedaan docker vs journal = gagal. Tanpa secret, tanpa jaringan selain pull image.
  promtail-redaction:
    name: Promtail redaction regression
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: promtail -check-syntax (promtail.yml, promtail-journal.yml)
        run: |
          for f in promtail.yml promtail-journal.yml; do
            docker run --rm -v "$PWD/infra/observability:/cfg:ro" \
              grafana/promtail:3.2.1@sha256:bf617e9d67e80247a59f717f9c1ad388d7d32dc0a1d29abd5799516d15e0a9b5 \
              -config.file="/cfg/$f" -check-syntax
          done
      - name: Redaksi HP / token / query string (fixture -> expected.txt)
        run: bash scripts/test-promtail-redaction.sh

  infra:
    name: Infra (compose, observability, shellcheck, hadolint, yamllint)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Siapkan secrets dummy + PKI internal (scripts/secrets.list, gen-pki.sh) & .env
        run: |
          bash scripts/gen-secrets.sh
          cp infra/compose/.env.example infra/compose/.env
      - name: PKI dev valid (3 tingkat, nameConstraints, leaf 90 hari, EKU klien, SAN nama service)
        run: |
          set -euo pipefail
          test "$(grep -c 'BEGIN CERTIFICATE' secrets/efn_ca_crt.txt)" -eq 2   # bundle intermediate + root
          for c in secrets/tls_*_crt.txt; do
            openssl verify -CAfile secrets/efn_ca_crt.txt "$c" > /dev/null
            openssl x509 -in "$c" -noout -checkend $((91 * 86400)) > /dev/null && { echo "::error::$c > 90 hari"; exit 1; }
          done
          openssl x509 -in secrets/pki-ca/intermediate.crt -noout -ext nameConstraints | grep -q 'DNS:api-gateway'
          openssl x509 -in secrets/tls_api_gateway_crt.txt -noout -ext subjectAltName | grep -q 'DNS:api-gateway'
          openssl x509 -in secrets/tls_clickhouse_crt.txt -noout -ext subjectAltName | grep -q 'IP Address:127.0.0.1'
          # Klien mTLS (docs/04 §8.5) punya clientAuth; server murni TIDAK
          for s in traefik prometheus grafana promtail ocr_worker blackbox_exporter cadvisor etl metabase_provision \
                   api_gateway odoo_rpc_gateway; do
            openssl x509 -in "secrets/tls_${s}_crt.txt" -noout -ext extendedKeyUsage | grep -q 'Client Authentication'
          done
          if openssl x509 -in secrets/tls_postgres_crt.txt -noout -ext extendedKeyUsage | grep -q 'Client Authentication'; then
            echo "::error::sertifikat server postgres tidak boleh ber-EKU clientAuth"; exit 1
          fi
          # nameConstraints menolak nama di luar daftar: leaf palsu "graph.facebook.com" harus GAGAL diverifikasi
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /tmp/x.key -subj /CN=x \
            -addext "subjectAltName=DNS:graph.facebook.com" -out /tmp/x.csr 2> /dev/null
          printf 'subjectAltName=DNS:graph.facebook.com\n' > /tmp/x.ext
          openssl x509 -req -in /tmp/x.csr -CA secrets/pki-ca/intermediate.crt -CAkey secrets/pki-ca/intermediate.key \
            -CAcreateserial -days 1 -extfile /tmp/x.ext -out /tmp/x.crt 2> /dev/null
          if openssl verify -CAfile secrets/efn_ca_crt.txt /tmp/x.crt > /dev/null 2>&1; then
            echo "::error::nameConstraints tidak efektif"; exit 1
          fi
      - name: Secret turunan (test vector member_hash_pepper, docs/04 §8.4)
        run: |
          bash scripts/derive-secrets.sh --self-test
          # Jalur fallback openssl kdf (host tanpa python3) juga harus lolos
          EFN_DERIVE_FORCE_OPENSSL=1 bash scripts/derive-secrets.sh --self-test
      - name: Enkripsi di setiap transaksi data (scripts/check-encryption.sh)
        run: bash scripts/check-encryption.sh
      - name: Rentang Cloudflare sinkron (traefik.yml == cloudflare-ips.txt)
        run: bash scripts/update-cloudflare-ips.sh --check
      - name: docker compose config (dev)
        working-directory: infra/compose
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml
          --profile core --profile data --profile ai --profile observability --profile ops config -q
      - name: docker compose config (prod)
        working-directory: infra/compose
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --profile core --profile data --profile ai --profile observability --profile ops config -q
      - name: Prod hanya mem-publish port Traefik
        working-directory: infra/compose
        run: |
          published=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile core --profile data --profile ai --profile observability --profile ops config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key')
          echo "service dengan port publish: $published"
          [ "$published" = "traefik" ] || { echo "::error::port publish selain traefik: $published"; exit 1; }
      - name: Setiap secret yang direferensikan service didefinisikan & ada di secrets.list
        working-directory: infra/compose
        # docker compose config membuang secret top-level yang tak direferensikan service; payment_provider_api_key
        # hanya di-mount oleh docker-compose.payment.yml (dan odoo_api_key_online_{pb,bcr,bcf} oleh docker-compose.online-*.yml,
        # G20 §12.1; _gl di base) -> overlay itu wajib ikut agar perbandingan lengkap.
        run: |
          overlays=()
          for f in docker-compose.online-*.yml; do overlays+=(-f "$f"); done
          # G21 AC-13: odoo_pii_* (secrets.list host:disabled) hanya di-mount docker-compose.pii.yml -> ikut juga.
          cfg=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.payment.yml \
            -f docker-compose.pii.yml "${overlays[@]}" \
            --profile core --profile data --profile ai --profile observability --profile ops config --format json)
          defined=$(echo "$cfg" | jq -r '.secrets | keys[]' | sort)
          listed=$(awk '!/^[[:space:]]*#/ && NF {print $1}' ../../scripts/secrets.list | sort)
          diff <(echo "$defined") <(echo "$listed") || { echo "::error::compose secrets != scripts/secrets.list"; exit 1; }
      # promtool memeriksa keberadaan file TLS (ca_file, cert) -> mount CA + sertifikat dummy dari gen-pki.sh
      - name: promtool (prometheus.yml + alert-rules.yml + web-config.yml)
        run: |
          chmod 755 secrets
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" \
            -v "$PWD/secrets/efn_ca_crt.txt:/run/secrets/efn_ca_crt:ro" \
            -v "$PWD/secrets/minio_prometheus_token.txt:/run/secrets/minio_prometheus_token:ro" \
            -v "$PWD/secrets/tls_prometheus_crt.txt:/run/secrets/tls_server_crt:ro" \
            -v "$PWD/secrets/tls_prometheus_key.txt:/run/secrets/tls_server_key:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 check config /etc/prometheus/prometheus.yml
          for wc in web-config.yml web-config-ui.yml web-config-alertmanager.yml; do
            docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" \
              -v "$PWD/secrets/efn_ca_crt.txt:/run/secrets/efn_ca_crt:ro" \
              -v "$PWD/secrets/tls_prometheus_crt.txt:/run/secrets/tls_server_crt:ro" \
              -v "$PWD/secrets/tls_prometheus_key.txt:/run/secrets/tls_server_key:ro" \
              --entrypoint promtool prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 check web-config "/etc/prometheus/$wc"
          done
      - name: amtool (alertmanager.yml)
        run: |
          docker run --rm -v "$PWD/infra/observability:/cfg:ro" --entrypoint amtool \
            prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5 check-config /cfg/alertmanager.yml
      - name: Grafana dashboard JSON valid
        run: |
          for f in infra/observability/grafana/provisioning/dashboards/json/*.json; do jq empty "$f"; done
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/host/efn-deploy scripts/host/efn-online-cs scripts/host/efn-rotate-online-key \
            scripts/host/*.sh scripts/smoke/*.sh tests/load/*.sh infra/backup/postgres/*.sh \
            infra/postgres/init/*.sh infra/wireguard/*.sh
          shellcheck -x infra/odoo-rpc-gateway/test-gateway.sh infra/odoo-rpc-gateway/test-gateway-load.sh
          shellcheck -s sh infra/odoo-rpc-gateway/entrypoint.sh
          shellcheck -s sh infra/minio/*.sh infra/redis/*.sh infra/rabbitmq/*.sh infra/clickhouse/*.sh infra/s3-gateway/*.sh \
            infra/acme/*.sh scripts/acme-test/*.sh infra/metabase/*.sh
      # Filter L7 object storage (ADR-030): sintaks HAProxy valid dengan sertifikat dummy dari gen-pki.sh
      - name: haproxy -c (infra/s3-gateway/haproxy.cfg)
        run: |
          cat secrets/tls_s3_gateway_crt.txt secrets/tls_s3_gateway_key.txt > /tmp/s3-gateway.pem
          chmod 644 /tmp/s3-gateway.pem
          docker run --rm -v "$PWD/infra/s3-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v /tmp/s3-gateway.pem:/tmp/haproxy/s3-gateway.pem:ro \
            -v "$PWD/secrets/efn_ca_crt.txt:/run/secrets/efn_ca_crt:ro" \
            haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      # G17 (docs/04 §10.4.1): filter BFF -> Odoo /json/2. Uji negatif nyata (mTLS, 12 path G21, encoded, header) butuh
      # stack berjalan: infra/odoo-rpc-gateway/test-gateway.sh (lokal/staging); di sini sintaks + ODOO_DB.
      - name: haproxy -c (infra/odoo-rpc-gateway/haproxy.cfg)
        run: |
          cat secrets/tls_odoo_rpc_gateway_crt.txt secrets/tls_odoo_rpc_gateway_key.txt > /tmp/odoo-rpc-gateway.pem
          chmod 644 /tmp/odoo-rpc-gateway.pem
          docker run --rm -e ODOO_DB=efn_odoo -e ODOO_RPC_MAXCONN=4 \
            -v "$PWD/infra/odoo-rpc-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v /tmp/odoo-rpc-gateway.pem:/tmp/haproxy/odoo-rpc-gateway.pem:ro \
            -v "$PWD/secrets/efn_ca_crt.txt:/run/secrets/efn_ca_crt:ro" \
            haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      # SEC-36/SEC-42/SEC-50: wrapper deploy host diuji dengan cosign palsu di container sekali pakai (87 kasus: replay/
      # downgrade, IMAGE_* lewat env, registry asing, trust anchor PKI, tanda tangan, allowlist env, topologi dipin di
      # deploy.conf, config manifest, karakter kontrol/multi-baris, kontrol keamanan production, lib deploy-validate,
      # image terikat SHA commit (SEC-91), persetujuan rilis production approved-release (SEC-92); G17: 101 kasus,
      # termasuk config penjualan online ONLINE_* dan penolakan saklar dev ODOO_ONLINE_MOCK/EFN_PAYMENT_SIMULATOR;
      # G21 AC-13: kunci PII host:* ditolak dari stdin, saklar EFN_ODOO_PII_*, validasi kunci host, status modul efn_pii)
      - name: efn-deploy regression (cosign palsu)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea \
            bash /src/scripts/host/test-efn-deploy.sh
      # G17 (SEC-98 / L-16d): wrapper CS online (aktor dari sudo, allowlist subcommand/argumen, journald tanpa PII)
      # diuji dengan docker/logger palsu di container sekali pakai (54 kasus; + peran SEC-107, alasan stdin SEC-108,
      # G18 online-erasure-pending read-only).
      - name: efn-online-cs regression (docker palsu)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea \
            bash /src/scripts/host/test-efn-online-cs.sh
      # G18 (W-11, R-T15): rotasi otomatis API key Odoo kanal online - docker/Odoo/BFF palsu (rotasi, rollback, cabut
      # tertunda, bukti 401, penolakan identitas/argumen/konfigurasi, tanpa kebocoran nilai key; r11 SEC-120: kunci host
      # bersama deploy + cabut key yatim per nama; G19: --all, --bootstrap, user bersama; G20 §12.1: allowlist kanal
      # GL/PB/BCR/BCF, kode lama RTL/FNB/kanal G19 ditolak; 90 kasus).
      - name: efn-rotate-online-key regression (docker palsu)
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea \
            bash /src/scripts/host/test-efn-rotate-online-key.sh
      # G13 (data-AI): dashboard Metabase sebagai kode - validasi definisi (SQL hanya efn_dwh.v_*, TLS wajib) + ruff.
      # Container sekali pakai (image python yang sama dengan uji efn-deploy), direktori repo read-only.
      - name: pytest + ruff infra/metabase
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src/infra/metabase -e PYTHONDONTWRITEBYTECODE=1             python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea             sh -c 'pip install -q --disable-pip-version-check pytest==8.3.4 ruff==0.16.10                    && ruff check --no-cache . && ruff format --no-cache --check .                    && python -m pytest -q -p no:cacheprovider tests'
      # SEC-37: ACME DNS-01 terpisah dari Traefik, diuji terhadap Pebble (server ACME uji Let's Encrypt) di network
      # --internal sekali pakai: penerbitan, hot-reload Traefik tanpa restart, izin volume, mode nonaktif, <VAR>_FILE
      - name: acme-dns regression (Pebble)
        run: bash scripts/test-acme-dns.sh
      - name: Traefik tidak memegang token DNS (SEC-37)
        working-directory: infra/compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile core config --format json \
            | jq -e '(.services.traefik.secrets // [] | map(.source) | index("acme_dns_api_token")) == null
                     and ([.services.traefik.environment // {} | keys[] | select(test("_FILE$|TOKEN"))] | length) == 0
                     and (.services["acme-dns"].ports // [] | length) == 0
                     and (.services["acme-dns"].networks | keys) == ["egress"]'
      # G13: hadolint v2.14.0 (image ber-digest) menggantikan hadolint-action v3.1.0 (hadolint 2.12): 2.12 tidak
      # mengenal `ADD --checksum` (BuildKit) yang dipakai infra/metabase/Dockerfile untuk memin jar driver.
      - name: hadolint
        run: |
          mapfile -t files < <(find . -name Dockerfile -not -path '*/node_modules/*' | sort)
          docker run --rm -v "$PWD:/src:ro" -w /src \
            hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e \
            hadolint --config .hadolint.yaml --failure-threshold warning "${files[@]}"
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yml infra .github

  # SEC-80 (r9): `CI gate` adalah job yang diwajibkan gerbang rilis (scripts/verify-commit-gates.sh PRESET_RELEASE);
  # jangan ganti `name:` tanpa mengubah preset. `changes` ikut di needs: bila paths-filter gagal, job lain ter-skip
  # dan gate TIDAK boleh lolos karena "semua skipped".
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, node, python, pytest, odoo-addons, odoo-test, odoo-test-pii, odoo-tour, infra, promtail-redaction]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

# Build image per service -> push GHCR (satu kali) -> scan Trivy image BY DIGEST -> SBOM (Syft) -> sign + attest
# (Cosign keyless). Dipicu oleh push ke main (tag: sha-<short>, main) dan tag v* (tag: X.Y.Z, X.Y, latest).
#
# r9 (9 Okt 2026, efn-devsecops-engineer):
# - SEC-80: job `gate` menunggu & memverifikasi workflow CI (job `CI gate`) dan Security (gitleaks, semgrep, Trivy fs,
#   checkov) untuk COMMIT YANG SAMA = success sebelum ada push/sign (scripts/verify-commit-gates.sh, Actions API,
#   `actions: read`). Pengganti branch protection yang tidak tersedia di repo privat paket gratis. Dipilih polling
#   (bukan `workflow_run`): pemicu workflow_run berjalan di konteks default branch -> identitas cosign
#   `build-push.yml@refs/tags/vX.Y.Z` untuk rilis tidak bisa dipertahankan, dan dua workflow sumber memicu dua run.
# - SEC-81: run PR = job `scan-pr` terpisah dengan `contents: read` saja (build + load + Trivy lokal, tanpa token
#   tulis/OIDC). Job `build` (izin tulis) tidak pernah berjalan untuk pull_request.
# - SEC-83: image di-build & di-push SATU kali; Trivy memindai `REGISTRY/<svc>@<digest>` hasil push itu; hanya bila
#   lolos, SBOM + `cosign sign/attest` dijalankan atas digest yang sama. Image yang gagal scan ada di registry tetapi
#   TIDAK bertanda tangan -> ditolak deploy (cosign verify di deploy.yml + host efn-deploy).
# Re-review G16c: SEC-90 push BY DIGEST tanpa tag; tag (`main`, `sha-*` hanya dari main, `X.Y.Z`, `X.Y`, `latest`)
#   dipasang SETELAH sign atas digest yang sama. SEC-94: job `build` meminta `security-events`/`attestations: write`
#   hanya karena repo publik (G18); scan-pr tetap read-only.
#   SEC-89 gate menunggu CI penuh (semua job pada push ke main) -> batas 75 menit.
#
# G16 (CI GitHub, 9 Okt 2026), repo privat paket gratis:
# - Tanpa artifact (kuota storage 500 MB): SBOM Syft TIDAK diunggah sebagai artifact; SBOM di-attest (cosign keyless)
#   dan disimpan di registry bersama image (+ SBOM BuildKit `sbom: true`). Ambil: `cosign download attestation`.
#   Build record buildx juga tidak diunggah (DOCKER_BUILD_RECORD_UPLOAD=false).
# - Hasil Trivy = tabel di log + job summary; SARIF/upload code scanning hanya bila repo publik atau
#   CODE_SCANNING_ENABLED=true. Gate HIGH/CRITICAL (fixed) memblokir tanda tangan. Pengecualian: .trivyignore.yaml
#   (input `trivyignores` trivy-action 0.35.0 membaca YAML: log "Using YAML ignorefile", diverifikasi run 62b1bf1).
# Runbook: docs/runbooks/ci-github-free-plan.md
name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # PR: hanya build + gate Trivy image (job scan-pr: tanpa login, push, SBOM, sign) agar gate terlihat SEBELUM merge
  # manual (alur satu PR, runbook ci-github-free-plan.md bagian 9). Dibatasi path agar hemat menit.
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/migration/**"
      - "infra/backup/postgres/**"
      - "infra/minio/**"
      - "infra/metabase/**"
      - ".trivyignore.yaml"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: read

# Build terbaru untuk ref yang sama menggantikan yang lama (hemat menit); tag rilis punya ref sendiri.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CODE_SCANNING: ${{ vars.CODE_SCANNING_ENABLED == 'true' || github.event.repository.visibility == 'public' }}
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ── PR: build + load + scan lokal, token hanya baca (SEC-81) ─────────────────────────────────────────────────────
  scan-pr:
    name: scan ${{ matrix.service }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [odoo, api-gateway, superapp-web, insight-web, login-gateway, ai-ocr-worker, etl, text2sql, esb-extract, forecast-worker,
                  esb-migrate, segment-worker, wa-unofficial, postgres, minio, metabase]
        include:
          - { service: odoo, context: services/odoo }
          - { service: api-gateway, context: services/api-gateway }
          - { service: superapp-web, context: services/superapp-web }
          - { service: insight-web, context: services/insight-web }   # G42 dashboard Insight (docs/04 §26)
          - { service: login-gateway, context: services/login-gateway }   # G62 halaman masuk staf (docs/04 §29, ADR-050)
          - { service: segment-worker, context: services/segment-worker }   # G50 segmen perilaku (docs/04 §28.7)
          - { service: wa-unofficial, context: services/wa-unofficial }     # G50 WA tidak resmi (ADR-044)
          - { service: ai-ocr-worker, context: services/ai-ocr-worker }
          - { service: etl, context: services/etl }
          - { service: text2sql, context: services/text2sql }   # G38 Text-to-SQL (docs/04 §23)
          - { service: esb-extract, context: services/esb-extract }   # G41 ekstraksi ESB Core (docs/04 §25)
          - { service: forecast-worker, context: services/forecast-worker }   # G44 forecast statsforecast (docs/04 §28.2)
          - { service: esb-migrate, context: scripts/migration }   # G43 mesin migrasi ESB -> Odoo (docs/04 §27.2)
          - { service: postgres, context: infra/backup/postgres }
          - { service: minio, context: infra/minio }
          - { service: metabase, context: infra/metabase }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Cache hanya dibaca: run PR tidak menulis cache GHA yang dipakai build main (cache poisoning).
      - name: Build (load lokal, tanpa push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ (matrix.service == 'api-gateway' || matrix.service == 'superapp-web' || matrix.service == 'insight-web' || matrix.service == 'login-gateway') && 'runtime' || '' }}
          load: true
          tags: local/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: false

      - name: Trivy image scan (gate HIGH/CRITICAL)
        # 0.35.0: satu-satunya tag yang tidak di-force-push pada insiden supply chain Maret 2026 (CVE-2026-33634);
        # binary Trivy dipin ke versi aman.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          version: v0.69.3
          image-ref: local/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.service }}.txt
          trivyignores: .trivyignore.yaml
      - name: Ringkasan Trivy (log + job summary)
        if: always()
        env:
          SVC: ${{ matrix.service }}
        run: |
          [ -f "trivy-${SVC}.txt" ] || exit 0
          cat "trivy-${SVC}.txt"
          { echo "### Trivy image ${SVC} (PR, HIGH/CRITICAL, fixed only)"; echo '```'; head -c 900000 "trivy-${SVC}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ── Non-PR: gerbang CI & Security untuk commit yang sama (SEC-80) ────────────────────────────────────────────────
  gate:
    name: Gate (CI & Security hijau untuk commit ini)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # CI terlama (Odoo test/tour) <= 45 menit per job, paralel; jeda polling 30 dtk. Menunggu = menit runner terpakai.
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tunggu & verifikasi CI + Security (commit yang sama)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash scripts/verify-commit-gates.sh --sha "$SHA" --preset release --timeout-min 75 --absent-min 10

  # ── Non-PR: push sekali -> scan by digest -> SBOM -> sign (SEC-81/83) ─────────────────────────────────────────────
  build:
    name: ${{ matrix.service }}
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # SEC-94 (r9) diperbarui G18 (repo PUBLIK di organisasi BIma-Creative-Tech, 18 Okt 2026): CODE_SCANNING dan
    # attestation kini aktif lewat ekspresi visibility -> izin yang dipakai langkah itu diminta di sini (job non-PR
    # saja; scan-pr tetap contents: read). Tanpa izin langkahnya gagal terlihat (403), bukan diam-diam.
    permissions:
      contents: read
      packages: write
      id-token: write         # cosign keyless (OIDC) + attest-build-provenance (Sigstore)
      security-events: write  # upload SARIF Trivy image (CODE_SCANNING == 'true')
      attestations: write     # actions/attest-build-provenance (repo publik / ATTESTATIONS_ENABLED)
    strategy:
      fail-fast: false
      matrix:
        service: [odoo, api-gateway, superapp-web, insight-web, login-gateway, ai-ocr-worker, etl, text2sql, esb-extract, forecast-worker,
                  esb-migrate, segment-worker, wa-unofficial, postgres, minio, metabase]
        include:
          - { service: odoo, context: services/odoo }
          - { service: api-gateway, context: services/api-gateway }
          - { service: superapp-web, context: services/superapp-web }
          # G50 (docs/04 §28.7/§28.9): ditandatangani seperti service lain; BELUM dipakai deploy.yml (overlay segment /
          # wa-unofficial; wa-unofficial OFF di production, ADR-044)
          - { service: segment-worker, context: services/segment-worker }
          - { service: wa-unofficial, context: services/wa-unofficial }
          # G44 (docs/04 §28.2): rantai rilis bertanda tangan (deploy.yml / efn-deploy IMAGE_FORECAST_WORKER); compose
          # memakainya hanya bila FORECAST_ENABLED=true (overlay forecast, deploy.sh). SEC-214: build GAGAL selama
          # services/forecast-worker/requirements.lock masih placeholder (pip --require-hashes).
          - { service: forecast-worker, context: services/forecast-worker }
          # G42 (docs/04 §26): ikut rantai rilis bertanda tangan (deploy.yml / efn-deploy IMAGE_INSIGHT_WEB)
          - { service: insight-web, context: services/insight-web }
          # G62 (docs/04 §29, ADR-050): ikut rantai rilis bertanda tangan (deploy.yml / efn-deploy IMAGE_LOGIN_GATEWAY)
          - { service: login-gateway, context: services/login-gateway }
          - { service: ai-ocr-worker, context: services/ai-ocr-worker }
          - { service: etl, context: services/etl }
          - { service: text2sql, context: services/text2sql }   # G38 Text-to-SQL (docs/04 §23)
          # G41 (docs/04 §25): image ditandatangani seperti service lain; BELUM dipakai deploy.yml (overlay esb, runbook §8)
          - { service: esb-extract, context: services/esb-extract }
          # G43 (docs/04 §27.2): container sekali jalan esb-migrate; ditandatangani, TIDAK dipakai deploy.yml (operator
          # menjalankan `docker compose run` dengan IMAGE_ESB_MIGRATE ber-digest, runbook migrasi-esb-odoo §2)
          - { service: esb-migrate, context: scripts/migration }
          # PostgreSQL + WAL-G (R-T08): image infra, ikut scan/SBOM/sign seperti image aplikasi
          - { service: postgres, context: infra/backup/postgres }
          # MinIO server + mc dari source upstream (image minio/minio & minio/mc hilang dari Docker Hub, gelombang 7)
          - { service: minio, context: infra/minio }
          # G13: Metabase + driver ClickHouse ber-checksum (infra/metabase/Dockerfile)
          - { service: metabase, context: infra/metabase }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # G18: owner organisasi `BIma-Creative-Tech` mengandung huruf besar; referensi image OCI wajib huruf kecil
      # (ekspresi Actions tidak punya lower()). IMAGE_REPO dipakai buildx push-by-digest, Trivy, Syft, cosign, attest.
      - name: Nama repo image (huruf kecil)
        env:
          OWNER: ${{ github.repository_owner }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/${SVC}"
          [[ "$repo" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]] || { echo "::error::nama image tidak valid: $repo"; exit 1; }
          echo "IMAGE_REPO=$repo" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          # SEC-90: `sha-<short>` hanya dari build main (identitas refs/heads/main); run tag v* tidak menimpanya.
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.vendor=Era Food and Nourishment
            org.opencontainers.image.title=efn-${{ matrix.service }}

      # SATU build: hasil push (digest) = yang di-scan, di-SBOM, dan ditandatangani (SEC-83).
      # SEC-90: push BY DIGEST tanpa tag -> image yang gagal Trivy tidak pernah mendapat tag (`main`, `latest`, `X.Y.Z`,
      # `sha-*`); tag dipasang di langkah terakhir atas digest yang sudah ditandatangani.
      - name: Build & push by digest (tanpa tag)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ (matrix.service == 'api-gateway' || matrix.service == 'superapp-web' || matrix.service == 'insight-web' || matrix.service == 'login-gateway') && 'runtime' || '' }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true

      - name: Digest valid
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::digest push tidak valid"; exit 1; }'

      - name: Trivy image scan BY DIGEST (gate HIGH/CRITICAL sebelum sign)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        env:
          # Image tidak ada di daemon lokal (buildx docker-container) -> ambil dari registry (kredensial docker login).
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.69.3
          image-ref: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.service }}.txt
          trivyignores: .trivyignore.yaml
      - name: Ringkasan Trivy (log + job summary)
        if: always()
        env:
          SVC: ${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [ -f "trivy-${SVC}.txt" ] || exit 0
          cat "trivy-${SVC}.txt"
          { echo "### Trivy image ${SVC}@${DIGEST} (HIGH/CRITICAL, fixed only)"; echo '```'; head -c 900000 "trivy-${SVC}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy SARIF (hanya bila code scanning tersedia)
        if: always() && env.CODE_SCANNING == 'true' && steps.push.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.69.3
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          trivyignores: .trivyignore.yaml
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always() && env.CODE_SCANNING == 'true' && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: SBOM (Syft, SPDX) - file lokal, bukan artifact
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        # SBOM tingkat paket (tanpa daftar file + relasi kepemilikan file): SPDX odoo default 58 MB (74 rb file) ditolak
        # Rekor publik saat `cosign attest` (cosign mengirim envelope ke Rekor untuk diverifikasi; Rekor jenis `dsse`
        # hanya MENYIMPAN hash envelope/payload + sertifikat, bukan isi SBOM: diverifikasi entri 3155542984, r9 SEC-84).
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP_OVERLAP: "false"
          SYFT_PACKAGE_EXCLUDE_BINARY_OVERLAP_BY_OWNERSHIP: "false"
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Cosign sign + attest SBOM (keyless, OIDC; disimpan di registry)
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.service }}.spdx.json
        # Rekor publik (sigstore) kadang timeout: retry dengan jeda; sign/attest idempoten per digest.
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "percobaan $i gagal, ulangi dalam $((i * 20)) dtk"; sleep $((i * 20)); done; return 1; }
          retry cosign sign "$IMAGE"
          retry cosign attest --type spdxjson --predicate "$SBOM" "$IMAGE"

      # SEC-90: tag hanya untuk digest yang sudah lolos Trivy + ditandatangani. `imagetools create` dengan satu sumber
      # memasang tag ke manifest/index YANG SAMA (digest tidak berubah; diuji 9 Okt 2026 dengan registry lokal: index
      # provenance+sbom tetap sha256 yang sama). Digest tiap tag diverifikasi ulang -> tanda tangan berlaku untuk tag.
      - name: Pasang tag atas digest bertanda tangan
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            [[ "$t" == "${IMAGE_REPO}:"* ]] || { echo "::error::tag di luar repo image: $t"; exit 1; }
            args+=(-t "$t")
          done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::tidak ada tag"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::$t -> $got, bukan $DIGEST"; exit 1; }
            echo "OK $t -> $DIGEST"
          done <<< "$TAGS"

      - name: Attest build provenance (GitHub)
        # Artifact attestation GitHub tidak tersedia untuk repo privat milik akun pribadi (paket gratis) -> hanya bila repo
        # publik atau variable ATTESTATIONS_ENABLED=true (org/Enterprise). Deploy tidak bergantung padanya: host memakai
        # `cosign verify` (langkah di atas), lihat scripts/host/efn-deploy.
        if: vars.ATTESTATIONS_ENABLED == 'true' || github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

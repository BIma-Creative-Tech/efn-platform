# Build image per service -> scan (Trivy) -> SBOM (Syft) -> sign (Cosign keyless) -> attest provenance -> push GHCR.
# Dipicu oleh push ke main (tag: sha-<short>, main) dan tag v* (tag: vX.Y.Z, latest).
#
# G16 (CI GitHub, 9 Okt 2026), repo privat paket gratis:
# - Tanpa artifact (kuota storage 500 MB): SBOM Syft TIDAK diunggah sebagai artifact; SBOM di-attest (cosign keyless)
#   dan disimpan di registry bersama image (+ SBOM BuildKit `sbom: true`). Ambil: `cosign download attestation`.
# - Hasil Trivy = tabel di log + job summary; SARIF/upload code scanning hanya bila repo publik atau
#   CODE_SCANNING_ENABLED=true. Gate HIGH/CRITICAL (fixed) tetap memblokir push. Pengecualian: .trivyignore.yaml.
# Runbook: docs/runbooks/ci-github-free-plan.md
name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # PR: hanya build + gate Trivy image (tanpa login, push, SBOM, sign) agar gate terlihat SEBELUM merge manual
  # (alur satu PR, runbook ci-github-free-plan.md bagian 9). Dibatasi path agar hemat menit.
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "infra/backup/postgres/**"
      - "infra/minio/**"
      - "infra/metabase/**"
      - ".trivyignore.yaml"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: read

# Build terbaru untuk ref yang sama menggantikan yang lama (hemat menit); tag rilis punya ref sendiri.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository_owner }}
  CODE_SCANNING: ${{ vars.CODE_SCANNING_ENABLED == 'true' || github.event.repository.visibility == 'public' }}

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write         # cosign keyless (OIDC)
      attestations: write     # build provenance
      security-events: write  # hanya terpakai bila CODE_SCANNING == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [odoo, api-gateway, superapp-web, ai-ocr-worker, etl, postgres, minio, metabase]
        include:
          - { service: odoo, context: services/odoo }
          - { service: api-gateway, context: services/api-gateway }
          - { service: superapp-web, context: services/superapp-web }
          - { service: ai-ocr-worker, context: services/ai-ocr-worker }
          - { service: etl, context: services/etl }
          # PostgreSQL + WAL-G (R-T08): image infra, ikut scan/SBOM/sign seperti image aplikasi
          - { service: postgres, context: infra/backup/postgres }
          # MinIO server + mc dari source upstream (image minio/minio & minio/mc hilang dari Docker Hub, gelombang 7)
          - { service: minio, context: infra/minio }
          # G13: Metabase + driver ClickHouse ber-checksum (infra/metabase/Dockerfile)
          - { service: metabase, context: infra/metabase }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.vendor=Era Food and Nourishment
            org.opencontainers.image.title=efn-${{ matrix.service }}

      - name: Build (load lokal untuk scan sebelum push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ${{ matrix.context }}
          target: ${{ (matrix.service == 'api-gateway' || matrix.service == 'superapp-web') && 'runtime' || '' }}
          load: true
          tags: local/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      - name: Trivy image scan (gate HIGH/CRITICAL)
        # 0.35.0: satu-satunya tag yang tidak di-force-push pada insiden supply chain Maret 2026 (CVE-2026-33634);
        # binary Trivy dipin ke versi aman.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          version: v0.69.3
          image-ref: local/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.service }}.txt
          trivyignores: .trivyignore.yaml
      - name: Ringkasan Trivy (log + job summary)
        if: always()
        env:
          SVC: ${{ matrix.service }}
        run: |
          [ -f "trivy-${SVC}.txt" ] || exit 0
          cat "trivy-${SVC}.txt"
          { echo "### Trivy image ${SVC} (HIGH/CRITICAL, fixed only)"; echo '```'; head -c 900000 "trivy-${SVC}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy SARIF (hanya bila code scanning tersedia)
        if: always() && env.CODE_SCANNING == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          version: v0.69.3
          skip-setup-trivy: true
          image-ref: local/${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          trivyignores: .trivyignore.yaml
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52  # v3.38.2
        if: always() && env.CODE_SCANNING == 'true' && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ${{ matrix.context }}
          target: ${{ (matrix.service == 'api-gateway' || matrix.service == 'superapp-web') && 'runtime' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: SBOM (Syft, SPDX) - file lokal, bukan artifact
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        # SBOM tingkat paket (tanpa daftar file + relasi kepemilikan file): SPDX odoo default 58 MB (74 rb file) ditolak
        # Rekor publik saat `cosign attest`; versi ramping ±2 MB dengan daftar paket yang sama (diukur 9 Okt 2026).
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP_OVERLAP: "false"
          SYFT_PACKAGE_EXCLUDE_BINARY_OVERLAP_BY_OWNERSHIP: "false"
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        if: github.event_name != 'pull_request'

      - name: Cosign sign + attest SBOM (keyless, OIDC; disimpan di registry)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.service }}.spdx.json
        # Rekor publik (sigstore) kadang timeout: retry dengan jeda; sign/attest idempoten per digest.
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "percobaan $i gagal, ulangi dalam $((i * 20)) dtk"; sleep $((i * 20)); done; return 1; }
          retry cosign sign "$IMAGE"
          retry cosign attest --type spdxjson --predicate "$SBOM" "$IMAGE"

      - name: Attest build provenance (GitHub)
        # Artifact attestation GitHub tidak tersedia untuk repo privat milik akun pribadi (paket gratis) -> hanya bila repo
        # publik atau variable ATTESTATIONS_ENABLED=true (org/Enterprise). Deploy tidak bergantung padanya: host memakai
        # `cosign verify` (langkah di atas), lihat scripts/host/efn-deploy.
        if: >-
          github.event_name != 'pull_request' &&
          (vars.ATTESTATIONS_ENABLED == 'true' || github.event.repository.visibility == 'public')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

# DAST: OWASP ZAP baseline terhadap staging setiap kali deploy staging selesai + mingguan.
name: DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap:
    # G16: tanpa staging (variable STAGING_DOMAIN kosong) tidak ada target -> job dilewati, bukan gagal/menghabiskan menit.
    # Catatan kuota: zaproxy/action-baseline mengunggah laporan sebagai artifact (zap_scan) -> perhatikan kuota storage.
    if: >-
      vars.STAGING_DOMAIN != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # STAGING_DOMAIN adalah repository variable (bukan environment-scoped) agar bisa dipakai di matrix
    strategy:
      fail-fast: false
      matrix:
        target:
          - https://app.${{ vars.STAGING_DOMAIN }}
          - https://api.${{ vars.STAGING_DOMAIN }}/health
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ matrix.target }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: true
          fail_action: false   # ubah ke true setelah baseline bersih

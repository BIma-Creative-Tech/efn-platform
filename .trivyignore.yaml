# Pengecualian Trivy (fs + image) - G16, 9 Okt 2026. Dipakai security.yml & build-push.yml (input `trivyignores`).
# ATURAN: setiap entri wajib `statement` (alasan) + `expired_at` (tanggal tinjau, maks. 90 hari). Setelah lewat
# tanggal, entri tidak berlaku lagi dan gate kembali gagal -> tinjau ulang, perpanjang dengan alasan, atau perbaiki.
# CVE dependency aplikasi (npm/pip) TIDAK di-ignore di sini: perbaiki versinya. Runbook: docs/runbooks/ci-github-free-plan.md
# Persetujuan: pengecualian WAL-G (FP CVE-2021-38599) dan Metabase v0.58.35 di bawah DISETUJUI pemilik proyek pada 9 Okt 2026
# (sampai expired_at). Entri baru di luar daftar ini butuh persetujuan baru.
vulnerabilities:
  # G17 (10 Okt 2026): 10 pengecualian WAL-G v3.0.9 (G16) DIHAPUS - WAL-G kini dibangun dari source (Go 1.27.2,
  # x/net 0.60.0, grpc 1.83.2; infra/backup/postgres/Dockerfile) dan Trivy image bersih. Tersisa false positive di bawah.
  # Bukan kerentanan versi ini: Trivy membaca versi modul wal-g sebagai pseudo-version "v0.0.0-...+dirty" (< 1.1)
  # sehingga CVE 2021 (diperbaiki di wal-g 1.1) tercocokkan. Binary = v3.0.9.
  - id: CVE-2021-38599
    paths: ["usr/local/bin/wal-g"]
    statement: "False positive: pseudo-version v0.0.0-...+dirty; binary sebenarnya wal-g v3.0.9 (perbaikan sejak 1.1). G16."
    expired_at: 2027-01-07
  # Metabase v0.58.35 LTS (image terbaru jalur LTS, 30 Sep 2026): dependency Java upstream di app/metabase.jar, belum
  # ada rilis Metabase yang memperbaikinya. Paparan: Metabase hanya internal (wg-https + allowlist staf, ADR-023),
  # koneksi DB hanya PostgreSQL & ClickHouse (driver mssql/zookeeper tidak dipakai). Tinjau saat bump Metabase.
  - id: CVE-2026-106451
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: lz4-java 1.10.1; belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  - id: CVE-2025-59250
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: mssql-jdbc 13.2.1 (driver tidak dipakai; kemungkinan FP sufiks .jre11); belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  - id: CVE-2026-54399
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: httpcore5 5.3.1; belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  - id: CVE-2026-54428
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: httpcore5-h2 5.2.4; belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  - id: CVE-2026-24281
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: zookeeper 3.8.4 (tidak dipakai); belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  - id: CVE-2026-24308
    paths: ["app/metabase.jar"]
    statement: "Metabase v0.58.35 LTS upstream: zookeeper 3.8.4 (tidak dipakai); belum ada rilis perbaikan; BI internal saja. G16."
    expired_at: 2026-11-09
  # G26 (PR #71, 28 Okt 2026): Trivy image menemukan CVE baru di guava 33.5.0-jre dalam metabase.jar. Rilis LTS terbaru
  # (v0.58.38, diperiksa 28 Okt) masih memuat 33.5.0, jadi belum ada image perbaikan. Dampaknya DoS pada BI internal saja.
  - id: CVE-2026-102554
    paths: ["app/metabase.jar"]
    statement: "Metabase LTS upstream: guava 33.5.0-jre (perbaikan 33.7.2 belum ada di rilis Metabase mana pun, v0.58.38 dicek 28 Okt); DoS, BI internal saja. G26."
    expired_at: 2026-11-09
misconfigurations:
  - id: DS-0002
    paths:
      - "infra/metabase/Dockerfile"
    statement: >-
      Image resmi Metabase: run_metabase.sh mulai sebagai root hanya untuk menyiapkan user `metabase` (MUID/MGID)
      lalu menjalankan JVM sebagai user tersebut (uid 2000, PID 1); USER di Dockerfile mematahkan langkah itu. Di
      compose (SEC-85, diuji 9 Okt 2026): cap_drop ALL + cap_add hanya CHOWN, SETUID, SETGID (dibutuhkan
      adduser/chown/su); no-new-privileges; tidak read_only (run_metabase.sh menulis /etc/passwd, /metabase.db);
      Jetty hanya loopback, akses lewat sidecar TLS mTLS. Sama dengan checkov:skip CKV_DOCKER_3 di Dockerfile.
      Pernyataan sebelumnya ("cap_drop ALL") keliru saat disetujui; pernyataan faktual ini DISETUJUI ULANG pemilik
      proyek pada 9 Okt 2026 (setelah merge PR #35).
    expired_at: 2027-01-07
secrets: []

  # MinIO internal lewat TLS terverifikasi; tidak membuka listener HTTP/2/gRPC, tidak merender html/template.
  # Tindak lanjut (keputusan lead): bangun WAL-G dari source tag v3.0.9 dengan Go >= 1.27.2 + grpc >= 1.83.2, atau
  # naikkan ke rilis upstream berikutnya. Tinjau ulang paling lambat tanggal expired_at.
  - id: CVE-2026-84304

# ATURAN: setiap entri wajib `statement` (alasan) + `expired_at` (tanggal tinjau, maks. 90 hari). Setelah lewat
# tanggal, entri tidak berlaku lagi dan gate kembali gagal -> tinjau ulang, perpanjang dengan alasan, atau perbaiki.
# CVE dependency aplikasi (npm/pip) TIDAK di-ignore di sini: perbaiki versinya. Runbook: docs/runbooks/ci-github-free-plan.md
# Persetujuan: pengecualian WAL-G 3.0.9 dan Metabase v0.58.35 di bawah DISETUJUI pemilik proyek pada 9 Okt 2026

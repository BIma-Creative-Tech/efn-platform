# odoo-rpc-gateway: filter L7 jalur BFF -> Odoo /json/2 untuk penjualan online (docs/04 §10.4.1, ADR-034 Proposed;
# pola s3-gateway ADR-030). Enkripsi: ADR-022 (TLS + mTLS kedua hop). Risiko: R-S03 (permukaan RPC Odoo), R-T15.
# Komponen: HAProxy LTS (GPL-2.0), image & digest sama dengan s3-gateway.
#
# Jalur: api-gateway --TLS 1.2+ mTLS (sertifikat klien CN api-gateway, CA internal)--> HAProxy :8443
#        --TLS re-encrypt mTLS (verify required, CA internal, verifyhost odoo, sertifikat klien CN odoo-rpc-gateway)-->
#        odoo-tls :8443 (ghostunnel --allow-cn=odoo-rpc-gateway) --loopback--> Odoo :8069 /json/2 (bearer API key PT).
# Tidak di-label Traefik, tanpa port host, tanpa stats socket / runtime API.
#
# Kebijakan (fail-closed; urutan aturan = urutan evaluasi; alasan penolakan dicatat di log `why=`):
#   - sertifikat klien wajib (handshake ditolak tanpa sertifikat dari CA internal; EKU clientAuth dicek OpenSSL)
#     dan CN harus persis `api-gateway`                                                       -> 403 cn
#   - HTTP/1.1 saja, request-target origin-form (`/...`), tanpa '#'                            -> 403 target
#   - method POST saja (method override header juga ditolak, lihat allowlist header)          -> 405 method
#   - path MENTAH (tanpa decode/normalisasi) harus SAMA PERSIS dengan salah satu dari 15 path §10.4.3 + §12.7 L-60 + §13.5
#     + §14.A.5 (QR order G22). Karena
#     dicocokkan mentah, '%'/';'/'//'/segmen titik/huruf besar/garis miring akhir otomatis tidak cocok; tetap ada
#     aturan eksplisit di depan agar log menyebut alasan yang jelas                           -> 403 path
#   - query string apa pun (termasuk '?' kosong)                                              -> 403 query
#   - header di luar allowlist (method override, upgrade, transfer-encoding, x-original-url, x-openerp-*, ...)
#     setelah header "derau" klien HTTP dibuang                                               -> 403 header
#   - Host harus odoo-rpc-gateway[:8443] (tepat satu)                                        -> 403 host
#   - Content-Type tepat satu, application/json (opsional ;charset=utf-8)                     -> 403 ctype
#   - Authorization tepat satu, skema bearer + token karakter aman                            -> 403 auth
#   - Content-Length tepat satu (tanpa chunked), <= 262144 byte (256 KB)                      -> 400 length / 413 too_large
#   - X-Odoo-Database DIPAKSA = ${ODOO_DB} (nilai klien dibuang); Cookie, X-Forwarded-*, Forwarded, X-Real-IP,
#     Accept-Language, Sec-Fetch-* dibuang; Set-Cookie respons Odoo dibuang.
# Log akses: tanpa body, tanpa header (Authorization tidak pernah ditulis), path tanpa query.
# Penolakan gateway membawa header respons `X-EFN-Gateway-Deny: <alasan>` sehingga BFF/uji bisa membedakannya dari
# 403/404 milik Odoo (alasan = kategori tetap di atas, bukan isi request).
global
    log stdout format raw local0 info
    maxconn 256
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2
    # Tidak ada stats socket / runtime API.

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    # §10.4.1: timeout 30 s ke Odoo (klien BFF memakai 8/15/20 s, jadi gateway tidak memotong lebih dulu)
    timeout server 30s
    timeout client 35s
    timeout http-request 10s
    timeout http-keep-alive 30s

frontend json2
    # Sertifikat odoo-rpc-gateway (gen-pki.sh, EKU server+client) digabung crt+key oleh entrypoint di tmpfs.
    bind :8443 ssl crt /tmp/haproxy/odoo-rpc-gateway.pem ca-file /run/secrets/efn_ca_crt verify required alpn http/1.1
    log-format "%ci cn=%{+Q}[ssl_c_s_dn(CN)] %HM %HPO %ST %B %Ta %Tt %Tw why=%[var(txn.why)]"
    # 503 milik gateway (antrean penuh/timeout antrean/Odoo down) dibedakan dari 503 Odoo; tanpa isi internal.
    http-error status 503 content-type application/json string "{\"error\":\"gateway_unavailable\"}" hdr X-EFN-Gateway-Error unavailable

    acl cn_bff         ssl_c_s_dn(CN) -m str api-gateway
    acl c_verified     ssl_c_verify eq 0
    acl ver11          req.ver -m str 1.1
    acl u_origin       url -m beg /
    acl u_fragment     url -m sub #
    acl m_post         method POST
    acl p_pct          path -m sub %
    acl p_semicolon    path -m sub ;
    acl p_dslash       path -m sub //
    acl p_dot          path -m reg (^|/)\.\.?(/|$)
    # 15 path persis docs/04 §10.4.3 + L-60 + §13.5 + §14.A.5 (case-sensitive, mentah). Ubah daftar = ubah kontrak +
    # RPC_ALLOWLIST Odoo.
    acl p_allowed      path -m str /json/2/efn.online.channel/efn_online_catalog
    acl p_allowed      path -m str /json/2/efn.online.channel/efn_online_stock
    acl p_allowed      path -m str /json/2/efn.online.channel/efn_online_image
    acl p_allowed      path -m str /json/2/efn.online.channel/efn_online_quote
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_place
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_mark_paid
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_cancel
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_refund
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_refund_settled
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_status
    # G20 L-60 (SEC-145 r13): otorisasi refund POS pesanan bayar di kasir setelah approver CS di BFF.
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_counter_refund_authorize
    # G21 §13.5 (W-06/E-39, L-63): faktur atas nama pembeli - partner terlindungi efn_pii; tanpa PII di hasil RPC.
    acl p_allowed      path -m str /json/2/efn.online.order/efn_online_set_invoice_party
    # G22 §14.A.5 / §14.E.2 (W-07 QR order dari ponsel, E-27): path 13-15, user teknis per PT efn_qr_pb/efn_qr_bcf
    # (API key odoo_api_key_qr_<pt>, grup teknis tanpa ACL dokumen). Model & nama metode = kontrak §14.A.5; bila
    # efn-odoo-engineer memakai nama lain (docs/08 §13.1b menyebut efn.pos.table.session), ubah kontrak dulu.
    acl p_allowed      path -m str /json/2/efn.pos.qr.order/efn_qr_menu
    acl p_allowed      path -m str /json/2/efn.pos.qr.order/efn_qr_submit
    acl p_allowed      path -m str /json/2/efn.pos.qr.order/efn_qr_status
    acl q_any         url -m sub ?
    # Allowlist nama header (HTX: huruf kecil; daftar sesuai urutan diterima, header ganda ikut muncul). PCRE2.
    # Header di luar daftar (x-http-method-override, x-method-override, upgrade, transfer-encoding, te, expect,
    # x-original-url, x-rewrite-url, x-openerp-session-id, proxy-*, ...) = tolak, bukan dibuang diam-diam.
    acl h_unknown      req.hdr_names,lower -m reg (^|,)(?!(host|content-type|content-length|authorization|accept|accept-encoding|user-agent|connection|traceparent|tracestate|x-request-id)(,|$))[^,]+
    acl h_host_one     req.fhdr_cnt(host) eq 1
    acl h_host_ok      req.fhdr(host) -m reg -i ^odoo-rpc-gateway(:8443)?$
    acl h_ct_one       req.fhdr_cnt(content-type) eq 1
    acl h_ct_ok        req.fhdr(content-type) -m reg -i ^application/json(\x20*;\x20*charset=utf-8)?$
    acl h_auth_one     req.fhdr_cnt(authorization) eq 1
    # Spasi di regex HAProxy memisah argumen (= pola OR) -> wajib \x20. Ditemukan uji G17: `^bearer [..]` membuat
    # `Authorization: Basic <base64 16+>` lolos lewat pola kedua.
    acl h_auth_ok      req.fhdr(authorization) -m reg -i ^bearer\x20[A-Za-z0-9._~+/=-]{16,512}$
    acl h_cl_one       req.fhdr_cnt(content-length) eq 1
    acl h_te           req.fhdr_cnt(transfer-encoding) gt 0
    acl h_cl_big       req.hdr_val(content-length) gt 262144

    # (1) identitas klien mTLS
    http-request set-var(txn.why) str(cn) if !c_verified || !cn_bff
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !c_verified || !cn_bff
    # (2) bentuk request-target & versi
    http-request set-var(txn.why) str(target) if !ver11 || !u_origin || u_fragment
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !ver11 || !u_origin || u_fragment
    # (3) method
    http-request set-var(txn.why) str(method) if !m_post
    http-request deny deny_status 405 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !m_post
    # (4) path: encoded / ';' / '//' / segmen titik, query, lalu allowlist persis
    http-request set-var(txn.why) str(path_encoded) if p_pct || p_semicolon || p_dslash || p_dot
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if p_pct || p_semicolon || p_dslash || p_dot
    http-request set-var(txn.why) str(query) if q_any
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if q_any
    http-request set-var(txn.why) str(path) if !p_allowed
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !p_allowed
    # (5) header: buang derau klien HTTP & header proxy/sesi dari klien, lalu allowlist
    http-request del-header cookie
    http-request del-header forwarded
    http-request del-header x-forwarded -m beg
    http-request del-header x-real-ip
    http-request del-header x-odoo-database
    http-request del-header accept-language
    http-request del-header sec-fetch -m beg
    http-request set-var(txn.why) str(header) if h_unknown
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if h_unknown
    http-request set-var(txn.why) str(host) if !h_host_one || !h_host_ok
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !h_host_one || !h_host_ok
    http-request set-var(txn.why) str(ctype) if !h_ct_one || !h_ct_ok
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !h_ct_one || !h_ct_ok
    http-request set-var(txn.why) str(auth) if !h_auth_one || !h_auth_ok
    http-request deny deny_status 403 hdr X-EFN-Gateway-Deny %[var(txn.why)] if !h_auth_one || !h_auth_ok
    http-request set-var(txn.why) str(length) if h_te || !h_cl_one
    http-request deny deny_status 400 hdr X-EFN-Gateway-Deny %[var(txn.why)] if h_te || !h_cl_one
    http-request set-var(txn.why) str(too_large) if h_cl_big
    http-request deny deny_status 413 hdr X-EFN-Gateway-Deny %[var(txn.why)] if h_cl_big
    # (6) paksa database Odoo (entrypoint memvalidasi ODOO_DB = ^efn_[a-z0-9_]{1,40}$, fail-closed)
    http-request set-header X-Odoo-Database "${ODOO_DB}"
    # (7) SEC-96: antrean ke Odoo penuh (16 request menunggu slot ODOO_RPC_MAXCONN) -> 503 seketika (kapasitas,
    #     bukan pelanggaran filter: header X-EFN-Gateway-Error, BUKAN X-EFN-Gateway-Deny; BFF boleh retry/backoff)
    http-request set-var(txn.why) str(busy) if { queue(odoo) ge 16 }
    http-request return status 503 content-type application/json string "{\"error\":\"gateway_unavailable\"}" hdr X-EFN-Gateway-Error unavailable if { queue(odoo) ge 16 }
    http-request set-var(txn.why) str(-)
    default_backend odoo

backend odoo
    # Respons: sesi web Odoo tidak pernah diteruskan ke BFF (bearer API key tidak butuh cookie)
    http-response del-header set-cookie
    # SEC-96 / L-16b (docs/04 §10.17): request online ke Odoo dibatasi ${ODOO_RPC_MAXCONN} (default 4, entrypoint
    # memvalidasi 1..16) = jumlah worker HTTP Odoo yang DISISIHKAN untuk kanal online; worker lain tetap untuk POS
    # (sizing: docs/runbooks/online-orders.md#sizing-worker). Kelebihan request MENGANTRE di gateway (bukan di worker
    # Odoo yang dipakai bersama POS): antrean dibatasi 16 (frontend, `queue(odoo)` -> 503 seketika) dan tiap request
    # menunggu maks. `timeout queue` 2 s -> 503. Kedua 503 membawa X-EFN-Gateway-Error: unavailable -> BFF retry/
    # backoff + circuit breaker (§10.4.2).
    timeout queue 2s
    # Re-encrypt mTLS ke sidecar odoo-tls (allow-cn odoo-rpc-gateway).
    server odoo odoo:8443 ssl verify required ca-file /run/secrets/efn_ca_crt crt /tmp/haproxy/odoo-rpc-gateway.pem verifyhost odoo sni str(odoo) alpn http/1.1 maxconn "${ODOO_RPC_MAXCONN}" check check-ssl inter 10s resolvers docker init-addr last,libc,none
    option httpchk
    http-check send meth GET uri /web/health ver HTTP/1.1 hdr Host odoo

# Healthcheck Docker (loopback namespace sendiri, bukan transaksi data): 200 bila backend Odoo sehat.
frontend health
    bind 127.0.0.1:8406
    mode http
    acl odoo_down nbsrv(odoo) lt 1
    monitor-uri /healthz
    monitor fail if odoo_down

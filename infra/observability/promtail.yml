server:
  # Hanya loopback (healthcheck); tidak di-scrape -> tidak ada listener di network.
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# Push log ke Loki lewat HTTPS terverifikasi + sertifikat klien promtail (mTLS, docs/04 §8.5)
clients:
  - url: https://loki:3100/loki/api/v1/push
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_promtail_crt
      key_file: /run/secrets/tls_promtail_key
      server_name: loki

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # docker-socket-proxy (read-only) lewat sidecar ghostunnel mTLS :2376
      # https:// (bukan tcp://): klien docker di promtail memakai scheme dari URL -> tcp:// = HTTP polos ke port mTLS
      # (EOF, gelombang 7). Traefik memakai klien sendiri sehingga tcp:// + tls tetap benar di traefik.yml.
      - host: https://docker-socket-proxy:2376
        refresh_interval: 15s
        tls_config:
          ca_file: /run/secrets/efn_ca_crt
          cert_file: /run/secrets/tls_promtail_crt
          key_file: /run/secrets/tls_promtail_key
          server_name: docker-socket-proxy
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Redaksi dasar: nomor HP Indonesia dan token Bearer tidak boleh masuk log (UU PDP, R-L01)
      - replace:
          expression: '(\+?62|0)8[1-9][0-9]{7,11}'
          replace: '[PHONE_REDACTED]'
      - replace:
          expression: '(?i)bearer\s+[a-z0-9\-_\.]+'
          replace: 'Bearer [REDACTED]'
      # Gelombang 11 (SEC-43): baris sink audit Odoo (`EFN_AUDIT_SINK {json}`, logger odoo.addons.efn_audit.sink)
      # -> stream terpisah stream="efn_audit_sink" (retensi 400 hari di loki.yml, alert ruler loki-rules/).
      # Label rendah kardinalitas saja: audit_op (create/write/unlink/purge). Field lain diparse saat query.
      # Hanya dari container service=odoo: container lain tidak bisa memalsukan stream ini dengan mencetak teks sama.
      - match:
          selector: '{service="odoo"} |= "odoo.addons.efn_audit.sink: EFN_AUDIT_SINK "'
          stages:
            - regex:
                expression: 'EFN_AUDIT_SINK (?P<sink>\{.*\})'
            - json:
                source: sink
                expressions:
                  audit_op: operation
            - static_labels:
                stream: efn_audit_sink
            - labels:
                audit_op:

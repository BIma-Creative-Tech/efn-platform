      # (6) G17 (docs/04 §10.11): baris penjualan online BFF -> stream="efn_online" (retensi default 30 hari;
      #     operasional, bukan bukti audit), alert loki-rules/efn-online.yml, runbook docs/runbooks/online-orders.md.
      #     Format NestJS ConsoleLogger (NO_COLOR=1), regex BERJANGKAR penuh, hanya service=api-gateway:
      #     - anomali  : "... WARN [OnlineAnomaly] EFN_ONLINE_ANOMALY {"kind":"<a-z_>","severity":"warning|critical",...}"
      #                  (services/api-gateway/src/odoo-rpc/online-metrics.ts; JSON.stringify kind lalu severity)
      #     - heartbeat: "... LOG|ERROR [Online<Nama>] EFN_ONLINE_RECON {"status":"ok|error",...}" (rekonsiliasi
      #                  efn_online_status §10.6.5, tiap siklus) -> dead-man EfnOnlineReconDeadman (20 menit).
      #     Label rendah kardinalitas: online_event (anomaly|recon), kind, severity, recon_status.
      - match:
          selector: '{service="api-gateway"} |~ "^\\[Nest\\] \\d+  - \\d{1,2}/\\d{1,2}/\\d{4}, \\d{1,2}:\\d{2}:\\d{2} (AM|PM) +WARN \\[OnlineAnomaly\\] EFN_ONLINE_ANOMALY \\{\"kind\":\"[a-z_]{1,40}\",\"severity\":\"(warning|critical)\"[^\\n]*\\}\\s*$"'
          stages:
            - regex:
                expression: ' EFN_ONLINE_ANOMALY \{"kind":"(?P<kind>[a-z_]{1,40})","severity":"(?P<severity>warning|critical)"'
            - static_labels:
                stream: efn_online
                online_event: anomaly
            - labels:
                kind:
                severity:

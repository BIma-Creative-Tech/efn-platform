server:
  # Hanya loopback (healthcheck); tidak di-scrape -> tidak ada listener di network.
  http_listen_address: 127.0.0.1
  http_listen_port: 9080
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# Push log ke Loki lewat HTTPS terverifikasi + sertifikat klien promtail (mTLS, docs/04 §8.5)
clients:
  - url: https://loki:3100/loki/api/v1/push
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_promtail_crt
      key_file: /run/secrets/tls_promtail_key
      server_name: loki

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # docker-socket-proxy (read-only) lewat sidecar ghostunnel mTLS :2376
      # https:// (bukan tcp://): klien docker di promtail memakai scheme dari URL -> tcp:// = HTTP polos ke port mTLS
      # (EOF, gelombang 7). Traefik memakai klien sendiri sehingga tcp:// + tls tetap benar di traefik.yml.
      - host: https://docker-socket-proxy:2376
        refresh_interval: 15s
        tls_config:
          ca_file: /run/secrets/efn_ca_crt
          cert_file: /run/secrets/tls_promtail_crt
          key_file: /run/secrets/tls_promtail_key
          server_name: docker-socket-proxy
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Gelombang 13 (SEC-51/SEC-52): baris jangkar audit dikenali dengan regex BERJANGKAR penuh pada format log
      # (timestamp, level, NAMA LOGGER, payload JSON ber-skema) - bukan substring di mana pun dalam baris. Baris lain
      # yang kebetulan memuat teks "EFN_AUDIT_SINK"/"EFN_AUDIT_RECON" (mis. login gagal berisi teks itu) tidak masuk
      # stream audit. Batas: newline di argumen log Python tidak di-escape -> baris palsu utuh tetap mungkin sampai
      # Odoo/ETL meng-escape newline (SEC-51 butir 2, Odoo engineer/data-AI); runbook audit-sink-alerts.md §Batas.
      #
      # (1) Kepala rantai salinan audit ClickHouse (ETL, logger efn_etl.audit_job) -> stream="efn_audit_anchor"
      #     retensi 400 hari (loki.yml) = jangkar eksternal + dead-man (loki-rules/efn-ops-logs.yml). Dicocokkan
      #     SEBELUM redaksi: hash hex 64 dapat memuat pola "08xxxxxxxx" yang akan dirusak redaksi nomor HP.
      #     G18 (data-AI, epoch rantai): kunci opsional `,"epoch":N` sebelum `}` (epoch 0 = format lama tanpa kunci).
      - match:
          selector: '{service="etl"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} INFO efn_etl\\.audit_job EFN_AUDIT_CHAIN_HEAD \\{\"company\":\\d+,\"seq\":\\d+,\"row_hash\":\"[0-9a-f]{64}\"(,\"epoch\":\\d+)?\\}\\s*$"'
          stages:
            - static_labels:
                stream: efn_audit_anchor
                audit_event: chain_head
      # (2) Gelombang 11 (SEC-43) + 13 (SEC-49/SEC-51) + 14 (dipindah SEBELUM redaksi): baris sink audit Odoo v2 (efn_audit >= 19.0.1.3.0) ->
      #     stream="efn_audit_sink" (retensi 400 hari, alert loki-rules/efn-audit-sink.yml). Format Odoo:
      #     "<tgl> <jam>,<ms> <pid> INFO <db> odoo.addons.efn_audit.sink: EFN_AUDIT_SINK {json}". JSON sort_keys +
      #     ensure_ascii (newline di nilai selalu di-escape): wajib diawali "audit_op", "critical", memuat "log_id"
      #     numerik, dan diakhiri "v": 2. Baris lain (logger lain, level lain, v1, substring di pesan login) DIBUANG
      #     dari stream ini. Label rendah kardinalitas: audit_op (10 nilai) + critical (true|false). Keaslian per baris =
      #     `mac` HMAC (kunci efn_audit_sink_key, diverifikasi ETL); alert EfnAuditSinkUnsigned bila mac null.
      #     Hanya dari container service=odoo (label Docker; container lain tidak bisa memalsukan).
      - match:
          selector: '{service="odoo"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} \\d+ INFO \\S+ odoo\\.addons\\.efn_audit\\.sink: EFN_AUDIT_SINK \\{\"audit_op\": \"[a-z_]{1,32}\", \"critical\": (true|false), [^\\n]*\"log_id\": [1-9]\\d*, [^\\n]*\"v\": 2\\}\\s*$"'
          stages:
            - regex:
                expression: ' odoo\.addons\.efn_audit\.sink: EFN_AUDIT_SINK (?P<sink>\{"audit_op": .*\})\s*$'
            - json:
                source: sink
                expressions:
                  audit_op: audit_op
                  critical: critical
            - static_labels:
                stream: efn_audit_sink
            - labels:
                audit_op:
                critical:
      # (2b) Gelombang 15b (SEC-76, efn_pos_kds >= G15): kegagalan pembuatan tiket dapur -> stream="efn_kds" (retensi
      #      default 30 hari; operasional, bukan bukti audit), alert loki-rules/efn-kds.yml, runbook
      #      docs/runbooks/kds-ticket-failed.md. Format Odoo (logger KHUSUS odoo.addons.efn_pos_kds.alert, level ERROR):
      #      "<tgl> <jam>,<ms> <pid> ERROR <db> odoo.addons.efn_pos_kds.alert: EFN_KDS_TICKET_FAILED {json}". JSON
      #      json.dumps(sort_keys=True), separator default ", "/": ": company_id, config_id, error (NAMA TIPE exception),
      #      event, kds_only, order_id, session_id, stations [{id, mode}]. Regex BERJANGKAR PENUH dan skema KETAT (hanya
      #      angka/null/boolean, mode dari selection tetap, error = identifier Python) -> tidak ada teks bebas/PII yang
      #      bisa masuk stream ini, dan baris lain yang sekadar memuat teks "EFN_KDS_TICKET_FAILED" (mis. catatan dapur,
      #      pesan login) TIDAK masuk. Dicocokkan SEBELUM redaksi (redaksi HP bisa mengubah ID besar berawalan 628...
      #      dan membuat baris tidak lagi cocok = alert hilang); redaksi tetap diterapkan sesudahnya (pertahanan
      #      berlapis). Hanya container service=odoo. Label rendah kardinalitas: kds_event (tetap) + kds_only (true|false);
      #      company/config/order/error dibaca di query (`| json`), bukan label.
      - match:
          selector: '{service="odoo"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} \\d+ ERROR \\S+ odoo\\.addons\\.efn_pos_kds\\.alert: EFN_KDS_TICKET_FAILED \\{\"company_id\": (\\d+|null), \"config_id\": (\\d+|null), \"error\": \"[A-Za-z_][A-Za-z0-9_]{0,79}\", \"event\": \"EFN_KDS_TICKET_FAILED\", \"kds_only\": (true|false), \"order_id\": \\d+, \"session_id\": (\\d+|null), \"stations\": \\[(\\{\"id\": \\d+, \"mode\": \"(kds|kds_printer|printer)\"\\}(, )?){0,50}\\]\\}\\s*$"'
          stages:
            - regex:
                expression: ' EFN_KDS_TICKET_FAILED \{.*"kds_only": (?P<kds_only>true|false), '
            - static_labels:
                stream: efn_kds
                kds_event: ticket_failed
            - labels:
                kds_only:
      # (2c) G21 (docs/04 §13.1 no. 7, E-44): rekonsiliasi liabilitas poin per PT setelah akrual harian Odoo
      #      (efn_loyalty_accounting) -> stream="efn_loyalty" (retensi 400 hari = bukti Finance, loki.yml),
      #      loyalty_event="liability_recon", label company_code (kode PT, <= 6 nilai). Alert loki-rules/efn-loyalty.yml
      #      grup efn-loyalty-liability-recon; panel Grafana efn-loyalty-liability-recon.json. Format Odoo:
      #      "<tgl> <jam>,<ms> <pid> INFO|WARNING <db> odoo.addons.efn_loyalty_accounting[.<sub>]: EFN_LOYALTY_RECON {json}".
      #      JSON = 5 kunci kontrak, nilai IDR bilangan bulat (boleh negatif), kode PT [A-Z][A-Z0-9]{1,7}, tanggal
      #      YYYY-MM-DD. Dua urutan kunci diterima: json.dumps(sort_keys=True) (bff_closing_liability_idr, company_code,
      #      date, diff_idr, odoo_liability_idr) dan urutan kontrak (company_code, date, odoo_liability_idr,
      #      bff_closing_liability_idr, diff_idr); separator ", "/": " atau ringkas ","/":". Regex BERJANGKAR PENUH dan
      #      skema KETAT (tanpa teks bebas) -> tidak ada PII yang bisa masuk; baris lain yang memuat teks
      #      "EFN_LOYALTY_RECON" (logger lain, kunci tambahan) TIDAK masuk dan tetap diredaksi. Dicocokkan SEBELUM
      #      redaksi DAN dikecualikan dari redaksi (selector di bawah): nominal liabilitas >= Rp6,2 M berawalan "628..."
      #      berpola nomor HP dan akan dirusak redaksi -> nilai alert hilang. Hanya container service=odoo. BFF memakai
      #      penanda yang sama untuk heartbeat recon-nya (tahap 4, service=api-gateway, loyalty_event="recon") - tidak
      #      bertabrakan karena selector service berbeda.
      - match:
          selector: '{service="odoo"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} \\d+ (INFO|WARNING) \\S+ odoo\\.addons\\.efn_loyalty_accounting(\\.[a-z0-9_]{1,40}){0,4}: EFN_LOYALTY_RECON (\\{\"bff_closing_liability_idr\": ?-?\\d{1,18}, ?\"company_code\": ?\"[A-Z][A-Z0-9]{1,7}\", ?\"date\": ?\"\\d{4}-\\d{2}-\\d{2}\", ?\"diff_idr\": ?-?\\d{1,18}, ?\"odoo_liability_idr\": ?-?\\d{1,18}\\}|\\{\"company_code\": ?\"[A-Z][A-Z0-9]{1,7}\", ?\"date\": ?\"\\d{4}-\\d{2}-\\d{2}\", ?\"odoo_liability_idr\": ?-?\\d{1,18}, ?\"bff_closing_liability_idr\": ?-?\\d{1,18}, ?\"diff_idr\": ?-?\\d{1,18}\\})\\s*$"'
          stages:
            - regex:
                expression: ' EFN_LOYALTY_RECON \{.*"company_code": ?"(?P<company_code>[A-Z][A-Z0-9]{1,7})"'
            - static_labels:
                stream: efn_loyalty
                loyalty_event: liability_recon
            - labels:
                company_code:
      # Redaksi dasar: nomor HP Indonesia dan token Bearer tidak boleh masuk log (UU PDP, R-L01). Semua baris KECUALI
      # kepala rantai (1) dan sink audit (2), yang dicocokkan di atas SEBELUM redaksi:
      #   - kepala rantai: isi dibatasi regex (angka + hex);
      #   - sink audit (G14, bug data-AI): baris bertanda tangan HMAC `mac` atas JSON kanonik. Redaksi mengubah isi
      #     (mis. `note` atau nilai lain berpola 08xxxxxxxx) -> ETL menghitung `sink_mac_invalid` palsu. Sink tidak memuat
      #     PII by design (efn_audit emit_sink: id, model, uid, nama field, catatan purge - tanpa nilai lama/baru;
      #     nama/nomor orang di-mask di sumber, SEC-45). Bila suatu saat sink memuat nomor HP, itu bug di efn_audit
      #     (perbaiki di sumber), bukan alasan meredaksi di sini (redaksi = MAC rusak = alarm tamper palsu).
      #   - rekonsiliasi liabilitas poin (2c, G21): hanya angka/kode PT/tanggal (skema ketat); redaksi merusak nominal
      #     berawalan 628... -> alert selisih buta. Dikecualikan lewat label loyalty_event (baris lain tidak berlabel itu
      #     pada tahap ini: label loyalty_event BFF/ETL baru dipasang di tahap 4/5 SETELAH redaksi).
      - match:
          selector: '{container=~".+", stream!~"efn_audit_anchor|efn_audit_sink", loyalty_event!="liability_recon"}'
          # G14 (bug ditemukan saat uji dry-run): stage `replace` Promtail hanya mengganti CAPTURE GROUP, bukan seluruh
          # kecocokan. Ekspresi lama `(\+?62|0)8...` hanya mengganti awalan "0"/"62" -> sisa nomor HP BOCOR ke Loki
          # ("[PHONE_REDACTED]81298765432"), dan ekspresi Bearer tanpa grup tidak mengganti apa pun. Sekarang seluruh
          # nilai sensitif = satu grup luar; grup dalam non-capturing (?:...).
          #
          # G15 (SEC-72/73/78): pola diperluas + UJI REGRESI CI (scripts/test-promtail-redaction.sh, fixture
          # infra/observability/tests/promtail/). Ubah pola di sini DAN di promtail-journal.yml, lalu perbarui
          # expected.txt; CI gagal bila keluaran berubah atau nilai sentinel lolos. RE2 (tanpa lookaround) ->
          # "batas kiri" = karakter non-alfanumerik di LUAR grup (tidak ikut diganti).
          # Urutan: rahasia di query/kv/JSON dulu (nilainya bisa berpola nomor), lalu skema Authorization, lalu HP.
          stages:
            # (a) Parameter rahasia di query string / logfmt (SEC-73): token reset password Odoo, access_token
            #     self-order, presigned S3, dll. Traefik JSON menulis "&" sebagai "\u0026" (encoding/json) -> ikut
            #     dikenali; "?"/"&"/"=" boleh URL-encoded (%3F/%26/%3D, mis. redirect=%2Fweb%3Ftoken%3D...). Nilai = sampai &, spasi, kutip, backslash, #.
            - replace:
                expression: '(?i)(?:^|[^a-z0-9_]|\\u0026|%3f|%26)(?:access_token|refresh_token|id_token|auth_token|token|password|passwd|pwd|csrf_token|secret|client_secret|api_key|apikey|signature|x-amz-signature|x-amz-credential|x-amz-security-token|otp|otp_code|pickup_code|qr_string|quote_hash)(?:=|%3d)([^&\s"''\\#]+)'
                replace: '[REDACTED]'
            #     Nama generik (code OAuth/OTP, key, sig) HANYA sebagai parameter query (?/&/;/\u0026) agar
            #     logfmt "code=200" di log Go tidak ikut diganti.
            - replace:
                expression: '(?i)(?:[?&;]|\\u0026|%3f|%26)(?:code|key|sig|auth|session_id|sid)(?:=|%3d)([^&\s"''\\#]+)'
                replace: '[REDACTED]'
            # (b) Rahasia sebagai kunci JSON / dict Python ("password": "...", 'token': '...').
            - replace:
                expression: '(?i)["''](?:password|passwd|token|access_token|refresh_token|secret|client_secret|api_key|otp|otp_code|pickup_code|qr_string|quote_hash)["'']\s*:\s*["'']([^"'']+)["'']'
                replace: '[REDACTED]'
            # (c) Skema Authorization: Bearer (JWT/opaque) dan Basic (base64; wajib memuat digit/+/=/"/" agar kata
            #     biasa seperti "Basic authentication" tidak terganti).
            - replace:
                expression: '(?i)\bbearer\s+([a-z0-9\-_.~+/]+=*)'
                replace: '[REDACTED]'
            - replace:
                expression: '(?i)\bbasic\s+([a-z0-9+/]*[0-9+/=][a-z0-9+/=]*)'
                replace: '[REDACTED]'
            # (c2) G17 (docs/04 §10.11): kode ambil pesanan online tampilan `ABCD-EFGH` (alfabet tanpa I/L/O/0/1; pola
            #      kontrak [A-HJ-NP-Z2-9] sedikit lebih luas). Batas kiri/kanan bukan alfanumerik dan bukan '-' -> segmen
            #      UUID huruf besar tidak terkena. Bentuk tanpa strip tidak diredaksi (terlalu banyak false positive kata
            #      8 huruf); BFF tidak pernah me-log kode, dan key query/JSON pickup_code/qr_string/quote_hash di (a)/(b).
            - replace:
                expression: '(?:^|[^0-9A-Za-z-])([A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4})(?:[^0-9A-Za-z-]|$)'
                replace: '[PICKUP_REDACTED]'
            # (d) Nomor HP Indonesia (SEC-78): 08…, 62…, +62…, (+62)…, %2B62…, dengan pemisah opsional spasi/titik/
            #     strip ("0812-3456-7890", "+62 812 3456 7890"). Struktur 8[1-9]x(x) [sep] xxx(x) [sep] xxx(xx) =
            #     7..11 digit setelah "8[1-9]" (sama dengan pola lama) dan blok terakhir tanpa pemisah -> tidak
            #     "menelan" nomor berikutnya. Batas kiri DAN kanan non-alfanumerik (di luar grup): potongan UUID/hash/
            #     ID container/ID thread tidak lagi terganti (false positive G14 merusak korelasi report_id antar-
            #     service). "0" harus langsung diikuti "8" -> durasi "0.85…" aman. Bentuk ter-mask "62812****789"
            #     (BFF) tidak cocok -> dibiarkan. Batas kanan MENGONSUMSI satu karakter -> nomor yang dipisah SATU
            #     karakter dari nomor sebelumnya kehilangan batas kirinya -> tahap yang sama dijalankan DUA kali.
            - replace:
                expression: '(?:^|[^0-9A-Za-z+]|%2[Bb])((?:\+?62\)?[\s.-]{0,2}|0)8[1-9][0-9]{1,2}[\s.-]?[0-9]{3,4}[\s.-]?[0-9]{3,5})(?:[^0-9A-Za-z]|$)'
                replace: '[PHONE_REDACTED]'
            - replace:
                expression: '(?:^|[^0-9A-Za-z+]|%2[Bb])((?:\+?62\)?[\s.-]{0,2}|0)8[1-9][0-9]{1,2}[\s.-]?[0-9]{3,4}[\s.-]?[0-9]{3,5})(?:[^0-9A-Za-z]|$)'
                replace: '[PHONE_REDACTED]'
      # (3) Hasil rekonsiliasi harian salinan audit (ETL) -> stream jangkar 400 hari + dead-man (SEC-52 butir 1).
      - match:
          selector: '{service="etl"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} (INFO|WARNING) efn_etl\\.audit_job EFN_AUDIT_RECON \\{\"max_log_id\":.*\\}\\s*$"'
          stages:
            - static_labels:
                stream: efn_audit_anchor
                audit_event: recon
      # (3b) G18 (data-AI): keputusan epoch rantai salinan audit setelah restore/reset DB Odoo -> stream jangkar 400 hari
      #      (alert loki-rules/efn-ops-logs.yml grup efn-audit-epoch). Berjangkar: logger, level, tag, event allowlist.
      - match:
          selector: '{service="etl"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} (INFO|WARNING|ERROR) efn_etl\\.audit_job EFN_AUDIT_EPOCH \\{\"event\":\"(register|new_epoch|divergence_blocked)\",\"epoch\":\\d+,.*\\}\\s*$"'
          stages:
            - static_labels:
                stream: efn_audit_anchor
                audit_event: epoch
      # (4) G13c (SEC-61): baris loyalty BFF (NestJS ConsoleLogger, NO_COLOR=1 di compose) -> stream="efn_loyalty"
      #     (retensi 400 hari = bukti fraud poin/Finance, loki.yml; alert loki-rules/efn-loyalty.yml). Format:
      #     "[Nest] <pid>  - <MM/DD/YYYY, h:mm:ss AM>    WARN [PosLoyaltyService] EFN_LOYALTY_ANOMALY {json}". Regex
      #     BERJANGKAR penuh: konteks logger tetap (3 kelas penulis), level, tag, dan payload ber-skema (kind + severity
      #     dari daftar tetap BFF `LOYALTY_ANOMALY_KINDS`, nilai string disaring BFF ke [A-Za-z0-9_.:-]). Hanya dari
      #     container service=api-gateway (label Docker). Baris dengan teks "EFN_LOYALTY_*" di tempat lain diabaikan.
      #     Format waktu berubah (locale/versi Nest) = baris tidak cocok -> dead-man EfnLoyaltyReconMissing menyala.
      - match:
          selector: '{service="api-gateway"} |~ "^\\[Nest\\] \\d+  - \\d{1,2}/\\d{1,2}/\\d{4}, \\d{1,2}:\\d{2}:\\d{2} (AM|PM) +WARN \\[(PosLoyaltyService|LoyaltyReconService|MigrationService)\\] EFN_LOYALTY_ANOMALY \\{\"kind\":\"[a-z_]{1,40}\",\"severity\":\"(warning|critical)\"[^\\n]*\\}\\s*$"'
          stages:
            - regex:
                expression: ' EFN_LOYALTY_ANOMALY (?P<payload>\{"kind":.*\})\s*$'
            - json:
                source: payload
                expressions:
                  kind: kind
                  severity: severity
            - static_labels:
                stream: efn_loyalty
                loyalty_event: anomaly
            - labels:
                kind:
                severity:
      #     Heartbeat job rekonsiliasi (LoyaltyReconService, akhir setiap siklus): status ok|error -> dead-man.
      - match:
          selector: '{service="api-gateway"} |~ "^\\[Nest\\] \\d+  - \\d{1,2}/\\d{1,2}/\\d{4}, \\d{1,2}:\\d{2}:\\d{2} (AM|PM) +(LOG|ERROR) \\[LoyaltyReconService\\] EFN_LOYALTY_RECON \\{\"status\":\"(ok|error)\"[^\\n]*$"'
          stages:
            - regex:
                expression: ' EFN_LOYALTY_RECON \{"status":"(?P<recon_status>ok|error)"'
            - static_labels:
                stream: efn_loyalty
                loyalty_event: recon
            - labels:
                recon_status:
      #     Saldo pembuka migrasi K-7 yang dibukukan (company, points, source_ref; tanpa nomor) -> rekonsiliasi Finance.
      - match:
          selector: '{service="api-gateway"} |~ "^\\[Nest\\] \\d+  - \\d{1,2}/\\d{1,2}/\\d{4}, \\d{1,2}:\\d{2}:\\d{2} (AM|PM) +LOG \\[MigrationService\\] EFN_LOYALTY_MIGRATION \\{\"company\":\"[A-Za-z0-9_-]{1,16}\",\"points\":\\d+,\"source_ref\":\"[A-Za-z0-9_.:-]{0,64}\"\\}\\s*$"'
          stages:
            - static_labels:
                stream: efn_loyalty
                loyalty_event: migration
      # (5) G14 (data-AI, sisa SEC-61): rekonsiliasi harian ledger poin BFF <-> pos.order oleh ETL
      #     (services/etl/efn_etl/loyalty_recon.py) -> stream="efn_loyalty" (400 hari), loyalty_event="etl_recon",
      #     label recon_status (ok|error). Format Python logging: "<YYYY-MM-DD HH:MM:SS,mmm> <LEVEL> <logger> {json}".
      #     ok: INFO (anomalies 0) / WARNING (anomalies > 0) dari logger efn_etl.loyalty_recon; error: ERROR dari logger
      #     efn_etl (__main__.run_loyalty_recon_cycle, payload {"status":"error","error":"<NamaTipe>"}). Regex BERJANGKAR:
      #     timestamp, level, logger, tag tepat setelah logger, kunci pertama "status". Hanya service=etl. Payload hanya
      #     angka/kind (sample_* = id numerik) -> redaksi di atas tidak mengubahnya. Alert: loki-rules/efn-loyalty.yml.
      - match:
          selector: '{service="etl"} |~ "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2},\\d{3} ((INFO|WARNING) efn_etl\\.loyalty_recon|ERROR efn_etl) EFN_LOYALTY_RECON_ETL \\{\"status\":\"(ok|error)\"[^\\n]*\\}\\s*$"'
          stages:
            - regex:

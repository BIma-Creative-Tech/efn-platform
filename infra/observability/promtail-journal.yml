# Promtail khusus HOST (prod/staging saja, service promtail-journal di docker-compose.prod.yml): membaca journald
# host read-only dan mengirim HANYA unit/identifier operasional EFN ke Loki (gelombang 12, sisa G11.8):
#   - efn-deploy (wrapper deploy root, `logger -t efn-deploy`, SEC-36/SEC-42): verifikasi tanda tangan, anti-replay,
#     penolakan rilis -> jejak deploy di luar host (host bisa dihapus penyerang yang mendapat root).
#   - efn-backup / efn-restore-test (systemd timer infra/backup/systemd): kegagalan sebelum metrik textfile ditulis.
# Bukan seluruh journal: log sistem lain (sshd, kernel) tetap di host (minimisasi data; IP admin = data pribadi).
# Runbook: docs/runbooks/host-journal-loki.md.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9081
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  # tmpfs: setelah restart container, max_age membatasi pembacaan ulang (Loki menolak duplikat entri identik).
  filename: /tmp/positions-journal.yaml

clients:
  - url: https://loki:3100/loki/api/v1/push
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_promtail_crt
      key_file: /run/secrets/tls_promtail_key
      server_name: loki

scrape_configs:
  - job_name: host-journal
    journal:
      path: /var/log/journal
      max_age: 12h
      json: false
      labels:
        job: host-journal
    relabel_configs:
      # Hanya identifier/unit EFN; sisanya dibuang SEBELUM dikirim.
      - source_labels: [__journal_syslog_identifier, __journal__systemd_unit]
        separator: ";"
        regex: '(efn-deploy;.*|.*;efn-(backup|restore-test)\.service)'
        action: keep
      # Label `service` diawali host- -> tidak bisa bertabrakan dengan label container (efn_audit_sink, alert ruler).
      - source_labels: [__journal_syslog_identifier]
        regex: 'efn-deploy'
        target_label: service
        replacement: host-efn-deploy
      - source_labels: [__journal__systemd_unit]
        regex: '(efn-backup|efn-restore-test)\.service'
        target_label: service
        replacement: host-$1
      - source_labels: [__journal_priority_keyword]
        target_label: level
      - source_labels: [__journal__hostname]
        target_label: host
    # G14: stage `replace` hanya mengganti CAPTURE GROUP (bukan seluruh kecocokan) -> nilai sensitif = satu grup luar,
    # grup dalam non-capturing. Ekspresi lama membocorkan sisa nomor HP dan tidak meredaksi Bearer (promtail.yml).
    pipeline_stages:
      - replace:
          expression: '((?:\+?62|0)8[1-9][0-9]{7,11})'
          replace: '[PHONE_REDACTED]'
      - replace:
          expression: '(?i)bearer\s+([a-z0-9\-_\.~+/]+=*)'
          replace: '[REDACTED]'

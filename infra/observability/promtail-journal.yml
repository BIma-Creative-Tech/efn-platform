# Promtail khusus HOST (prod/staging saja, service promtail-journal di docker-compose.prod.yml): membaca journald
# host read-only dan mengirim HANYA unit/identifier operasional EFN ke Loki (gelombang 12, sisa G11.8):
#   - efn-deploy (wrapper deploy root, `logger -t efn-deploy`, SEC-36/SEC-42): verifikasi tanda tangan, anti-replay,
#     penolakan rilis -> jejak deploy di luar host (host bisa dihapus penyerang yang mendapat root).
#   - efn-backup / efn-restore-test (systemd timer infra/backup/systemd): kegagalan sebelum metrik textfile ditulis.
#   - efn-online-cs (G17, wrapper CLI CS online): MULAI/SELESAI/DITOLAK aktor, host, subcommand, id (tanpa alasan),
#     alert loki-rules/efn-online.yml grup efn-online-cs.
#   - efn-rotate-online-key (G18 W-11, timer root rotasi API key Odoo kanal online): MULAI/KEY BARU/VERIFIKASI/
#     ROLLBACK/DICABUT/SELESAI - id & nama key, TANPA nilai key; alert grup efn-online-key-rotation.
#   - efn-metabase-housekeeping (G18 W-19): nonaktifkan akun Metabase tidak aktif 90 hari (log hanya id user).
# Bukan seluruh journal: log sistem lain (sshd, kernel) tetap di host (minimisasi data; IP admin = data pribadi).
# Runbook: docs/runbooks/host-journal-loki.md.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9081
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 0

positions:
  # tmpfs: setelah restart container, max_age membatasi pembacaan ulang (Loki menolak duplikat entri identik).
  filename: /tmp/positions-journal.yaml

clients:
  - url: https://loki:3100/loki/api/v1/push
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_promtail_crt
      key_file: /run/secrets/tls_promtail_key
      server_name: loki

scrape_configs:
  - job_name: host-journal
    journal:
      path: /var/log/journal
      max_age: 12h
      json: false
      labels:
        job: host-journal
    relabel_configs:
      # Hanya identifier/unit EFN; sisanya dibuang SEBELUM dikirim.
      # G17 (SEC-108 / L-19e): + efn-online-cs (wrapper CS online, root) HANYA bila _UID journald = 0. _UID diisi
      # journald (field tepercaya), bukan oleh pengirim -> user non-root di host tidak bisa memalsukan baris audit CS
      # lewat `logger -t efn-online-cs`.
      - source_labels: [__journal_syslog_identifier, __journal__systemd_unit, __journal__uid]
        separator: ";"
        # G18 (W-11): + efn-rotate-online-key (rotasi API key kanal online, root, _UID 0 saja - pola efn-online-cs);
        # W-19: + unit efn-metabase-housekeeping.service.
        regex: '(efn-deploy;.*;.*|.*;efn-(backup|restore-test|metabase-housekeeping)\.service;.*|(efn-online-cs|efn-rotate-online-key);.*;0)'
        action: keep
      # Label `service` diawali host- -> tidak bisa bertabrakan dengan label container (efn_audit_sink, alert ruler).
      - source_labels: [__journal_syslog_identifier]
        regex: 'efn-deploy'
        target_label: service
        replacement: host-efn-deploy
      - source_labels: [__journal_syslog_identifier]
        regex: 'efn-online-cs'
        target_label: service
        replacement: host-efn-online-cs
      - source_labels: [__journal_syslog_identifier]
        regex: 'efn-rotate-online-key'
        target_label: service
        replacement: host-efn-rotate-online-key
      - source_labels: [__journal__systemd_unit]
        regex: '(efn-backup|efn-restore-test|efn-metabase-housekeeping)\.service'
        target_label: service
        replacement: host-$1
      - source_labels: [__journal_priority_keyword]
        target_label: level
      - source_labels: [__journal__hostname]
        target_label: host
    # G14: stage `replace` hanya mengganti CAPTURE GROUP (bukan seluruh kecocokan) -> nilai sensitif = satu grup luar,
    # grup dalam non-capturing. G15 (SEC-72/73/78): SALINAN PERSIS tahap redaksi promtail.yml (a)-(d); CI
    # (scripts/test-promtail-redaction.sh) menjalankan kedua pipeline atas fixture yang sama dan menolak perbedaan.
    pipeline_stages:
      # (a0) G22 (docs/04 §14.A.2): token sesi meja QR `fts1.<b64url sid>.<exp>.<b64url HMAC>` (salinan persis
      #      promtail.yml (a0); dijalankan pertama).
      - replace:
          expression: '(fts1\.[A-Za-z0-9_.-]+)'
          replace: '[TABLE_TOKEN_REDACTED]'
      # (a) Parameter rahasia di query string / logfmt (SEC-73): token reset password Odoo, access_token
      #     self-order, presigned S3, dll. Traefik JSON menulis "&" sebagai "\u0026" (encoding/json) -> ikut
      #     dikenali; "?"/"&"/"=" boleh URL-encoded (%3F/%26/%3D, mis. redirect=%2Fweb%3Ftoken%3D...). Nilai = sampai &, spasi, kutip, backslash, #.
      - replace:
          expression: '(?i)(?:^|[^a-z0-9_]|\\u0026|%3f|%26)(?:access_token|refresh_token|id_token|auth_token|token|password|passwd|pwd|csrf_token|secret|client_secret|api_key|apikey|signature|x-amz-signature|x-amz-credential|x-amz-security-token|otp|otp_code|pickup_code|qr_string|quote_hash)(?:=|%3d)([^&\s"''\\#]+)'
          replace: '[REDACTED]'
      #     Nama generik (code OAuth/OTP, key, sig) HANYA sebagai parameter query (?/&/;/\u0026) agar
      #     logfmt "code=200" di log Go tidak ikut diganti.
      - replace:
          expression: '(?i)(?:[?&;]|\\u0026|%3f|%26)(?:code|key|sig|auth|session_id|sid)(?:=|%3d)([^&\s"''\\#]+)'
          replace: '[REDACTED]'
      # (b) Rahasia sebagai kunci JSON / dict Python ("password": "...", 'token': '...').
      - replace:
          expression: '(?i)["''](?:password|passwd|token|access_token|refresh_token|secret|client_secret|api_key|otp|otp_code|pickup_code|qr_string|quote_hash)["'']\s*:\s*["'']([^"'']+)["'']'
          replace: '[REDACTED]'
      # (c) Skema Authorization: Bearer (JWT/opaque) dan Basic (base64; wajib memuat digit/+/=/"/" agar kata
      #     biasa seperti "Basic authentication" tidak terganti).
      - replace:
          expression: '(?i)\bbearer\s+([a-z0-9\-_.~+/]+=*)'
          replace: '[REDACTED]'
      - replace:
          expression: '(?i)\bbasic\s+([a-z0-9+/]*[0-9+/=][a-z0-9+/=]*)'
          replace: '[REDACTED]'
      # (c2) G17 (docs/04 §10.11): kode ambil pesanan online tampilan `ABCD-EFGH` (alfabet tanpa I/L/O/0/1; pola
      #      kontrak [A-HJ-NP-Z2-9] sedikit lebih luas). Batas kiri/kanan bukan alfanumerik dan bukan '-' -> segmen
      #      UUID huruf besar tidak terkena. Bentuk tanpa strip tidak diredaksi (terlalu banyak false positive kata
      #      8 huruf); BFF tidak pernah me-log kode, dan key query/JSON pickup_code/qr_string/quote_hash di (a)/(b).
      - replace:
          expression: '(?:^|[^0-9A-Za-z-])([A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4})(?:[^0-9A-Za-z-]|$)'
          replace: '[PICKUP_REDACTED]'
      # (d) Nomor HP Indonesia (SEC-78): 08…, 62…, +62…, (+62)…, %2B62…, dengan pemisah opsional spasi/titik/
      #     strip ("0812-3456-7890", "+62 812 3456 7890"). Struktur 8[1-9]x(x) [sep] xxx(x) [sep] xxx(xx) =
      #     7..11 digit setelah "8[1-9]" (sama dengan pola lama) dan blok terakhir tanpa pemisah -> tidak
      #     "menelan" nomor berikutnya. Batas kiri DAN kanan non-alfanumerik (di luar grup): potongan UUID/hash/
      #     ID container/ID thread tidak lagi terganti (false positive G14 merusak korelasi report_id antar-
      #     service). "0" harus langsung diikuti "8" -> durasi "0.85…" aman. Bentuk ter-mask "62812****789"
      #     (BFF) tidak cocok -> dibiarkan. Batas kanan MENGONSUMSI satu karakter -> nomor yang dipisah SATU
      #     karakter dari nomor sebelumnya kehilangan batas kirinya -> tahap yang sama dijalankan DUA kali.
      - replace:
          expression: '(?:^|[^0-9A-Za-z+]|%2[Bb])((?:\+?62\)?[\s.-]{0,2}|0)8[1-9][0-9]{1,2}[\s.-]?[0-9]{3,4}[\s.-]?[0-9]{3,5})(?:[^0-9A-Za-z]|$)'
          replace: '[PHONE_REDACTED]'
      - replace:
          expression: '(?:^|[^0-9A-Za-z+]|%2[Bb])((?:\+?62\)?[\s.-]{0,2}|0)8[1-9][0-9]{1,2}[\s.-]?[0-9]{3,4}[\s.-]?[0-9]{3,5})(?:[^0-9A-Za-z]|$)'
          replace: '[PHONE_REDACTED]'

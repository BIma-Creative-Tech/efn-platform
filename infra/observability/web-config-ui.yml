# exporter-toolkit web config untuk Prometheus (docs/04 §8.5, SEC-20): HANYA TLS + mTLS. Alertmanager memakai
# web-config-alertmanager.yml (tambahan klien loki, gelombang 11).
# Klien sah: Prometheus (self-scrape, alerting -> Alertmanager) dan Grafana (datasource). Tidak diekspos Traefik.
tls_server_config:
  cert_file: /run/secrets/tls_server_crt
  key_file: /run/secrets/tls_server_key
  min_version: TLS12
  client_auth_type: RequireAndVerifyClientCert
  client_ca_file: /run/secrets/efn_ca_crt
  client_allowed_sans:
    - prometheus
    - grafana

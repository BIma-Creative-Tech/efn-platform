# Aturan alert EFN. Prinsip: hanya kondisi yang butuh tindakan manusia, `for:` cukup panjang agar tidak berisik,
# setiap alert punya runbook_url. Severity: critical (bangunkan on-call) | warning (jam kerja).
# Label `metric_status: proposed` = metrik belum diekspos service; nama metrik diusulkan ke agent pemilik service.
groups:
  # ─────────────────────────── Ketersediaan ───────────────────────────
  - name: efn-availability
    rules:
      - alert: EfnServiceDown
        expr: up{job!~"probe-.*"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Target scrape {{ $labels.job }} ({{ $labels.instance }}) tidak bisa dijangkau"
          description: "Prometheus gagal scrape {{ $labels.job }} selama 3 menit. Service mati, restart loop, atau exporter belum jalan."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/service-down.md

      - alert: EfnHealthProbeFailed
        expr: probe_success{job="probe-internal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Health endpoint {{ $labels.instance }} gagal"
          description: "Probe internal ke {{ $labels.instance }} gagal 2 menit. Odoo/BFF/Web tidak melayani request (POS & checkout terdampak)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/service-down.md

      - alert: EfnPublicEndpointDown
        expr: probe_success{job="probe-https"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint publik {{ $labels.instance }} tidak dapat diakses"
          description: "Probe HTTPS publik gagal 5 menit (DNS, Cloudflare, Traefik, atau sertifikat)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/service-down.md

      - alert: EfnPostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL tidak menerima koneksi"
          description: "postgres-exporter tidak bisa terhubung ke PostgreSQL. Semua PT (Odoo multi-company) terdampak."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/service-down.md

      - alert: EfnRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis tidak tersedia"
          description: "OTP, rate limit, dan discount token BFF bergantung pada Redis."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/service-down.md

  # ─────────────────────────── Odoo ───────────────────────────
  - name: efn-odoo
    rules:
      - alert: EfnOdooHttp5xxHigh
        expr: |
          (
            sum(rate(traefik_service_requests_total{service=~"odoo(-ws)?@docker", code=~"5.."}[5m]))
            /
            sum(rate(traefik_service_requests_total{service=~"odoo(-ws)?@docker"}[5m]))
          ) > 0.05
          and
          sum(rate(traefik_service_requests_total{service=~"odoo(-ws)?@docker"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Odoo mengembalikan HTTP 5xx > 5% ({{ $value | humanizePercentage }})"
          description: "Rasio 5xx dari Odoo lewat Traefik di atas 5% selama 5 menit (minimal 0.2 req/s agar tidak berisik)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-http-5xx.md

  # ─────────────────────────── RabbitMQ / OCR ───────────────────────────
  - name: efn-messaging
    rules:
      - alert: EfnOcrQueueBacklog
        expr: sum by (queue) (rabbitmq_queue_messages{queue="ocr.requested"}) > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Antrean ocr.requested menumpuk ({{ $value }} pesan)"
          description: "Lebih dari 200 pesan menunggu selama 10 menit. Price Hunter tertunda; transaksi POS tidak terdampak."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/rabbitmq-ocr-backlog.md

      - alert: EfnOcrNoConsumer
        expr: sum by (queue) (rabbitmq_queue_consumers{queue="ocr.requested"}) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidak ada consumer di ocr.requested"
          description: "ai-ocr-worker tidak terhubung ke RabbitMQ selama 10 menit."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/rabbitmq-ocr-backlog.md

      - alert: EfnDeadLetterNotEmpty
        # DLQ order.* (penjualan online, G17) ditangani EfnOnlineDlqNotEmpty (runbook online-orders.md)
        expr: sum by (queue) (rabbitmq_queue_messages{queue=~".+\\.dlq", queue!~"order\\..+"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ {{ $labels.queue }} berisi {{ $value }} pesan"
          description: "Ada pesan yang gagal diproses permanen. Periksa penyebab sebelum replay (consumer idempotent)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/rabbitmq-dlq.md

  # ─────────────────────────── OTP / WhatsApp (metrik diusulkan) ───────────────────────────
  # Metrik BFF (prom-client, services/api-gateway/src/common/metrics/metrics.service.ts):
  #   efn_otp_verify_total{purpose="pos_promo|login", outcome="verified|invalid|expired|locked"}
  #   efn_otp_request_total{purpose, outcome="sent|delivery_failed|rate_limited"}
  #   efn_whatsapp_send_total{outcome="success|failure"}
  # Label = `outcome` (bukan `result`): dengan `result!="ok"` semua seri cocok -> alert palsu permanen.
  - name: efn-otp
    rules:
      - alert: EfnOtpVerifyFailureRateHigh
        expr: |
          (
            sum by (purpose) (rate(efn_otp_verify_total{outcome!="verified"}[15m]))
            /
            sum by (purpose) (rate(efn_otp_verify_total[15m]))
          ) > 0.4
          and
          sum by (purpose) (increase(efn_otp_verify_total[15m])) > 20
        for: 10m
        labels:
          severity: warning
          metric_status: proposed
        annotations:
          summary: "Kegagalan verifikasi OTP {{ $labels.purpose }} tinggi ({{ $value | humanizePercentage }})"
          description: "Lebih dari 40% verifikasi OTP gagal (min. 20 percobaan/15 menit). Indikasi WA terlambat, jam server, atau brute force."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/otp-failure-rate.md

      - alert: EfnOtpSendFailureRateHigh
        expr: |
          (
            sum(rate(efn_whatsapp_send_total{outcome="failure"}[10m]))
            /
            sum(rate(efn_whatsapp_send_total[10m]))
          ) > 0.1
          and
          sum(increase(efn_whatsapp_send_total[10m])) > 10
        for: 10m
        labels:
          severity: critical
          metric_status: proposed
        annotations:
          summary: "Pengiriman OTP WhatsApp gagal > 10%"
          description: "WhatsApp Cloud API menolak/time-out. Promo ber-OTP di POS tidak bisa dipakai pelanggan."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/otp-failure-rate.md

      # SEC-34 (G12 BFF): ALTCHA adaptif naik ke level 3 (biaya PoW maksimum) bila rate limit per IP atau anggaran
      # OTP global hampir habis. Lonjakan level 3 = indikasi serangan SMS/WhatsApp pumping atau bot login.
      - alert: EfnAltchaMaxLevelSpike
        expr: sum(increase(efn_altcha_challenge_total{level="3"}[15m])) > 50
        for: 5m
        labels:
          severity: warning
          team: security
          metric_status: proposed
        annotations:
          summary: "ALTCHA level 3 diterbitkan {{ $value | humanize }} kali dalam 15 menit"
          description: "Challenge biaya maksimum melonjak: rate limit per IP / anggaran OTP global hampir habis (dugaan OTP pumping)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/otp-failure-rate.md#altcha-level-3

  # ─────────────────────────── Poin EFN (SEC-61, G13c) ───────────────────────────
  # Lapis kedua dead-man rekonsiliasi loyalty (lapis utama berbasis log: loki-rules/efn-loyalty.yml
  # EfnLoyaltyReconMissing, yang menekan alert ini lewat inhibit Alertmanager). Gauge per proses BFF bernilai 0 setelah
  # restart sampai siklus pertama (LOYALTY_RECON_INTERVAL_MS, default 1 jam) -> max_over_time 26 jam + filter > 0 agar
  # deploy/restart tidak memicu alert palsu; hanya satu replika menjalankan siklus (advisory lock) -> max antar replika.
  - name: efn-loyalty
    rules:
      - alert: EfnLoyaltyReconStale
        expr: |
          time() - max(max_over_time(efn_loyalty_recon_last_success_timestamp_seconds{job="api-gateway"}[26h]) > 0) > 7200
        for: 15m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Poin EFN: rekonsiliasi ledger terakhir sukses {{ $value | humanizeDuration }} lalu"
          description: "Job LoyaltyReconService tidak sukses > 2 jam; kontrol detektif fraud poin tidak berjalan."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyreconmissing

  # ─────────────────────────── Poin hangus (G22, docs/04 §14.D.4/§14.D.9, data-AI) ───────────────────────────
  # Alert run (aborted/error/dead-man) berbasis log di loki-rules/efn-loyalty.yml grup efn-loyalty-expiry (devsecops);
  # di sini hanya kegagalan notifikasi WA T-30 (§14.D.4: hangus TETAP berjalan walau pesan gagal -> member bisa
  # kehilangan poin tanpa pemberitahuan; risiko keluhan/Legal). Counter BFF baru muncul setelah kegagalan pertama:
  # increase() melewatkan inkremen pertama seri baru -> BFF diminta menginisialisasi seri dengan 0 (laporan data-AI G22).
  # Dashboard: grafana efn-loyalty-expiry.json.
  - name: efn-loyalty-expiry
    rules:
      - alert: EfnLoyaltyExpiryNoticeFailed
        expr: sum(increase(efn_loyalty_expiry_notice_failed_total{job="api-gateway"}[26h])) > 0
        labels:
          severity: warning
          team: finance
          metric_status: proposed
        annotations:
          summary: "Poin hangus: {{ $value | humanize }} notifikasi WA T-30 gagal dalam 26 jam"
          description: "Pesan pengingat hangus (template efn_loyalty_inactivity_notice) gagal permanen (DLQ notify.push). Member tetap akan kehilangan poin pada due_at; tinjau DLQ/template Meta dan informasikan CRM/Legal."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-inactivity-expiry.md#efnloyaltyexpirynoticefailed

  # ─────────────────────────── Penjualan online (G17, docs/04 §10.11) ───────────────────────────
  # Metrik BFF (services/api-gateway/src/odoo-rpc/online-metrics.ts), scrape job api-gateway (mTLS :9464). Selama
  # ONLINE_ENABLED=false seri tidak bertambah -> alert diam. Dead-man rekonsiliasi berbasis log:
  # loki-rules/efn-online.yml. Runbook: docs/runbooks/online-orders.md, docs/runbooks/odoo-online-api-key.md (R-T15).
  - name: efn-online
    rules:
      - alert: EfnOnlineOrderStuck
        expr: max by (state) (efn_online_stuck_parts{job="api-gateway"}) > 0
        for: 15m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Pesanan online tertahan di state {{ $labels.state }} ({{ $value }} bagian)"
          description: "Bagian order melewati batas (placing > 2 m, paying > 10 m, awaiting_payment > expires_at + 5 m, refund belum final > 24 j). Pelanggan bisa sudah membayar tanpa pesanan terkonfirmasi."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlineorderstuck

      - alert: EfnOnlineAmountMismatch
        expr: sum by (stage) (increase(efn_online_amount_mismatch_total{job="api-gateway"}[15m])) > 0
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Selisih nominal pesanan online di tahap {{ $labels.stage }}"
          description: "Nominal bayar/porsi tidak sama dengan amount_payable Odoo. Bagian masuk review; jangan refund/konfirmasi manual sebelum diperiksa."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlineamountmismatch

      - alert: EfnOnlineDlqNotEmpty
        expr: sum by (queue) (rabbitmq_queue_messages{queue=~"order\\..+\\.dlq"}) > 0
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "DLQ saga online {{ $labels.queue }} berisi {{ $value }} pesan"
          description: "Pesan saga gagal 11 kali (x-delivery-limit 10). Order terkait tertahan sampai pesan diperiksa dan di-replay (consumer idempoten)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlinedlqnotempty

      - alert: EfnOnlineOdooAuthFailure
        expr: sum by (channel) (increase(efn_online_odoo_auth_failures_total{job="api-gateway"}[5m])) > 0
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Odoo menolak API key kanal online {{ $labels.channel }} (401/403)"
          description: "API key kedaluwarsa/dicabut (R-T15) atau user teknis berubah. Checkout kanal ini berhenti; POS tidak terdampak."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#efnonlineodooauthfailure

      - alert: EfnOnlineCircuitOpen
        expr: max by (channel) (efn_online_circuit_open{job="api-gateway"}) == 1
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Circuit breaker Odoo kanal {{ $labels.channel }} terbuka > 5 menit"
          description: "Quote/checkout online menjawab 503 online_unavailable. Periksa odoo-rpc-gateway, odoo-tls, Odoo."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlinecircuitopen

      - alert: EfnOnlineCatalogStale
        expr: max by (channel) (efn_online_catalog_sync_age_seconds{job="api-gateway"}) > 1800
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Katalog online kanal {{ $labels.channel }} tidak tersinkron {{ $value | humanizeDuration }}"
          description: "Harga/produk di Super-App basi (harga final tetap dihitung Odoo saat quote/place)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlinecatalogstale

      # Kontrak §10.11: "refund manual_required|failed > 0 selama 1 j". BFF hanya mengekspos counter transisi
      # (efn_online_refunds_total{status}); refund yang MASIH terbuka > 24 j juga muncul di efn_online_stuck_parts.
      # Pendekatan: transisi ke manual_required/failed dalam 1 jam terakhir -> alert menyala 1 jam (metric_status
      # proposed: gauge refund terbuka per status = usulan ke BFF).
      - alert: EfnOnlineRefundPending
        expr: sum by (status) (increase(efn_online_refunds_total{job="api-gateway", status=~"manual_required|failed"}[1h])) > 0
        labels:
          severity: warning
          team: finance
          metric_status: proposed
        annotations:
          summary: "Refund online berstatus {{ $labels.status }} dalam 1 jam terakhir"
          description: "Refund gagal/harus manual. Selesaikan lewat CLI BFF (online-refund-settle) setelah dana dikembalikan."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#efnonlinerefundpending

      # R-T15 (L-6; W-11 key 30 hari + rotasi otomatis): Odoo tidak mengekspos masa berlaku key lewat /json/2 ->
      # metrik textfile node-exporter ditulis scripts/host/efn-rotate-online-key (timer harian, rotasi saat sisa < 10 h):
      #   efn_odoo_api_key_expiry_timestamp_seconds / _active_keys / _rotation_last_run_ok /
      #   _rotation_last_run_timestamp_seconds / _rotation_last_success_timestamp_seconds  {channel="GL"|"PB"|"BCR"|"BCF"|"WTZ"} (G20/G24)
      # G19 (docs/04 §11.3): satu deret per kanal; `--all` menandai last_run_ok=0 juga untuk kanal yang gagal sebelum
      # sempat menulis metrik (secret tidak di-mount, user teknis bersama) -> EfnOnlineApiKeyRotationFailed per kanal.
      # Sisa < 7 hari = timer sudah gagal >= 3 hari berturut-turut (normal: rotasi di sisa 10 hari).
      - alert: EfnOnlineApiKeyExpiringSoon
        expr: min by (channel) (efn_odoo_api_key_expiry_timestamp_seconds) - time() < 7 * 86400
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "API key Odoo kanal online {{ $labels.channel }} kedaluwarsa dalam {{ $value | humanizeDuration }}"
          description: "Rotasi otomatis tidak berhasil beberapa hari. Cek journald efn-rotate-online-key; bila kedaluwarsa, checkout kanal berhenti (R-T15)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#rotasi
      - alert: EfnOnlineApiKeyExpiryCritical
        expr: min by (channel) (efn_odoo_api_key_expiry_timestamp_seconds) - time() < 3 * 86400
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "API key Odoo kanal online {{ $labels.channel }} kedaluwarsa < 3 hari"
          description: "Rotasi segera (sudo efn-rotate-online-key --channel=<KANAL> --force); setelah kedaluwarsa Odoo menjawab 401 dan checkout kanal berhenti (R-T15)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#rotasi
      # Kanal dipakai (ada transisi bagian order) tetapi masa berlaku key tidak tercatat -> R-T15 buta.
      - alert: EfnOnlineApiKeyExpiryUnknown
        expr: |
          sum by (channel) (increase(efn_online_parts_total{job="api-gateway"}[1d])) > 0
          unless on (channel) efn_odoo_api_key_expiry_timestamp_seconds
        for: 1h
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Masa berlaku API key Odoo kanal {{ $labels.channel }} tidak tercatat"
          description: "Metrik textfile efn_odoo_api_key_expiry_timestamp_seconds tidak ada (timer rotasi belum dipasang / state hilang); alert kedaluwarsa (R-T15) tidak bisa bekerja."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#metrik-masa-berlaku
      # W-11: run rotasi terakhir gagal (rollback, Odoo menolak pembuatan, pencabutan gagal/tidak efektif). Satu kali
      # gagal = warning (timer mencoba ulang besok); ROLLBACK GAGAL = critical lewat ruler Loki (efn-online.yml).
      - alert: EfnOnlineApiKeyRotationFailed
        expr: max by (channel) (efn_odoo_api_key_rotation_last_run_ok) == 0
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Rotasi API key Odoo kanal {{ $labels.channel }} gagal pada run terakhir"
          description: "Key lama tetap terpasang bila rollback sukses. Lihat journald/Loki service=host-efn-rotate-online-key (baris GAGAL/ROLLBACK)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#rotasi-gagal
      # Timer harian tidak berjalan (unit dimatikan, host mati, skrip ditolak sebelum menulis metrik).
      - alert: EfnOnlineApiKeyRotationNotRunning
        expr: time() - max by (channel) (efn_odoo_api_key_rotation_last_run_timestamp_seconds) > 2 * 86400 + 3600
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Timer rotasi API key kanal {{ $labels.channel }} tidak berjalan > 2 hari"
          description: "G19: systemctl status efn-rotate-online-key.timer (semua kanal, --all) atau efn-rotate-online-key@{{ $labels.channel }}.timer; kanal masih di CHANNELS/ONLINE_CHANNELS? Kanal yang sengaja dihentikan: hapus /var/lib/efn/online-key/<kanal>.* (runbook)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#rotasi-gagal
      # Lebih dari satu key aktif setelah overlap (1 jam) + cabut tertunda harian = kredensial lama masih sah.
      - alert: EfnOnlineApiKeyExtraKeys
        expr: max by (channel) (efn_odoo_api_key_active_keys) > 1
        for: 26h
        labels:
          severity: warning
          team: security
        annotations:
          summary: "User teknis kanal {{ $labels.channel }} punya {{ $value }} API key aktif"
          description: "Key lama belum dicabut (atau ada key buatan manual). Cabut lewat efn-rotate-online-key / runbook §4."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/odoo-online-api-key.md#rotasi-gagal
      # W-18 (Q-P18): erasure DIPAKSA setelah 14 hari walau pesanan online masih terbuka -> tautan akun dilepas,
      # pelanggan kehilangan kode ambil di aplikasi; CS wajib menindaklanjuti bagian terbuka (online-erasure-pending).
      # Pasangan log: EFN_ONLINE_ANOMALY kind=erasure_forced_open_orders (ruler Loki). Counter tanpa label subjek.
      - alert: EfnDsarErasureForcedOpenOrders
        expr: sum(increase(efn_dsar_erasure_deferral_total{job="api-gateway",event="forced"}[1h])) > 0
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Erasure dipaksa setelah 14 hari dengan pesanan online terbuka ({{ $value | humanize }} dalam 1 jam)"
          description: "Jalankan sudo efn-online-cs online-erasure-pending; selesaikan unlinked_open_parts (refund/serah terima terverifikasi)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/online-orders.md#erasure-paksa

  # ─────────────────────────── Backup & DR (R-T08) ───────────────────────────
  # Metrik efn_backup_* / efn_restore_test_* ditulis scripts/backup.sh & scripts/restore-test.sh (textfile collector).
  - name: efn-backup
    rules:
      - alert: EfnBackupFailed
        expr: efn_backup_last_status{type="base"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Base backup PostgreSQL terakhir GAGAL"
          description: "scripts/backup.sh selesai dengan error. Lihat journalctl -u efn-backup."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-failed.md

      - alert: EfnBackupStale
        expr: time() - efn_backup_last_success_timestamp_seconds{type="base"} > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Tidak ada base backup sukses > 26 jam"
          description: "Backup harian terlambat/terlewat. RTO memanjang karena replay WAL lebih banyak."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-failed.md

      - alert: EfnBackupMetricMissing
        expr: absent(efn_backup_last_success_timestamp_seconds{type="base"})
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "Metrik backup tidak ada"
          description: "Timer efn-backup belum dipasang atau textfile collector tidak membaca direktori metrik."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-failed.md

      - alert: EfnWalArchiveFailing
        expr: efn_archiver_failing == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WAL archiving (WAL-G -> MinIO) gagal"
          description: "archive_command gagal > 10 menit: RPO 15 menit terlanggar dan pg_wal akan membengkak."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-failed.md

      - alert: EfnWalArchiveStale
        expr: efn_archiver_last_archive_age_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tidak ada WAL ter-archive > 1 jam"
          description: "Normalnya archive_timeout=900 memaksa archive tiap 15 menit bila ada aktivitas. Cek archive_mode & aktivitas DB."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-failed.md

      - alert: EfnRestoreTestFailed
        expr: efn_restore_test_last_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Restore test bulanan GAGAL"
          description: "Backup tidak terbukti bisa dipulihkan. Perlakukan sebagai insiden DR."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-restore.md

      - alert: EfnRestoreTestOverdue
        expr: time() - efn_restore_test_last_success_timestamp_seconds > 35 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Restore test sukses terakhir > 35 hari"
          description: "DoD keamanan mensyaratkan restore test < 30 hari (docs/03 §5)."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/backup-restore.md

  # ─────────────────────────── Host ───────────────────────────
  - name: efn-host
    rules:
      - alert: EfnDiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} terpakai {{ $value | humanizePercentage }}"
          description: "Penggunaan disk > 85% selama 15 menit. PostgreSQL berhenti menulis bila disk penuh."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/disk-usage.md

      - alert: EfnDiskUsageCritical
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} hampir penuh ({{ $value | humanizePercentage }})"
          description: "Tindakan segera: risiko PostgreSQL/RabbitMQ berhenti."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/disk-usage.md

      # W-19 (Q-P14): akun Metabase tidak aktif 90 hari dinonaktifkan oleh timer host efn-metabase-housekeeping.
      # Hanya bila metrik pernah ditulis (timer terpasang); gagal/tidak berjalan > 3 hari = minimisasi akses tertunda.
      - alert: EfnMetabaseHousekeepingStale
        expr: time() - max(efn_metabase_housekeeping_last_success_timestamp_seconds) > 3 * 86400
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Housekeeping Metabase (akun tidak aktif 90 hari) tidak sukses > 3 hari"
          description: "journalctl -u efn-metabase-housekeeping; jalankan ulang setelah Metabase sehat."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/retention.md#metabase-housekeeping

  # ─────────────────────────── TLS ───────────────────────────
  - name: efn-tls
    rules:
      - alert: EfnCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"probe-https|probe-wg-tls"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sertifikat {{ $labels.instance }} kedaluwarsa dalam {{ $value | humanize }} hari"
          description: "Perpanjangan otomatis (Traefik HTTP-01 untuk host publik, service acme-dns untuk wg-https) seharusnya terjadi jauh sebelum kedaluwarsa."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/tls-cert-expiry.md

      - alert: EfnCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry{job=~"probe-https|probe-wg-tls"} - time()) / 86400 < 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Sertifikat {{ $labels.instance }} kedaluwarsa dalam < 3 hari"
          description: "Super-App, API, dan ERP akan ditolak browser/aplikasi."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/tls-cert-expiry.md

      # SEC-37: Traefik menyajikan sertifikat yang tidak valid publik untuk erp. (acme-dns belum pernah menerbitkan,
      # acme-publish menolak PEM / volume traefik-dynamic kosong, atau rantai salah). Tanpa ini kegagalan penerbitan PERTAMA tidak terlihat oleh
      # alert kedaluwarsa (metrik expiry tidak ada saat handshake gagal). Dev: selalu gagal (self-signed) - wajar.
      - alert: EfnWgCertProbeFailed
        expr: probe_success{job="probe-wg-tls"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sertifikat publik wg-https (erp./bi./ops./status.) tidak valid"
          description: "Handshake TLS ke traefik:8443 dengan SNI erp. gagal diverifikasi CA publik. POS outlet akan menolak koneksi."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/acme-dns-token.md#5-operasi-service-acme-dns

  # ─────────────────────────── PKI internal (docs/04 §7.1) ───────────────────────────
  # Dua sumber: (1) probe handshake TLS ke listener internal (probe-internal-tls), (2) metrik textfile
  # efn_internal_cert_expiry_timestamp_seconds{cert} yang ditulis scripts/deploy.sh dari file secret (mencakup
  # PostgreSQL dan CA). Sertifikat internal kedaluwarsa = koneksi antar-service GAGAL (fail closed, tanpa fallback).
  - name: efn-internal-tls
    rules:
      - alert: EfnInternalTlsHandshakeFailed
        expr: probe_success{job="probe-internal-tls"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Handshake TLS internal ke {{ $labels.instance }} gagal"
          description: "Listener tidak TLS, sertifikat tidak cocok nama service / tidak diterbitkan CA internal, atau service mati."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/internal-pki.md

      # Leaf 90 hari; deploy.sh menerbitkan ulang leaf yang sisa < 30 hari. < 21 hari = belum ada deploy sejak
      # masuk jendela perpanjangan -> jalankan workflow Deploy (workflow_dispatch) untuk rotasi.
      - alert: EfnInternalCertExpiringSoon
        expr: |
          ((probe_ssl_earliest_cert_expiry{job="probe-internal-tls"} - time()) / 86400 < 21)
          or
          ((efn_internal_cert_expiry_timestamp_seconds - time()) / 86400 < 21)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sertifikat internal {{ $labels.instance }}{{ $labels.cert }} kedaluwarsa dalam {{ $value | humanize }} hari"
          description: "Jalankan workflow Deploy (deploy.sh memperbarui leaf < 30 hari otomatis). Intermediate/root: prosedur Superadmin di runbook."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/internal-pki.md

      - alert: EfnInternalCertExpiryCritical
        expr: |
          ((probe_ssl_earliest_cert_expiry{job="probe-internal-tls"} - time()) / 86400 < 7)
          or
          ((efn_internal_cert_expiry_timestamp_seconds - time()) / 86400 < 7)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Sertifikat internal {{ $labels.instance }}{{ $labels.cert }} kedaluwarsa dalam < 7 hari"
          description: "Setelah kedaluwarsa, klien menolak koneksi (verify-full): POS OTP, Super-App, OCR, ETL berhenti."
          runbook_url: https://github.com/efn/efn-platform/blob/main/docs/runbooks/internal-pki.md

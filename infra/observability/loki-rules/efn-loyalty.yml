# Aturan ruler Loki gelombang 13c (SEC-61): anomali poin EFN dari BFF (services/api-gateway/src/loyalty/loyalty-anomaly.ts).
# Sumber: baris `EFN_LOYALTY_ANOMALY {json}` (pagar earn 409 earn_limit_exceeded, job rekonsiliasi ledger per jam,
# migrasi K-7) dan heartbeat `EFN_LOYALTY_RECON {json}` (LoyaltyReconService). Promtail (promtail.yml tahap 4)
# hanya memasukkan baris yang cocok regex BERJANGKAR (container service=api-gateway, konteks logger tetap, payload
# ber-skema) ke stream="efn_loyalty" dengan label loyalty_event (anomaly|recon|migration), kind, severity, recon_status.
# Severity per kind ditentukan BFF (LOYALTY_ANOMALY_KINDS), bukan rule ini: critical = indikasi ledger dimanipulasi /
# aturan earn dilanggar (page on-call), warning = pagar batas bekerja / data perlu ditinjau (ringkasan jam kerja).
# Alertmanager group_by [alertname, ...] -> semua kind warning dalam satu notifikasi (ringkasan per kind).
# Runbook: docs/runbooks/loyalty-anomaly.md. Pasangan metrik Prometheus: efn_loyalty_anomaly_total{kind,severity},
# efn_loyalty_recon_last_success_timestamp_seconds (alert-rules.yml grup efn-loyalty).
groups:
  - name: efn-loyalty
    interval: 1m
    rules:
      # Satu kejadian critical sudah cukup: earn_ledger_mismatch/orphan, earn_above_rule, reverse_exceeds_earn,
      # restore_exceeds_redeem, ledger_unknown_source, earn_limit_company_hour. Temuan rekonsiliasi berulang tiap
      # siklus selama masih di jendela lookback (26 jam) -> alert tetap menyala sampai ditangani.
      - alert: EfnLoyaltyAnomalyCritical
        expr: |
          sum by (kind) (
            count_over_time({stream="efn_loyalty", loyalty_event="anomaly", severity="critical"} [15m])
          ) > 0
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Poin EFN: anomali KRITIS {{ $labels.kind }} ({{ $value }} baris dalam 15 menit)"
          description: "Ledger poin tidak konsisten dengan catatan earn/redeem atau pagar batas PT terlampaui. Perlakukan sebagai dugaan fraud/insiden sampai terbukti sebaliknya; jangan koreksi ledger tanpa CR Finance."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyanomalycritical"
      # Ringkasan per kind (jam kerja): earn_limit_order/member_day/pos_config_hour, earn_above_order_cap,
      # member_day_above_limit, migration_large_balance, migration_erased_member.
      - alert: EfnLoyaltyAnomalyWarning
        expr: |
          sum by (kind) (
            count_over_time({stream="efn_loyalty", loyalty_event="anomaly", severity="warning"} [1h])
          ) > 0
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Poin EFN: {{ $value }} anomali {{ $labels.kind }} dalam 1 jam"
          description: "Pagar batas earn menolak transaksi atau data poin perlu ditinjau (order di Odoo berstatus review). Tinjau pola per kasir/PT."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyanomalywarning"
      # DEAD-MAN: job rekonsiliasi (tiap jam, LOYALTY_RECON_INTERVAL_MS) tidak mencetak status ok selama 2 jam = job
      # mati/gagal terus, BFF tidak jalan, ATAU format log berubah sehingga promtail tidak lagi mengenali baris
      # loyalty (alert anomali ikut buta). Persisten lintas restart BFF (berbasis log, bukan gauge proses).
      - alert: EfnLoyaltyReconMissing
        expr: |
          absent_over_time({stream="efn_loyalty", loyalty_event="recon", recon_status="ok"} [2h])
        for: 15m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Poin EFN: rekonsiliasi ledger tidak sukses > 2 jam (atau baris log tidak dikenali)"
          description: "Kontrol detektif fraud poin tidak berjalan atau pipeline log loyalty buta (format log/NO_COLOR/promtail). Anomali tidak akan ter-alert sampai pulih."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyreconmissing"
      - alert: EfnLoyaltyReconFailing
        expr: |
          sum (count_over_time({stream="efn_loyalty", loyalty_event="recon", recon_status="error"} [3h])) >= 2
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Poin EFN: job rekonsiliasi gagal >= 2 kali dalam 3 jam"
          description: "Query rekonsiliasi gagal (DB, grant, timeout). Lihat log LoyaltyReconService di BFF."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyreconmissing"

  # G14 (data-AI, sisa SEC-61): rekonsiliasi HARIAN ledger poin BFF <-> pos.order Odoo oleh ETL
  # (services/etl/efn_etl/loyalty_recon.py; ETL_LOYALTY_RECON_INTERVAL_SECONDS default 86400). Baris
  # `EFN_LOYALTY_RECON_ETL {"status":"ok","anomalies":N,"open_items":M,"kinds":{..},...}` -> promtail.yml tahap 5 ->
  # {stream="efn_loyalty", loyalty_event="etl_recon", recon_status="ok|error"}. Karena hanya satu baris per hari, alert
  # memakai NILAI TERAKHIR dalam 26 jam (last_over_time): tetap menyala sampai run berikutnya bersih (anomali ditangani
  # atau keluar jendela/NOT_BEFORE), bukan padam setelah 15 menit. Angka diambil dengan `| regexp` berjangkar pada
  # urutan kunci tetap (summary_payload: status, anomalies, open_items, ...): baris diawali timestamp Python sehingga
  # `| json` gagal (JSONParserErr), dan regexp tidak membuat label kinds_*/sample_* (kardinalitas tetap).
  # Runbook: docs/runbooks/loyalty-anomaly.md.
  - name: efn-loyalty-etl-recon
    interval: 5m
    rules:
      # anomalies > 0 = ledger poin vs order POS tidak cocok (earn tanpa order paid, order paid member tanpa earn,
      # nilai baris Poin EFN beda dengan redeem, dst.) -> dugaan manipulasi/bug sampai terbukti sebaliknya.
      - alert: EfnLoyaltyEtlReconAnomaly
        expr: |
          max(
            last_over_time({stream="efn_loyalty", loyalty_event="etl_recon", recon_status="ok"}
              | regexp `^\S+ \S+ \S+ efn_etl\.loyalty_recon EFN_LOYALTY_RECON_ETL [{]"status":"ok","anomalies":(?P<anomalies>\d+),"open_items":(?P<open_items>\d+),`
              | unwrap anomalies | __error__="" [26h]) by (loyalty_event)
          ) > 0
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Poin EFN: rekonsiliasi harian ledger vs order POS menemukan {{ $value }} anomali"
          description: "Ledger poin BFF dan order POS Odoo tidak konsisten (field kinds/sample_* baris EFN_LOYALTY_RECON_ETL; ClickHouse efn_dwh.loyalty_recon_finding). Jangan koreksi ledger tanpa CR Finance."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyetlreconanomaly"
      # open_items > 0 = pekerjaan tertunda (order review, outbox hold/pending > 24 jam, outbox failed) -> ringkasan
      # harian Finance/supervisor, bukan page.
      - alert: EfnLoyaltyEtlReconOpenItems
        expr: |
          max(
            last_over_time({stream="efn_loyalty", loyalty_event="etl_recon", recon_status="ok"}
              | regexp `^\S+ \S+ \S+ efn_etl\.loyalty_recon EFN_LOYALTY_RECON_ETL [{]"status":"ok","anomalies":(?P<anomalies>\d+),"open_items":(?P<open_items>\d+),`
              | unwrap open_items | __error__="" [26h]) by (loyalty_event)
          ) > 0
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Poin EFN: {{ $value }} item poin POS tertunda (review/outbox) menunggu tindak lanjut"
          description: "Order berstatus review, outbox earn/clawback hold/pending > 24 jam, atau outbox failed. Tinjau di Odoo Point of Sale > Review Poin."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyetlreconopenitems"
      # DEAD-MAN: tidak ada status ok selama 26 jam = job mati/gagal terus (grant G14, modul efn_pos_loyalty_ledger,
      # DB), ETL berhenti, ETL_LOYALTY_RECON_ENABLED=false, ATAU format log berubah (alert anomali ikut buta).
      - alert: EfnLoyaltyEtlReconMissing
        expr: |
          absent_over_time({stream="efn_loyalty", loyalty_event="etl_recon", recon_status="ok"} [26h])
        for: 15m
        labels:
          severity: warning
          team: data
        annotations:
          summary: "Poin EFN: rekonsiliasi harian ETL (loyalty_recon) tidak sukses > 26 jam (atau baris tidak dikenali)"
          description: "Kontrol detektif ledger poin vs order POS tidak berjalan. Cek log ETL (EFN_LOYALTY_RECON_ETL status error / heartbeat job=loyalty_recon)."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyetlreconmissing"

  # G21 (data-AI, docs/04 §13.1 no. 7, E-44): rekonsiliasi liabilitas poin per PT setelah akrual harian Odoo
  # (efn_loyalty_accounting, cron 02:00 WIB): saldo akun Liabilitas Poin PT (Odoo) vs closing_liability_idr BFF.
  # Baris `EFN_LOYALTY_RECON {bff_closing_liability_idr, company_code, date, diff_idr, odoo_liability_idr}` (tanpa PII)
  # -> promtail.yml tahap 2c -> {stream="efn_loyalty", loyalty_event="liability_recon", company_code="<PT>"}.
  # Satu baris per PT per hari -> alert memakai NILAI TERAKHIR dalam 26 jam (last_over_time), tetap menyala sampai run
  # berikutnya bersih. Angka diambil dengan `| regexp` TANPA jangkar posisi (urutan kunci boleh sort_keys atau urutan
  # kontrak; isi stream sudah dibatasi regex berjangkar penuh di promtail). |diff| = unwrap digit tanpa tanda "-".
  # Tidak ada koreksi otomatis (kontrak): alert + aktivitas Finance di Odoo; jurnal koreksi lewat CR Finance.
  #
  # AMBANG CRITICAL (konfigurasi): Rp 100.000 = PLACEHOLDER sampai Finance menetapkan (usulan Q-F21-1, laporan
  # data-AI G21). Ubah HANYA angka `> 100000` pada EfnLoyaltyLiabilityReconCritical (satu tempat; Loki ruler tidak
  # mengekspansi env di file aturan) + panel Grafana efn-loyalty-liability-recon.json (threshold merah) lewat PR.
  # Warning menyala untuk selisih berapa pun (≠ 0); critical menekan warning PT yang sama (alertmanager.yml inhibit).
  # Runbook: docs/runbooks/loyalty-anomaly.md (bagian liabilitas poin — diusulkan, milik lead/devsecops).
  - name: efn-loyalty-liability-recon
    interval: 5m
    rules:
      - alert: EfnLoyaltyLiabilityReconMismatch
        expr: |
          max by (company_code) (
            last_over_time({stream="efn_loyalty", loyalty_event="liability_recon"}
              | regexp `"diff_idr": ?-?(?P<diff_abs>\d+)`
              | unwrap diff_abs | __error__="" [26h])
          ) > 0
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Poin EFN: liabilitas poin {{ $labels.company_code }} di Odoo beda Rp {{ $value }} dari saldo penutup BFF"
          description: "Saldo akun Liabilitas Poin PT (Odoo) tidak sama dengan closing_liability_idr BFF setelah akrual harian. Penyebab umum: akrual hari sebelumnya gagal/terlewat, jurnal manual ke akun liabilitas, akun per PT salah konfigurasi. Tinjau aktivitas Finance di Odoo; tidak ada koreksi otomatis."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyliabilityreconmismatch"
      - alert: EfnLoyaltyLiabilityReconCritical
        expr: |
          max by (company_code) (
            last_over_time({stream="efn_loyalty", loyalty_event="liability_recon"}
              | regexp `"diff_idr": ?-?(?P<diff_abs>\d+)`
              | unwrap diff_abs | __error__="" [26h])
          ) > 100000
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Poin EFN: selisih liabilitas poin {{ $labels.company_code }} Rp {{ $value }} melewati ambang kritis"
          description: "Selisih liabilitas poin Odoo vs BFF di atas ambang critical (PLACEHOLDER Rp 100.000, efn-loyalty.yml). Perlakukan sebagai dugaan salah saji laporan keuangan / manipulasi ledger sampai terbukti sebaliknya; jangan koreksi tanpa CR Finance."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyliabilityreconcritical"
      # DEAD-MAN: tidak ada baris rekonsiliasi selama 26 jam padahal ada dalam 7 hari terakhir = cron akrual Odoo
      # berhenti/gagal (akun PT belum dikonfigurasi -> galat + aktivitas Finance, tanpa baris recon), Odoo mati, ATAU
      # format log berubah (alert selisih ikut buta). Hanya "bersenjata" setelah baris pertama terlihat (7 hari) agar
      # lingkungan tanpa efn_loyalty_accounting tidak alarm terus; berhenti > 7 hari = alert padam (lihat laporan G21).
      - alert: EfnLoyaltyLiabilityReconMissing
        expr: |
          absent_over_time({stream="efn_loyalty", loyalty_event="liability_recon"} [26h])
          and
          sum by (stream, loyalty_event) (count_over_time({stream="efn_loyalty", loyalty_event="liability_recon"} [7d])) > 0
        for: 30m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Poin EFN: rekonsiliasi liabilitas poin harian (Odoo) tidak terlihat > 26 jam"
          description: "Cron akrual poin Odoo (02:00 WIB) tidak mencatat EFN_LOYALTY_RECON untuk PT mana pun. Cek log Odoo efn_loyalty_accounting (akun per PT, akses BFF /v1/pos/loyalty/accruals) dan pipeline log (promtail tahap 2c)."
          runbook_url: "https://github.com/efn/efn-platform/blob/main/docs/runbooks/loyalty-anomaly.md#efnloyaltyliabilityreconmissing"

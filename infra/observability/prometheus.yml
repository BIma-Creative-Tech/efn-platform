# Prometheus EFN. Alert rules: alert-rules.yml (runbook: docs/runbooks/). Alertmanager: profile `ops`.
# Semua scrape lewat HTTPS dengan verifikasi CA internal (docs/04 §7.1) DAN sertifikat klien `prometheus`
# (mTLS, docs/04 §8.5): exporter/Alertmanager/Loki/Traefik/cAdvisor/RabbitMQ/redis_exporter MENOLAK klien tanpa
# sertifikat dari CA internal; web-config*.yml membatasi SAN klien. /run/secrets/tls_server_crt|key = sertifikat
# `prometheus` (EKU server+client). `server_name` wajib untuk job dns_sd (alamat target = IP).
# MinIO: bearer JWT (minio_prometheus_token). ClickHouse/BFF/worker: lihat pengecualian E11/E12 ADR-022.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: efn

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    # Alertmanager --web.external-url=.../alertmanager -> semua route di bawah /alertmanager (tanpa ini POST alert 404, gel. 7)
    - scheme: https
      path_prefix: /alertmanager
      tls_config:
        ca_file: /run/secrets/efn_ca_crt
        cert_file: /run/secrets/tls_server_crt
        key_file: /run/secrets/tls_server_key
      static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    metrics_path: /alertmanager/metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["alertmanager:9093"]

  # Router metrics Traefik: Host(`traefik`) + opsi TLS efn-mtls (SNI = traefik)
  - job_name: traefik
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # api-gateway bisa >1 replika (prod): dns_sd mengambil semua A record service compose.
  # Container BFF ada di 4 network -> satu replika bisa muncul dengan beberapa IP (QA U8). K25-06: nama yang di-resolve
  # adalah alias `api-gateway-metrics` yang HANYA didaftarkan di network `internal` (docker-compose.yml, dicek
  # check-encryption.sh) -> DNS Docker hanya mengembalikan IP `internal` setiap replika, tanpa menyebut nama network
  # (`api-gateway.<stack>_internal` bergantung pada EFN_STACK). Relabel keep tetap dipertahankan sebagai lapisan kedua:
  # hanya IP beroktet ketiga 1 = network `internal` untuk EFN_SUBNET_BASE apa pun (<base>.1.0/24, base selalu 2 oktet).
  # docs/04 §8.10/§8.11: /metrics BFF hanya di listener mTLS TERPISAH :9464 (METRICS_PORT), CN klien `prometheus`
  # (METRICS_TLS_CLIENT_ALLOWED_CN). Port API :3000 tidak lagi melayani /metrics (404).
  - job_name: api-gateway
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: api-gateway
    dns_sd_configs:
      # Alias ber-scope network `internal` (bukan `api-gateway`: tanpa sufiks DNS bisa mengembalikan IP network
      # `data` <base>.2.x yang dibuang relabel di bawah -> target hilang; gelombang 7)
      - names: ["api-gateway-metrics"]
        type: A
        port: 9464
    relabel_configs:
      - source_labels: [__address__]
        regex: '\d{1,3}\.\d{1,3}\.1\.\d{1,3}:9464'
        action: keep

  # ai-ocr-worker: metrik HTTPS :9100 = sidecar ghostunnel ocr-worker-metrics-tls (mTLS --allow-cn=prometheus, E12
  # ditutup gel. 12); worker sendiri hanya di loopback :9101.
  - job_name: ocr-worker
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: ocr-worker
    dns_sd_configs:
      - names: ["ocr-worker-metrics"]   # alias network `internal` saja, lihat job api-gateway
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '\d{1,3}\.\d{1,3}\.1\.\d{1,3}:9100'
        action: keep

  # G50 (docs/04 §28.9, ADR-044): wa-unofficial /metrics di server admin HTTPS :8443 (CA internal, SAN wa-unofficial),
  # autentikasi bearer token metrik (wa_unofficial_metrics_token, != token admin). SEC-G50-06: scrape lewat relay TCP
  # wa-admin-relay (TLS passthrough, network wa-ingress) -> Prometheus tidak berbagi network dengan wa-unofficial;
  # server_name tetap wa-unofficial (verifikasi end-to-end). Service + secret + network HANYA ada di overlay
  # docker-compose.wa-unofficial.yml: tanpa overlay nama DNS tidak ada -> 0 target (tidak ada EfnServiceDown palsu).
  # K25-06: nama = alias `wa-admin-relay-ingress` yang HANYA didaftarkan di network wa-ingress (bukan
  # `wa-admin-relay.<stack>_wa-ingress`); relabel keep = IP statis relay <EFN_SUBNET_BASE>.21.10 untuk base apa pun.
  - job_name: wa-unofficial
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/wa_unofficial_metrics_token
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      server_name: wa-unofficial
    dns_sd_configs:
      - names: ["wa-admin-relay-ingress"]
        type: A
        port: 8443
    relabel_configs:
      - source_labels: [__address__]
        regex: '\d{1,3}\.\d{1,3}\.21\.10:8443'
        action: keep

  # G66 (docs/04 §30.11, ADR-051): prodplan /metrics lewat sidecar prodplan-tls :8443 (mTLS, --allow-cn=prometheus),
  # network insight-plan (satu-satunya network bersama Prometheus <-> prodplan). Service + network HANYA ada di overlay
  # docker-compose.prodplan.yml: tanpa overlay nama DNS tidak ada -> 0 target (tidak ada EfnProdplanDown palsu).
  # dns_sd (bukan static) karena alasan itu; relabel keep = oktet ketiga 24 (insight-plan) untuk EFN_SUBNET_BASE apa pun.
  - job_name: prodplan
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: prodplan
    dns_sd_configs:
      - names: ["prodplan"]
        type: A
        port: 8443
    relabel_configs:
      - source_labels: [__address__]
        regex: '\d{1,3}\.\d{1,3}\.24\.\d{1,3}:8443'
        action: keep

  # Metrik per-queue (ocr.requested, *.dlq): endpoint per-object plugin rabbitmq_prometheus (TLS 15691, mTLS)
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    scrape_interval: 60s
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["rabbitmq:15691"]

  - job_name: clickhouse
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["clickhouse:8443"]

  # Object storage (SILO) hanya lewat filter L7 s3-gateway (ADR-030); /minio/v2/metrics/* diizinkan filter.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/minio_prometheus_token
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      server_name: s3-gateway
    static_configs:
      - targets: ["s3-gateway:9000"]

  - job_name: loki
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["loki:3100"]

  - job_name: node
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor tanpa TLS native -> sidecar ghostunnel :8443 (--allow-cn=prometheus)
  - job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["cadvisor:8443"]

  - job_name: postgres
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: blackbox
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Probe health endpoint internal lewat TLS terverifikasi (tidak lewat Traefik). Blackbox membawa sertifikat
  # klien `blackbox-exporter` (diizinkan sidecar Odoo/Next.js/Metabase/Ollama untuk probe saja).
  - job_name: probe-internal
    metrics_path: /probe
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [https_internal]
    static_configs:
      - targets:
          - https://odoo:8443/web/health
          - https://api-gateway:3000/health
          - https://superapp-web:3443/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # G42 (docs/04 §26.6): health dashboard insight-web lewat sidecar mTLS (network insight-ingress). Job terpisah dari
  # probe-internal: dashboard bukan jalur transaksi -> alert EfnInsightWebDown berderajat warning, bukan critical.
  # Sertifikat tls_insight_web dipantau metrik textfile efn_internal_cert_expiry_timestamp_seconds (deploy.sh).
  - job_name: probe-insight
    metrics_path: /probe
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [https_internal]
    static_configs:
      - targets:
          - https://insight-web:3443/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # G62 (docs/04 §29, ADR-050): halaman masuk staf login-gateway lewat sidecar mTLS (network login-ingress). Job terpisah:
  # gateway mati tidak menghentikan ERP (staf/kasir tetap bisa membuka erp. langsung) -> alert warning, bukan critical.
  # Sertifikat tls_login_gateway dipantau metrik textfile efn_internal_cert_expiry_timestamp_seconds (deploy.sh).
  - job_name: probe-login
    metrics_path: /probe
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [https_internal]
    static_configs:
      - targets:
          - https://login-gateway:3443/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Handshake TLS ke SETIAP listener internal: membuktikan TLS aktif + sertifikat cocok nama service + masa berlaku
  # (alert EfnInternalCertExpiring*). PostgreSQL (STARTTLS-like SSLRequest) dipantau lewat metrik textfile.
  - job_name: probe-internal-tls
    metrics_path: /probe
    scrape_interval: 5m
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [tls_internal]
    static_configs:
      - targets:
          - redis:6379
          - rabbitmq:5671
          - rabbitmq:15671
          - s3-gateway:9000
          - clickhouse:9440
          - clickhouse:8443
          - api-gateway:3000
          - odoo:8443
          - odoo:8444
          - superapp-web:3443
          - ollama:11434
          - metabase:3443
          - grafana:3000
          - uptime-kuma:3001
          # docker-socket-proxy:2376 tidak diprobe: mTLS (CN traefik/promtail/cadvisor) + network socket-proxy
          # terisolasi; kesehatannya terlihat dari discovery Traefik/Promtail dan healthcheck sidecar.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SEC-37: sertifikat DNS-01 host wg-https (service acme-dns -> volume -> Traefik). Satu target cukup: satu sertifikat
  # SAN untuk erp./bi./ops./status. Alert EfnCertExpiringSoon/Critical dan EfnWgCertProbeFailed.
  - job_name: probe-wg-tls
    metrics_path: /probe
    scrape_interval: 5m
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [tls_wg_public]
    static_configs:
      - targets: ["traefik:8443"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # Probe HTTPS publik (lewat Cloudflare/Traefik): ketersediaan + masa berlaku sertifikat publik.
  # Target di targets/blackbox-https.yml; scripts/deploy.sh mengganti efn.local dengan TRAEFIK_DOMAIN.
  - job_name: probe-https
    metrics_path: /probe
    scrape_interval: 60s
    scheme: https
    tls_config:
      ca_file: /run/secrets/efn_ca_crt
      cert_file: /run/secrets/tls_server_crt
      key_file: /run/secrets/tls_server_key
      server_name: blackbox-exporter
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/blackbox-https.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# auth_enabled: false = single tenant. Kontrol akses = mTLS dengan ALLOWLIST CN (SEC-20, SEC-35, docs/04 §8.5):
# Loki sendiri hanya listen di loopback namespace-nya (127.0.0.1:3101, pola E1 ADR-022); satu-satunya jalan masuk
# dari network adalah sidecar ghostunnel `loki-tls` (:3100, TLS sertifikat loki) yang hanya menerima sertifikat
# klien CN promtail (push), grafana (query) dan prometheus (metrik). Sebelumnya (E12) sertifikat klien CA internal
# APA PUN diterima (termasuk ocr-worker yang memproses gambar tak tepercaya).
auth_enabled: false

# HTTP hanya loopback (TLS + mTLS di sidecar). gRPC & ring hanya loopback (single binary, tidak ada peer lain).
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

memberlist:
  bind_addr: [127.0.0.1]

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h   # 30 hari (default semua stream)
  # Gelombang 11 (SEC-43): salinan tamper-evident ringkasan log audit kontrol Odoo (EFN_AUDIT_SINK, tanpa nilai/PII)
  # disimpan 400 hari (> MIN retensi log kontrol di Odoo 365 hari). Per-stream retention butuh compactor
  # retention_enabled (di bawah). Stream lain tetap 30 hari.
  retention_stream:
    - selector: '{stream="efn_audit_sink"}'
      priority: 1
      period: 9600h
    # G12: jejak deploy/backup host (promtail-journal, prod) = log kontrol keamanan, retensi sama dengan sink audit
    - selector: '{job="host-journal"}'
      priority: 2
      period: 9600h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Gelombang 11 (SEC-43): ruler mengevaluasi aturan LogQL di infra/observability/loki-rules/ (tenant tunggal "fake",
# auth_enabled=false) dan mengirim alert ke Alertmanager lewat HTTPS + mTLS (sertifikat loki, CA internal, verifikasi
# nama). Tanpa fallback plaintext. Penyimpanan rule read-only (bind mount), tidak ada API rule tulis yang dipakai.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules-scratch
  evaluation_interval: 1m
  enable_api: false
  alertmanager_url: https://alertmanager:9093/alertmanager
  enable_alertmanager_v2: true
  alertmanager_client:
    tls_ca_path: /run/secrets/efn_ca_crt
    tls_cert_path: /run/secrets/tls_loki_crt
    tls_key_path: /run/secrets/tls_loki_key
    tls_server_name: alertmanager
    tls_insecure_skip_verify: false
  external_url: https://ops.efn.local/grafana

# auth_enabled: false = single tenant. Kontrol akses = mTLS dengan ALLOWLIST CN (SEC-20, SEC-35, docs/04 §8.5):
# Loki sendiri hanya listen di loopback namespace-nya (127.0.0.1:3101, pola E1 ADR-022); satu-satunya jalan masuk
# dari network adalah sidecar ghostunnel `loki-tls` (:3100, TLS sertifikat loki) yang hanya menerima sertifikat
# klien CN promtail (push), grafana (query) dan prometheus (metrik). Sebelumnya (E12) sertifikat klien CA internal
# APA PUN diterima (termasuk ocr-worker yang memproses gambar tak tepercaya).
auth_enabled: false

# HTTP hanya loopback (TLS + mTLS di sidecar). gRPC & ring hanya loopback (single binary, tidak ada peer lain).
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

memberlist:
  bind_addr: [127.0.0.1]

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h   # 30 hari; audit log penting disalin ke MinIO oleh job terpisah
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

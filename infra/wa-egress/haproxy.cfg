# wa-egress-proxy: satu-satunya jalur keluar service wa-unofficial (G50, ADR-044 Proposed §3.6, docs/04 §28.9).
# Pola: TLS PASSTHROUGH dengan allowlist SNI (bukan proxy HTTP CONNECT): HAProxy mode tcp membaca SNI ClientHello,
# meneruskan byte TLS apa adanya ke host WhatsApp yang diizinkan, menolak SNI lain. Tidak ada terminasi TLS dan tidak
# ada hop plaintext: TLS end-to-end wa-unofficial <-> WhatsApp dengan verifikasi CA publik di sisi Baileys.
# wa-unofficial menjangkau proxy lewat extra_hosts (nama host WhatsApp -> IP statis proxy di network internal wa-egress);
# proxy sendiri ada di network wa-internet (bisa keluar internet, enable_icc=false).
#
# DAFTAR HOST BELUM DIVERIFIKASI (docs/04 §28.9; wajib PoC dengan nomor uji sebelum staging):
#   web.whatsapp.com  - websocket Baileys default (wss://web.whatsapp.com/ws/chat): login, pairing, kirim teks.
# Host media (mmg.whatsapp.net, *.cdn.whatsapp.net) TIDAK diizinkan: kanal hanya mengirim teks; extra_hosts tidak bisa
# wildcard. Bila PoC menunjukkan host lain wajib, tambahkan ACL sni_* + backend + extra_hosts di overlay (keputusan
# devsecops + catatan ADR-044), jangan membuka egress umum.
#
# Komponen: HAProxy LTS (GPL-2.0), image & digest sama dengan s3-gateway/odoo-rpc-gateway. Non-root, read_only, tanpa
# capability; port 443 di-bind non-root lewat sysctl net.ipv4.ip_unprivileged_port_start=0 (compose).
global
    log stdout format raw local0 info
    maxconn 64
    # Tidak ada stats socket / runtime API.

resolvers pub
    # DNS embedded Docker (127.0.0.11) di network wa-internet meneruskan ke resolver host.
    parse-resolv-conf
    hold valid 60s
    resolve_retries 3
    timeout resolve 2s
    timeout retry 1s

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 10s
    # Websocket WhatsApp berumur panjang (keepalive aplikasi ~30 s).
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend wa_tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content capture req.ssl_sni len 128
    # Hanya ClientHello TLS (type 1); bukan TLS = tolak.
    tcp-request content reject unless { req.ssl_hello_type 1 }
    acl sni_web req.ssl_sni -m str web.whatsapp.com
    tcp-request content reject unless sni_web
    # Log: IP klien (wa-unofficial), SNI, backend, status terminasi, byte, durasi. Tanpa isi (terenkripsi).
    log-format "%ci sni=%[capture.req.hdr(0)] be=%b ts=%ts bytes=%B tt=%Tt"
    use_backend be_wa_web if sni_web

backend be_wa_web
    # Tanpa health check aktif (tidak membuat koneksi berkala ke WhatsApp). init-addr libc: resolusi saat start, lalu
    # resolvers pub memperbarui IP.
    server web web.whatsapp.com:443 resolvers pub resolve-prefer ipv4 init-addr last,libc,none

# Healthcheck Docker (loopback namespace sendiri): proses hidup + konfigurasi termuat.
frontend health
    bind 127.0.0.1:8407
    mode http
    timeout client 5s
    monitor-uri /healthz

# wa-admin-relay: SATU-SATUNYA jalur masuk ke port admin/metrik wa-unofficial (G50, SEC-G50-06, ADR-044 Proposed).
# Masalah: network bridge Docker dua arah. Bila Traefik/Prometheus berbagi network dengan wa-unofficial, proses
# wa-unofficial (Baileys, permukaan RCE terbesar G50) bisa membuka koneksi ke listener Traefik dan Prometheus :9090.
# Solusi: relay TCP (TLS passthrough) di antara dua network:
#   wa-ingress (internal): traefik + prometheus -> wa-admin-relay :8443
#   wa-admin   (internal): wa-admin-relay -> wa-unofficial :8443
# wa-unofficial hanya berbagi network dengan relay ini, dan relay tidak listen di sisi wa-admin, jadi dari wa-unofficial
# Traefik, Prometheus, maupun relay tidak terjangkau.
# TLS tidak diterminasi di sini: Traefik (serversTransport serverName wa-unofficial) dan Prometheus (server_name
# wa-unofficial) memverifikasi sertifikat wa-unofficial (CA internal) end-to-end; token admin/metrik tetap di service.
# Komponen: HAProxy LTS, image & digest sama dengan wa-egress-proxy. Non-root, read_only, tanpa capability.
global
    log stdout format raw local0 info
    maxconn 64
    # Tidak ada stats socket / runtime API.

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend wa_admin_in
    # Bind HANYA ke IP statis relay di wa-ingress (compose ipv4_address): di sisi wa-admin relay tidak punya listener
    # (selain health loopback), jadi wa-unofficial tidak bisa membuka koneksi ke relay sama sekali.
    # K25-06: IP dari env WA_RELAY_BIND_IP (compose: <EFN_SUBNET_BASE>.21.10 = ipv4_address). Env kosong/tidak ada =
    # start GAGAL (.alert), bukan bind ":8443" di semua interface (termasuk sisi wa-admin).
.if !defined(WA_RELAY_BIND_IP)
    .alert "WA_RELAY_BIND_IP wajib diset (IP statis relay di network wa-ingress, docker-compose.wa-unofficial.yml)"
.endif
.if streq("${WA_RELAY_BIND_IP}","")
    .alert "WA_RELAY_BIND_IP kosong"
.endif
    bind "${WA_RELAY_BIND_IP}:8443"
    # Hanya ClientHello TLS; bukan TLS = tolak.
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.ssl_hello_type 1 }
    log-format "%ci be=%b ts=%ts bytes=%B tt=%Tt"
    default_backend be_wa_unofficial

backend be_wa_unofficial
    server wa wa-unofficial:8443 resolvers docker init-addr last,libc,none

# Healthcheck Docker (loopback namespace sendiri)
frontend health
    bind 127.0.0.1:8408
    mode http
    timeout client 5s
    monitor-uri /healthz

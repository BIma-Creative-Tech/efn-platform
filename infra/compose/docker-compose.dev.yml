# Override untuk laptop developer. Mem-publish port ke 127.0.0.1 laptop dan me-mount source code untuk hot reload.
# JANGAN dipakai di server. Dev = prod untuk enkripsi: PKI dari `make pki`/`make secrets` (scripts/gen-pki.sh),
# semua port yang dipublish adalah port TLS (tidak ada EFN_ALLOW_PLAINTEXT). Untuk alat lokal (psql, redis-cli,
# DBeaver) gunakan CA secrets/efn_ca_crt.txt dan hostname `localhost` (ada di SAN).
# Catatan: daftar `ports` digabung (append) dengan base; port 80/443 Traefik sudah ada di base.
# Port service ber-sidecar dipublish di service app (pemilik network namespace), bukan di sidecar.
services:
  # Host internal (erp./bi./ops./status.) hanya di entrypoint wg-https: dev = https://erp.efn.local:9443
  # (base: 127.0.0.1:9443 -> :8443). Sertifikat publik dev = default self-signed Traefik (E8).
  traefik:
    environment:
      # Browser laptop -> port publish -> Traefik terlihat dari bridge Docker Desktop (bukan WireGuard)
      - EFN_INTERNAL_EXTRA_CIDR=172.16.0.0/12
    # Sertifikat edge dev self-signed *.efn.local (scripts/gen-secrets.sh): sniStrict butuh sertifikat yang cocok.
    volumes:
      - ../traefik/dev:/etc/traefik/dynamic/dev:ro
    secrets: [dev_edge_crt, dev_edge_key]   # digabung dengan daftar secret base

  # `command` menggantikan base seluruhnya: parameter archive WAL-G, TLS, hba_file, SEC-18 tetap disertakan.
  # Set PG_ARCHIVE_MODE=off di .env bila tidak ingin archiving di laptop.
  postgres:
    image: efn/postgres:dev
    ports: ["127.0.0.1:5432:5432"]   # TLS wajib: psql "sslmode=verify-full sslrootcert=secrets/efn_ca_crt.txt host=localhost"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-on}
      - -c
      - archive_command=/usr/local/bin/efn-walg wal-push %p
      - -c
      - archive_timeout=900
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      # G15 (SEC-72): sumber utama nomor HP mentah di Loki dev = log_statement=all (Odoo/psycopg2 menginterpolasi
      # parameter di klien -> INSERT res_partner.phone/pos_order.mobile tercetak utuh). Default kini `ddl`;
      # debugging SQL: PG_LOG_STATEMENT=all di .env + recreate postgres, kembalikan setelah selesai.
      - log_statement=${PG_LOG_STATEMENT:-ddl}
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/tls_postgres_crt
      - -c
      - ssl_key_file=/var/run/postgresql/efn-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf

  redis:
    ports: ["127.0.0.1:6379:6379"]          # rediss

  rabbitmq:
    ports: ["127.0.0.1:5671:5671", "127.0.0.1:15671:15671"]   # amqps, management https

  # Storage hanya di network internal `objstore` (ADR-030) -> port tidak bisa/tidak boleh dipublish. Akses S3 dari
  # laptop lewat filter s3-gateway (https://localhost:9000, CA secrets/efn_ca_crt.txt); admin/console:
  # `docker exec efn-minio-1 mc ...` (runbook dev-stack-boot.md §5).
  minio:
    image: efn/minio:dev

  minio-init:
    image: efn/minio:dev

  s3-gateway:
    ports: ["127.0.0.1:9000:9000"]          # https (S3 API lewat filter L7)

  odoo:
    image: efn/odoo:dev
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:8444:8444"]     # sidecar ghostunnel (https)
    volumes:
      - ../../services/odoo/addons:/mnt/extra-addons:ro
    environment:
      APP_ENV: dev
      ODOO_DEV_MODE: "all"
      # G19 E-38 PoC -> G20 E-38a (docs/04 §12.5, ADR-036 Accepted §0): kunci PII Odoo HANYA untuk container odoo (bukan
      # BFF, ETL, OCR, Metabase, odoo-rpc-gateway; dicek scripts/check-encryption.sh). G21 AC-13: staging/production
      # memakai overlay docker-compose.pii.yml (env + mount sama, EFN_ODOO_PII_REQUIRED=true) saat EFN_ODOO_PII_ENABLED=true.
      # Tanpa modul efn_pii terpasang, env ini tidak dipakai.
      EFN_ODOO_PII_KEY_V1_FILE: /run/secrets/odoo_pii_key_v1
      EFN_ODOO_PII_ACTIVE_KEY_VERSION: "1"
      EFN_ODOO_PII_BIDX_KEY_FILE: /run/secrets/odoo_pii_bidx_key
      # G20 E-38a (ADR-036 §0.5 Accepted, docs/04 §12.5): kunci HMAC token nama (efn_name_tokens) - kunci KETIGA, terpisah
      # dari bidx (SEC-140 c). Hanya odoo. Default efn_pii juga mencari <EFN_ODOO_PII_KEY_DIR>/odoo_pii_name_key.
      EFN_ODOO_PII_NAME_KEY_FILE: /run/secrets/odoo_pii_name_key
    secrets: [odoo_pii_key_v1, odoo_pii_bidx_key, odoo_pii_name_key]   # digabung dengan daftar secret base

  api-gateway:
    image: efn/api-gateway:dev
    build:
      target: dev
    ports: ["127.0.0.1:3000:3000"]          # https
    environment:
      NODE_ENV: development
      APP_ENV: dev
      # `nest start --watch` (tsc) butuh heap > default ~250 MB -> OOM pada limit 512M base (gelombang 7)
      NODE_OPTIONS: --max-old-space-size=1024
      # G17-QA-05: Docker Desktop (Windows) tidak meneruskan event inotify dari bind mount ./src -> `nest start --watch`
      # (TypeScript watch API) tidak pernah melihat perubahan; setelah satu kompilasi gagal (mis. 14:20 9 Okt: 4 error
      # TS saat file BFF setengah diedit) app tidak pernah start ulang -> container `unhealthy` sampai di-recreate.
      # Watcher TypeScript dipaksa polling (env resmi ts.sys, hanya dev; produksi tidak memakai watch).
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
      WHATSAPP_ENABLED: "false"
      # docs/04 §3.2 v5.2: mode uji OTP (APK uji tanpa WhatsApp) - kode login dikembalikan di respons untuk nomor ini
      # saja (62xxx, dipisah koma, maks 10). Kosong = mati. BFF menolak start bila diisi di luar APP_ENV=dev.
      DEV_OTP_REVEAL_MEMBERS: ${DEV_OTP_REVEAL_MEMBERS:-}
      PAYMENT_PROVIDER: mock
      # G17: penjualan online AKTIF di dev terhadap E-28 nyata lewat odoo-rpc-gateway (ODOO_ONLINE_MOCK sengaja tidak
      # diset). Butuh secrets/odoo_api_key_online_gl.txt (kanal default GL, G20) berisi key nyata
      # (docs/runbooks/odoo-online-api-key.md §1); placeholder `disabled` -> BFF menolak konfigurasi kanal. Kanal PB/BCR/BCF/WTZ
      # di dev: ONLINE_CHANNELS di .env + `-f docker-compose.online-<kode>.yml`. Base/prod tetap default false.
      ONLINE_ENABLED: "true"
      ONLINE_CATALOG_ENABLED: "true"
      # G13c: rekonsiliasi loyalty tiap 5 menit di dev (default 1 jam) agar heartbeat EFN_LOYALTY_RECON & anomali
      # rekonsiliasi teramati oleh smoke dalam satu run.
      LOYALTY_RECON_INTERVAL_MS: "300000"
      # G22 (docs/04 §14.A.9): URL tenant QR meja dev (https; token di fragment). QR tetap MATI kecuali .env
      # FNB_QR_ENABLED=true + `-f docker-compose.online-qr-pb.yml` (key user teknis efn_qr_pb nyata,
      # docs/runbooks/odoo-qr-api-key.md §1). Job poin hangus W-17 dev: LOYALTY_EXPIRY_ENABLED=true di .env (DRY_RUN
      # default true) + LOYALTY_ACTIVITY_EPOCH.
      FNB_QR_BASE_URL_PB: ${FNB_QR_BASE_URL_PB:-https://app.efn.local}
      FNB_QR_BASE_URL_BCF: ${FNB_QR_BASE_URL_BCF:-https://app.efn.local}
      # Teks consent DRAFT frontend (services/superapp-web/lib/consent.ts): versi persis + SHA-256 UTF-8 `body`.
      # Dijaga test superapp-web tests/consent.test.ts — ubah teks = ubah keduanya (G6 QA).
      CONSENT_LOCATION_VERSION: location@2026-10-06
      CONSENT_LOCATION_TEXT_SHA256: 938707dc56c73323db27d0360d69386bf95e290ce0b0a465741de78ca19c96e5
      # G27 §18.3: teks marketing diperluas ke notifikasi aplikasi (DRAFT DPO/Legal) - sama persis dengan web lib/consent.ts + app.
      CONSENT_MARKETING_VERSION: marketing@2026-10-27
      CONSENT_MARKETING_TEXT_SHA256: cbf5fd4dddcb361e1512b7b10ae7e0a80799c587db3d9dab951810e65afc750e
      # G27 §18.3a: persetujuan Kebijakan Privasi (DRAFT DPO/Legal). Dipaksa setelah APK baru terpasang (.env).
      CONSENT_PRIVACY_VERSION: privacy@2026-10-27
      CONSENT_PRIVACY_TEXT_SHA256: b66c21588d1d7ecd2c9edcde1bc813c4e138f00708f8b3c6004226f80a1593e2
      PRIVACY_CONSENT_ENFORCED: ${PRIVACY_CONSENT_ENFORCED:-false}
      # G27 §18.2: promo Super-App (banner slider + pop-up dari Odoo efn_promo). Default mati; nyalakan di .env.
      PROMO_ENABLED: ${PROMO_ENABLED:-false}
      PROMO_PUSH_ENABLED: ${PROMO_PUSH_ENABLED:-false}
      PROMO_COMPANIES: ${PROMO_COMPANIES:-}
      # G31 §20: engine MGM (default mati; nyalakan di .env untuk uji dev)
      MGM_ENABLED: ${MGM_ENABLED:-false}
      MGM_CLAIM_WINDOW_DAYS: ${MGM_CLAIM_WINDOW_DAYS:-30}
      MGM_SETTLE_INTERVAL_MS: ${MGM_SETTLE_INTERVAL_MS:-300000}
    volumes:
      - ../../services/api-gateway/src:/app/src:ro
    read_only: false
    command: ["npm", "run", "start:dev"]
    deploy:
      resources:
        limits: { memory: 1536M }

  # Stage dev image: `next dev -H ${HOSTNAME}` -> 127.0.0.1 (base env), diakses lewat sidecar :3443
  superapp-web:
    image: efn/superapp-web:dev
    build:
      target: dev
    ports: ["127.0.0.1:3443:3443"]          # sidecar ghostunnel (https)
    environment:
      NODE_ENV: development
      APP_ENV: dev
      # G17: simulator pembayaran online (QR mock) HANYA dev; base = "false", render prod dicek check-encryption.sh
      EFN_PAYMENT_SIMULATOR: "true"
      # Dev via https://app.efn.local (Traefik) -> cookie Secure tetap jalan; COOKIE_INSECURE diabaikan di production.
    volumes:
      - ../../services/superapp-web/app:/app/app:ro
      - ../../services/superapp-web/lib:/app/lib:ro
      - ../../services/superapp-web/components:/app/components:ro
      - ../../services/superapp-web/proxy.ts:/app/proxy.ts:ro
      # Config dev (mis. turbopackFileSystemCacheForDev=false) berlaku tanpa rebuild image.
      - ../../services/superapp-web/next.config.mjs:/app/next.config.mjs:ro
      # Aset statis (model 3D landing, poster, logo brand) - tanpa rebuild image saat aset berubah.
      - ../../services/superapp-web/public:/app/public:ro
    read_only: false
    # `next dev` mengompilasi route sesuai permintaan dan menyimpan cache webpack di memori. Diukur gel. 12
    # (7 Okt 2026): 330 MiB setelah start -> 477 MiB setelah 6 route dikompilasi -> 487 MiB (95 % dari 512M base).
    # Base 512M tetap untuk image produksi (`next start`, standalone).
    deploy:
      resources:
        limits: { memory: 1024M }

  clickhouse:
    ports: ["127.0.0.1:18443:8443", "127.0.0.1:9440:9440"]    # https (host 18443: 8443 dipakai odoo), native TLS

  metabase:
    ports: ["127.0.0.1:3444:3443"]          # sidecar ghostunnel (https; host 3444: 3443 dipakai superapp-web)

  ollama:
    ports: ["127.0.0.1:11434:11434"]        # sidecar ghostunnel (https)

  etl:
    image: efn/etl:dev
    environment:
      APP_ENV: dev
      ETL_INTERVAL_SECONDS: "120"
      # R5: grant efn_etl di DB Odoo diterapkan scripts/smoke/run-e2e-smoke.sh / runbook dev-stack-boot §3
      ETL_ENABLE_ODOO: "true"
      # G12: butuh grant terbaru (efn_audit >= 19.0.1.2.0 di DB dev; sebelum itu job audit_copy mencatat gagal)
      ETL_ENABLE_GL: "true"
      ETL_AUDIT_COPY_ENABLED: "true"
      # G14: go-live loyalty POS di DB dev (efn_pos_loyalty_ledger dipasang 7 Okt). Tanpa ini 42 order smoke lama
      # muncul sebagai anomali `paid_member_order_without_earn` (EfnLoyaltyEtlReconAnomaly palsu).
      # G18 QA: bisa ditimpa .env (mis. setelah reset DB Odoo dev) agar data uji lama BFF tidak memicu temuan.
      ETL_LOYALTY_RECON_NOT_BEFORE: ${ETL_LOYALTY_RECON_NOT_BEFORE:-2026-10-07T07:09:00Z}
      # G18 (data-AI): epoch rantai salinan audit OTOMATIS saat DB Odoo dev di-reset (KHUSUS dev; staging/production
      # ditolak deploy-validate EFN_DEV_ONLY_SWITCHES + check-encryption + config ETL)
      ETL_AUDIT_EPOCH_AUTO: "true"
      # G21/G22 (QA G22 P2-3): ETL_PARTNER_REGION_ENABLED, ETL_ENABLE_KDS, ETL_KDS_ONLINE_ENABLED,
      # ETL_LOYALTY_RECON_ONLINE_ENABLED, ETL_ENABLE_WASTE (G32) TIDAK dipaksa true di dev (butuh efn_region / efn_pos_kds / E-29a + grant G21/G22
      # di DB Odoo dev). Nyalakan lewat .env lokal setelah modul + grant terpasang; base meneruskan `${X:-false}`.

  ocr-worker:
    image: efn/ai-ocr-worker:dev
    environment:
      APP_ENV: dev
      # Gelombang 10: Ollama dev = CPU saja; qwen2.5vl:3b butuh ±70 s per foto baru (prompt eval ±1300 token gambar
      # @ ±19 tok/s) -> default worker 90 s mepet (ReadTimeout -> flagged/vlm_unavailable). Produksi (GPU) tetap 90 s.
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-240}

  text2sql:
    image: efn/text2sql:dev
    environment:
      APP_ENV: dev

  # Docker Desktop (WSL2): "/" bukan shared/slave mount -> propagasi rslave ditolak daemon. Target sama = mengganti
  # entri base (/:/host:ro,rslave). Produksi (Linux) tetap rslave.
  node-exporter:
    volumes:
      - /:/host:ro

# Dev saja (bukan bagian scripts/secrets.list / produksi): sertifikat edge self-signed dari scripts/gen-secrets.sh
secrets:
  dev_edge_crt: { file: ../../secrets/dev_edge_crt.txt }
  dev_edge_key: { file: ../../secrets/dev_edge_key.txt }
  # Kunci PII Odoo (odoo_pii_key_v1/_bidx_key/_name_key): definisi top-level kini di compose base (G21 AC-13, sama dengan
  # scripts/secrets.list). Dev: 32 byte acak dari scripts/gen-secrets.sh (bagian "PII Odoo"); menghapus file key ring =
  # data partner terlindungi di DB dev tidak terbaca; bidx/name hilang = indeks/token dihitung ulang.

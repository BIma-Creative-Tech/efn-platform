# G50 (docs/04 §28.7/§28.9/§28.10, ADR-044 Proposed, K18-01): WhatsApp TIDAK RESMI (Baileys) terisolasi, HANYA promo
# personal & notify-me/price alert supermarket. OTP/pesanan/pembayaran/poin tetap WhatsApp Cloud API resmi.
# Runbook: docs/runbooks/supermarket-campaign-channels.md.
#
# STATUS: WA_UNOFFICIAL_ENABLED=false default di SEMUA env (service idle: hanya GET /health). OFF di PRODUCTION sampai
# penerimaan risiko tertulis pemilik proyek + Legal (WA_UNOFFICIAL_RISK_ACCEPTANCE_REF, Q-SM14) dan DPO (Q-SM18);
# deploy-validate menolak production tanpa ref (+ izin Superadmin EFN_ALLOW_FEATURE_ON), service sendiri exit 78.
# Image belum masuk rantai rilis bertanda tangan (pola overlay forecast/esb): deploy.sh TIDAK menyertakan overlay ini.
#
# Pemakaian (dev/staging lokal; secret WA nyata hanya dibuat `APP_ENV=dev bash scripts/gen-secrets.sh`):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.wa-unofficial.yml \
#     --profile core --profile observability --profile wa-unofficial up -d wa-unofficial wa-egress-proxy wa-admin-relay
#
# Jaringan (least privilege, dicek scripts/check-encryption.sh):
#   rmq         (internal) : HANYA rabbitmq <-> wa-unofficial (amqps 5671, user efn-wa-unofficial, CA internal)
#   wa-egress   (internal) : HANYA wa-unofficial <-> wa-egress-proxy (TLS passthrough allowlist SNI, IP statis)
#   wa-internet (keluar)   : HANYA wa-egress-proxy (enable_icc=false) -> host WhatsApp (daftar BELUM DIVERIFIKASI)
#   wa-admin    (internal) : HANYA wa-admin-relay <-> wa-unofficial :8443
#   wa-ingress  (internal) : traefik + prometheus -> wa-admin-relay 172.30.21.10:8443 (TLS passthrough)
#   SEC-G50-06: network bridge Docker dua arah -> wa-unofficial TIDAK berbagi network dengan Traefik/Prometheus. Relay
#   (infra/wa-egress/admin-relay.cfg) hanya listen di IP wa-ingress, jadi dari wa-unofficial tidak ada listener yang
#   terjangkau lewat jalur admin. TLS tetap end-to-end ke wa-unofficial (sertifikat diverifikasi Traefik/Prometheus).
#   wa-unofficial TIDAK di network data/internal/cache/egress: tanpa PostgreSQL, Redis, Odoo, ClickHouse, internet langsung.
#   Catatan: brief meminta "rmq + wa-egress saja"; wa-admin ditambahkan karena endpoint admin + scrape metrik butuh
#   jalur masuk (lewat relay).
#
# Admin: Traefik entrypoint wg-https, host wa-admin.<TRAEFIK_DOMAIN>, middleware internal-ops (subnet staf WireGuard),
#   TLS option efn-mtls (sertifikat klien CA internal, leaf `wa-operator`) + bearer wa_unofficial_admin_token di service.
#   Hanya path /health, /v1/admin/* (bukan /metrics). Production: overlay tidak dipakai.
#
# Secret (semua lewat /run/secrets, tidak ada di env):
#   rabbitmq_password_wa_unofficial  host:disabled (dev nyata)  rabbitmq (buat user) + wa-unofficial
#   wa_unofficial_session_key        host:disabled (dev 32 B)   wa-unofficial
#   wa_unofficial_hash_key           host:disabled (dev >= 32)  wa-unofficial + api-gateway (to_hash HMAC)
#   wa_unofficial_admin_token        host:disabled (dev >= 32)  wa-unofficial
#   wa_unofficial_metrics_token      host:disabled (dev >= 32)  wa-unofficial + prometheus
#   tls_wa_unofficial_crt/_key       pki (gen-pki.sh, server)   wa-unofficial
#   efn_ca_crt                       bundle CA internal
services:
  wa-unofficial:
    image: ${IMAGE_WA_UNOFFICIAL:-ghcr.io/efn/wa-unofficial:dev}
    build:
      context: ../../services/wa-unofficial
    profiles: ["wa-unofficial"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service"
    security_opt:
      - no-new-privileges:true
    depends_on:
      rabbitmq:
        condition: service_healthy
      wa-egress-proxy:
        condition: service_healthy
    # Non-root: user `app` image (adduser -S). uid tidak dipaku di sini karena volume state dibuat image dengan owner app;
    # check-encryption menolak user root/kosong -> uid dibaca dari image saat build tidak bisa dicek statis, jadi nama
    # user dipakai eksplisit.
    user: app
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      # Kill switch §28.10: HANYA string persis "true" yang menyalakan (selain itu idle).
      WA_UNOFFICIAL_ENABLED: ${WA_UNOFFICIAL_ENABLED:-false}
      WA_UNOFFICIAL_RISK_ACCEPTANCE_REF: ${WA_UNOFFICIAL_RISK_ACCEPTANCE_REF:-}
      AMQP_URL: amqps://efn-wa-unofficial@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_wa_unofficial
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      WA_UNOFFICIAL_SESSION_KEY_FILE: /run/secrets/wa_unofficial_session_key
      WA_UNOFFICIAL_HASH_KEY_FILE: /run/secrets/wa_unofficial_hash_key
      WA_UNOFFICIAL_ADMIN_TOKEN_FILE: /run/secrets/wa_unofficial_admin_token
      WA_UNOFFICIAL_METRICS_TOKEN_FILE: /run/secrets/wa_unofficial_metrics_token
      TLS_CERT_FILE: /run/secrets/tls_wa_unofficial_crt
      TLS_KEY_FILE: /run/secrets/tls_wa_unofficial_key
      HEALTHCHECK_CA_FILE: /run/secrets/efn_ca_crt
      HEALTHCHECK_SERVERNAME: wa-unofficial
      PORT: "8443"
      WA_UNOFFICIAL_STATE_DIR: /var/lib/wa-unofficial
      # Batas teknis anti-ban §28.9 (tidak ada jaminan; ban bisa terjadi kapan saja, R-B16)
      WA_UNOFFICIAL_RATE_PER_MIN: ${WA_UNOFFICIAL_RATE_PER_MIN:-10}
      WA_UNOFFICIAL_MAX_PER_DAY: ${WA_UNOFFICIAL_MAX_PER_DAY:-300}
      WA_UNOFFICIAL_MAX_PER_MEMBER_PER_DAY: ${WA_UNOFFICIAL_MAX_PER_MEMBER_PER_DAY:-1}
      WA_UNOFFICIAL_JITTER_MIN_MS: ${WA_UNOFFICIAL_JITTER_MIN_MS:-2000}
      WA_UNOFFICIAL_JITTER_MAX_MS: ${WA_UNOFFICIAL_JITTER_MAX_MS:-8000}
      WA_UNOFFICIAL_SENDER_LABEL: ${WA_UNOFFICIAL_SENDER_LABEL:-Promo EFN}
      # WA_UNOFFICIAL_PROXY_URL sengaja TIDAK diset: egress = TLS passthrough wa-egress-proxy lewat extra_hosts (tanpa
      # proxy HTTP CONNECT plaintext; check-encryption menolak http:// di env).
      LOG_LEVEL: ${WA_UNOFFICIAL_LOG_LEVEL:-info}
    secrets:
      - rabbitmq_password_wa_unofficial
      - wa_unofficial_session_key
      - wa_unofficial_hash_key
      - wa_unofficial_admin_token
      - wa_unofficial_metrics_token
      - tls_wa_unofficial_crt
      - tls_wa_unofficial_key
      - efn_ca_crt
    # Nama host WhatsApp -> IP statis wa-egress-proxy (BELUM DIVERIFIKASI: daftar host, lihat infra/wa-egress/haproxy.cfg)
    extra_hosts:
      - "web.whatsapp.com:172.30.14.10"
    volumes:
      # Sesi Baileys + state (dedup, kuota, opt-out to_hash): AES-256-GCM di aplikasi (wa_unofficial_session_key) +
      # disk host LUKS (production). Backup hanya lewat backup terenkripsi; kunci salah = gagal muat (tanpa fallback).
      - wa-unofficial-state:/var/lib/wa-unofficial
    networks: [rmq, wa-egress, wa-admin]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 384M }
    healthcheck:
      # HTTPS loopback ke /health dengan verifikasi CA internal + servername wa-unofficial (dist/healthcheck.js)
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      service: wa-unofficial

  # SEC-G50-06: relay TCP satu-satunya jalur masuk ke :8443 wa-unofficial (infra/wa-egress/admin-relay.cfg). Label
  # Traefik ada di SINI (alamat backend = IP relay di wa-ingress), bukan di wa-unofficial.
  wa-admin-relay:
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: ["wa-unofficial"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service"
    security_opt:
      - no-new-privileges:true
    user: haproxy
    volumes:
      - ../wa-egress/admin-relay.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      wa-ingress:
        ipv4_address: 172.30.21.10
      wa-admin: {}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8408/healthz"]   # loopback namespace sendiri
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: wa-admin-relay
      traefik.enable: "true"
      traefik.docker.network: efn_wa-ingress
      # ADR-044 / docs/04 §28.9: HANYA wg-https + subnet staf (internal-ops) + mTLS operator (efn-mtls) + token admin.
      # Sertifikat host: acme-dns (ACME_DOMAINS diperluas di bawah) / dev: edge self-signed *.efn.local.
      # serversTransport efn-wa-unofficial: serverName wa-unofficial -> TLS (passthrough relay) diverifikasi end-to-end.
      traefik.http.routers.wa-admin.rule: >-
        Host(`wa-admin.${TRAEFIK_DOMAIN:-efn.local}`) && (Path(`/health`) || PathPrefix(`/v1/admin/`))
      traefik.http.routers.wa-admin.entrypoints: wg-https
      traefik.http.routers.wa-admin.tls: "true"
      traefik.http.routers.wa-admin.tls.options: efn-mtls@file
      traefik.http.routers.wa-admin.middlewares: internal-ops@file,secure-headers@file,ratelimit-odoo-login@file
      traefik.http.routers.wa-admin.service: wa-admin
      traefik.http.services.wa-admin.loadbalancer.server.port: "8443"
      traefik.http.services.wa-admin.loadbalancer.server.scheme: https
      traefik.http.services.wa-admin.loadbalancer.serversTransport: efn-wa-unofficial@file

  # TLS passthrough dengan allowlist SNI (infra/wa-egress/haproxy.cfg). Satu-satunya container di network wa-internet.
  wa-egress-proxy:
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: ["wa-unofficial"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service"
    security_opt:
      - no-new-privileges:true
    # uid image haproxy (non-root). Bind :443 tanpa capability lewat sysctl namespaced berikut.
    user: haproxy
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ../wa-egress/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      wa-egress:
        ipv4_address: 172.30.14.10
      wa-internet: {}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8407/healthz"]   # loopback namespace sendiri
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: wa-egress-proxy

  # Union dengan base: broker juga di network rmq; secret password efn-wa-unofficial dibaca entrypoint (user dibuat
  # hanya bila bukan placeholder `disabled`).
  rabbitmq:
    networks: [data, internal, rmq]
    secrets:
      - rabbitmq_password_wa_unofficial

  # BFF: kunci HMAC to_hash bersama (publisher notify.wa_unofficial + verifikasi opt-out). Tanpa overlay = kanal mati.
  api-gateway:
    environment:
      WA_UNOFFICIAL_HASH_KEY_FILE: /run/secrets/wa_unofficial_hash_key
    secrets:
      - wa_unofficial_hash_key

  traefik:
    networks: [edge, internal, socket-proxy, insight-ingress, wa-ingress]

  prometheus:
    networks: [internal, data, wa-ingress]
    secrets:
      - wa_unofficial_metrics_token

  # Sertifikat wg-https (DNS-01) mencakup host admin. Hanya dipakai bila overlay aktif (production: tidak).
  acme-dns:
    environment:
      - ACME_DOMAINS=erp.${TRAEFIK_DOMAIN:-efn.local},bi.${TRAEFIK_DOMAIN:-efn.local},ops.${TRAEFIK_DOMAIN:-efn.local},status.${TRAEFIK_DOMAIN:-efn.local},insight.${TRAEFIK_DOMAIN:-efn.local},wa-admin.${TRAEFIK_DOMAIN:-efn.local}

volumes:
  wa-unofficial-state:

networks:
  rmq:            # hanya rabbitmq <-> wa-unofficial (dicek scripts/check-encryption.sh)
    internal: true
    ipam:
      config: [{ subnet: 172.30.13.0/24 }]
  wa-egress:      # hanya wa-unofficial <-> wa-egress-proxy
    internal: true
    ipam:
      config: [{ subnet: 172.30.14.0/24 }]
  wa-internet:    # hanya wa-egress-proxy -> internet (pola egress-esb SEC-183)
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config: [{ subnet: 172.30.15.0/24 }]
  wa-admin:       # hanya wa-admin-relay <-> wa-unofficial :8443 (SEC-G50-06)
    internal: true
    ipam:
      config: [{ subnet: 172.30.16.0/24 }]
  wa-ingress:     # traefik + prometheus -> wa-admin-relay (relay listen hanya di 172.30.21.10)
    internal: true
    ipam:
      config: [{ subnet: 172.30.21.0/24 }]

secrets:
  rabbitmq_password_wa_unofficial: { file: ../../secrets/rabbitmq_password_wa_unofficial.txt }
  wa_unofficial_session_key: { file: ../../secrets/wa_unofficial_session_key.txt }
  wa_unofficial_hash_key: { file: ../../secrets/wa_unofficial_hash_key.txt }
  wa_unofficial_admin_token: { file: ../../secrets/wa_unofficial_admin_token.txt }
  wa_unofficial_metrics_token: { file: ../../secrets/wa_unofficial_metrics_token.txt }
  tls_wa_unofficial_crt: { file: ../../secrets/tls_wa_unofficial_crt.txt }
  tls_wa_unofficial_key: { file: ../../secrets/tls_wa_unofficial_key.txt }

# Override kanal online FNB-BACHA (Bacha kafe, PT F&B; docs/04 §11.3, G19 W-21). Pola docker-compose.online-fnb.yml:
# API key Odoo kanal ini (`odoo_api_key_online_fnb_bacha`, user teknis efn_online_fnb_bacha) HANYA di-mount ke BFF saat
# ONLINE_CHANNELS memuat FNB-BACHA (scripts/deploy.sh). Selama kanal mati file ini TIDAK disertakan.
# Pembuatan & rotasi key: docs/runbooks/odoo-online-api-key.md (efn-rotate-online-key).
# CI (job infra) menyertakan file ini saat membandingkan secrets compose dengan scripts/secrets.list.
services:
  api-gateway:
    environment:
      ODOO_API_KEY_ONLINE_FNB_BACHA_FILE: /run/secrets/odoo_api_key_online_fnb_bacha
    secrets:
      - odoo_api_key_online_fnb_bacha

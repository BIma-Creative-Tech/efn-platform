services:
  # ───────────────────────── EDGE ─────────────────────────
  # Traefik/Promtail/cAdvisor tidak me-mount docker.sock; discovery lewat proxy read-only (GET containers/events).
  # Proxy hanya listen 127.0.0.1:2375; akses dari network lewat sidecar ghostunnel mTLS :2376 (CN yang diizinkan:
  # traefik, promtail, cadvisor).
  docker-socket-proxy:
    <<: *common
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    profiles: ["core"]
    environment:
      BIND_CONFIG: "127.0.0.1:2375"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-proxy]
    cap_drop: [ALL]
    # haproxy menulis file runtime saat start -> tidak read_only
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: docker-socket-proxy

  docker-socket-proxy-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:docker-socket-proxy"
    depends_on: [docker-socket-proxy]
    command:
      - server
      - --listen=0.0.0.0:2376
      - --target=127.0.0.1:2375
      - --cert=/run/secrets/tls_docker_socket_proxy_crt
      - --key=/run/secrets/tls_docker_socket_proxy_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=promtail
      - --allow-cn=cadvisor
      - --status=http://127.0.0.1:6060
      - --quiet=conns
    secrets: [efn_ca_crt, tls_docker_socket_proxy_crt, tls_docker_socket_proxy_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6060/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: docker-socket-proxy-tls

  traefik:
    <<: *common
    # >= v3.6.1 wajib: Docker Engine 29 menolak API < 1.44 (Traefik v3.2 gagal "Error response from daemon", gel. 7)
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    profiles: ["core"]
    depends_on:
      docker-socket-proxy-tls:
        condition: service_healthy
      acme-dns-init:   # titik mount base/ dev/ (milik root, sticky) di volume traefik-dynamic (SEC-37/SEC-53)
        condition: service_completed_successfully
    command:
      - --configFile=/etc/traefik/traefik.yml
    # Publik (websecure, lewat Cloudflare) di IP publik host; `wg-https` (ADR-023, host internal erp./bi./ops./status.)
    # HANYA di IP WireGuard host. Prod: EFN_PUBLIC_BIND=<IP publik>, EFN_WG_BIND=10.88.0.1, EFN_WG_HTTPS_PORT=443
    # (ditulis deploy.sh). Dev: wg-https di 127.0.0.1:9443 (https://erp.efn.local:9443).
    ports:
      - "${EFN_PUBLIC_BIND:-0.0.0.0}:80:80"
      - "${EFN_PUBLIC_BIND:-0.0.0.0}:443:443"
      - "${EFN_WG_BIND:-127.0.0.1}:${EFN_WG_HTTPS_PORT:-9443}:8443"
    environment:
      - TRAEFIK_DOMAIN=${TRAEFIK_DOMAIN:-efn.local}
      # Allowlist WireGuard (dynamic/middlewares.yml, SEC-21): outlet vs staf back-office/IT (ADR-023 butir 3)
      - EFN_WG_OUTLET_CIDR=${EFN_WG_OUTLET_CIDR:-10.88.0.0/16}
      - EFN_WG_STAFF_CIDR=${EFN_WG_STAFF_CIDR:-10.89.0.0/16}
      # Tambahan allowlist (dev: bridge Docker Desktop). Prod: tidak diset (127.0.0.1/32).
      - EFN_INTERNAL_EXTRA_CIDR=${EFN_INTERNAL_EXTRA_CIDR:-127.0.0.1/32}
    # SEC-37: Traefik (internet-facing) TIDAK memegang token DNS. Sertifikat host wg-https (erp./bi./ops./status.)
    # diterbitkan service `acme-dns` dan dipasang `acme-publish` ke volume traefik-dynamic (read-only di sini).
    secrets: [efn_ca_crt, tls_traefik_crt, tls_traefik_key]
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # SEC-37/SEC-53: volume traefik-dynamic = direktori provider file itu sendiri (read-only). Watch Traefik
      # (fsnotify) TIDAK rekursif -> acme-dns.yml harus di puncak agar sertifikat baru dimuat tanpa restart (diuji
      # scripts/test-acme-dns.sh). Konfigurasi statis di subdirektori (dibaca rekursif saat start/reload):
      # base/ (di bawah) dan dev/ (override dev); titik mount dibuat acme-dns-init (milik root, sticky).
      # Penulis volume ini HANYA acme-publish (network none, template tetap), bukan acme-dns yang ber-network.
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - ../traefik/dynamic:/etc/traefik/dynamic/base:ro
      - traefik-acme:/acme
    networks: [edge, internal, socket-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { memory: 256M }
    labels:
      service: traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SEC-35: metrik Traefik (entrypoint `metrics` di 127.0.0.1:8084) hanya lewat sidecar ini, mTLS CN prometheus.
  # Ikut namespace Traefik -> di-recreate bersama traefik.
  traefik-metrics-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:traefik"
    depends_on: [traefik]
    command:
      - server
      - --listen=0.0.0.0:8082
      - --target=127.0.0.1:8084
      - --cert=/run/secrets/tls_traefik_crt
      - --key=/run/secrets/tls_traefik_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6070
      - --quiet=conns
    secrets: [efn_ca_crt, tls_traefik_crt, tls_traefik_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6070/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: traefik-metrics-tls

  # SEC-37 (ADR-023): ACME DNS-01 untuk host wg-https, terpisah dari Traefik. lego resmi (image ber-digest) + skrip
  # infra/acme/acme-dns.sh: TANPA port, hanya network egress (CA + API DNS), satu-satunya pemegang token DNS.
  # SEC-53: acme-dns hanya menulis PEM ke volume acme-dns-out; `acme-publish` (network none) memvalidasi PEM dan
  # menulis crt/key berversi + acme-dns.yml (template tetap) ke volume traefik-dynamic -> Traefik hot-reload.
  # Dev/CI: token `disabled` -> idle (tanpa request ACME). Uji: scripts/test-acme-dns.sh (Pebble).
  # Runbook: docs/runbooks/acme-dns-token.md. Volume acme-dns-data (kunci akun ACME) hanya di sini.
  acme-dns-init:
    <<: *common
    image: goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd
    profiles: ["core"]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-dns-init.sh"]
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-data:/data
      - acme-dns-out:/out
      - traefik-dynamic:/dyn
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    deploy:
      resources:
        limits: { memory: 32M }
    labels:
      service: acme-dns-init

  acme-dns:
    <<: *common
    image: goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd
    profiles: ["core"]
    depends_on:
      acme-dns-init:
        condition: service_completed_successfully
    user: "65532:0"
    init: true
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-dns.sh"]
    environment:
      - ACME_DOMAINS=erp.${TRAEFIK_DOMAIN:-efn.local},bi.${TRAEFIK_DOMAIN:-efn.local},ops.${TRAEFIK_DOMAIN:-efn.local},status.${TRAEFIK_DOMAIN:-efn.local}
      - ACME_EMAIL=${ACME_EMAIL:-ops@example.com}
      - ACME_DNS_PROVIDER=${ACME_DNS_PROVIDER:-cloudflare}
      # Staging ACME: https://acme-staging-v02.api.letsencrypt.org/directory (uji sebelum produksi, runbook §3)
      - ACME_SERVER=${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - ACME_OUT=/out
      - LEGO_LOG_LEVEL=info
      # lego membaca <VAR>_FILE (diuji scripts/test-acme-dns.sh): token tidak pernah di env/argv
      - ${ACME_DNS_TOKEN_ENV:-CF_DNS_API_TOKEN}_FILE=/run/secrets/acme_dns_api_token
    secrets: [acme_dns_api_token]
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-data:/data
      - acme-dns-out:/out
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    labels:
      service: acme-dns
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.disabled || [ -n \"$$(find /data/.last-ok -mmin -1500 2>/dev/null)\" ]"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10m

  # SEC-53: satu-satunya penulis direktori provider file Traefik. Tanpa network (tidak memproses input jaringan),
  # read-only, cap_drop ALL, uid terpisah (65533, grup 0 = baca PEM acme-dns + dibaca Traefik). Memvalidasi PEM murni
  # lalu menulis acme-dns.yml dari template tetap (infra/acme/acme-publish.sh). Mode nonaktif acme-dns: tidak ada PEM
  # -> idle sehat.
  acme-publish:
    <<: *common
    image: goacme/lego:v5.5.2@sha256:1944e8c36055beec47c7de6f15202b41128be75eea0ffa257f0c14d93c5155fd
    profiles: ["core"]
    depends_on:
      acme-dns-init:
        condition: service_completed_successfully
    user: "65533:0"
    init: true
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-publish.sh"]
    environment:
      - ACME_IN=/in
      - ACME_DYN=/dyn
      - ACME_TRAEFIK_DIR=/etc/traefik/dynamic
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-out:/in:ro
      - traefik-dynamic:/dyn
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 32M }
    labels:
      service: acme-publish
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$(find /tmp/.acme-publish-alive -mmin -5 2>/dev/null)\" ]"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m

  # ───────────────────────── DATA LAYER ─────────────────────────
  # Image custom = postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4 + WAL-G (infra/backup/postgres). WAL di-archive ke MinIO (HTTPS, CA internal)
  # bucket pg-backup setiap segmen penuh atau paling lambat archive_timeout=900 s -> RPO 15 menit (R-T08).
  # TLS: ssl=on, TLSv1.2+, hba_file = infra/postgres/pg_hba.conf (hostssl saja, superuser hanya socket lokal).
  # PostgreSQL menolak kunci privat yang bisa dibaca group/other -> entrypoint menyalin kunci (0600) ke
  # /var/run/postgresql/efn-tls sebelum memanggil entrypoint resmi.
  # Non-root (USER postgres di image) -> cap_drop ALL aman. Tidak read_only: socket/lock di /var/run/postgresql.
  postgres:
    <<: *common
    image: ${IMAGE_POSTGRES:-ghcr.io/efn/postgres:dev}
    build:
      context: ../backup/postgres
    profiles: ["core"]
    entrypoint:
      - /bin/bash
      - -c
      - >-
        install -d -m 0700 /var/run/postgresql/efn-tls &&
        install -m 0600 /run/secrets/tls_postgres_key /var/run/postgresql/efn-tls/server.key &&
        exec docker-entrypoint.sh "$$@"
      - efn-pg-entrypoint
    environment:
      # Superuser hanya untuk entrypoint/backup via socket lokal (pg_hba menolak superuser lewat TCP)
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: ${PG_DB:-efn_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
      # WAL-G (dibaca oleh /usr/local/bin/efn-walg; secret dibaca dari file per pemanggilan)
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://pg-backup/efn}
      # Lewat filter L7 s3-gateway (ADR-030), bukan langsung ke storage
      WALG_S3_ENDPOINT: https://s3-gateway:9000
      WALG_S3_CA_CERT_FILE: /run/secrets/efn_ca_crt
      MINIO_BACKUP_ACCESS_KEY_FILE: /run/secrets/minio_backup_access_key
      MINIO_BACKUP_PASSWORD_FILE: /run/secrets/minio_backup_password
      WALG_LIBSODIUM_KEY_FILE: /run/secrets/walg_libsodium_key
    secrets:
      - pg_password
      - minio_backup_access_key
      - minio_backup_password
      - walg_libsodium_key
      - efn_ca_crt
      - tls_postgres_crt
      - tls_postgres_key
      # dibaca infra/postgres/init/00-roles.sh (role per service)
      - pg_password_odoo
      - pg_password_bff
      - pg_password_ocr
      - pg_password_etl
      - pg_password_metabase
      - pg_password_exporter
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [data]
    shm_size: 256m
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2G }
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-on}
      - -c
      - archive_command=/usr/local/bin/efn-walg wal-push %p
      - -c
      - archive_timeout=900
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      # SEC-18: parameter bind (bisa berisi nomor HP) tidak pernah dicetak ke log
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      # TLS (docs/04 §7.1)
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/tls_postgres_crt
      - -c
      - ssl_key_file=/var/run/postgresql/efn-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      service: postgres

  # Redis: TLS saja (6379 = tls-port, port plaintext 0), ACL dari secret (user default off), noeviction (SEC-05).
  # Network `cache` khusus: hanya api-gateway, redis-exporter, blackbox.
  redis:
    <<: *common
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    profiles: ["core"]
    entrypoint: ["/bin/sh", "/efn/redis-entrypoint.sh"]
    environment:
      REDIS_MAXMEMORY: 512mb
    secrets: [efn_ca_crt, tls_redis_crt, tls_redis_key, redis_password_bff, redis_password_exporter]
    volumes:
      - redis-data:/data
      - ../redis/redis-entrypoint.sh:/efn/redis-entrypoint.sh:ro
    networks: [cache]
    read_only: true
    tmpfs: [/tmp]
    # wrapper: chown file ACL (CHOWN) lalu setpriv ke user redis (SETUID/SETGID); entrypoint resmi tidak dipakai
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: { memory: 768M }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password_exporter)" redis-cli --tls
          --cacert /run/secrets/efn_ca_crt -h localhost -p 6379 --user efn-exporter --no-auth-warning ping
          | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      service: redis

  # RabbitMQ: amqps 5671 saja, management https 15671, metrik https 15691 (infra/rabbitmq/rabbitmq.conf).
  # User per service + permission regex dari definitions yang dibangkitkan entrypoint (SEC-02, SEC-08).
  # Distribusi Erlang (25672) & epmd hanya di loopback; nodename tetap (rabbit@localhost) agar data stabil.
  # Tidak read_only: entrypoint resmi menulis cookie/konfigurasi di /var/lib/rabbitmq.
  rabbitmq:
    <<: *common
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    profiles: ["core"]
    hostname: rabbitmq
    entrypoint: ["/bin/sh", "/efn/rabbitmq-entrypoint.sh"]
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-efn-admin}
      RABBITMQ_NODENAME: rabbit@localhost
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-kernel inet_dist_use_interface {127,0,0,1}"
      # SEC-25 (G6): default strict - configure dicabut, read hanya queue yang dikonsumsi. Semua klien memakai
      # passive declare (BFF checkQueue, worker queue_declare(passive=True), ETL tanpa declare). Fallback: false.
      RABBITMQ_STRICT_PERMISSIONS: ${RABBITMQ_STRICT_PERMISSIONS:-true}
    secrets:
      - rabbitmq_password
      - rabbitmq_password_bff
      - rabbitmq_password_ocr
      - rabbitmq_password_etl
      - efn_ca_crt
      - tls_rabbitmq_crt
      - tls_rabbitmq_key
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-defaults.conf:ro
      - ../rabbitmq/rabbitmq-entrypoint.sh:/efn/rabbitmq-entrypoint.sh:ro
    tmpfs: [/tmp]
    networks: [data, internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      service: rabbitmq

  # SEC-35: metrik RabbitMQ (plugin di 127.0.0.1:15692) hanya lewat sidecar ini, mTLS CN prometheus saja.
  rabbitmq-metrics-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:rabbitmq"
    depends_on: [rabbitmq]
    command:
      - server
      - --listen=0.0.0.0:15691
      - --target=127.0.0.1:15692
      - --cert=/run/secrets/tls_rabbitmq_crt
      - --key=/run/secrets/tls_rabbitmq_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6069
      - --quiet=conns
    secrets: [efn_ca_crt, tls_rabbitmq_crt, tls_rabbitmq_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6069/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: rabbitmq-metrics-tls

  # Object storage S3 = SILO (fork komunitas MinIO, ADR-030), nama service tetap `minio`. HTTPS saja (sertifikat
  # disalin ke /tmp/certs karena butuh nama file public.crt/private.key), SSE-S3 dengan kunci KMS statis dari secret
  # minio_kms_key (docs/04 §7.2).
  # HANYA di network `objstore`: klien (BFF, worker, WAL-G, Prometheus) wajib lewat filter L7 `s3-gateway`
  # (ADR-030 Keputusan 2); minio-init (admin API) satu-satunya klien langsung.
  # Tidak read_only: server menulis ~/.minio saat start.
  minio:
    <<: *common
    # Dibangun dari source tag SILO (infra/minio/Dockerfile): image minio/minio & minio/mc sudah hilang dari Docker Hub
    # dan upstream diarsipkan.
    image: ${IMAGE_MINIO:-ghcr.io/efn/minio:dev}
    build:
      context: ../minio
    profiles: ["core"]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/certs/CAs &&
        cp /run/secrets/tls_minio_crt /tmp/certs/public.crt &&
        cp /run/secrets/tls_minio_key /tmp/certs/private.key &&
        cp /run/secrets/efn_ca_crt /tmp/certs/CAs/efn-ca.crt &&
        exec minio server /data --console-address :9001 --certs-dir /tmp/certs
    environment:
      # Root user = access key acak dari secret (SEC-48, docs/04 §8.12), bukan nama tetap `efnadmin`
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
      # Metrik hanya dengan bearer JWT user metrik (access key acak; minio-init + derive-secrets.sh), SEC-20/SEC-30
      MINIO_PROMETHEUS_AUTH_TYPE: jwt
      # Healthcheck `mc ready` memverifikasi TLS dengan CA internal (Go membaca SSL_CERT_FILE)
      SSL_CERT_FILE: /run/secrets/efn_ca_crt
    secrets: [minio_root_user, minio_root_password, minio_kms_key, efn_ca_crt, tls_minio_crt, tls_minio_key]
    volumes:
      - minio-data:/data
    networks: [objstore]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_health=https://localhost:9000 mc ready health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      service: minio

  # Filter L7 (HAProxy LTS) di depan object storage - ADR-030 Keputusan 2, aturan di infra/s3-gateway/haproxy.cfg.
  # TLS masuk dengan sertifikat `s3-gateway` (CA internal); TLS keluar ke minio:9000 diverifikasi (CA internal,
  # verifyhost minio). Satu-satunya jalur klien aplikasi ke storage. Non-root (uid haproxy image), read_only,
  # tanpa capability (port 9000 > 1024). PEM gabungan crt+key hanya di tmpfs /tmp.
  s3-gateway:
    <<: *common
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/efn/entrypoint.sh"]
    secrets: [efn_ca_crt, tls_s3_gateway_crt, tls_s3_gateway_key]
    volumes:
      - ../s3-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../s3-gateway/entrypoint.sh:/efn/entrypoint.sh:ro
    networks: [internal, data, objstore]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8405/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: s3-gateway

  # One-shot: bucket (SSE-S3, versioning, object lock), user per service + kebijakan minimum (docs/04 §7.2-§7.3).
  # Idempoten; dijalankan ulang setiap `up`. Juga dipakai untuk rotasi password user MinIO.
  minio-init:
    <<: *common
    image: ${IMAGE_MINIO:-ghcr.io/efn/minio:dev}   # image yang sama dengan minio (berisi mc)
    build:
      context: ../minio
    profiles: ["core"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      # Admin langsung ke storage di network objstore (bukan lewat s3-gateway yang menolak /minio/admin/*)
      MINIO_URL: https://minio:9000
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      MINIO_BUCKET_PG_BACKUP: pg-backup
      # G17: gambar katalog online (docs/04 §10.10; retensi dikelola job BFF, bukan lifecycle)
      MINIO_BUCKET_CATALOG: catalog
      # Retensi foto Market Scout (docs/04 §8.4: default 90 hari, menunggu DPO)
      MINIO_MARKET_SCOUT_EXPIRE_DAYS: ${MARKET_SCOUT_PHOTO_RETENTION_DAYS:-90}
      MC_CONFIG_DIR: /tmp/.mc
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_backup_password
      - minio_bff_secret
      - minio_ocr_secret
      - minio_prometheus_secret
      - minio_backup_access_key
      - minio_bff_access_key
      - minio_ocr_access_key
      - minio_prometheus_access_key
      - efn_ca_crt
    volumes:
      - ../minio/minio-init.sh:/init/minio-init.sh:ro
    networks: [objstore]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      service: minio-init

  # ───────────────────────── ERP ─────────────────────────
  # Odoo listen 127.0.0.1:8069 (HTTP) dan :8072 (websocket); TLS oleh sidecar odoo-tls (:8443) dan
  # odoo-ws-tls (:8444). Ke PostgreSQL: user efn_odoo, sslmode verify-full (render_odoo_conf.py).
  # SEC-01: semua router Odoo internal-only (WireGuard), login di-rate-limit ketat, /xmlrpc & /jsonrpc diblok.
  # Tidak read_only: entrypoint merender /etc/odoo/odoo.conf saat start. User odoo (non-root).
  odoo:
    <<: *common
    image: ${IMAGE_ODOO:-ghcr.io/efn/odoo:dev}
    build:
      context: ../../services/odoo
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: postgres
      PORT: "5432"
      USER: efn_odoo
      PASSWORD_FILE: /run/secrets/pg_password_odoo
      ODOO_ADMIN_PASSWORD_FILE: /run/secrets/odoo_admin_password
      ODOO_HTTP_INTERFACE: 127.0.0.1
      PGSSLROOTCERT: /run/secrets/efn_ca_crt
      EFN_CA_FILE: /run/secrets/efn_ca_crt
      EFN_BFF_URL: https://api-gateway:3000
      EFN_BFF_API_KEY_FILE: /run/secrets/odoo_bff_api_key
      # docs/04 §8.4: pepper member_hash (HKDF dari otp_pepper, scripts/derive-secrets.sh) untuk efn_member_hash
      EFN_MEMBER_HASH_PEPPER_FILE: /run/secrets/member_hash_pepper
      # SEC-51 (G13): HMAC per baris sink audit (efn_audit >= 19.0.1.3.0); tanpa secret -> "mac": null + alert
      EFN_AUDIT_SINK_KEY_FILE: /run/secrets/efn_audit_sink_key
      # G17 (docs/04 §10.5, L-2): HMAC event pesanan online Odoo -> BFF (X-EFN-Signature)
      EFN_ONLINE_EVENT_HMAC_FILE: /run/secrets/odoo_online_event_hmac
    secrets:
      [pg_password_odoo, odoo_admin_password, odoo_bff_api_key, member_hash_pepper, efn_audit_sink_key, odoo_online_event_hmac, efn_ca_crt]
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [internal, data]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 3G }
    labels:
      service: odoo
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      # ADR-023: HANYA entrypoint wg-https (IP WireGuard) + allowlist outlet/staf (SEC-01, SEC-21). Sertifikat publik
      # ACME DNS-01 (browser POS tidak perlu CA internal). Tidak ada router erp. di websecure (publik).
      traefik.http.routers.odoo.rule: Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.odoo.entrypoints: wg-https
      traefik.http.routers.odoo.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo.middlewares: internal-only@file,secure-headers@file,odoo-block-dbmanager@file,ratelimit-odoo@file
      traefik.http.routers.odoo.service: odoo
      traefik.http.services.odoo.loadbalancer.server.port: "8443"
      traefik.http.services.odoo.loadbalancer.server.scheme: https
      traefik.http.services.odoo.loadbalancer.serversTransport: efn-odoo@file
      # Login: rate limit ketat per peer WireGuard
      traefik.http.routers.odoo-login.rule: >-
        Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
        && (Path(`/web/login`) || PathPrefix(`/web/session/authenticate`) || PathPrefix(`/web/login/totp`))
      traefik.http.routers.odoo-login.priority: "200"
      traefik.http.routers.odoo-login.entrypoints: wg-https
      traefik.http.routers.odoo-login.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-login.middlewares: internal-only@file,secure-headers@file,ratelimit-odoo-login@file
      traefik.http.routers.odoo-login.service: odoo
      # XML-RPC / JSON-RPC / JSON-2 API Odoo 19 (SEC-22) diblok total (403). Integrasi server-to-server tidak
      # lewat Traefik; sidecar odoo-tls hanya menerima klien mTLS CN traefik (+ probe blackbox).
      traefik.http.routers.odoo-rpc-block.rule: >-
        Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
        && (PathPrefix(`/xmlrpc`) || PathPrefix(`/jsonrpc`) || PathPrefix(`/json/2`))
      traefik.http.routers.odoo-rpc-block.priority: "300"
      traefik.http.routers.odoo-rpc-block.entrypoints: wg-https
      traefik.http.routers.odoo-rpc-block.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-rpc-block.middlewares: deny-all@file
      traefik.http.routers.odoo-rpc-block.service: odoo
      # Websocket (POS, bus)
      traefik.http.routers.odoo-ws.rule: Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`) && PathPrefix(`/websocket`)
      traefik.http.routers.odoo-ws.priority: "250"
      traefik.http.routers.odoo-ws.entrypoints: wg-https
      traefik.http.routers.odoo-ws.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-ws.middlewares: internal-only@file,secure-headers@file,ratelimit-odoo@file
      traefik.http.routers.odoo-ws.service: odoo-ws
      traefik.http.services.odoo-ws.loadbalancer.server.port: "8444"
      traefik.http.services.odoo-ws.loadbalancer.server.scheme: https
      traefik.http.services.odoo-ws.loadbalancer.serversTransport: efn-odoo@file
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health || exit 1"]   # loopback namespace sendiri
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  odoo-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:odoo"
    depends_on: [odoo]
    command:
      - server
      - --listen=0.0.0.0:8443
      - --target=127.0.0.1:8069
      - --cert=/run/secrets/tls_odoo_crt
      - --key=/run/secrets/tls_odoo_key
      # mTLS (docs/04 §8.5, SEC-20/SEC-22): hanya Traefik (+ probe kesehatan blackbox yang hanya bisa dipicu
      # Prometheus lewat mTLS) + filter L7 odoo-rpc-gateway (G17, docs/04 §10.4.1: BFF -> /json/2, 10 path saja).
      # Container lain di network internal/data (termasuk BFF langsung) tidak bisa mencapai Odoo.
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --allow-cn=odoo-rpc-gateway
      - --status=http://127.0.0.1:6061
      - --quiet=conns
    secrets: [efn_ca_crt, tls_odoo_crt, tls_odoo_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6061/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-tls

  odoo-ws-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:odoo"
    depends_on: [odoo]
    command:
      - server
      - --listen=0.0.0.0:8444
      - --target=127.0.0.1:8072
      - --cert=/run/secrets/tls_odoo_crt
      - --key=/run/secrets/tls_odoo_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6062
      - --quiet=conns
    secrets: [efn_ca_crt, tls_odoo_crt, tls_odoo_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6062/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-ws-tls

  # Filter L7 BFF -> Odoo /json/2 (G17, docs/04 §10.4.1, ADR-034 Proposed; pola s3-gateway). Aturan di
  # infra/odoo-rpc-gateway/haproxy.cfg: mTLS masuk hanya CN api-gateway, POST ke 10 path persis, header allowlist,
  # X-Odoo-Database dipaksa; keluar mTLS verify-full ke odoo-tls (CN odoo-rpc-gateway). Tanpa label Traefik, tanpa
  # port host. Non-root (uid image haproxy), read_only, tanpa capability; PEM crt+key hanya di tmpfs /tmp.
  odoo-rpc-gateway:
    <<: *common
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    profiles: ["core"]
    depends_on:
      odoo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/efn/entrypoint.sh"]
    environment:
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      # SEC-96 / L-16b: koneksi paralel maks. ke Odoo = worker HTTP Odoo yang disisihkan untuk online (1..16).
      # Kelebihan mengantre 2 s lalu 503. Sizing worker: docs/runbooks/online-orders.md#sizing-worker
      ODOO_RPC_MAXCONN: ${ODOO_RPC_MAXCONN:-4}
    secrets: [efn_ca_crt, tls_odoo_rpc_gateway_crt, tls_odoo_rpc_gateway_key]
    volumes:
      - ../odoo-rpc-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../odoo-rpc-gateway/entrypoint.sh:/efn/entrypoint.sh:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8406/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-rpc-gateway

  # ───────────────────────── BFF / API ─────────────────────────
  # HTTPS native di :3000 (TLS_CERT_FILE/TLS_KEY_FILE). Network `egress` untuk WhatsApp Cloud API & payment.
  api-gateway:
    <<: *common
    image: ${IMAGE_API_GATEWAY:-ghcr.io/efn/api-gateway:dev}
    build:
      context: ../../services/api-gateway
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      s3-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-production}
      # G13c: ConsoleLogger NestJS tanpa kode warna ANSI -> baris log berjangkar (`[Nest] <pid>  - <waktu>  WARN [Ctx] ...`)
      # untuk regex promtail EFN_LOYALTY_ANOMALY / EFN_LOYALTY_RECON (infra/observability/promtail.yml).
      NO_COLOR: "1"
      PORT: "3000"
      TLS_CERT_FILE: /run/secrets/tls_api_gateway_crt
      TLS_KEY_FILE: /run/secrets/tls_api_gateway_key
      EFN_CA_FILE: /run/secrets/efn_ca_crt
      # SEC-23: TIDAK ada NODE_EXTRA_CA_CERTS di BFF - CA internal hanya dipercaya oleh klien internal eksplisit
      # (pg/redis/amqp/minio), bukan untuk egress publik (WhatsApp, payment gateway).
      HEALTHCHECK_CA_FILE: /run/secrets/efn_ca_crt
      HEALTHCHECK_SERVERNAME: api-gateway
      # SEC-03: subnet Docker internal (Traefik, Next.js) + rentang Cloudflare (scripts/deploy.sh dari
      # infra/traefik/cloudflare-ips.txt). Dev: hanya subnet internal.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.1.0/24}
      # PostgreSQL (docs/04 §7.1/§7.3)
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-efn_platform}
      PG_USER: efn_bff
      PG_PASSWORD_FILE: /run/secrets/pg_password_bff
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      # Redis (TLS + ACL)
      REDIS_URL: rediss://redis:6379
      REDIS_USERNAME: efn-bff
      REDIS_PASSWORD_FILE: /run/secrets/redis_password_bff
      REDIS_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # RabbitMQ (amqps, URL tanpa password)
      AMQP_URL: amqps://efn-bff@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_bff
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # Auth & OTP (docs/04 §2, §3.1)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      OTP_PEPPER_FILE: /run/secrets/otp_pepper
      DISCOUNT_TOKEN_SECRET_FILE: /run/secrets/discount_token_secret
      ODOO_BFF_API_KEY_FILE: /run/secrets/odoo_bff_api_key
      WEBHOOK_PAYMENT_SECRET_FILE: /run/secrets/webhook_payment_secret
      OTP_TTL_SECONDS: "180"
      OTP_MAX_ATTEMPTS: "3"
      # SEC-54 (G13): CGNAT seluler = banyak pelanggan per IPv4. Kontrol utama = batas per member (3/15 menit, 10/jam)
      # + budget global; batas per IP sumber dinaikkan 20 -> 60/15 menit agar satu penyerang di IP bersama butuh 3x
      # lebih banyak PoW untuk mengunci IP itu. Level ALTCHA berbasis rasio kegagalan = backlog BFF (laporan G13).
      OTP_RL_SOURCE_LIMIT: ${OTP_RL_SOURCE_LIMIT:-60}
      # PII at rest (docs/04 §7.2): AES-256-GCM, key ring versi 1 (rotasi: docs/runbooks/pii-key-rotation.md)
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      # Rotasi (U2): kunci v2+ via override yang me-mount pii_encryption_key_v<N> + PII_ENCRYPTION_KEY_V<N>_FILE,
      # lalu naikkan versi aktif, jalankan `node dist/cli/pii-reencrypt.js`, baru pensiunkan (PII_RETIRED_VERSIONS).
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-1}
      PII_RETIRED_VERSIONS: ${PII_RETIRED_VERSIONS:-}
      # Captcha OTP ALTCHA (docs/04 §8.1)
      ALTCHA_HMAC_KEY_FILE: /run/secrets/altcha_hmac_key
      # K-7 (G13): endpoint migrasi /internal/v1/migration/* (server-to-server, TIDAK dirutekan Traefik publik).
      # Default false -> 404. Production: aktif sementara hanya lewat config manifest bertanda tangan (SEC-50).
      MIGRATION_ENABLED: ${MIGRATION_ENABLED:-false}
      MIGRATION_API_KEY_FILE: /run/secrets/migration_api_key
      # /metrics di listener mTLS terpisah (docs/04 §8.10/§8.11): https://api-gateway:9464/metrics, klien CN prometheus.
      # Port tidak dipublish; Prometheus menjangkau lewat network `internal`.
      METRICS_PORT: "9464"
      METRICS_TLS_CLIENT_ALLOWED_CN: prometheus
      METRICS_CLIENT_CA_FILE: /run/secrets/efn_ca_crt
      # Consent (docs/04 §8.9): versi + sha256 teks AKTIF. Kosong -> grant 503 consent_unavailable. Dev: compose dev.
      CONSENT_LOCATION_VERSION: ${CONSENT_LOCATION_VERSION:-}
      CONSENT_LOCATION_TEXT_SHA256: ${CONSENT_LOCATION_TEXT_SHA256:-}
      CONSENT_MARKETING_VERSION: ${CONSENT_MARKETING_VERSION:-}
      CONSENT_MARKETING_TEXT_SHA256: ${CONSENT_MARKETING_TEXT_SHA256:-}
      # DSAR & retensi (docs/04 §8.4; default usulan, menunggu DPO)
      DSAR_DELETE_GRACE_DAYS: ${DSAR_DELETE_GRACE_DAYS:-7}
      # W-18/W-19 (keputusan pemilik proyek 10 Okt 2026, PDP v7): batas tunda erasure karena pesanan online terbuka
      # (Q-P18, 1..14), daftar tolak migrasi subjek terhapus (Q-P12, 0..730), usia minimum member (Q-P3, 17..21),
      # koordinat Price Hunter di-NULL-kan setelah N hari (Q-P8). Validasi rentang: scripts/lib/deploy-validate.sh.
      DSAR_OPEN_ORDER_MAX_DEFER_DAYS: ${DSAR_OPEN_ORDER_MAX_DEFER_DAYS:-14}
      ERASURE_SUPPRESSION_DAYS: ${ERASURE_SUPPRESSION_DAYS:-365}
      MEMBER_MIN_AGE: ${MEMBER_MIN_AGE:-17}
      PRICE_HUNTER_GEO_RETENTION_DAYS: ${PRICE_HUNTER_GEO_RETENTION_DAYS:-90}
      OTP_AUDIT_RETENTION_DAYS: "90"
      PRICE_HUNTER_USER_ENC_RETENTION_DAYS: ${MARKET_SCOUT_PHOTO_RETENTION_DAYS:-90}
      PRICE_HUNTER_REPORT_RETENTION_DAYS: "730"
      # Payment gateway-agnostic (docs/04 §8.3). Base/dev/staging: mock. Produksi WAJIB eksplisit (prod override +
      # deploy.sh menolak mock). Kunci provider hanya di-mount bila != mock (docker-compose.payment.yml).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # WhatsApp Cloud API resmi (WHATSAPP_ENABLED=false -> sender console, token tidak dipakai)
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-efn_otp}
      WHATSAPP_TOKEN_FILE: /run/secrets/whatsapp_token
      # Object storage lewat filter L7 s3-gateway (ADR-030); user bff (bukan root), access key = secret acak (§8.12)
      MINIO_ENDPOINT: s3-gateway
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "true"
      MINIO_CA_FILE: /run/secrets/efn_ca_crt
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_bff_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_bff_secret
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      # ── G17 penjualan online (docs/04 §10.13; angka = PLACEHOLDER pilot §10.1, menunggu Q-ON*) ──
      # Kill switch: default false (production). Dev/staging menyalakan lewat .env (ONLINE_ENABLED=true).
      ONLINE_ENABLED: ${ONLINE_ENABLED:-false}
      ONLINE_CATALOG_ENABLED: ${ONLINE_CATALOG_ENABLED:-false}
      LOYALTY_EARN_EXCLUDE_POINT_PAYMENT: ${LOYALTY_EARN_EXCLUDE_POINT_PAYMENT:-true}
      # r11 (L-25f/l, SEC-118/124): toleransi nilai restore poin (% nilai redeem; 0..50 di deploy-validate) dan retensi
      # reservasi committed (nilai keuangan, >= 10 th, Q-P2) - rekonsiliasi K-18-6 tidak positif palsu setelah erasure.
      LOYALTY_RESTORE_TOLERANCE_PCT: ${LOYALTY_RESTORE_TOLERANCE_PCT:-10}
      LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS: ${LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS:-3650}
      ONLINE_CHANNELS: ${ONLINE_CHANNELS:-RTL}
      ONLINE_FULFILMENTS: ${ONLINE_FULFILMENTS:-pickup}
      ONLINE_PAYMENT_TIMEOUT_SECONDS: ${ONLINE_PAYMENT_TIMEOUT_SECONDS:-900}
      ONLINE_QUOTE_TTL_SECONDS: ${ONLINE_QUOTE_TTL_SECONDS:-600}
      ONLINE_MAX_OPEN_ORDERS_PER_MEMBER: ${ONLINE_MAX_OPEN_ORDERS_PER_MEMBER:-3}
      ONLINE_CATALOG_SYNC_SECONDS: ${ONLINE_CATALOG_SYNC_SECONDS:-300}
      ONLINE_PICKUP_CODE_MAX_DAYS: ${ONLINE_PICKUP_CODE_MAX_DAYS:-7}
      # Retensi (L-5; Q-P17 diputuskan 10 Okt 2026: tautan 730 h, event 180 h)
      ONLINE_ORDER_MEMBER_LINK_DAYS: ${ONLINE_ORDER_MEMBER_LINK_DAYS:-730}
      ONLINE_EVENT_RETENTION_DAYS: ${ONLINE_EVENT_RETENTION_DAYS:-180}
      # W-19 (Q-P19, diputuskan 10 Okt 2026): audit CLI CS 10 tahun
      ONLINE_ADMIN_AUDIT_RETENTION_DAYS: ${ONLINE_ADMIN_AUDIT_RETENTION_DAYS:-3650}
      # BFF -> Odoo /json/2 HANYA lewat filter odoo-rpc-gateway (mTLS: klien CN api-gateway = sertifikat BFF ber-EKU
      # server+client, gen-pki.sh profil `both`; verify-full CA internal, hostname odoo-rpc-gateway)
      ODOO_RPC_URL: https://odoo-rpc-gateway:8443
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      ODOO_RPC_TIMEOUT_MS: ${ODOO_RPC_TIMEOUT_MS:-8000}
      # SEC-96/SEC-109 (L-19f): pool konkurensi json2 BFF terpisah jalur publik (katalog/stok/quote) vs saga.
      # Aturan: PUBLIC + SAGA <= ODOO_RPC_MAXCONN gateway (deploy-validate). Base/dev: 2 + 2 = maxconn 4;
      # prod pilot (opsi B, 10 Okt 2026): 1 + 1 = maxconn 2 (docker-compose.prod.yml).
      ODOO_RPC_PUBLIC_MAX_CONCURRENCY: ${ODOO_RPC_PUBLIC_MAX_CONCURRENCY:-2}
      ODOO_RPC_SAGA_MAX_CONCURRENCY: ${ODOO_RPC_SAGA_MAX_CONCURRENCY:-2}
      ODOO_RPC_CA_FILE: /run/secrets/efn_ca_crt
      ODOO_RPC_CLIENT_CERT_FILE: /run/secrets/tls_api_gateway_crt
      ODOO_RPC_CLIENT_KEY_FILE: /run/secrets/tls_api_gateway_key
      # API key per kanal (satu key = satu user teknis = satu PT). FNB: tambah env + secret saat kanal diaktifkan.
      ODOO_API_KEY_ONLINE_RTL_FILE: /run/secrets/odoo_api_key_online_rtl
      ODOO_ONLINE_EVENT_HMAC_FILE: /run/secrets/odoo_online_event_hmac
      MINIO_CATALOG_BUCKET: catalog
    secrets:
      - efn_ca_crt
      - tls_api_gateway_crt
      - tls_api_gateway_key
      - pg_password_bff
      - redis_password_bff
      - rabbitmq_password_bff
      - minio_bff_access_key
      - minio_bff_secret
      - jwt_secret
      - otp_pepper
      - discount_token_secret
      - odoo_bff_api_key
      - whatsapp_token
      - webhook_payment_secret
      - pii_encryption_key
      - altcha_hmac_key
      - migration_api_key
      - odoo_api_key_online_rtl
      - odoo_online_event_hmac
    networks: [internal, data, cache, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: api-gateway
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      # Tidak lewat router publik (docs/04 §1-2, ADR-002):
      #   /metrics    -> tidak ada di :3000 lagi; Prometheus scrape https://api-gateway:9464 (mTLS, tidak lewat Traefik)
      #   /v1/pos/*   -> server-to-server Odoo (efn.bff_url = https://api-gateway:3000)
      #   /internal/* -> server-to-server
      #   /v1/webhooks/* -> hanya router api-webhook-payments di bawah (POST saja)
      traefik.http.routers.api.rule: >-
        Host(`api.${TRAEFIK_DOMAIN:-efn.local}`) && !PathPrefix(`/metrics`)
        && !PathPrefix(`/v1/pos`) && !PathPrefix(`/internal`) && !PathPrefix(`/v1/webhooks`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.routers.api.middlewares: secure-headers@file,ratelimit-api@file
      traefik.http.routers.api.service: api
      # Webhook payment provider (docs/04 §8.3): publik, POST saja, bucket rate limit terpisah. Verifikasi
      # signature/HMAC + replay window + idempotensi di BFF.
      traefik.http.routers.api-webhook-payments.rule: >-
        Host(`api.${TRAEFIK_DOMAIN:-efn.local}`) && Method(`POST`) && PathPrefix(`/v1/webhooks/payments/`)
      traefik.http.routers.api-webhook-payments.priority: "200"
      traefik.http.routers.api-webhook-payments.entrypoints: websecure
      traefik.http.routers.api-webhook-payments.tls.certresolver: letsencrypt
      traefik.http.routers.api-webhook-payments.middlewares: secure-headers@file,ratelimit-webhook@file
      traefik.http.routers.api-webhook-payments.service: api
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.server.scheme: https
      traefik.http.services.api.loadbalancer.serversTransport: efn-api-gateway@file
    healthcheck:
      # healthcheck.js image BFF: HTTPS loopback, verifikasi CA (HEALTHCHECK_CA_FILE) + servername api-gateway
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ───────────────────────── WEB ─────────────────────────
  # Satu app Next.js melayani beberapa host: app (super-app), mart (supermarket), kitchen (F&B).
  # Next.js standalone listen 127.0.0.1:3001; TLS oleh sidecar superapp-web-tls (:3443).
  superapp-web:
    <<: *common
    image: ${IMAGE_SUPERAPP_WEB:-ghcr.io/efn/superapp-web:dev}
    build:
      context: ../../services/superapp-web
    profiles: ["core"]
    depends_on: [api-gateway]
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      HOSTNAME: 127.0.0.1
      PORT: "3001"
      # Browser tidak memanggil BFF langsung; Next.js server-side meneruskan request lewat HTTPS terverifikasi.
      # CSP dikirim oleh Next.js sendiri; middleware Traefik secure-headers@file sengaja tidak menyetel CSP.
      BFF_INTERNAL_URL: https://api-gateway:3000
      NODE_EXTRA_CA_CERTS: /run/secrets/efn_ca_crt
      # G17: simulator pembayaran (tombol "simulasikan bayar", lib/orders-server.ts) - nilai TETAP false (bukan ${..}),
      # hanya docker-compose.dev.yml menyalakannya. check-encryption.sh menolak nilai lain di render prod.
      EFN_PAYMENT_SIMULATOR: "false"
    secrets: [efn_ca_crt]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: superapp-web
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      traefik.http.routers.web.rule: >-
        Host(`app.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`${TRAEFIK_DOMAIN:-efn.local}`)
        || Host(`mart.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`kitchen.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.routers.web.middlewares: secure-headers@file
      traefik.http.services.web.loadbalancer.server.port: "3443"
      traefik.http.services.web.loadbalancer.server.scheme: https
      traefik.http.services.web.loadbalancer.serversTransport: efn-superapp-web@file
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  superapp-web-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:superapp-web"
    depends_on: [superapp-web]
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3001
      - --cert=/run/secrets/tls_superapp_web_crt
      - --key=/run/secrets/tls_superapp_web_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6063
      - --quiet=conns
    secrets: [efn_ca_crt, tls_superapp_web_crt, tls_superapp_web_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6063/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: superapp-web-tls

  # ───────────────────────── ANALYTICS ─────────────────────────
  # ClickHouse: HTTPS 8443 + native TLS 9440 saja (config.d/tls.xml), disk terenkripsi (config.d/encrypted-storage.xml,
  # kunci clickhouse_disk_key). Skema/user/grant dipasang one-shot `clickhouse-init` lewat TLS (bukan initdb.d
  # bawaan yang memakai port native plaintext).
  # Tidak cap_drop/read_only: entrypoint ClickHouse butuh chown + IPC_LOCK/SYS_NICE dan menulis /etc/clickhouse-server.
  clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    profiles: ["data"]
    # image tidak mendukung *_FILE: baca secret di entrypoint wrapper
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export CLICKHOUSE_PASSWORD="$$(cat /run/secrets/clickhouse_password)"
        CLICKHOUSE_DISK_KEY_HEX="$$(cat /run/secrets/clickhouse_disk_key)";
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-efn}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [clickhouse_password, clickhouse_disk_key, efn_ca_crt, tls_clickhouse_crt, tls_clickhouse_key]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/config.d/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - ../clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config.d/encrypted-storage.xml:/etc/clickhouse-server/config.d/encrypted-storage.xml:ro
      - ../clickhouse/client-config.xml:/etc/clickhouse-client/config.xml:ro
    networks: [data]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    deploy:
      resources:
        limits: { memory: 4G }
    healthcheck:
      # Liveness loopback di namespace sendiri (bukan transaksi data); busybox wget tidak punya opsi CA.
      # Verifikasi TLS penuh dilakukan clickhouse-init dan probe-internal-tls Prometheus.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      service: clickhouse

  clickhouse-init:
    <<: *common
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    profiles: ["data"]
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "101:101"
    entrypoint: ["/bin/sh", "/efn/clickhouse-init.sh"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-efn}
      # TTL (W-19, keputusan 10 Okt 2026): baris mart 10 th; kolom pseudonim (user_hash/member_hash/customer_id) 5 th;
      # koordinat Price Hunter 90 h. Rentang: deploy-validate (mart 1..30, pseudonim 1..mart, geo 1..3650).
      CH_MART_RETENTION_YEARS: ${CH_MART_RETENTION_YEARS:-10}
      CH_PSEUDONYM_RETENTION_YEARS: ${CH_PSEUDONYM_RETENTION_YEARS:-5}
      CH_GEO_RETENTION_DAYS: ${CH_GEO_RETENTION_DAYS:-90}
    secrets:
      - clickhouse_password
      - clickhouse_password_etl
      - clickhouse_password_text2sql
      - clickhouse_password_metabase
      - efn_ca_crt
    volumes:
      - ../clickhouse/clickhouse-init.sh:/efn/clickhouse-init.sh:ro
      - ../clickhouse/init:/init/schema:ro
      - ../clickhouse/access:/init/access:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    labels:
      service: clickhouse-init

  # Metabase: Jetty listen 127.0.0.1:3000, TLS oleh sidecar metabase-tls (:3443). DB aplikasi: user efn_metabase
  # lewat JDBC sslmode=verify-full. Koneksi ke ClickHouse (HTTPS 8443, user efn_metabase, CA internal) dibuat oleh
  # metabase-provision lewat API dan disimpan TERENKRIPSI di DB `metabase` (G16b) -> service ini TIDAK me-mount
  # clickhouse_password_metabase (SEC-85, least privilege).
  # Capability (SEC-85, diuji di stack dev 9 Okt 2026): cap_drop ALL + minimum untuk run_metabase.sh resmi yang mulai
  # sebagai root: adduser/addgroup + chown /metabase.db & home (CHOWN), `su metabase` busybox (SETUID, SETGID).
  # no-new-privileges (x-common) kompatibel: su dijalankan oleh root (tanpa elevasi setuid). Log start memuat
  # "adduser: /home/metabase: Operation not permitted" (chmod g+s home tanpa FOWNER): diharapkan, home tidak dipakai;
  # hasil uji: healthy, "MB_ENCRYPTION_SECRET_KEY correctly configured", metabase-provision exit 0. Tidak read_only:
  # run_metabase.sh menulis /etc/passwd, /metabase.db dan Metabase menulis /plugins (sample DB) saat start.
  metabase:
    <<: *common
    # G13/G16: image sendiri = metabase v0.58.35 LTS (digest; driver ClickHouse bawaan) - infra/metabase/Dockerfile.
    # Staging/prod: by digest dari manifest rilis bertanda tangan (IMAGE_METABASE, SEC-42).
    image: ${IMAGE_METABASE:-ghcr.io/efn/metabase:dev}
    build:
      context: ../metabase
    profiles: ["data"]
    depends_on:
      postgres:
        condition: service_healthy
    # G16b: ENTRYPOINT image = efn-metabase-entrypoint (infra/metabase/efn-entrypoint.sh): membaca
    # metabase_encryption_key -> MB_ENCRYPTION_SECRET_KEY (enkripsi at rest detail koneksi di DB `metabase`;
    # FAIL-CLOSED bila secret tidak ada/pendek). JANGAN override `entrypoint:` di sini (dicek check-encryption.sh).
    # Password DB: MB_DB_PASS_FILE didukung run_metabase.sh resmi (file_env).
    environment:
      MB_JETTY_HOST: 127.0.0.1
      MB_JETTY_PORT: "3000"
      MB_DB_TYPE: postgres
      MB_DB_CONNECTION_URI: "jdbc:postgresql://postgres:5432/metabase?ssl=true&sslmode=verify-full&sslrootcert=/run/secrets/efn_ca_crt"
      MB_DB_USER: efn_metabase
      MB_DB_PASS_FILE: /run/secrets/pg_password_metabase
      # W-19 (Q-P14, 10 Okt 2026): riwayat query (query_execution) 10 tahun - setting internal Metabase, hanya lewat env
      MB_AUDIT_MAX_RETENTION_DAYS: ${MB_AUDIT_MAX_RETENTION_DAYS:-3650}
      JAVA_TIMEZONE: Asia/Jakarta
    secrets: [pg_password_metabase, metabase_encryption_key, efn_ca_crt]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - metabase-data:/metabase-data
    networks: [internal, data]
    deploy:
      resources:
        limits: { memory: 2G }
    labels:
      service: metabase
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      traefik.http.routers.bi.rule: Host(`bi.${TRAEFIK_DOMAIN:-efn.local}`)
      # ADR-023/SEC-21: hanya wg-https + subnet staf (bukan LAN outlet)
      traefik.http.routers.bi.entrypoints: wg-https
      traefik.http.routers.bi.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.bi.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.bi.loadbalancer.server.port: "3443"
      traefik.http.services.bi.loadbalancer.server.scheme: https
      traefik.http.services.bi.loadbalancer.serversTransport: efn-metabase@file
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]   # loopback namespace sendiri
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  metabase-tls:
    <<: *ghostunnel
    profiles: ["data"]
    network_mode: "service:metabase"
    depends_on: [metabase]
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3000
      - --cert=/run/secrets/tls_metabase_crt
      - --key=/run/secrets/tls_metabase_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --allow-cn=metabase-provision   # G13: one-shot provision.py (setup admin segera setelah sehat)
      - --status=http://127.0.0.1:6064
      - --quiet=conns
    secrets: [efn_ca_crt, tls_metabase_crt, tls_metabase_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6064/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: metabase-tls

  # ETL: user efn_etl (PostgreSQL, grant level kolom) dan efn_etl (ClickHouse, INSERT/SELECT mart).
  # Tidak membaca otp_pepper (SEC-16): hash member sudah dihitung BFF di PostgreSQL.
  # G13 (data-AI infra/metabase/provision.py): setup awal Metabase (admin dari secret), koneksi ClickHouse TLS strict,
  # dashboard sebagai kode. Jalan OTOMATIS begitu metabase-tls sehat: instance yang belum di-setup bisa diklaim siapa
  # pun di subnet staf, jadi tidak boleh ada jeda manual. Idempoten (run ulang = update). Lewat sidecar metabase-tls
  # (HTTPS + mTLS CN metabase-provision, CA internal), tanpa network egress. deploy.sh memeriksa exit code-nya.
  metabase-provision:
    <<: *common
    image: python:3.12-bookworm@sha256:e91fec3d1ac69f04e4eddcd29c327e630ce34658cf31075bfa7e8b0e052bafea
    profiles: ["data"]
    restart: "no"
    depends_on:
      metabase:
        condition: service_healthy
      metabase-tls:
        condition: service_healthy
    user: "65534:65534"
    entrypoint: ["python", "-I", "-B", "/opt/efn-metabase/provision.py"]
    command:
      - --url=https://metabase:3443
      - --ca-file=/run/secrets/efn_ca_crt
      - --client-cert=/run/secrets/tls_metabase_provision_crt
      - --client-key=/run/secrets/tls_metabase_provision_key
      - --admin-email=${METABASE_ADMIN_EMAIL:-admin@efn.local}
      - --admin-password-file=/run/secrets/metabase_admin_password
      - --ch-password-file=/run/secrets/clickhouse_password_metabase
    secrets: [efn_ca_crt, tls_metabase_provision_crt, tls_metabase_provision_key, metabase_admin_password,
              clickhouse_password_metabase]
    volumes:
      - ../metabase:/opt/efn-metabase:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      service: metabase-provision

  etl:
    <<: *common
    image: ${IMAGE_ETL:-ghcr.io/efn/etl:dev}
    build:
      context: ../../services/etl
    profiles: ["data"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: efn_etl
      PG_PASSWORD_FILE: /run/secrets/pg_password_etl
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      PG_DB: ${PG_DB:-efn_platform}
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      ODOO_PG_HOST: postgres
      ODOO_PG_PORT: "5432"
      ODOO_PG_USER: efn_etl
      ODOO_PG_PASSWORD_FILE: /run/secrets/pg_password_etl
      CH_HOST: clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      CH_CA_FILE: /run/secrets/efn_ca_crt
      CH_DATABASE: efn_dwh
      CH_USER: efn_etl
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_etl
      ETL_INTERVAL_SECONDS: "900"
      # R5: job fact_sales_line dari DB Odoo (butuh services/etl/sql/odoo-readonly-grants.sql; deploy.sh menerapkan
      # grant lalu mengaktifkan otomatis). Dev override: true.
      ETL_ENABLE_ODOO: ${ETL_ENABLE_ODOO:-false}
      # G12: mart GL + salinan audit tamper-evident (services/etl/README.md). Grant yang sama (efn_audit >= 19.0.1.2.0);
      # deploy.sh mengaktifkan otomatis setelah grant sukses. Dev override: true.
      ETL_ENABLE_GL: ${ETL_ENABLE_GL:-false}
      ETL_AUDIT_COPY_ENABLED: ${ETL_AUDIT_COPY_ENABLED:-false}
      # G14: rekonsiliasi ledger poin vs pos.order mulai dari go-live loyalty POS (UTC, YYYY-MM-DDTHH:MM:SSZ). Nilai dari
      # manifest rilis bertanda tangan (SEC-50, deploy-validate.sh); kosong = semua order dalam jendela lookback.
      ETL_LOYALTY_RECON_NOT_BEFORE: ${ETL_LOYALTY_RECON_NOT_BEFORE:-}
      # SEC-114 (L-25b): default payment (E-30 = desain G18); product hanya data historis (ditolak deploy-validate di production)
      ETL_LOYALTY_POINTS_MODE: ${ETL_LOYALTY_POINTS_MODE:-payment}
      # W-19: harus sama dengan clickhouse-init (TTL kolom pseudonim / geo; ETL gagal start bila di luar rentang)
      CH_PSEUDONYM_RETENTION_YEARS: ${CH_PSEUDONYM_RETENTION_YEARS:-5}
      CH_GEO_RETENTION_DAYS: ${CH_GEO_RETENTION_DAYS:-90}
      # DSAR ClickHouse (docs/04 §8.4): publish privacy.erasure.completed sebagai efn-etl (write amq.default saja)
      AMQP_URL: amqps://efn-etl@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_etl
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # SEC-51/52 (G13): verifikasi HMAC baris sink audit Odoo dari Loki (query_range lewat loki-tls, mTLS CN etl).
      # Disiapkan devsecops; dipakai services/etl/efn_etl/sink.py (data-AI) bila sudah diaktifkan.
      EFN_AUDIT_SINK_KEY_FILE: /run/secrets/efn_audit_sink_key
      LOKI_URL: https://loki:3100
      LOKI_CA_FILE: /run/secrets/efn_ca_crt
      LOKI_CLIENT_CERT_FILE: /run/secrets/tls_etl_crt
      LOKI_CLIENT_KEY_FILE: /run/secrets/tls_etl_key
    secrets: [pg_password_etl, clickhouse_password_etl, rabbitmq_password_etl, efn_audit_sink_key, tls_etl_crt, tls_etl_key,
              efn_ca_crt]
    networks: [data]   # rabbitmq, postgres, clickhouse, loki (G13) semuanya di network data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    # ETL tidak punya port HTTP: healthcheck hanya memastikan proses utama hidup.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      service: etl

  # ───────────────────────── AI ─────────────────────────
  # Ollama listen 127.0.0.1:11435; TLS oleh sidecar ollama-tls di :11434 (OLLAMA_URL=https://ollama:11434).
  # Network `egress` hanya untuk `ollama pull` model. Tidak read_only: runner diekstrak ke direktori tmp besar.
  ollama:
    <<: *common
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ["ai"]
    # Ollama yang bind ke loopback menolak (403) Host selain localhost/os.Hostname()/*.local|.internal (proteksi DNS
    # rebinding). Klien datang lewat sidecar ollama-tls dengan `Host: ollama:11434`; tanpa hostname eksplisit
    # (default = id container) semua panggilan VLM ocr-worker -> 403 -> flagged/vlm_unavailable (G8 E2E).
    hostname: ollama
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal, egress]
    environment:
      OLLAMA_HOST: 127.0.0.1:11435
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "2"
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 12G }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      service: ollama
    # GPU: aktifkan di docker-compose.prod.yml (deploy.resources.reservations.devices)

  ollama-tls:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ollama"
    depends_on: [ollama]
    command:
      - server
      - --listen=0.0.0.0:11434
      - --target=127.0.0.1:11435
      - --cert=/run/secrets/tls_ollama_crt
      - --key=/run/secrets/tls_ollama_key
      # SEC-20: Ollama tanpa autentikasi sendiri -> hanya ocr-worker (+ probe handshake blackbox) yang boleh masuk.
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=ocr-worker
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6065
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ollama_crt, tls_ollama_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6065/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ollama-tls

  # Worker: amqps (user efn-ocr), PostgreSQL efn_ocr verify-full, MinIO efn-ocr (GetObject saja), Ollama HTTPS,
  # metrik Prometheus HTTPS di :9100.
  ocr-worker:
    <<: *common
    image: ${IMAGE_AI_OCR_WORKER:-ghcr.io/efn/ai-ocr-worker:dev}
    build:
      context: ../../services/ai-ocr-worker
    profiles: ["ai"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      AMQP_URL: amqps://efn-ocr@rabbitmq:5671
      RABBITMQ_URL: amqps://efn-ocr@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_ocr
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-efn_platform}
      PG_USER: efn_ocr
      PG_PASSWORD_FILE: /run/secrets/pg_password_ocr
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      OLLAMA_URL: https://ollama:11434
      OLLAMA_CA_FILE: /run/secrets/efn_ca_crt
      # mTLS ke sidecar ollama-tls (--allow-cn=ocr-worker, docs/04 §8.5): sertifikat tls_ocr_worker (EKU server+client)
      OLLAMA_CLIENT_CERT_FILE: /run/secrets/tls_ocr_worker_crt
      OLLAMA_CLIENT_KEY_FILE: /run/secrets/tls_ocr_worker_key
      OLLAMA_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      # Lewat filter L7 s3-gateway (ADR-030); access key = secret acak (docs/04 §8.12/§8.13)
      MINIO_ENDPOINT: s3-gateway
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "true"
      MINIO_CA_FILE: /run/secrets/efn_ca_crt
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_ocr_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_ocr_secret
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      OCR_CONFIDENCE_THRESHOLD: "0.80"
      NAME_SIMILARITY_THRESHOLD: "0.75"
      # E12 ditutup (gel. 12): worker tetap HTTPS+mTLS tetapi HANYA di loopback :9101 (prometheus-client tidak bisa
      # membatasi CN). Dari network: ocr-worker-metrics-tls :9100 (--allow-cn=prometheus) -> 127.0.0.1:9102
      # ocr-worker-metrics-bridge (ghostunnel client, TLS ke worker, verify-cn ocr-worker) -> 127.0.0.1:9101.
      # Healthcheck worker tetap ke 127.0.0.1:${METRICS_PORT}.
      METRICS_PORT: "9101"
      METRICS_BIND_ADDRESS: 127.0.0.1
      METRICS_TLS_CERT_FILE: /run/secrets/tls_ocr_worker_crt
      METRICS_TLS_KEY_FILE: /run/secrets/tls_ocr_worker_key
      METRICS_TLS_CA_FILE: /run/secrets/efn_ca_crt
      METRICS_TLS_CLIENT_CA_FILE: /run/secrets/efn_ca_crt
    secrets:
      - rabbitmq_password_ocr
      - minio_ocr_access_key
      - minio_ocr_secret
      - pg_password_ocr
      - efn_ca_crt
      - tls_ocr_worker_crt
      - tls_ocr_worker_key
    networks: [internal, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2G }
    healthcheck:
      test: ["CMD", "python", "-m", "efn_ocr.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      service: ocr-worker

  # E12 (ADR-022) ditutup: /metrics worker dari network hanya untuk CN prometheus. Dua sidecar di namespace worker
  # (di-recreate bersama ocr-worker): server mTLS :9100 -> loopback :9102 -> client TLS -> worker 127.0.0.1:9101.
  # Hop plaintext hanya 127.0.0.1:9102 di namespace worker (pola E1). Worker sendiri tetap mewajibkan sertifikat
  # klien CA internal; bridge memakai sertifikat ocr-worker (EKU server+client) dan memverifikasi CN ocr-worker.
  ocr-worker-metrics-tls:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ocr-worker"
    depends_on: [ocr-worker-metrics-bridge]
    command:
      - server
      - --listen=0.0.0.0:9100
      - --target=127.0.0.1:9102
      - --cert=/run/secrets/tls_ocr_worker_crt
      - --key=/run/secrets/tls_ocr_worker_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6075
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ocr_worker_crt, tls_ocr_worker_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6075/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ocr-worker-metrics-tls

  ocr-worker-metrics-bridge:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ocr-worker"
    depends_on: [ocr-worker]
    command:
      - client
      - --listen=127.0.0.1:9102
      - --target=127.0.0.1:9101
      - --override-server-name=ocr-worker
      - --cert=/run/secrets/tls_ocr_worker_crt
      - --key=/run/secrets/tls_ocr_worker_key
      - --cacert=/run/secrets/efn_ca_crt
      - --verify-cn=ocr-worker
      - --status=http://127.0.0.1:6076
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ocr_worker_crt, tls_ocr_worker_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6076/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ocr-worker-metrics-bridge

  # ───────────────────────── OBSERVABILITY ─────────────────────────
  # Endpoint HTTP komponen exporter-toolkit hanya TLS (infra/observability/web-config.yml). Image busybox tidak
  # bisa memverifikasi TLS di healthcheck -> healthcheck Docker dinonaktifkan untuk komponen ber-TLS tanpa klien
  # yang sesuai; kesehatannya dipantau Prometheus (`up`, EfnServiceDown) dan Uptime Kuma.
  prometheus:
    <<: *common
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web-config.yml
      - --storage.tsdb.retention.time=30d
    # tls_server_crt/key = sertifikat `prometheus` (EKU server+client): server web UI/API (mTLS: klien prometheus,
    # grafana) DAN sertifikat klien untuk semua scrape/alerting (docs/04 §8.5).
    secrets:
      - efn_ca_crt
      - minio_prometheus_token
      - source: tls_prometheus_crt
        target: tls_server_crt
      - source: tls_prometheus_key
        target: tls_server_key
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/web-config-ui.yml:/etc/prometheus/web-config.yml:ro
      - ../observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ../observability/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks: [internal, data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      disable: true
    labels:
      service: prometheus

  # Image Loki 3.x tidak membawa shell/wget -> healthcheck Docker tidak tersedia;
  # kesehatan Loki dipantau Prometheus (job `loki`, alert EfnServiceDown).
  # SEC-35 (gelombang 9): Loki tidak mendukung allowlist CN klien -> Loki listen 127.0.0.1:3101 (pola E1) dan
  # sidecar loki-tls (:3100) hanya menerima mTLS CN promtail (push), grafana (query), prometheus (metrik).
  # Sertifikat klien lain (mis. ocr-worker, blackbox) ditolak -> log tidak bisa dibaca/dipalsukan dari sana.
  loki:
    <<: *common
    image: grafana/loki:3.2.1@sha256:09a53b4a4ff81ffcd8f13886df19d33fac7a8d3aaf952e3c7e66cbade5b2fc31
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki.yml
    # Gelombang 11: ruler Loki mengirim alert sink audit Odoo (SEC-43) ke Alertmanager lewat mTLS (sertifikat loki,
    # EKU server+client; Alertmanager allowlist SAN loki di web-config-alertmanager.yml).
    secrets: [efn_ca_crt, tls_loki_crt, tls_loki_key]
    volumes:
      - ../observability/loki.yml:/etc/loki/loki.yml:ro
      - ../observability/loki-rules:/etc/loki/rules/fake:ro
      - loki-data:/loki
    networks: [internal, data]   # data: klien etl (G13, mTLS CN etl di loki-tls)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      disable: true
    labels:
      service: loki

  loki-tls:
    <<: *ghostunnel
    profiles: ["observability"]
    network_mode: "service:loki"
    depends_on: [loki]
    command:
      - server
      - --listen=0.0.0.0:3100
      - --target=127.0.0.1:3101
      - --cert=/run/secrets/tls_loki_crt
      - --key=/run/secrets/tls_loki_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=promtail
      - --allow-cn=grafana
      - --allow-cn=prometheus
      - --allow-cn=etl          # G13: baca baris sink audit untuk verifikasi HMAC (SEC-51)
      - --status=http://127.0.0.1:6067
      - --quiet=conns
    secrets: [efn_ca_crt, tls_loki_crt, tls_loki_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6067/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: loki-tls

  promtail:
    <<: *common
    image: grafana/promtail:3.2.1@sha256:bf617e9d67e80247a59f717f9c1ad388d7d32dc0a1d29abd5799516d15e0a9b5
    profiles: ["observability"]
    command: -config.file=/etc/promtail/promtail.yml
    secrets: [efn_ca_crt, tls_promtail_crt, tls_promtail_key]
    volumes:
      - ../observability/promtail.yml:/etc/promtail/promtail.yml:ro
    networks: [internal, socket-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: promtail

  grafana:
    <<: *common
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://ops.${TRAEFIK_DOMAIN:-efn.local}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /run/secrets/tls_grafana_crt
      GF_SERVER_CERT_KEY: /run/secrets/tls_grafana_key
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password, efn_ca_crt, tls_grafana_crt, tls_grafana_key]
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      disable: true   # dipantau probe-internal-tls (grafana:3000) + Uptime Kuma
    labels:
      service: grafana
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      traefik.http.routers.ops.rule: Host(`ops.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.ops.entrypoints: wg-https
      traefik.http.routers.ops.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.ops.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.ops.loadbalancer.server.port: "3000"
      traefik.http.services.ops.loadbalancer.server.scheme: https
      traefik.http.services.ops.loadbalancer.serversTransport: efn-grafana@file

  # HTTPS native (UPTIME_KUMA_SSL_*); healthcheck bawaan image (extra/healthcheck) mengikuti mode SSL.
  # Tidak cap_drop: entrypoint melakukan chown data.
  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1.23.16@sha256:431fee3be822b04861cf0e35daf4beef6b7cb37391c5f26c3ad6e12ce280fe18
    profiles: ["observability"]
    environment:
      UPTIME_KUMA_SSL_CERT: /run/secrets/tls_uptime_kuma_crt
      UPTIME_KUMA_SSL_KEY: /run/secrets/tls_uptime_kuma_key
      NODE_EXTRA_CA_CERTS: /run/secrets/efn_ca_crt
    secrets: [efn_ca_crt, tls_uptime_kuma_crt, tls_uptime_kuma_key]
    volumes:
      - uptime-kuma-data:/app/data
    networks: [internal, egress]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: uptime-kuma
      traefik.enable: "true"
      traefik.docker.network: efn_internal
      traefik.http.routers.status.rule: Host(`status.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.status.entrypoints: wg-https
      traefik.http.routers.status.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.status.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.status.loadbalancer.server.port: "3001"
      traefik.http.services.status.loadbalancer.server.scheme: https
      traefik.http.services.status.loadbalancer.serversTransport: efn-uptime-kuma@file

  # ───────────────────────── OPS (alerting + exporter) ─────────────────────────
  # Cluster gossip (9094) dimatikan: single instance, tidak ada listener plaintext.
  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ["ops"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.config.file=/etc/alertmanager/web-config.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.external-url=https://ops.${TRAEFIK_DOMAIN:-efn.local}/alertmanager
    secrets:
      - alertmanager_webhook_url
      - efn_ca_crt
      - source: tls_alertmanager_crt
        target: tls_server_crt
      - source: tls_alertmanager_key
        target: tls_server_key
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../observability/web-config-alertmanager.yml:/etc/alertmanager/web-config.yml:ro
      - alertmanager-data:/alertmanager
    networks: [internal, egress]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: alertmanager

  # Metrik host (disk, CPU, memori) + textfile collector untuk status backup/restore-test & masa berlaku
  # sertifikat internal (ditulis scripts/backup.sh, restore-test.sh, deploy.sh ke ${NODE_EXPORTER_TEXTFILE_DIR}).
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    profiles: ["ops"]
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/node-exporter/web-config.yml
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    secrets:
      - efn_ca_crt
      - source: tls_node_exporter_crt
        target: tls_server_crt
      - source: tls_node_exporter_key
        target: tls_server_key
    volumes:
      - /:/host:ro,rslave
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/efn/node-exporter}:/textfile:ro
      - ../observability/web-config.yml:/etc/node-exporter/web-config.yml:ro
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: node-exporter

  # cAdvisor (SEC-09): tanpa docker.sock, tanpa rootfs host. Metadata container lewat docker-socket-proxy (mTLS,
  # read-only GET), statistik dari /sys/fs/cgroup (cgroup namespace host) + /var/lib/docker/image (metadata layer
  # saja, bukan volume). cap_drop ALL. Listen 127.0.0.1:8080; TLS oleh sidecar cadvisor-tls :8443.
  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    profiles: ["ops"]
    cgroup: host
    command:
      - --listen_ip=127.0.0.1
      - --port=8080
      - --docker=tcp://docker-socket-proxy:2376
      - --docker-tls
      - --docker-tls-ca=/run/secrets/efn_ca_crt
      - --docker-tls-cert=/run/secrets/tls_cadvisor_crt
      - --docker-tls-key=/run/secrets/tls_cadvisor_key
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    secrets: [efn_ca_crt, tls_cadvisor_crt, tls_cadvisor_key]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/image:/var/lib/docker/image:ro
    networks: [internal, socket-proxy]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: cadvisor

  cadvisor-tls:
    <<: *ghostunnel
    profiles: ["ops"]
    network_mode: "service:cadvisor"
    depends_on: [cadvisor]
    command:
      - server
      - --listen=0.0.0.0:8443
      - --target=127.0.0.1:8080
      - --cert=/run/secrets/tls_cadvisor_crt
      - --key=/run/secrets/tls_cadvisor_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6066
      - --quiet=conns
    secrets: [efn_ca_crt, tls_cadvisor_crt, tls_cadvisor_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6066/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: cadvisor-tls

  # postgres-exporter: user efn_exporter (pg_monitor), TLS verify-full ke PostgreSQL, endpoint metrik TLS.
  postgres-exporter:
    <<: *common
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0
    profiles: ["ops"]
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yml
      - --web.config.file=/etc/postgres-exporter/web-config.yml
    environment:
      DATA_SOURCE_URI: postgres:5432/${PG_DB:-efn_platform}?sslmode=verify-full&sslrootcert=/run/secrets/efn_ca_crt
      DATA_SOURCE_USER: efn_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_password_exporter
    secrets:
      - pg_password_exporter
      - efn_ca_crt
      - source: tls_postgres_exporter_crt
        target: tls_server_crt
      - source: tls_postgres_exporter_key
        target: tls_server_key
    volumes:
      - ../observability/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
      - ../observability/web-config.yml:/etc/postgres-exporter/web-config.yml:ro
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: postgres-exporter

  # redis_exporter: rediss + ACL efn-exporter. Password dari secret lewat wrapper (env REDIS_PASSWORD hanya di proses
  # exporter). SEC-35 (gelombang 9): redis_exporter tidak mendukung allowlist CN -> endpoint metrik di loopback
  # 127.0.0.1:9122 (pola E1) dan sidecar redis-exporter-tls (:9121) hanya menerima mTLS CN prometheus.
  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0-alpine@sha256:117e28099cf52e284c43073935a3beb8dd7a29aa4972a7c1a062dba421e986fa
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "-c", "export REDIS_PASSWORD=\"$$(cat /run/secrets/redis_password_exporter)\"; exec /redis_exporter"]
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_USER: efn-exporter
      # CA untuk koneksi KLIEN exporter -> Redis (TLS terverifikasi)
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /run/secrets/efn_ca_crt
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 127.0.0.1:9122
    secrets: [redis_password_exporter, efn_ca_crt]
    networks: [cache, data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      disable: true
    labels:
      service: redis-exporter

  redis-exporter-tls:
    <<: *ghostunnel
    profiles: ["ops"]
    network_mode: "service:redis-exporter"
    depends_on: [redis-exporter]
    command:
      - server
      - --listen=0.0.0.0:9121
      - --target=127.0.0.1:9122
      - --cert=/run/secrets/tls_redis_exporter_crt
      - --key=/run/secrets/tls_redis_exporter_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6068
      - --quiet=conns
    secrets: [efn_ca_crt, tls_redis_exporter_crt, tls_redis_exporter_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6068/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: redis-exporter-tls

  # Probe health (HTTPS internal), handshake TLS semua listener internal, dan HTTPS publik (sertifikat ACME).
  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    profiles: ["ops"]
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.config.file=/etc/blackbox/web-config.yml
    secrets:
      - efn_ca_crt
      - source: tls_blackbox_exporter_crt
        target: tls_server_crt
      - source: tls_blackbox_exporter_key
        target: tls_server_key
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ../observability/web-config.yml:/etc/blackbox/web-config.yml:ro
    networks: [internal, data, cache, egress]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      disable: true
    labels:
      service: blackbox-exporter

# EFN Platform - base compose. Dipakai bersama override:
#   dev     : docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile core --profile data up -d
#   prod    : docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.host.yml \
#               --profile core --profile data --profile ai --profile observability --profile ops up -d
# Profiles: core (edge, odoo, bff, web, pg, redis, mq, minio) | data (clickhouse, metabase, etl) | ai (ollama, ocr-worker)
#           observability (prometheus, loki, promtail, grafana, uptime-kuma) | ops (alertmanager + exporter)
# Semua image di-pin versi. Dependabot (.github/dependabot.yml) mengusulkan bump.
#
# ENKRIPSI DI SETIAP TRANSAKSI DATA (docs/04 §7, ADR-022) - gelombang 3:
#   - Setiap hop TCP antar-container memakai TLS yang diverifikasi terhadap CA internal (/run/secrets/efn_ca_crt).
#     PKI: scripts/gen-pki.sh (dev/CI) atau GitHub Environment (staging/prod). Tidak ada listener plaintext di network.
#   - Aplikasi tanpa TLS native (Odoo, Next.js, Ollama, Metabase, cAdvisor, docker-socket-proxy) listen 127.0.0.1
#     dan dibungkus sidecar ghostunnel (`network_mode: service:<app>`): plaintext hanya di loopback namespace itu.
#     Konsekuensi: port/label Traefik tetap di service app (namespace pemilik); sidecar ikut di-recreate bila app
#     di-recreate; service ber-sidecar tidak bisa di-scale >1 replika (lihat prod: superapp-web replicas 1).
#   - mTLS (docs/04 §8.5, gelombang 5): setiap sidecar ghostunnel memakai --cacert + --allow-cn (klien sah saja,
#     TIDAK ada --disable-authentication; dicek check-encryption.sh) dan endpoint observability mewajibkan
#     sertifikat klien (web-config*.yml, loki.yml, redis_exporter, rabbitmq 15691, Traefik :8082).
#     PKI 3 tingkat: root offline -> intermediate per lingkungan -> leaf 90 hari (scripts/gen-pki.sh).
#   - Kredensial per service (docs/04 §7.3, SEC-02): tidak ada aplikasi yang memakai superuser/root.
#   - scripts/check-encryption.sh (CI job infra) menolak URL/env plaintext di compose.
#
# Baseline hardening setiap service (lihat docs/runbooks/README.md):
#   restart, logging terbatas, no-new-privileges, limit memori (deploy.resources.limits), healthcheck,
#   cap_drop ALL bila image tidak butuh capability, read_only + tmpfs bila image tidak menulis di luar volume.
#   Pengecualian dicatat sebagai komentar di service yang bersangkutan.
# Secret: hanya lewat `secrets:` (file di /run/secrets/<nama>). Daftar sumber: scripts/secrets.list.

name: efn

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    labels: "service"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

# Sidecar TLS (docs/04 §7.1). Non-root, read-only, tanpa capability. Status ghostunnel hanya di loopback.
x-ghostunnel: &ghostunnel
  <<: *common
  image: ghostunnel/ghostunnel:v1.11.3-alpine@sha256:2599b8a04bae16d70a4209495618dea61b46a00a9a05fcf74da282688ad3517f
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  deploy:
    resources:
      limits: { memory: 64M }

# Subnet di-pin agar TRUSTED_PROXIES BFF (SEC-03) presisi. Bentrok dengan jaringan host -> ubah di sini + .env.
networks:
  edge:          # Traefik dan publik (80/443)
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  egress:        # akses keluar internet terkontrol: WhatsApp Cloud API, alert webhook, probe TLS, pull model
    ipam:
      config: [{ subnet: 172.30.3.0/24 }]
  internal:      # semua service backend (Traefik -> app, Next.js -> BFF)
    internal: true
    ipam:
      config: [{ subnet: 172.30.1.0/24 }]
  data:          # DB, broker, object storage; tidak bisa keluar
    internal: true
    ipam:
      config: [{ subnet: 172.30.2.0/24 }]
  cache:         # Redis hanya untuk BFF + exporter (SEC-05)
    internal: true
    ipam:
      config: [{ subnet: 172.30.5.0/24 }]
  socket-proxy:  # hanya Traefik/Promtail/cAdvisor <-> docker-socket-proxy (mTLS)
    internal: true
    ipam:
      config: [{ subnet: 172.30.4.0/24 }]
  objstore:      # hanya s3-gateway (filter L7) + minio-init <-> minio (ADR-030); klien aplikasi TIDAK ada di sini
    internal: true
    ipam:
      config: [{ subnet: 172.30.6.0/24 }]

volumes:
  traefik-acme:          # acme.json resolver HTTP-01 host publik (Traefik)
  acme-dns-data:         # SEC-37: kunci akun ACME + sertifikat asli lego, HANYA service acme-dns
  acme-dns-out:          # SEC-53: PEM crt/key hasil acme-dns (rw acme-dns, ro acme-publish). BUKAN direktori Traefik
  traefik-dynamic:       # SEC-53: direktori provider file Traefik (ro); satu-satunya penulis = acme-publish (network none)
  pg-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  odoo-data:
  clickhouse-data:
  metabase-data:
  ollama-models:
  prometheus-data:
  grafana-data:
  loki-data:
  uptime-kuma-data:
  alertmanager-data:


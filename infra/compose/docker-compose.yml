# EFN Platform - base compose. Dipakai bersama override:
#   dev     : docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile core --profile data up -d
#   prod    : docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.host.yml \
#               --profile core --profile data --profile ai --profile observability --profile ops up -d
# Profiles: core (edge, odoo, bff, web, pg, redis, mq, minio) | data (clickhouse, metabase, etl) | ai (ollama, ocr-worker)
#           observability (prometheus, loki, promtail, grafana, uptime-kuma) | ops (alertmanager + exporter)
#           data juga memuat insight-web + insight-web-tls (G42, dashboard staf, ADR-041)
#           core juga memuat login-gateway + login-gateway-tls (G62, halaman masuk staf, ADR-050)
# Overlay opsional profil data: docker-compose.esb.yml (G41, ekstraksi ESB Core -> ClickHouse; satu-satunya egress ESB;
#   G43: + service sekali jalan esb-migrate di profil `migrate`). docker-compose.migration.yml (G43) = kunci bundel +
#   direktori pertukaran ke odoo HANYA selama jendela migrasi (docs/runbooks/migrasi-esb-odoo.md).
#   docker-compose.forecast.yml (G44, forecast-worker: baca ClickHouse, tulis Odoo lewat odoo-rpc-gateway).
#   docker-compose.segment.yml (G50, segment-worker: baca ClickHouse, anggota segmen -> BFF :9466, ringkasan -> Odoo).
# Overlay opsional profil wa-unofficial: docker-compose.wa-unofficial.yml (G50, ADR-044: WhatsApp tidak resmi terisolasi,
#   OFF di production; runbook supermarket-campaign-channels.md).
# Semua image di-pin versi. Dependabot (.github/dependabot.yml) mengusulkan bump.
#
# ENKRIPSI DI SETIAP TRANSAKSI DATA (docs/04 §7, ADR-022) - gelombang 3:
#   - Setiap hop TCP antar-container memakai TLS yang diverifikasi terhadap CA internal (/run/secrets/efn_ca_crt).
#     PKI: scripts/gen-pki.sh (dev/CI) atau GitHub Environment (staging/prod). Tidak ada listener plaintext di network.
#   - Aplikasi tanpa TLS native (Odoo, Next.js, Ollama, Metabase, cAdvisor, docker-socket-proxy) listen 127.0.0.1
#     dan dibungkus sidecar ghostunnel (`network_mode: service:<app>`): plaintext hanya di loopback namespace itu.
#     Konsekuensi: port/label Traefik tetap di service app (namespace pemilik); sidecar ikut di-recreate bila app
#     di-recreate; service ber-sidecar tidak bisa di-scale >1 replika (lihat prod: superapp-web replicas 1).
#   - mTLS (docs/04 §8.5, gelombang 5): setiap sidecar ghostunnel memakai --cacert + --allow-cn (klien sah saja,
#     TIDAK ada --disable-authentication; dicek check-encryption.sh) dan endpoint observability mewajibkan
#     sertifikat klien (web-config*.yml, loki.yml, redis_exporter, rabbitmq 15691, Traefik :8082).
#     PKI 3 tingkat: root offline -> intermediate per lingkungan -> leaf 90 hari (scripts/gen-pki.sh).
#   - Kredensial per service (docs/04 §7.3, SEC-02): tidak ada aplikasi yang memakai superuser/root.
#   - scripts/check-encryption.sh (CI job infra) menolak URL/env plaintext di compose.
#
# Baseline hardening setiap service (lihat docs/runbooks/README.md):
#   restart, logging terbatas, no-new-privileges, limit memori (deploy.resources.limits), healthcheck,
#   cap_drop ALL bila image tidak butuh capability, read_only + tmpfs bila image tidak menulis di luar volume.
#   Pengecualian dicatat sebagai komentar di service yang bersangkutan.
# Secret: hanya lewat `secrets:` (file di /run/secrets/<nama>). Daftar sumber: scripts/secrets.list.
#
# IDENTITAS STACK (K25-06, docs/runbooks/multi-env-local.md): satu variabel EFN_STACK (default `efn`) menentukan nama
# project compose, nama network (`<stack>_<network>`), label traefik.docker.network, filter discovery Traefik/Promtail
# (label com.docker.compose.project), dan tag image lokal default (ghcr.io/<stack>/<svc>:dev). EFN_SUBNET_BASE (default
# `172.30`, dua oktet) menentukan subnet IPAM semua network (<base>.<n>.0/24). Default keduanya = stack `efn` lama
# (konfigurasi ter-render identik). Jangan memakai `-p <nama>` yang berbeda dari EFN_STACK: set EFN_STACK di .env.
# Dicek scripts/check-encryption.sh (render tambahan EFN_STACK=efn-prod EFN_SUBNET_BASE=10.250).

name: ${EFN_STACK:-efn}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    labels: "service"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

# Sidecar TLS (docs/04 §7.1). Non-root, read-only, tanpa capability. Status ghostunnel hanya di loopback.
x-ghostunnel: &ghostunnel
  <<: *common
  image: ghostunnel/ghostunnel:v1.11.5-alpine@sha256:65c4e34ec0ee0f30ea1f72b7411ec70a91c32fc50f067a8466ad2adb1e7420f2
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  deploy:
    resources:
      limits: { memory: 64M }

# Subnet di-pin agar TRUSTED_PROXIES BFF (SEC-03) presisi. Prefix = EFN_SUBNET_BASE (default 172.30; bentrok dengan
# jaringan host / stack EFN lain -> set di .env, mis. 10.250). Nama network eksplisit `<EFN_STACK>_<key>` (sama dengan
# nama bawaan compose) agar label traefik.docker.network dan skrip uji tidak bergantung pada `-p`.
# Peta oktet ketiga (TETAP, dipakai turunan): 0 edge, 1 internal (TRUSTED_PROXIES, relabel Prometheus), 2 data,
# 3 egress, 4 socket-proxy, 5 cache, 6 objstore, 7-8 overlay ESB, 9-10 insight, 11-12 overlay forecast,
# 13-16 + 21 overlay wa-unofficial, 17-19 overlay segment, 20 mail (dev), 22 login-ingress (G62).
# PostgreSQL hanya di network `data` -> pg_hba memakai `samenet` (dicek check-encryption.sh), bukan CIDR literal.
networks:
  edge:          # Traefik dan publik (80/443)
    name: ${EFN_STACK:-efn}_edge
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.0.0/24" }]
  egress:        # akses keluar internet terkontrol: WhatsApp Cloud API, alert webhook, probe TLS, pull model
    name: ${EFN_STACK:-efn}_egress
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.3.0/24" }]
  internal:      # semua service backend (Traefik -> app, Next.js -> BFF)
    name: ${EFN_STACK:-efn}_internal
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.1.0/24" }]
  data:          # DB, broker, object storage; tidak bisa keluar
    name: ${EFN_STACK:-efn}_data
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.2.0/24" }]
  cache:         # Redis hanya untuk BFF + exporter (SEC-05)
    name: ${EFN_STACK:-efn}_cache
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.5.0/24" }]
  socket-proxy:  # hanya Traefik/Promtail/cAdvisor <-> docker-socket-proxy (mTLS)
    name: ${EFN_STACK:-efn}_socket-proxy
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.4.0/24" }]
  objstore:      # hanya s3-gateway (filter L7) + minio-init <-> minio (ADR-030); klien aplikasi TIDAK ada di sini
    name: ${EFN_STACK:-efn}_objstore
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.6.0/24" }]
  # G42 (docs/04 §26.11, ADR-041 C7): insight-web TIDAK di `internal` (RabbitMQ, sidecar Odoo, BFF) maupun `data`
  # (PostgreSQL, RabbitMQ, s3-gateway, Loki). Dua network khusus, dicek scripts/check-encryption.sh:
  #   insight-ingress : traefik (-> insight-web-tls :3443) + blackbox-exporter (probe health) + insight-web
  #   insight-data    : insight-web <-> clickhouse (HTTPS 8443) saja
  # Traefik dan ClickHouse sengaja tidak berbagi network (edge internet-facing tidak bisa menjangkau gudang data).
  # Oktet 7 dan 8 dipakai overlay docker-compose.esb.yml (G41); 11 dan 12 dipakai overlay docker-compose.forecast.yml (G44).
  # G50: oktet 13-16 overlay docker-compose.wa-unofficial.yml (rmq, wa-egress, wa-internet, wa-admin), 17-19 overlay
  # docker-compose.segment.yml (segment-ch, segment-rpc, segment-bff), 20 network `mail` dev (Mailpit), 21 wa-ingress
  # (overlay wa-unofficial: traefik/prometheus -> relay admin, SEC-G50-06; relay IP statis <base>.21.10).
  insight-ingress:
    name: ${EFN_STACK:-efn}_insight-ingress
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.9.0/24" }]
  insight-data:
    name: ${EFN_STACK:-efn}_insight-data
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.10.0/24" }]
  # G62 (docs/04 §29, ADR-050): login-gateway hanya butuh jalur masuk. Anggota: traefik (-> login-gateway-tls :3443),
  # blackbox-exporter (probe /healthz), login-gateway. Tanpa DB/broker/Odoo/ClickHouse/egress (dicek check-encryption.sh).
  login-ingress:
    name: ${EFN_STACK:-efn}_login-ingress
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.22.0/24" }]

volumes:
  traefik-acme:          # acme.json resolver HTTP-01 host publik (Traefik)
  acme-dns-data:         # SEC-37: kunci akun ACME + sertifikat asli lego, HANYA service acme-dns
  acme-dns-out:          # SEC-53: PEM crt/key hasil acme-dns (rw acme-dns, ro acme-publish). BUKAN direktori Traefik
  traefik-dynamic:       # SEC-53: direktori provider file Traefik (ro); satu-satunya penulis = acme-publish (network none)
  pg-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  odoo-data:
  clickhouse-data:
  metabase-data:
  ollama-models:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:    # posisi baca promtail (positions.yaml) agar restart tidak membaca ulang semua log
  uptime-kuma-data:
  alertmanager-data:

# Harus identik dengan scripts/secrets.list (dicek CI job infra).
secrets:
  # superuser / admin
  pg_password: { file: ../../secrets/pg_password.txt }
  odoo_admin_password: { file: ../../secrets/odoo_admin_password.txt }
  rabbitmq_password: { file: ../../secrets/rabbitmq_password.txt }
  minio_root_password: { file: ../../secrets/minio_root_password.txt }
  minio_root_user: { file: ../../secrets/minio_root_user.txt }
  clickhouse_password: { file: ../../secrets/clickhouse_password.txt }
  grafana_admin_password: { file: ../../secrets/grafana_admin_password.txt }
  # kredensial per service (docs/04 §7.3)
  pg_password_odoo: { file: ../../secrets/pg_password_odoo.txt }
  pg_password_bff: { file: ../../secrets/pg_password_bff.txt }
  pg_password_ocr: { file: ../../secrets/pg_password_ocr.txt }
  pg_password_etl: { file: ../../secrets/pg_password_etl.txt }
  pg_password_metabase: { file: ../../secrets/pg_password_metabase.txt }
  pg_password_exporter: { file: ../../secrets/pg_password_exporter.txt }
  rabbitmq_password_bff: { file: ../../secrets/rabbitmq_password_bff.txt }
  rabbitmq_password_ocr: { file: ../../secrets/rabbitmq_password_ocr.txt }
  rabbitmq_password_etl: { file: ../../secrets/rabbitmq_password_etl.txt }
  redis_password_bff: { file: ../../secrets/redis_password_bff.txt }
  redis_password_exporter: { file: ../../secrets/redis_password_exporter.txt }
  minio_bff_secret: { file: ../../secrets/minio_bff_secret.txt }
  minio_ocr_secret: { file: ../../secrets/minio_ocr_secret.txt }
  minio_prometheus_secret: { file: ../../secrets/minio_prometheus_secret.txt }
  # access key object storage = secret acak (docs/04 §8.12, ADR-030)
  minio_bff_access_key: { file: ../../secrets/minio_bff_access_key.txt }
  minio_ocr_access_key: { file: ../../secrets/minio_ocr_access_key.txt }
  minio_prometheus_access_key: { file: ../../secrets/minio_prometheus_access_key.txt }
  clickhouse_password_etl: { file: ../../secrets/clickhouse_password_etl.txt }
  clickhouse_password_text2sql: { file: ../../secrets/clickhouse_password_text2sql.txt }
  # G38 (docs/04 §23): service key Odoo -> text2sql dan kunci tanda tangan cakupan PT (row policy efn_t2s)
  text2sql_api_key: { file: ../../secrets/text2sql_api_key.txt }
  text2sql_scope_key: { file: ../../secrets/text2sql_scope_key.txt }
  tls_text2sql_crt: { file: ../../secrets/tls_text2sql_crt.txt }
  tls_text2sql_key: { file: ../../secrets/tls_text2sql_key.txt }
  clickhouse_password_metabase: { file: ../../secrets/clickhouse_password_metabase.txt }
  # G41 (docs/04 §25, ADR-040): user ClickHouse efn_esb (role esb_writer). Dibuat clickhouse-init di base; dipakai service
  # esb-extract yang HANYA ada di overlay docker-compose.esb.yml (password ESB per brand juga hanya di overlay itu).
  clickhouse_password_esb: { file: ../../secrets/clickhouse_password_esb.txt }
  # G44 (docs/04 §28.2, ADR-046): user ClickHouse efn_forecast_reader (baca view efn_forecast.* saja). Dibuat clickhouse-init
  # di base; dipakai service forecast-worker yang HANYA ada di overlay docker-compose.forecast.yml (API key Odoo per PT +
  # sertifikat klien mTLS juga hanya di overlay itu).
  clickhouse_password_forecast: { file: ../../secrets/clickhouse_password_forecast.txt }
  # G50 (docs/04 §28.7, ADR-047): user ClickHouse efn_segment_reader (baca view efn_segment.* saja). Dibuat clickhouse-init
  # di base; dipakai segment-worker yang HANYA ada di overlay docker-compose.segment.yml (API key Odoo segmen + sertifikat
  # klien mTLS juga hanya di overlay itu).
  clickhouse_password_segment: { file: ../../secrets/clickhouse_password_segment.txt }
  # G42 (docs/04 §26.10, ADR-041): SSO Odoo -> insight-web, cookie sesi, tanda tangan cakupan PT (row policy
  # efn_insight_scope), user ClickHouse efn_insight. Mount least privilege dicek scripts/check-encryption.sh.
  insight_sso_key: { file: ../../secrets/insight_sso_key.txt }
  insight_session_key: { file: ../../secrets/insight_session_key.txt }
  insight_scope_key: { file: ../../secrets/insight_scope_key.txt }
  clickhouse_password_insight: { file: ../../secrets/clickhouse_password_insight.txt }
  # G43 (docs/04 §27.2/§27.10, ADR-042): migrasi ESB -> Odoo, host:disabled di produksi (aktif hanya selama jendela
  # migrasi). clickhouse_password_mig: clickhouse-init (base; placeholder -> user efn_mig dihapus) + esb-migrate (overlay
  # docker-compose.esb.yml, profil migrate). migration_bundle_key: esb-migrate + odoo HANYA lewat overlay
  # docker-compose.migration.yml. Least privilege dicek scripts/check-encryption.sh.
  clickhouse_password_mig: { file: ../../secrets/clickhouse_password_mig.txt }
  migration_bundle_key: { file: ../../secrets/migration_bundle_key.txt }
  # kunci aplikasi (docs/04 §2, §7.2)
  jwt_secret: { file: ../../secrets/jwt_secret.txt }
  otp_pepper: { file: ../../secrets/otp_pepper.txt }
  discount_token_secret: { file: ../../secrets/discount_token_secret.txt }
  odoo_bff_api_key: { file: ../../secrets/odoo_bff_api_key.txt }
  whatsapp_token: { file: ../../secrets/whatsapp_token.txt }
  webhook_payment_secret: { file: ../../secrets/webhook_payment_secret.txt }
  pii_encryption_key: { file: ../../secrets/pii_encryption_key.txt }
  altcha_hmac_key: { file: ../../secrets/altcha_hmac_key.txt }
  payment_provider_api_key: { file: ../../secrets/payment_provider_api_key.txt }   # mount: docker-compose.payment.yml
  acme_dns_api_token: { file: ../../secrets/acme_dns_api_token.txt }
  # G13: HMAC baris sink audit Odoo (SEC-51; hanya odoo + etl), admin Metabase (provision), endpoint migrasi BFF (K-7)
  efn_audit_sink_key: { file: ../../secrets/efn_audit_sink_key.txt }
  metabase_admin_password: { file: ../../secrets/metabase_admin_password.txt }
  # G16b: kunci enkripsi at rest DB aplikasi Metabase (MB_ENCRYPTION_SECRET_KEY; hanya service metabase) [SA]
  metabase_encryption_key: { file: ../../secrets/metabase_encryption_key.txt }
  migration_api_key: { file: ../../secrets/migration_api_key.txt }
  # G17 penjualan online (docs/04 §10.10): API key Odoo per kanal (dibuat di Odoo, runbook odoo-online-api-key.md)
  # + HMAC event Odoo -> BFF (L-2; hanya odoo + api-gateway).
  # G20 (docs/04 §12.1): kode kanal = kode PT. `_gl` di-mount base (kanal default GL); `_pb`/`_bcr`/`_bcf` HANYA oleh
  # overlay docker-compose.online-<kode>.yml saat kanal ada di ONLINE_CHANNELS (deploy.sh).
  odoo_api_key_online_gl: { file: ../../secrets/odoo_api_key_online_gl.txt }
  odoo_api_key_online_pb: { file: ../../secrets/odoo_api_key_online_pb.txt }
  odoo_api_key_online_bcr: { file: ../../secrets/odoo_api_key_online_bcr.txt }
  odoo_api_key_online_bcf: { file: ../../secrets/odoo_api_key_online_bcf.txt }
  # G24 (docs/04 §16.1): kanal WTZ (PT Wetzel's Pretzels) - overlay docker-compose.online-wtz.yml
  odoo_api_key_online_wtz: { file: ../../secrets/odoo_api_key_online_wtz.txt }
  # 23 Nov 2026 (supermarket web): kanal SMD (PT Supermarket Demo) - overlay docker-compose.online-smd.yml
  odoo_api_key_online_smd: { file: ../../secrets/odoo_api_key_online_smd.txt }
  odoo_online_event_hmac: { file: ../../secrets/odoo_online_event_hmac.txt }
  # G21 (docs/04 §13.1 no. 3, L-61): HMAC publikasi kebijakan poin Odoo -> BFF (hanya odoo + api-gateway)
  loyalty_policy_signing_key: { file: ../../secrets/loyalty_policy_signing_key.txt }
  # G22 (docs/04 §14.A.2/§14.A.9/§14.E.4): kunci HMAC token sesi meja QR (`fts1.`; HANYA api-gateway), HMAC event
  # Odoo -> BFF /v1/pos/fnb/events (hanya odoo + api-gateway), API key Odoo user teknis QR per PT (host:disabled,
  # dirotasi efn-rotate-online-key --channel=QR-<PT>; mount HANYA lewat overlay docker-compose.online-qr-<pt>.yml).
  fnb_table_token_key: { file: ../../secrets/fnb_table_token_key.txt }
  odoo_fnb_event_hmac: { file: ../../secrets/odoo_fnb_event_hmac.txt }
  odoo_api_key_qr_pb: { file: ../../secrets/odoo_api_key_qr_pb.txt }
  odoo_api_key_qr_bcf: { file: ../../secrets/odoo_api_key_qr_bcf.txt }
  # G23 (docs/04 §15.3/§15.5, W-35): HMAC event reservasi Odoo -> BFF /v1/pos/booking/events (hanya odoo + api-gateway);
  # API key Odoo user teknis reservasi per PT F&B (efn_booking_<pt>, host:disabled, dirotasi efn-rotate-online-key
  # --channel=BOOKING-<PT>; mount HANYA lewat overlay docker-compose.online-booking-<pt>.yml saat BOOKING_ENABLED=true).
  odoo_booking_event_hmac: { file: ../../secrets/odoo_booking_event_hmac.txt }
  odoo_api_key_booking_pb: { file: ../../secrets/odoo_api_key_booking_pb.txt }
  odoo_api_key_booking_bcf: { file: ../../secrets/odoo_api_key_booking_bcf.txt }
  # G27 (docs/04 §18.1): user teknis promo per PT (group_promo_bff). Di-mount hanya lewat overlay online-promo-<pt>.
  odoo_api_key_promo_pb: { file: ../../secrets/odoo_api_key_promo_pb.txt }
  # G21 AC-13 (docs/04 §13.2, ADR-036 §0): kunci PII Odoo (host:disabled [SA], dibuat Superadmin di host). Mount HANYA
  # ke odoo oleh docker-compose.pii.yml (deploy.sh bila EFN_ODOO_PII_ENABLED=true) / docker-compose.dev.yml.
  odoo_pii_key_v1: { file: ../../secrets/odoo_pii_key_v1.txt }
  odoo_pii_bidx_key: { file: ../../secrets/odoo_pii_bidx_key.txt }
  odoo_pii_name_key: { file: ../../secrets/odoo_pii_name_key.txt }
  # G50 (docs/04 §28.6-§28.10; ADR-044/047/048 Proposed). Mount least privilege dicek scripts/check-encryption.sh:
  #   behavior_*_pepper, email_*, odoo_api_key_campaign_smd -> HANYA api-gateway (base, flag default false)
  #   odoo_api_key_segment_smd, tls_segment_worker_*        -> HANYA segment-worker (overlay docker-compose.segment.yml)
  #   wa_unofficial_*, rabbitmq_password_wa_unofficial, tls_wa_unofficial_* -> HANYA overlay docker-compose.wa-unofficial.yml
  behavior_subject_pepper: { file: ../../secrets/behavior_subject_pepper.txt }
  behavior_device_pepper: { file: ../../secrets/behavior_device_pepper.txt }
  email_smtp_password: { file: ../../secrets/email_smtp_password.txt }
  email_unsubscribe_key: { file: ../../secrets/email_unsubscribe_key.txt }
  odoo_api_key_campaign_smd: { file: ../../secrets/odoo_api_key_campaign_smd.txt }
  # turunan (scripts/derive-secrets.sh)
  member_hash_pepper: { file: ../../secrets/member_hash_pepper.txt }
  minio_prometheus_token: { file: ../../secrets/minio_prometheus_token.txt }
  # backup & at rest
  minio_backup_password: { file: ../../secrets/minio_backup_password.txt }
  minio_backup_access_key: { file: ../../secrets/minio_backup_access_key.txt }
  walg_libsodium_key: { file: ../../secrets/walg_libsodium_key.txt }
  minio_kms_key: { file: ../../secrets/minio_kms_key.txt }
  clickhouse_disk_key: { file: ../../secrets/clickhouse_disk_key.txt }
  alertmanager_webhook_url: { file: ../../secrets/alertmanager_webhook_url.txt }
  # PKI internal (scripts/gen-pki.sh)
  efn_ca_crt: { file: ../../secrets/efn_ca_crt.txt }
  tls_postgres_crt: { file: ../../secrets/tls_postgres_crt.txt }
  tls_postgres_key: { file: ../../secrets/tls_postgres_key.txt }
  tls_redis_crt: { file: ../../secrets/tls_redis_crt.txt }
  tls_redis_key: { file: ../../secrets/tls_redis_key.txt }
  tls_rabbitmq_crt: { file: ../../secrets/tls_rabbitmq_crt.txt }
  tls_rabbitmq_key: { file: ../../secrets/tls_rabbitmq_key.txt }
  tls_minio_crt: { file: ../../secrets/tls_minio_crt.txt }
  tls_minio_key: { file: ../../secrets/tls_minio_key.txt }
  tls_s3_gateway_crt: { file: ../../secrets/tls_s3_gateway_crt.txt }
  tls_s3_gateway_key: { file: ../../secrets/tls_s3_gateway_key.txt }
  tls_clickhouse_crt: { file: ../../secrets/tls_clickhouse_crt.txt }
  tls_clickhouse_key: { file: ../../secrets/tls_clickhouse_key.txt }
  tls_api_gateway_crt: { file: ../../secrets/tls_api_gateway_crt.txt }
  tls_api_gateway_key: { file: ../../secrets/tls_api_gateway_key.txt }
  tls_odoo_crt: { file: ../../secrets/tls_odoo_crt.txt }
  tls_odoo_key: { file: ../../secrets/tls_odoo_key.txt }
  tls_odoo_rpc_gateway_crt: { file: ../../secrets/tls_odoo_rpc_gateway_crt.txt }
  tls_odoo_rpc_gateway_key: { file: ../../secrets/tls_odoo_rpc_gateway_key.txt }
  tls_superapp_web_crt: { file: ../../secrets/tls_superapp_web_crt.txt }
  tls_superapp_web_key: { file: ../../secrets/tls_superapp_web_key.txt }
  tls_insight_web_crt: { file: ../../secrets/tls_insight_web_crt.txt }   # G42: sidecar insight-web-tls
  tls_insight_web_key: { file: ../../secrets/tls_insight_web_key.txt }
  tls_login_gateway_crt: { file: ../../secrets/tls_login_gateway_crt.txt }   # G62: sidecar login-gateway-tls
  tls_login_gateway_key: { file: ../../secrets/tls_login_gateway_key.txt }
  tls_ollama_crt: { file: ../../secrets/tls_ollama_crt.txt }
  tls_ollama_key: { file: ../../secrets/tls_ollama_key.txt }
  tls_metabase_crt: { file: ../../secrets/tls_metabase_crt.txt }
  tls_metabase_key: { file: ../../secrets/tls_metabase_key.txt }
  tls_traefik_crt: { file: ../../secrets/tls_traefik_crt.txt }
  tls_traefik_key: { file: ../../secrets/tls_traefik_key.txt }
  tls_prometheus_crt: { file: ../../secrets/tls_prometheus_crt.txt }
  tls_prometheus_key: { file: ../../secrets/tls_prometheus_key.txt }
  tls_alertmanager_crt: { file: ../../secrets/tls_alertmanager_crt.txt }
  tls_alertmanager_key: { file: ../../secrets/tls_alertmanager_key.txt }
  tls_grafana_crt: { file: ../../secrets/tls_grafana_crt.txt }
  tls_grafana_key: { file: ../../secrets/tls_grafana_key.txt }
  tls_loki_crt: { file: ../../secrets/tls_loki_crt.txt }
  tls_loki_key: { file: ../../secrets/tls_loki_key.txt }
  tls_promtail_crt: { file: ../../secrets/tls_promtail_crt.txt }
  tls_promtail_key: { file: ../../secrets/tls_promtail_key.txt }
  # G13: klien mTLS (clientAuth saja): etl -> loki-tls (verifikasi sink v2), metabase-provision -> metabase-tls
  tls_etl_crt: { file: ../../secrets/tls_etl_crt.txt }
  tls_etl_key: { file: ../../secrets/tls_etl_key.txt }
  tls_metabase_provision_crt: { file: ../../secrets/tls_metabase_provision_crt.txt }
  tls_metabase_provision_key: { file: ../../secrets/tls_metabase_provision_key.txt }
  tls_uptime_kuma_crt: { file: ../../secrets/tls_uptime_kuma_crt.txt }
  tls_uptime_kuma_key: { file: ../../secrets/tls_uptime_kuma_key.txt }
  tls_node_exporter_crt: { file: ../../secrets/tls_node_exporter_crt.txt }
  tls_node_exporter_key: { file: ../../secrets/tls_node_exporter_key.txt }
  tls_postgres_exporter_crt: { file: ../../secrets/tls_postgres_exporter_crt.txt }
  tls_postgres_exporter_key: { file: ../../secrets/tls_postgres_exporter_key.txt }
  tls_redis_exporter_crt: { file: ../../secrets/tls_redis_exporter_crt.txt }
  tls_redis_exporter_key: { file: ../../secrets/tls_redis_exporter_key.txt }
  tls_blackbox_exporter_crt: { file: ../../secrets/tls_blackbox_exporter_crt.txt }
  tls_blackbox_exporter_key: { file: ../../secrets/tls_blackbox_exporter_key.txt }
  tls_ocr_worker_crt: { file: ../../secrets/tls_ocr_worker_crt.txt }
  tls_ocr_worker_key: { file: ../../secrets/tls_ocr_worker_key.txt }
  tls_cadvisor_crt: { file: ../../secrets/tls_cadvisor_crt.txt }
  tls_cadvisor_key: { file: ../../secrets/tls_cadvisor_key.txt }
  tls_docker_socket_proxy_crt: { file: ../../secrets/tls_docker_socket_proxy_crt.txt }
  tls_docker_socket_proxy_key: { file: ../../secrets/tls_docker_socket_proxy_key.txt }

services:
  # ───────────────────────── EDGE ─────────────────────────
  # Traefik/Promtail/cAdvisor tidak me-mount docker.sock; discovery lewat proxy read-only (GET containers/events).
  # Proxy hanya listen 127.0.0.1:2375; akses dari network lewat sidecar ghostunnel mTLS :2376 (CN yang diizinkan:
  # traefik, promtail, cadvisor).
  docker-socket-proxy:
    <<: *common
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    profiles: ["core"]
    environment:
      BIND_CONFIG: "127.0.0.1:2375"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-proxy]
    cap_drop: [ALL]
    # haproxy menulis file runtime saat start -> tidak read_only
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: docker-socket-proxy

  docker-socket-proxy-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:docker-socket-proxy"
    depends_on: [docker-socket-proxy]
    command:
      - server
      - --listen=0.0.0.0:2376
      - --target=127.0.0.1:2375
      - --cert=/run/secrets/tls_docker_socket_proxy_crt
      - --key=/run/secrets/tls_docker_socket_proxy_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=promtail
      - --allow-cn=cadvisor
      - --status=http://127.0.0.1:6060
      - --quiet=conns
    secrets: [efn_ca_crt, tls_docker_socket_proxy_crt, tls_docker_socket_proxy_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6060/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: docker-socket-proxy-tls

  traefik:
    <<: *common
    # >= v3.6.1 wajib: Docker Engine 29 menolak API < 1.44 (Traefik v3.2 gagal "Error response from daemon", gel. 7)
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    profiles: ["core"]
    depends_on:
      docker-socket-proxy-tls:
        condition: service_healthy
      acme-dns-init:   # titik mount base/ dev/ (milik root, sticky) di volume traefik-dynamic (SEC-37/SEC-53)
        condition: service_completed_successfully
    # K25-06: konfigurasi statis Traefik tidak bisa membaca env (file XOR CLI XOR env). infra/stack/render-config.sh
    # mengganti @EFN_STACK@ di traefik.yml (network default + constraint project compose: Traefik hanya menemukan
    # container stack ini walau docker-socket-proxy melihat semua container host) ke /tmp/traefik.yml (tmpfs), lalu exec.
    entrypoint: ["/bin/sh", "/efn/render-config.sh", "/etc/traefik/traefik.yml", "/tmp/traefik.yml", "traefik"]
    command:
      - --configFile=/tmp/traefik.yml
    # Publik (websecure, lewat Cloudflare) di IP publik host; `wg-https` (ADR-023, host internal erp./bi./ops./status.)
    # HANYA di IP WireGuard host. Prod: EFN_PUBLIC_BIND=<IP publik>, EFN_WG_BIND=10.88.0.1, EFN_WG_HTTPS_PORT=443
    # (ditulis deploy.sh). Dev: wg-https di 127.0.0.1:9443 (https://erp.efn.local:9443).
    # K25-06: port host 80/443 bisa diganti (EFN_HTTP_PORT/EFN_HTTPS_PORT) agar stack EFN kedua tidak bentrok.
    ports:
      - "${EFN_PUBLIC_BIND:-0.0.0.0}:${EFN_HTTP_PORT:-80}:80"
      - "${EFN_PUBLIC_BIND:-0.0.0.0}:${EFN_HTTPS_PORT:-443}:443"
      - "${EFN_WG_BIND:-127.0.0.1}:${EFN_WG_HTTPS_PORT:-9443}:8443"
    environment:
      - EFN_STACK=${EFN_STACK:-efn}
      - TRAEFIK_DOMAIN=${TRAEFIK_DOMAIN:-efn.local}
      # Allowlist WireGuard (dynamic/middlewares.yml, SEC-21): outlet vs staf back-office/IT (ADR-023 butir 3)
      - EFN_WG_OUTLET_CIDR=${EFN_WG_OUTLET_CIDR:-10.88.0.0/16}
      - EFN_WG_STAFF_CIDR=${EFN_WG_STAFF_CIDR:-10.89.0.0/16}
      # Tambahan allowlist (dev: bridge Docker Desktop). Prod: tidak diset (127.0.0.1/32).
      - EFN_INTERNAL_EXTRA_CIDR=${EFN_INTERNAL_EXTRA_CIDR:-127.0.0.1/32}
    # SEC-37: Traefik (internet-facing) TIDAK memegang token DNS. Sertifikat host wg-https (erp./bi./ops./status.)
    # diterbitkan service `acme-dns` dan dipasang `acme-publish` ke volume traefik-dynamic (read-only di sini).
    secrets: [efn_ca_crt, tls_traefik_crt, tls_traefik_key]
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../stack/render-config.sh:/efn/render-config.sh:ro
      # SEC-37/SEC-53: volume traefik-dynamic = direktori provider file itu sendiri (read-only). Watch Traefik
      # (fsnotify) TIDAK rekursif -> acme-dns.yml harus di puncak agar sertifikat baru dimuat tanpa restart (diuji
      # scripts/test-acme-dns.sh). Konfigurasi statis di subdirektori (dibaca rekursif saat start/reload):
      # base/ (di bawah) dan dev/ (override dev); titik mount dibuat acme-dns-init (milik root, sticky).
      # Penulis volume ini HANYA acme-publish (network none, template tetap), bukan acme-dns yang ber-network.
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - ../traefik/dynamic:/etc/traefik/dynamic/base:ro
      - traefik-acme:/acme
    # insight-ingress (G42): satu-satunya jalur ke sidecar insight-web-tls; tanpa akses ke ClickHouse (insight-data)
    # login-ingress (G62): satu-satunya jalur ke sidecar login-gateway-tls
    networks: [edge, internal, socket-proxy, insight-ingress, login-ingress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { memory: 256M }
    labels:
      service: traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/tmp/traefik.yml"]   # hasil render (K25-06)
      interval: 30s
      timeout: 5s
      retries: 3

  # SEC-35: metrik Traefik (entrypoint `metrics` di 127.0.0.1:8084) hanya lewat sidecar ini, mTLS CN prometheus.
  # Ikut namespace Traefik -> di-recreate bersama traefik.
  traefik-metrics-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:traefik"
    depends_on: [traefik]
    command:
      - server
      - --listen=0.0.0.0:8082
      - --target=127.0.0.1:8084
      - --cert=/run/secrets/tls_traefik_crt
      - --key=/run/secrets/tls_traefik_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6070
      - --quiet=conns
    secrets: [efn_ca_crt, tls_traefik_crt, tls_traefik_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6070/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: traefik-metrics-tls

  # SEC-37 (ADR-023): ACME DNS-01 untuk host wg-https, terpisah dari Traefik. lego resmi (image ber-digest) + skrip
  # infra/acme/acme-dns.sh: TANPA port, hanya network egress (CA + API DNS), satu-satunya pemegang token DNS.
  # SEC-53: acme-dns hanya menulis PEM ke volume acme-dns-out; `acme-publish` (network none) memvalidasi PEM dan
  # menulis crt/key berversi + acme-dns.yml (template tetap) ke volume traefik-dynamic -> Traefik hot-reload.
  # Dev/CI: token `disabled` -> idle (tanpa request ACME). Uji: scripts/test-acme-dns.sh (Pebble).
  # Runbook: docs/runbooks/acme-dns-token.md. Volume acme-dns-data (kunci akun ACME) hanya di sini.
  acme-dns-init:
    <<: *common
    image: goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
    profiles: ["core"]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-dns-init.sh"]
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-data:/data
      - acme-dns-out:/out
      - traefik-dynamic:/dyn
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    deploy:
      resources:
        limits: { memory: 32M }
    labels:
      service: acme-dns-init

  acme-dns:
    <<: *common
    image: goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
    profiles: ["core"]
    depends_on:
      acme-dns-init:
        condition: service_completed_successfully
    user: "65532:0"
    init: true
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-dns.sh"]
    environment:
      # G42: insight. (dashboard insight-web, wg-https saja) ikut sertifikat SAN yang sama; G62: login. (login-gateway)
      - ACME_DOMAINS=erp.${TRAEFIK_DOMAIN:-efn.local},bi.${TRAEFIK_DOMAIN:-efn.local},ops.${TRAEFIK_DOMAIN:-efn.local},status.${TRAEFIK_DOMAIN:-efn.local},insight.${TRAEFIK_DOMAIN:-efn.local},login.${TRAEFIK_DOMAIN:-efn.local}
      - ACME_EMAIL=${ACME_EMAIL:-ops@example.com}
      - ACME_DNS_PROVIDER=${ACME_DNS_PROVIDER:-cloudflare}
      # Staging ACME: https://acme-staging-v02.api.letsencrypt.org/directory (uji sebelum produksi, runbook §3)
      - ACME_SERVER=${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - ACME_OUT=/out
      - LEGO_LOG_LEVEL=info
      # lego membaca <VAR>_FILE (diuji scripts/test-acme-dns.sh): token tidak pernah di env/argv
      - ${ACME_DNS_TOKEN_ENV:-CF_DNS_API_TOKEN}_FILE=/run/secrets/acme_dns_api_token
    secrets: [acme_dns_api_token]
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-data:/data
      - acme-dns-out:/out
    networks: [egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    labels:
      service: acme-dns
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.disabled || [ -n \"$$(find /data/.last-ok -mmin -1500 2>/dev/null)\" ]"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10m

  # SEC-53: satu-satunya penulis direktori provider file Traefik. Tanpa network (tidak memproses input jaringan),
  # read-only, cap_drop ALL, uid terpisah (65533, grup 0 = baca PEM acme-dns + dibaca Traefik). Memvalidasi PEM murni
  # lalu menulis acme-dns.yml dari template tetap (infra/acme/acme-publish.sh). Mode nonaktif acme-dns: tidak ada PEM
  # -> idle sehat.
  acme-publish:
    <<: *common
    image: goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
    profiles: ["core"]
    depends_on:
      acme-dns-init:
        condition: service_completed_successfully
    user: "65533:0"
    init: true
    entrypoint: ["/bin/sh", "/opt/efn-acme/acme-publish.sh"]
    environment:
      - ACME_IN=/in
      - ACME_DYN=/dyn
      - ACME_TRAEFIK_DIR=/etc/traefik/dynamic
    volumes:
      - ../acme:/opt/efn-acme:ro
      - acme-dns-out:/in:ro
      - traefik-dynamic:/dyn
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 32M }
    labels:
      service: acme-publish
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$(find /tmp/.acme-publish-alive -mmin -5 2>/dev/null)\" ]"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m

  # ───────────────────────── DATA LAYER ─────────────────────────
  # Image custom = postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4 + WAL-G (infra/backup/postgres). WAL di-archive ke MinIO (HTTPS, CA internal)
  # bucket pg-backup setiap segmen penuh atau paling lambat archive_timeout=900 s -> RPO 15 menit (R-T08).
  # TLS: ssl=on, TLSv1.2+, hba_file = infra/postgres/pg_hba.conf (hostssl saja, superuser hanya socket lokal).
  # PostgreSQL menolak kunci privat yang bisa dibaca group/other -> entrypoint menyalin kunci (0600) ke
  # /var/run/postgresql/efn-tls sebelum memanggil entrypoint resmi.
  # Non-root (USER postgres di image) -> cap_drop ALL aman. Tidak read_only: socket/lock di /var/run/postgresql.
  postgres:
    <<: *common
    image: ${IMAGE_POSTGRES:-ghcr.io/${EFN_STACK:-efn}/postgres:dev}
    build:
      context: ../backup/postgres
    profiles: ["core"]
    entrypoint:
      - /bin/bash
      - -c
      - >-
        install -d -m 0700 /var/run/postgresql/efn-tls &&
        install -m 0600 /run/secrets/tls_postgres_key /var/run/postgresql/efn-tls/server.key &&
        exec docker-entrypoint.sh "$$@"
      - efn-pg-entrypoint
    environment:
      # Superuser hanya untuk entrypoint/backup via socket lokal (pg_hba menolak superuser lewat TCP)
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: ${PG_DB:-efn_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
      # WAL-G (dibaca oleh /usr/local/bin/efn-walg; secret dibaca dari file per pemanggilan)
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://pg-backup/efn}
      # Lewat filter L7 s3-gateway (ADR-030), bukan langsung ke storage
      WALG_S3_ENDPOINT: https://s3-gateway:9000
      WALG_S3_CA_CERT_FILE: /run/secrets/efn_ca_crt
      MINIO_BACKUP_ACCESS_KEY_FILE: /run/secrets/minio_backup_access_key
      MINIO_BACKUP_PASSWORD_FILE: /run/secrets/minio_backup_password
      WALG_LIBSODIUM_KEY_FILE: /run/secrets/walg_libsodium_key
    secrets:
      - pg_password
      - minio_backup_access_key
      - minio_backup_password
      - walg_libsodium_key
      - efn_ca_crt
      - tls_postgres_crt
      - tls_postgres_key
      # dibaca infra/postgres/init/00-roles.sh (role per service)
      - pg_password_odoo
      - pg_password_bff
      - pg_password_ocr
      - pg_password_etl
      - pg_password_metabase
      - pg_password_exporter
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - ../postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [data]
    shm_size: 256m
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2G }
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-on}
      - -c
      - archive_command=/usr/local/bin/efn-walg wal-push %p
      - -c
      - archive_timeout=900
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      # SEC-18: parameter bind (bisa berisi nomor HP) tidak pernah dicetak ke log
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      # TLS (docs/04 §7.1)
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/tls_postgres_crt
      - -c
      - ssl_key_file=/var/run/postgresql/efn-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      service: postgres

  # Redis: TLS saja (6379 = tls-port, port plaintext 0), ACL dari secret (user default off), noeviction (SEC-05).
  # Network `cache` khusus: hanya api-gateway, redis-exporter, blackbox.
  redis:
    <<: *common
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    profiles: ["core"]
    entrypoint: ["/bin/sh", "/efn/redis-entrypoint.sh"]
    environment:
      REDIS_MAXMEMORY: 512mb
    secrets: [efn_ca_crt, tls_redis_crt, tls_redis_key, redis_password_bff, redis_password_exporter]
    volumes:
      - redis-data:/data
      - ../redis/redis-entrypoint.sh:/efn/redis-entrypoint.sh:ro
    networks: [cache]
    read_only: true
    tmpfs: [/tmp]
    # wrapper: chown file ACL (CHOWN) lalu setpriv ke user redis (SETUID/SETGID); entrypoint resmi tidak dipakai
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: { memory: 768M }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password_exporter)" redis-cli --tls
          --cacert /run/secrets/efn_ca_crt -h localhost -p 6379 --user efn-exporter --no-auth-warning ping
          | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      service: redis

  # RabbitMQ: amqps 5671 saja, management https 15671, metrik https 15691 (infra/rabbitmq/rabbitmq.conf).
  # User per service + permission regex dari definitions yang dibangkitkan entrypoint (SEC-02, SEC-08).
  # Distribusi Erlang (25672) & epmd hanya di loopback; nodename tetap (rabbit@localhost) agar data stabil.
  # Tidak read_only: entrypoint resmi menulis cookie/konfigurasi di /var/lib/rabbitmq.
  rabbitmq:
    <<: *common
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    profiles: ["core"]
    hostname: rabbitmq
    entrypoint: ["/bin/sh", "/efn/rabbitmq-entrypoint.sh"]
    environment:
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-efn-admin}
      RABBITMQ_NODENAME: rabbit@localhost
      ERL_EPMD_ADDRESS: 127.0.0.1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-kernel inet_dist_use_interface {127,0,0,1}"
      # SEC-25 (G6): default strict - configure dicabut, read hanya queue yang dikonsumsi. Semua klien memakai
      # passive declare (BFF checkQueue, worker queue_declare(passive=True), ETL tanpa declare). Fallback: false.
      RABBITMQ_STRICT_PERMISSIONS: ${RABBITMQ_STRICT_PERMISSIONS:-true}
    secrets:
      - rabbitmq_password
      - rabbitmq_password_bff
      - rabbitmq_password_ocr
      - rabbitmq_password_etl
      - efn_ca_crt
      - tls_rabbitmq_crt
      - tls_rabbitmq_key
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-defaults.conf:ro
      - ../rabbitmq/rabbitmq-entrypoint.sh:/efn/rabbitmq-entrypoint.sh:ro
    tmpfs: [/tmp]
    networks: [data, internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      service: rabbitmq

  # SEC-35: metrik RabbitMQ (plugin di 127.0.0.1:15692) hanya lewat sidecar ini, mTLS CN prometheus saja.
  rabbitmq-metrics-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:rabbitmq"
    depends_on: [rabbitmq]
    command:
      - server
      - --listen=0.0.0.0:15691
      - --target=127.0.0.1:15692
      - --cert=/run/secrets/tls_rabbitmq_crt
      - --key=/run/secrets/tls_rabbitmq_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6069
      - --quiet=conns
    secrets: [efn_ca_crt, tls_rabbitmq_crt, tls_rabbitmq_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6069/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: rabbitmq-metrics-tls

  # Object storage S3 = SILO (fork komunitas MinIO, ADR-030), nama service tetap `minio`. HTTPS saja (sertifikat
  # disalin ke /tmp/certs karena butuh nama file public.crt/private.key), SSE-S3 dengan kunci KMS statis dari secret
  # minio_kms_key (docs/04 §7.2).
  # HANYA di network `objstore`: klien (BFF, worker, WAL-G, Prometheus) wajib lewat filter L7 `s3-gateway`
  # (ADR-030 Keputusan 2); minio-init (admin API) satu-satunya klien langsung.
  # Tidak read_only: server menulis ~/.minio saat start.
  minio:
    <<: *common
    # Dibangun dari source tag SILO (infra/minio/Dockerfile): image minio/minio & minio/mc sudah hilang dari Docker Hub
    # dan upstream diarsipkan.
    image: ${IMAGE_MINIO:-ghcr.io/${EFN_STACK:-efn}/minio:dev}
    build:
      context: ../minio
    profiles: ["core"]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/certs/CAs &&
        cp /run/secrets/tls_minio_crt /tmp/certs/public.crt &&
        cp /run/secrets/tls_minio_key /tmp/certs/private.key &&
        cp /run/secrets/efn_ca_crt /tmp/certs/CAs/efn-ca.crt &&
        exec minio server /data --console-address :9001 --certs-dir /tmp/certs
    environment:
      # Root user = access key acak dari secret (SEC-48, docs/04 §8.12), bukan nama tetap `efnadmin`
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_KMS_SECRET_KEY_FILE: /run/secrets/minio_kms_key
      # Metrik hanya dengan bearer JWT user metrik (access key acak; minio-init + derive-secrets.sh), SEC-20/SEC-30
      MINIO_PROMETHEUS_AUTH_TYPE: jwt
      # Healthcheck `mc ready` memverifikasi TLS dengan CA internal (Go membaca SSL_CERT_FILE)
      SSL_CERT_FILE: /run/secrets/efn_ca_crt
    secrets: [minio_root_user, minio_root_password, minio_kms_key, efn_ca_crt, tls_minio_crt, tls_minio_key]
    volumes:
      - minio-data:/data
    networks: [objstore]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_health=https://localhost:9000 mc ready health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      service: minio

  # Filter L7 (HAProxy LTS) di depan object storage - ADR-030 Keputusan 2, aturan di infra/s3-gateway/haproxy.cfg.
  # TLS masuk dengan sertifikat `s3-gateway` (CA internal); TLS keluar ke minio:9000 diverifikasi (CA internal,
  # verifyhost minio). Satu-satunya jalur klien aplikasi ke storage. Non-root (uid haproxy image), read_only,
  # tanpa capability (port 9000 > 1024). PEM gabungan crt+key hanya di tmpfs /tmp.
  s3-gateway:
    <<: *common
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/efn/entrypoint.sh"]
    secrets: [efn_ca_crt, tls_s3_gateway_crt, tls_s3_gateway_key]
    volumes:
      - ../s3-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../s3-gateway/entrypoint.sh:/efn/entrypoint.sh:ro
    networks: [internal, data, objstore]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8405/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: s3-gateway

  # One-shot: bucket (SSE-S3, versioning, object lock), user per service + kebijakan minimum (docs/04 §7.2-§7.3).
  # Idempoten; dijalankan ulang setiap `up`. Juga dipakai untuk rotasi password user MinIO.
  minio-init:
    <<: *common
    image: ${IMAGE_MINIO:-ghcr.io/${EFN_STACK:-efn}/minio:dev}   # image yang sama dengan minio (berisi mc)
    build:
      context: ../minio
    profiles: ["core"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      # Admin langsung ke storage di network objstore (bukan lewat s3-gateway yang menolak /minio/admin/*)
      MINIO_URL: https://minio:9000
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      MINIO_BUCKET_PG_BACKUP: pg-backup
      # G17: gambar katalog online (docs/04 §10.10; retensi dikelola job BFF, bukan lifecycle)
      MINIO_BUCKET_CATALOG: catalog
      # Retensi foto Market Scout (docs/04 §8.4: default 90 hari, menunggu DPO)
      MINIO_MARKET_SCOUT_EXPIRE_DAYS: ${MARKET_SCOUT_PHOTO_RETENTION_DAYS:-90}
      MC_CONFIG_DIR: /tmp/.mc
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_backup_password
      - minio_bff_secret
      - minio_ocr_secret
      - minio_prometheus_secret
      - minio_backup_access_key
      - minio_bff_access_key
      - minio_ocr_access_key
      - minio_prometheus_access_key
      - efn_ca_crt
    volumes:
      - ../minio/minio-init.sh:/init/minio-init.sh:ro
    networks: [objstore]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      service: minio-init

  # ───────────────────────── ERP ─────────────────────────
  # Odoo listen 127.0.0.1:8069 (HTTP) dan :8072 (websocket); TLS oleh sidecar odoo-tls (:8443) dan
  # odoo-ws-tls (:8444). Ke PostgreSQL: user efn_odoo, sslmode verify-full (render_odoo_conf.py).
  # SEC-01: semua router Odoo internal-only (WireGuard), login di-rate-limit ketat, /xmlrpc & /jsonrpc diblok.
  # Tidak read_only: entrypoint merender /etc/odoo/odoo.conf saat start. User odoo (non-root).
  odoo:
    <<: *common
    image: ${IMAGE_ODOO:-ghcr.io/${EFN_STACK:-efn}/odoo:dev}
    build:
      context: ../../services/odoo
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      HOST: postgres
      PORT: "5432"
      USER: efn_odoo
      PASSWORD_FILE: /run/secrets/pg_password_odoo
      ODOO_ADMIN_PASSWORD_FILE: /run/secrets/odoo_admin_password
      ODOO_HTTP_INTERFACE: 127.0.0.1
      PGSSLROOTCERT: /run/secrets/efn_ca_crt
      EFN_CA_FILE: /run/secrets/efn_ca_crt
      EFN_BFF_URL: https://api-gateway:3000
      EFN_BFF_API_KEY_FILE: /run/secrets/odoo_bff_api_key
      # docs/04 §8.4: pepper member_hash (HKDF dari otp_pepper, scripts/derive-secrets.sh) untuk efn_member_hash
      EFN_MEMBER_HASH_PEPPER_FILE: /run/secrets/member_hash_pepper
      # SEC-51 (G13): HMAC per baris sink audit (efn_audit >= 19.0.1.3.0); tanpa secret -> "mac": null + alert
      EFN_AUDIT_SINK_KEY_FILE: /run/secrets/efn_audit_sink_key
      # G17 (docs/04 §10.5, L-2): HMAC event pesanan online Odoo -> BFF (X-EFN-Signature)
      EFN_ONLINE_EVENT_HMAC_FILE: /run/secrets/odoo_online_event_hmac
      # G21 (docs/04 §13.1 no. 3, L-61): tanda tangan outbox kebijakan poin -> BFF (X-EFN-Signature, efn_loyalty_accounting)
      EFN_LOYALTY_POLICY_SIGNING_KEY_FILE: /run/secrets/loyalty_policy_signing_key
      # G22 (docs/04 §14.A.4): tanda tangan outbox event QR meja -> BFF POST /v1/pos/fnb/events (X-EFN-Signature)
      EFN_FNB_EVENT_HMAC_FILE: /run/secrets/odoo_fnb_event_hmac
      # G23 (docs/04 §15.5): tanda tangan outbox event reservasi meja -> BFF POST /v1/pos/booking/events (X-EFN-Signature)
      EFN_BOOKING_EVENT_HMAC_FILE: /run/secrets/odoo_booking_event_hmac
      # G38 (docs/04 §23.5): Tanya Data -> service text2sql (HTTPS 8443, CA internal); kill switch default false
      TEXT2SQL_ENABLED: ${TEXT2SQL_ENABLED:-false}
      EFN_TEXT2SQL_URL: https://text2sql:8443
      EFN_TEXT2SQL_API_KEY_FILE: /run/secrets/text2sql_api_key
      # G42 (docs/04 §26.2, ADR-041): menu "Dashboard Insight" -> /efn/insight/open membuat token eit1 (HMAC
      # insight_sso_key) yang dibawa BROWSER ke insight-web (POST form). Odoo tidak pernah menghubungi insight-web (tanpa
      # network ke sana). Kill switch default false; URL wajib https (check-encryption.sh).
      INSIGHT_ENABLED: ${INSIGHT_ENABLED:-false}
      # G52 (docs/04 §28.15.10): token SSO Insight default 3 = eit3; "2" = rollback eit2, "1" = rollback eit1 (SEC-G47-02).
      EFN_INSIGHT_TOKEN_VERSION: ${EFN_INSIGHT_TOKEN_VERSION:-3}
      # G47 (docs/04 §28.13.12): bagian supermarket token eit2; hanya "true" persis. Satu saklar dengan insight-web.
      INSIGHT_SM_ENABLED: ${INSIGHT_SM_ENABLED:-false}
      # G52 (docs/04 §28.15.10): persona F&B (Eksekutif/Toko/Marketing); hanya "true" persis, default false. Satu saklar dengan insight-web.
      INSIGHT_FNB_PERSONA_ENABLED: ${INSIGHT_FNB_PERSONA_ENABLED:-false}
      EFN_INSIGHT_URL: https://insight.${TRAEFIK_DOMAIN:-efn.local}
      EFN_INSIGHT_SSO_KEY_FILE: /run/secrets/insight_sso_key
    # Kunci PII Odoo (odoo_pii_*) TIDAK di base: overlay docker-compose.pii.yml (production, L-59) / dev compose.
    secrets:
      [pg_password_odoo, odoo_admin_password, odoo_bff_api_key, member_hash_pepper, efn_audit_sink_key, odoo_online_event_hmac,
       loyalty_policy_signing_key, odoo_fnb_event_hmac, odoo_booking_event_hmac, text2sql_api_key, insight_sso_key, efn_ca_crt]
    volumes:
      - odoo-data:/var/lib/odoo
    networks: [internal, data]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 3G }
    labels:
      service: odoo
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      # ADR-023: HANYA entrypoint wg-https (IP WireGuard) + allowlist outlet/staf (SEC-01, SEC-21). Sertifikat publik
      # ACME DNS-01 (browser POS tidak perlu CA internal). Tidak ada router erp. di websecure (publik).
      traefik.http.routers.odoo.rule: Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.odoo.entrypoints: wg-https
      traefik.http.routers.odoo.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo.middlewares: internal-only@file,secure-headers@file,odoo-block-dbmanager@file,ratelimit-odoo@file
      traefik.http.routers.odoo.service: odoo
      traefik.http.services.odoo.loadbalancer.server.port: "8443"
      traefik.http.services.odoo.loadbalancer.server.scheme: https
      traefik.http.services.odoo.loadbalancer.serversTransport: efn-odoo@file
      # Login: rate limit ketat per peer WireGuard
      traefik.http.routers.odoo-login.rule: >-
        Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
        && (Path(`/web/login`) || PathPrefix(`/web/session/authenticate`) || PathPrefix(`/web/login/totp`))
      traefik.http.routers.odoo-login.priority: "200"
      traefik.http.routers.odoo-login.entrypoints: wg-https
      traefik.http.routers.odoo-login.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-login.middlewares: internal-only@file,secure-headers@file,ratelimit-odoo-login@file
      traefik.http.routers.odoo-login.service: odoo
      # G42 (docs/04 §26.2): halaman form SSO Insight. Header keamanan varian strict-origin (Origin harus terkirim ke
      # insight-web /sso untuk cek C1; no-referrer -> Origin: null); CSP/no-store tetap dari controller.
      traefik.http.routers.odoo-insight-open.rule: Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`) && Path(`/efn/insight/open`)
      traefik.http.routers.odoo-insight-open.priority: "220"
      traefik.http.routers.odoo-insight-open.entrypoints: wg-https
      traefik.http.routers.odoo-insight-open.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-insight-open.middlewares: internal-only@file,secure-headers-insight-sso@file,ratelimit-odoo@file
      traefik.http.routers.odoo-insight-open.service: odoo
      # XML-RPC / JSON-RPC / JSON-2 API Odoo 19 (SEC-22) diblok total (403). Integrasi server-to-server tidak
      # lewat Traefik; sidecar odoo-tls hanya menerima klien mTLS CN traefik (+ probe blackbox).
      traefik.http.routers.odoo-rpc-block.rule: >-
        Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`)
        && (PathPrefix(`/xmlrpc`) || PathPrefix(`/jsonrpc`) || PathPrefix(`/json/2`))
      traefik.http.routers.odoo-rpc-block.priority: "300"
      traefik.http.routers.odoo-rpc-block.entrypoints: wg-https
      traefik.http.routers.odoo-rpc-block.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-rpc-block.middlewares: deny-all@file
      traefik.http.routers.odoo-rpc-block.service: odoo
      # Websocket (POS, bus)
      traefik.http.routers.odoo-ws.rule: Host(`erp.${TRAEFIK_DOMAIN:-efn.local}`) && PathPrefix(`/websocket`)
      traefik.http.routers.odoo-ws.priority: "250"
      traefik.http.routers.odoo-ws.entrypoints: wg-https
      traefik.http.routers.odoo-ws.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.odoo-ws.middlewares: internal-only@file,secure-headers@file,ratelimit-odoo@file
      traefik.http.routers.odoo-ws.service: odoo-ws
      traefik.http.services.odoo-ws.loadbalancer.server.port: "8444"
      traefik.http.services.odoo-ws.loadbalancer.server.scheme: https
      traefik.http.services.odoo-ws.loadbalancer.serversTransport: efn-odoo@file
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health || exit 1"]   # loopback namespace sendiri
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  odoo-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:odoo"
    depends_on: [odoo]
    command:
      - server
      - --listen=0.0.0.0:8443
      - --target=127.0.0.1:8069
      - --cert=/run/secrets/tls_odoo_crt
      - --key=/run/secrets/tls_odoo_key
      # mTLS (docs/04 §8.5, SEC-20/SEC-22): hanya Traefik (+ probe kesehatan blackbox yang hanya bisa dipicu
      # Prometheus lewat mTLS) + filter L7 odoo-rpc-gateway (G17, docs/04 §10.4.1: BFF -> /json/2, 10 path saja).
      # Container lain di network internal/data (termasuk BFF langsung) tidak bisa mencapai Odoo.
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --allow-cn=odoo-rpc-gateway
      - --status=http://127.0.0.1:6061
      - --quiet=conns
    secrets: [efn_ca_crt, tls_odoo_crt, tls_odoo_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6061/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-tls

  odoo-ws-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:odoo"
    depends_on: [odoo]
    command:
      - server
      - --listen=0.0.0.0:8444
      - --target=127.0.0.1:8072
      - --cert=/run/secrets/tls_odoo_crt
      - --key=/run/secrets/tls_odoo_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6062
      - --quiet=conns
    secrets: [efn_ca_crt, tls_odoo_crt, tls_odoo_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6062/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-ws-tls

  # Filter L7 BFF -> Odoo /json/2 (G17, docs/04 §10.4.1, ADR-034 Proposed; pola s3-gateway). Aturan di
  # infra/odoo-rpc-gateway/haproxy.cfg: mTLS masuk hanya CN api-gateway (24 path persis) dan CN forecast-worker (G44
  # §28.2, 5 path forecast; network forecast-rpc dari overlay docker-compose.forecast.yml), header allowlist,
  # X-Odoo-Database dipaksa; keluar mTLS verify-full ke odoo-tls (CN odoo-rpc-gateway). Tanpa label Traefik, tanpa
  # port host. Non-root (uid image haproxy), read_only, tanpa capability; PEM crt+key hanya di tmpfs /tmp.
  odoo-rpc-gateway:
    <<: *common
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    profiles: ["core"]
    depends_on:
      odoo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/efn/entrypoint.sh"]
    environment:
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      # SEC-96 / L-16b: koneksi paralel maks. ke Odoo = worker HTTP Odoo yang disisihkan untuk online (1..16).
      # Kelebihan mengantre 2 s lalu 503. Sizing worker: docs/runbooks/online-orders.md#sizing-worker
      ODOO_RPC_MAXCONN: ${ODOO_RPC_MAXCONN:-4}
    secrets: [efn_ca_crt, tls_odoo_rpc_gateway_crt, tls_odoo_rpc_gateway_key]
    volumes:
      - ../odoo-rpc-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../odoo-rpc-gateway/entrypoint.sh:/efn/entrypoint.sh:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8406/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: odoo-rpc-gateway

  # ───────────────────────── BFF / API ─────────────────────────
  # HTTPS native di :3000 (TLS_CERT_FILE/TLS_KEY_FILE). Network `egress` untuk WhatsApp Cloud API & payment.
  api-gateway:
    <<: *common
    image: ${IMAGE_API_GATEWAY:-ghcr.io/${EFN_STACK:-efn}/api-gateway:dev}
    build:
      context: ../../services/api-gateway
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      s3-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-production}
      # G13c: ConsoleLogger NestJS tanpa kode warna ANSI -> baris log berjangkar (`[Nest] <pid>  - <waktu>  WARN [Ctx] ...`)
      # untuk regex promtail EFN_LOYALTY_ANOMALY / EFN_LOYALTY_RECON (infra/observability/promtail.yml).
      NO_COLOR: "1"
      PORT: "3000"
      TLS_CERT_FILE: /run/secrets/tls_api_gateway_crt
      TLS_KEY_FILE: /run/secrets/tls_api_gateway_key
      EFN_CA_FILE: /run/secrets/efn_ca_crt
      # SEC-23: TIDAK ada NODE_EXTRA_CA_CERTS di BFF - CA internal hanya dipercaya oleh klien internal eksplisit
      # (pg/redis/amqp/minio), bukan untuk egress publik (WhatsApp, payment gateway).
      HEALTHCHECK_CA_FILE: /run/secrets/efn_ca_crt
      HEALTHCHECK_SERVERNAME: api-gateway
      # SEC-03: subnet Docker internal (Traefik, Next.js) + rentang Cloudflare (scripts/deploy.sh dari
      # infra/traefik/cloudflare-ips.txt). Dev: hanya subnet internal (= <EFN_SUBNET_BASE>.1.0/24, K25-06).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${EFN_SUBNET_BASE:-172.30}.1.0/24}
      # PostgreSQL (docs/04 §7.1/§7.3)
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-efn_platform}
      PG_USER: efn_bff
      PG_PASSWORD_FILE: /run/secrets/pg_password_bff
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      # Redis (TLS + ACL)
      REDIS_URL: rediss://redis:6379
      REDIS_USERNAME: efn-bff
      REDIS_PASSWORD_FILE: /run/secrets/redis_password_bff
      REDIS_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # RabbitMQ (amqps, URL tanpa password)
      AMQP_URL: amqps://efn-bff@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_bff
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # Auth & OTP (docs/04 §2, §3.1)
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      OTP_PEPPER_FILE: /run/secrets/otp_pepper
      DISCOUNT_TOKEN_SECRET_FILE: /run/secrets/discount_token_secret
      ODOO_BFF_API_KEY_FILE: /run/secrets/odoo_bff_api_key
      WEBHOOK_PAYMENT_SECRET_FILE: /run/secrets/webhook_payment_secret
      OTP_TTL_SECONDS: "180"
      OTP_MAX_ATTEMPTS: "3"
      # SEC-54 (G13): CGNAT seluler = banyak pelanggan per IPv4. Kontrol utama = batas per member (3/15 menit, 10/jam)
      # + budget global; batas per IP sumber dinaikkan 20 -> 60/15 menit agar satu penyerang di IP bersama butuh 3x
      # lebih banyak PoW untuk mengunci IP itu. Level ALTCHA berbasis rasio kegagalan = backlog BFF (laporan G13).
      OTP_RL_SOURCE_LIMIT: ${OTP_RL_SOURCE_LIMIT:-60}
      # PII at rest (docs/04 §7.2): AES-256-GCM, key ring versi 1 (rotasi: docs/runbooks/pii-key-rotation.md)
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      # Rotasi (U2): kunci v2+ via override yang me-mount pii_encryption_key_v<N> + PII_ENCRYPTION_KEY_V<N>_FILE,
      # lalu naikkan versi aktif, jalankan `node dist/cli/pii-reencrypt.js`, baru pensiunkan (PII_RETIRED_VERSIONS).
      PII_ACTIVE_KEY_VERSION: ${PII_ACTIVE_KEY_VERSION:-1}
      PII_RETIRED_VERSIONS: ${PII_RETIRED_VERSIONS:-}
      # Captcha OTP ALTCHA (docs/04 §8.1)
      ALTCHA_HMAC_KEY_FILE: /run/secrets/altcha_hmac_key
      # K-7 (G13): endpoint migrasi /internal/v1/migration/* (server-to-server, TIDAK dirutekan Traefik publik).
      # Default false -> 404. Production: aktif sementara hanya lewat config manifest bertanda tangan (SEC-50).
      MIGRATION_ENABLED: ${MIGRATION_ENABLED:-false}
      MIGRATION_API_KEY_FILE: /run/secrets/migration_api_key
      # /metrics di listener mTLS terpisah (docs/04 §8.10/§8.11): https://api-gateway:9464/metrics, klien CN prometheus.
      # Port tidak dipublish; Prometheus menjangkau lewat network `internal`.
      METRICS_PORT: "9464"
      METRICS_TLS_CLIENT_ALLOWED_CN: prometheus
      METRICS_CLIENT_CA_FILE: /run/secrets/efn_ca_crt
      # Consent (docs/04 §8.9): versi + sha256 teks AKTIF. Kosong -> grant 503 consent_unavailable. Dev: compose dev.
      CONSENT_LOCATION_VERSION: ${CONSENT_LOCATION_VERSION:-}
      CONSENT_LOCATION_TEXT_SHA256: ${CONSENT_LOCATION_TEXT_SHA256:-}
      CONSENT_MARKETING_VERSION: ${CONSENT_MARKETING_VERSION:-}
      CONSENT_MARKETING_TEXT_SHA256: ${CONSENT_MARKETING_TEXT_SHA256:-}
      # G27 §18.3a: persetujuan Kebijakan Privasi saat masuk/daftar (teks DRAFT DPO/Legal = web lib/consent.ts + app).
      CONSENT_PRIVACY_VERSION: ${CONSENT_PRIVACY_VERSION:-}
      CONSENT_PRIVACY_TEXT_SHA256: ${CONSENT_PRIVACY_TEXT_SHA256:-}
      PRIVACY_CONSENT_ENFORCED: ${PRIVACY_CONSENT_ENFORCED:-false}
      # DSAR & retensi (docs/04 §8.4; default usulan, menunggu DPO)
      DSAR_DELETE_GRACE_DAYS: ${DSAR_DELETE_GRACE_DAYS:-7}
      # W-18/W-19 (keputusan pemilik proyek 10 Okt 2026, PDP v7): batas tunda erasure karena pesanan online terbuka
      # (Q-P18, 1..14), daftar tolak migrasi subjek terhapus (Q-P12, 0..730), usia minimum member (Q-P3, 17..21),
      # koordinat Price Hunter di-NULL-kan setelah N hari (Q-P8). Validasi rentang: scripts/lib/deploy-validate.sh.
      DSAR_OPEN_ORDER_MAX_DEFER_DAYS: ${DSAR_OPEN_ORDER_MAX_DEFER_DAYS:-14}
      ERASURE_SUPPRESSION_DAYS: ${ERASURE_SUPPRESSION_DAYS:-365}
      MEMBER_MIN_AGE: ${MEMBER_MIN_AGE:-17}
      PRICE_HUNTER_GEO_RETENTION_DAYS: ${PRICE_HUNTER_GEO_RETENTION_DAYS:-90}
      OTP_AUDIT_RETENTION_DAYS: "90"
      PRICE_HUNTER_USER_ENC_RETENTION_DAYS: ${MARKET_SCOUT_PHOTO_RETENTION_DAYS:-90}
      PRICE_HUNTER_REPORT_RETENTION_DAYS: "730"
      # Payment gateway-agnostic (docs/04 §8.3). Base/dev/staging: mock. Produksi WAJIB eksplisit (prod override +
      # deploy.sh menolak mock). Kunci provider hanya di-mount bila != mock (docker-compose.payment.yml).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # WhatsApp Cloud API resmi (WHATSAPP_ENABLED=false -> sender console, token tidak dipakai)
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-efn_otp}
      WHATSAPP_TOKEN_FILE: /run/secrets/whatsapp_token
      # Object storage lewat filter L7 s3-gateway (ADR-030); user bff (bukan root), access key = secret acak (§8.12)
      MINIO_ENDPOINT: s3-gateway
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "true"
      MINIO_CA_FILE: /run/secrets/efn_ca_crt
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_bff_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_bff_secret
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      # ── G17 penjualan online (docs/04 §10.13; angka = PLACEHOLDER pilot §10.1, menunggu Q-ON*) ──
      # Kill switch: default false (production). Dev/staging menyalakan lewat .env (ONLINE_ENABLED=true).
      ONLINE_ENABLED: ${ONLINE_ENABLED:-false}
      ONLINE_CATALOG_ENABLED: ${ONLINE_CATALOG_ENABLED:-false}
      LOYALTY_EARN_EXCLUDE_POINT_PAYMENT: ${LOYALTY_EARN_EXCLUDE_POINT_PAYMENT:-true}
      LOYALTY_POINT_VALUE_IDR: ${LOYALTY_POINT_VALUE_IDR:-100}   # nilai 1 poin (Rp), Q-13 Finance; dibaca juga etl (SEC-118)
      # r11 (L-25f/l, SEC-118/124): toleransi nilai restore poin (% nilai redeem; 0..50 di deploy-validate) dan retensi
      # reservasi committed (nilai keuangan, >= 10 th, Q-P2) - rekonsiliasi K-18-6 tidak positif palsu setelah erasure.
      LOYALTY_RESTORE_TOLERANCE_PCT: ${LOYALTY_RESTORE_TOLERANCE_PCT:-10}
      LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS: ${LOYALTY_COMMITTED_RESERVATION_RETENTION_DAYS:-3650}
      # G20 (docs/04 §12.1): kode kanal = kode PT (GL, PB, BCR, BCF; G24 §16.1: WTZ; 23 Nov 2026: SMD); RTL/FNB dan kanal G19 berhifen dihapus
      ONLINE_CHANNELS: ${ONLINE_CHANNELS:-GL}
      ONLINE_FULFILMENTS: ${ONLINE_FULFILMENTS:-pickup}
      # G19 W-02 (docs/04 §11.1): reservasi stok 1 jam. URUTAN AKTIVASI: payment_timeout_minutes kanal Odoo = 70 DULU,
      # baru BFF 3600 (aturan Odoo >= BFF + 10 menit; runbook online-orders.md#aktivasi-reservasi-1-jam). Lingkungan
      # yang Odoo-nya belum 70: set ONLINE_PAYMENT_TIMEOUT_SECONDS=900 eksplisit (config rilis) sampai Odoo diubah.
      ONLINE_PAYMENT_TIMEOUT_SECONDS: ${ONLINE_PAYMENT_TIMEOUT_SECONDS:-3600}
      ONLINE_QUOTE_TTL_SECONDS: ${ONLINE_QUOTE_TTL_SECONDS:-600}
      # L-32: maks 2 order terbuka per member sejak reservasi aktif (anti stock griefing)
      ONLINE_MAX_OPEN_ORDERS_PER_MEMBER: ${ONLINE_MAX_OPEN_ORDERS_PER_MEMBER:-2}
      # G20 W-30 (docs/04 §12.2 no. 2): maks order `counter` (bayar di kasir) terbuka per member -> 429 too_many_open_orders
      ONLINE_MAX_OPEN_COUNTER_ORDERS_PER_MEMBER: ${ONLINE_MAX_OPEN_COUNTER_ORDERS_PER_MEMBER:-1}
      # G26 L-95/L-103 (docs/04 §17.10): pesanan online wajib bayar dulu; counter dibekukan (dev: ONLINE_COUNTER_LEGACY)
      ONLINE_PAYMENT_METHODS: ${ONLINE_PAYMENT_METHODS:-qris,bank_transfer}
      ONLINE_COUNTER_LEGACY: ${ONLINE_COUNTER_LEGACY:-false}
      ONLINE_TRANSFER_MAX_UPLOADS: ${ONLINE_TRANSFER_MAX_UPLOADS:-3}
      ONLINE_TRANSFER_MIN_VERIFY_SECONDS: ${ONLINE_TRANSFER_MIN_VERIFY_SECONDS:-600}
      ONLINE_MAX_OPEN_TRANSFER_ORDERS_PER_MEMBER: ${ONLINE_MAX_OPEN_TRANSFER_ORDERS_PER_MEMBER:-1}
      # G19 W-09 (docs/04 §11.2 no. 6): quote ber-promo_codes dihitung terpisah (anti-enumerasi kupon) -> 429 rate_limited
      ONLINE_RL_PROMO_MEMBER_LIMIT: ${ONLINE_RL_PROMO_MEMBER_LIMIT:-10}
      ONLINE_RL_PROMO_MEMBER_WINDOW_SECONDS: ${ONLINE_RL_PROMO_MEMBER_WINDOW_SECONDS:-900}
      ONLINE_RL_PROMO_IP_LIMIT: ${ONLINE_RL_PROMO_IP_LIMIT:-30}
      ONLINE_RL_PROMO_IP_WINDOW_SECONDS: ${ONLINE_RL_PROMO_IP_WINDOW_SECONDS:-900}
      ONLINE_CATALOG_SYNC_SECONDS: ${ONLINE_CATALOG_SYNC_SECONDS:-300}
      ONLINE_PICKUP_CODE_MAX_DAYS: ${ONLINE_PICKUP_CODE_MAX_DAYS:-7}
      # Retensi (L-5; Q-P17 diputuskan 10 Okt 2026: tautan 730 h, event 180 h)
      ONLINE_ORDER_MEMBER_LINK_DAYS: ${ONLINE_ORDER_MEMBER_LINK_DAYS:-730}
      ONLINE_EVENT_RETENTION_DAYS: ${ONLINE_EVENT_RETENTION_DAYS:-180}
      # W-19 (Q-P19, diputuskan 10 Okt 2026): audit CLI CS 10 tahun
      ONLINE_ADMIN_AUDIT_RETENTION_DAYS: ${ONLINE_ADMIN_AUDIT_RETENTION_DAYS:-3650}
      # BFF -> Odoo /json/2 HANYA lewat filter odoo-rpc-gateway (mTLS: klien CN api-gateway = sertifikat BFF ber-EKU
      # server+client, gen-pki.sh profil `both`; verify-full CA internal, hostname odoo-rpc-gateway)
      ODOO_RPC_URL: https://odoo-rpc-gateway:8443
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      ODOO_RPC_TIMEOUT_MS: ${ODOO_RPC_TIMEOUT_MS:-8000}
      # SEC-96/SEC-109 (L-19f): pool konkurensi json2 BFF terpisah jalur publik (katalog/stok/quote) vs saga.
      # Aturan: PUBLIC + SAGA <= ODOO_RPC_MAXCONN gateway (deploy-validate). Base/dev: 2 + 2 = maxconn 4;
      # prod pilot (opsi B, 10 Okt 2026): 1 + 1 = maxconn 2 (docker-compose.prod.yml).
      ODOO_RPC_PUBLIC_MAX_CONCURRENCY: ${ODOO_RPC_PUBLIC_MAX_CONCURRENCY:-2}
      ODOO_RPC_SAGA_MAX_CONCURRENCY: ${ODOO_RPC_SAGA_MAX_CONCURRENCY:-2}
      ODOO_RPC_CA_FILE: /run/secrets/efn_ca_crt
      ODOO_RPC_CLIENT_CERT_FILE: /run/secrets/tls_api_gateway_crt
      ODOO_RPC_CLIENT_KEY_FILE: /run/secrets/tls_api_gateway_key
      # API key per kanal (satu key = satu user teknis = satu kanal). Kanal default GL di base; PB/BCR/BCF/WTZ/SMD: env
      # ODOO_API_KEY_ONLINE_<KODE>_FILE + secret di overlay docker-compose.online-<kode>.yml (docs/04 §12.1).
      ODOO_API_KEY_ONLINE_GL_FILE: /run/secrets/odoo_api_key_online_gl
      ODOO_ONLINE_EVENT_HMAC_FILE: /run/secrets/odoo_online_event_hmac
      # G21 (docs/04 §13.1 no. 3-4, L-61): verifikasi tanda tangan PUT /v1/pos/loyalty/policies (replay window 300 s)
      LOYALTY_POLICY_SIGNING_KEY_FILE: /run/secrets/loyalty_policy_signing_key
      # ── G22 (docs/04 §14; angka = PLACEHOLDER kontrak, rentang divalidasi scripts/lib/deploy-validate.sh) ──
      # W-07 QR order meja (§14.A.9). Kill switch default false. Production true butuh FNB_QR_BASE_URL_<PT> https +
      # API key QR nyata per PT (deploy.sh) -> overlay docker-compose.online-qr-<pt>.yml me-mount key QR PT itu saja.
      FNB_QR_ENABLED: ${FNB_QR_ENABLED:-false}
      FNB_QR_COMPANIES: ${FNB_QR_COMPANIES:-PB,BCF}
      FNB_QR_BASE_URL_PB: ${FNB_QR_BASE_URL_PB:-}
      FNB_QR_BASE_URL_BCF: ${FNB_QR_BASE_URL_BCF:-}
      FNB_QR_POINTS_ENABLED: ${FNB_QR_POINTS_ENABLED:-false}
      FNB_TABLE_SESSION_TTL_SECONDS: ${FNB_TABLE_SESSION_TTL_SECONDS:-14400}
      FNB_MAX_SUBMISSIONS_PER_SESSION: ${FNB_MAX_SUBMISSIONS_PER_SESSION:-10}
      FNB_MAX_ITEMS_PER_SESSION: ${FNB_MAX_ITEMS_PER_SESSION:-150}
      FNB_MAX_LINES: ${FNB_MAX_LINES:-30}
      FNB_MAX_LINE_QTY: ${FNB_MAX_LINE_QTY:-20}
      FNB_CAPTCHA_MODE: ${FNB_CAPTCHA_MODE:-off}
      FNB_MENU_SYNC_SECONDS: ${FNB_MENU_SYNC_SECONDS:-300}
      # Retensi (§14.E.5, usulan paket DPO): fnb_* 180 hari; tautan member QR 30 hari setelah sesi ditutup
      FNB_SESSION_RETENTION_DAYS: ${FNB_SESSION_RETENTION_DAYS:-180}
      FNB_SESSION_MEMBER_LINK_DAYS: ${FNB_SESSION_MEMBER_LINK_DAYS:-30}
      # Token sesi meja `fts1.` (HKDF dari secret ini; BFF saja). FNB_TABLE_TOKEN_KEY_PREV_FILE (verifikasi saja) belum
      # di-wire: rotasi = di luar jam layanan (TTL <= 4 jam) - docs/runbooks/fnb-table-token-key.md.
      FNB_TABLE_TOKEN_KEY_FILE: /run/secrets/fnb_table_token_key
      ODOO_FNB_EVENT_HMAC_FILE: /run/secrets/odoo_fnb_event_hmac
      # W-12 poin online (§14.C.1 no. 5): kill switch default false (+ flag kanal Odoo loyalty_redeem/loyalty_earn)
      ONLINE_LOYALTY_REDEEM_ENABLED: ${ONLINE_LOYALTY_REDEEM_ENABLED:-false}
      ONLINE_LOYALTY_EARN_ENABLED: ${ONLINE_LOYALTY_EARN_ENABLED:-false}
      # W-17 poin hangus 12 bulan tidak aktif (§14.D.8). L-73: job & anonimisasi OFF di production sampai Legal/DPO/Meta
      # setuju; deploy-validate menolak true tanpa izin Superadmin EFN_ALLOW_FEATURE_ON (/etc/efn/deploy.conf). DRY_RUN
      # default true (run pertama tiap lingkungan hanya menghitung). D-22-18: LOYALTY_POINT_EXPIRY_DAYS DIHAPUS (jangan
      # ditambahkan lagi; deploy-validate & check-encryption menolaknya) -> LOYALTY_POINT_MAX_AGE_DAYS (0 = tanpa umur).
      LOYALTY_EXPIRY_ENABLED: ${LOYALTY_EXPIRY_ENABLED:-false}
      LOYALTY_EXPIRY_DRY_RUN: ${LOYALTY_EXPIRY_DRY_RUN:-true}
      LOYALTY_INACTIVITY_EXPIRY_MONTHS: ${LOYALTY_INACTIVITY_EXPIRY_MONTHS:-12}
      LOYALTY_EXPIRY_NOTICE_DAYS: ${LOYALTY_EXPIRY_NOTICE_DAYS:-30}
      LOYALTY_EXPIRY_RUN_HOUR_WIB: ${LOYALTY_EXPIRY_RUN_HOUR_WIB:-1}
      LOYALTY_EXPIRY_NOTICE_HOUR_WIB: ${LOYALTY_EXPIRY_NOTICE_HOUR_WIB:-10}
      LOYALTY_EXPIRY_BATCH_SIZE: ${LOYALTY_EXPIRY_BATCH_SIZE:-500}
      LOYALTY_EXPIRY_MAX_PER_RUN: ${LOYALTY_EXPIRY_MAX_PER_RUN:-20000}
      LOYALTY_ACTIVITY_EPOCH: ${LOYALTY_ACTIVITY_EPOCH:-}
      LOYALTY_POINT_MAX_AGE_DAYS: ${LOYALTY_POINT_MAX_AGE_DAYS:-0}
      LOYALTY_INACTIVE_ANONYMIZE: ${LOYALTY_INACTIVE_ANONYMIZE:-false}
      LOYALTY_INACTIVE_ANONYMIZE_GRACE_DAYS: ${LOYALTY_INACTIVE_ANONYMIZE_GRACE_DAYS:-0}
      # SEC-171 (r15): notice hangus hanya ke member dengan consent `marketing` aktif. Default true sampai Legal
      # memutuskan dasar hukum; production `false` ditolak deploy-validate kecuali Superadmin mencantumkan nama ini di
      # EFN_ALLOW_FEATURE_ON (/etc/efn/deploy.conf). check-encryption.sh: render prod wajib "true".
      LOYALTY_EXPIRY_NOTICE_REQUIRE_CONSENT: ${LOYALTY_EXPIRY_NOTICE_REQUIRE_CONSENT:-true}
      # ── G23 (docs/04 §15; angka = PLACEHOLDER kontrak Q-BK1..7, rentang divalidasi scripts/lib/deploy-validate.sh) ──
      # W-35 reservasi meja PB/BCF. Kill switch default false (/v1/booking/* 503 booking_unavailable). true butuh API key
      # booking nyata per PT (deploy.sh) -> overlay docker-compose.online-booking-<pt>.yml me-mount key PT itu saja.
      BOOKING_ENABLED: ${BOOKING_ENABLED:-false}
      # G27 (docs/04 §18.2): promo Super-App dari Odoo efn_promo. Default mati (GET /v1/promo kosong -> hero lama).
      PROMO_ENABLED: ${PROMO_ENABLED:-false}
      PROMO_PUSH_ENABLED: ${PROMO_PUSH_ENABLED:-false}
      PROMO_COMPANIES: ${PROMO_COMPANIES:-}
      PROMO_SYNC_SECONDS: ${PROMO_SYNC_SECONDS:-120}
      # G31 (docs/04 §20): engine MGM (referral, akrual, settle setelah masa retur, clawback). Default MATI (prod wajib
      # false, check-encryption.sh); /v1/me/referral -> 503 mgm_unavailable. Angka = kebijakan Odoo efn_mgm_policy.
      MGM_ENABLED: ${MGM_ENABLED:-false}
      MGM_CLAIM_WINDOW_DAYS: ${MGM_CLAIM_WINDOW_DAYS:-30}
      MGM_SETTLE_INTERVAL_MS: ${MGM_SETTLE_INTERVAL_MS:-300000}
      BOOKING_COMPANIES: ${BOOKING_COMPANIES:-PB,BCF}
      BOOKING_MAX_ACTIVE_PER_MEMBER: ${BOOKING_MAX_ACTIVE_PER_MEMBER:-2}
      BOOKING_MEMBER_LINK_DAYS: ${BOOKING_MEMBER_LINK_DAYS:-180}
      BOOKING_RETENTION_DAYS: ${BOOKING_RETENTION_DAYS:-400}
      ODOO_BOOKING_EVENT_HMAC_FILE: /run/secrets/odoo_booking_event_hmac
      # W-36 pre-order berjadwal (§15.4). Kill switch default false (/v1/catalog/slots 503 slots_unavailable; pickup_slot
      # di keranjang diabaikan). Slot juga harus diaktifkan per outlet di Odoo (efn_online_slot).
      ONLINE_SLOTS_ENABLED: ${ONLINE_SLOTS_ENABLED:-false}
      MINIO_CATALOG_BUCKET: catalog
      # ── G50 (docs/04 §28.6-§28.10; ADR-044/047/048 Proposed). SEMUA flag default false di semua env. Production:
      # BEHAVIOR_TRACKING_ENABLED / PROMO_CAMPAIGN_ENABLED / WA_UNOFFICIAL_ENABLED = OFF; deploy-validate menolak true
      # tanpa ref persetujuan (+ izin Superadmin EFN_ALLOW_FEATURE_ON). Runbook: docs/runbooks/supermarket-campaign-channels.md
      BEHAVIOR_TRACKING_ENABLED: ${BEHAVIOR_TRACKING_ENABLED:-false}
      BEHAVIOR_SUBJECT_PEPPER_FILE: /run/secrets/behavior_subject_pepper
      BEHAVIOR_DEVICE_PEPPER_FILE: /run/secrets/behavior_device_pepper
      BEHAVIOR_RL_DEVICE_PER_MIN: ${BEHAVIOR_RL_DEVICE_PER_MIN:-120}
      BEHAVIOR_RL_IP_PER_MIN: ${BEHAVIOR_RL_IP_PER_MIN:-600}
      # L-153: staging event 1..7 hari (lebih lama = keputusan DPO)
      BEHAVIOR_EVENT_RETENTION_DAYS: ${BEHAVIOR_EVENT_RETENTION_DAYS:-7}
      BEHAVIOR_DEVICE_LINK_IDLE_DAYS: ${BEHAVIOR_DEVICE_LINK_IDLE_DAYS:-180}
      BEHAVIOR_DEVICE_CONSENT_RETENTION_DAYS: ${BEHAVIOR_DEVICE_CONSENT_RETENTION_DAYS:-400}
      BEHAVIOR_ERASED_SUBJECT_RETENTION_DAYS: ${BEHAVIOR_ERASED_SUBJECT_RETENTION_DAYS:-100}
      SEGMENT_RETENTION_DAYS: ${SEGMENT_RETENTION_DAYS:-30}
      # Teks consent `tracking` aktif (versi + sha256 UTF-8 body teks frontend). Kosong = banner tidak tampil, grant 503.
      CONSENT_TRACKING_VERSION: ${CONSENT_TRACKING_VERSION:-}
      CONSENT_TRACKING_TEXT_SHA256: ${CONSENT_TRACKING_TEXT_SHA256:-}
      WISHLIST_ENABLED: ${WISHLIST_ENABLED:-false}
      RESTOCK_ALERT_ENABLED: ${RESTOCK_ALERT_ENABLED:-false}
      PRICE_ALERT_ENABLED: ${PRICE_ALERT_ENABLED:-false}
      ALERT_WATCH_INTERVAL_SECONDS: ${ALERT_WATCH_INTERVAL_SECONDS:-300}
      PROMO_CAMPAIGN_ENABLED: ${PROMO_CAMPAIGN_ENABLED:-false}
      CAMPAIGN_FREQUENCY_CAP_ENABLED: ${CAMPAIGN_FREQUENCY_CAP_ENABLED:-false}
      CAMPAIGN_BUDGET_CAP_ENABLED: ${CAMPAIGN_BUDGET_CAP_ENABLED:-false}
      CAMPAIGN_MAX_PER_MEMBER_PER_WEEK: ${CAMPAIGN_MAX_PER_MEMBER_PER_WEEK:-2}
      CAMPAIGN_COMPANIES: ${CAMPAIGN_COMPANIES:-SMD}
      CAMPAIGN_SYNC_SECONDS: ${CAMPAIGN_SYNC_SECONDS:-60}
      # API key user teknis efn_campaign_<pt> (path #30-#31). PT baru = secret + env + mount + regex check-encryption.
      ODOO_API_KEY_CAMPAIGN_SMD_FILE: /run/secrets/odoo_api_key_campaign_smd
      # §28.7: listener HTTPS mTLS terpisah untuk POST /internal/v1/segments/*/members (hanya dibuka bila
      # PROMO_CAMPAIGN_ENABLED=true). Port TIDAK dipublish dan tanpa label Traefik; klien hanya CN segment-worker lewat
      # network segment-bff (overlay docker-compose.segment.yml).
      SEGMENT_INTERNAL_PORT: "9466"
      SEGMENT_TLS_CLIENT_ALLOWED_CN: segment-worker
      SEGMENT_CLIENT_CA_FILE: /run/secrets/efn_ca_crt
      # ADR-048 kanal email: implicit|starttls saja (tanpa mode plaintext, L-160). Production butuh penyedia + DPA +
      # SPF/DKIM/DMARC (Q-SM19). EMAIL_SMTP_CA_FILE kosong = CA sistem (penyedia publik); dev = CA internal (Mailpit).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_TLS_MODE: ${EMAIL_SMTP_TLS_MODE:-implicit}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD_FILE: /run/secrets/email_smtp_password
      EMAIL_SMTP_CA_FILE: ${EMAIL_SMTP_CA_FILE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_RATE_PER_MIN: ${EMAIL_RATE_PER_MIN:-60}
      EMAIL_UNSUBSCRIBE_KEY_FILE: /run/secrets/email_unsubscribe_key
      EMAIL_UNSUBSCRIBE_URL: ${EMAIL_UNSUBSCRIBE_URL:-}
      EMAIL_UNSUBSCRIBE_MAILTO: ${EMAIL_UNSUBSCRIBE_MAILTO:-}
      EMAIL_UNSUBSCRIBE_TTL_DAYS: ${EMAIL_UNSUBSCRIBE_TTL_DAYS:-30}
      EMAIL_UNSUBSCRIBE_RATE_PER_MIN: ${EMAIL_UNSUBSCRIBE_RATE_PER_MIN:-10}
      EMAIL_BRAND_NAME: ${EMAIL_BRAND_NAME:-EFN}
      # ADR-044: BFF mematikan kanal (log error) bila production tanpa ref; kunci HMAC to_hash (wa_unofficial_hash_key)
      # HANYA di-mount overlay docker-compose.wa-unofficial.yml (tanpa overlay = kanal mati: hash_key_missing).
      WA_UNOFFICIAL_ENABLED: ${WA_UNOFFICIAL_ENABLED:-false}
      WA_UNOFFICIAL_RISK_ACCEPTANCE_REF: ${WA_UNOFFICIAL_RISK_ACCEPTANCE_REF:-}
      CHANNEL_RETENTION_INTERVAL_MS: ${CHANNEL_RETENTION_INTERVAL_MS:-21600000}
    secrets:
      - efn_ca_crt
      - tls_api_gateway_crt
      - tls_api_gateway_key
      - pg_password_bff
      - redis_password_bff
      - rabbitmq_password_bff
      - minio_bff_access_key
      - minio_bff_secret
      - jwt_secret
      - otp_pepper
      - discount_token_secret
      - odoo_bff_api_key
      - whatsapp_token
      - webhook_payment_secret
      - pii_encryption_key
      - altcha_hmac_key
      - migration_api_key
      - odoo_api_key_online_gl
      - odoo_online_event_hmac
      - loyalty_policy_signing_key
      - fnb_table_token_key
      - odoo_fnb_event_hmac
      - odoo_booking_event_hmac
      # G50 (docs/04 §28.10): hanya BFF
      - behavior_subject_pepper
      - behavior_device_pepper
      - email_smtp_password
      - email_unsubscribe_key
      - odoo_api_key_campaign_smd
    # K25-06: alias `api-gateway-metrics` HANYA di network `internal` -> dns_sd Prometheus mendapat IP internal setiap
    # replika tanpa menyebut nama network (`api-gateway.<stack>_internal`). Dicek check-encryption.sh.
    networks:
      internal:
        aliases: [api-gateway-metrics]
      data:
      cache:
      egress:
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: api-gateway
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      # Tidak lewat router publik (docs/04 §1-2, ADR-002):
      #   /metrics    -> tidak ada di :3000 lagi; Prometheus scrape https://api-gateway:9464 (mTLS, tidak lewat Traefik)
      #   /v1/pos/*   -> server-to-server Odoo (efn.bff_url = https://api-gateway:3000)
      #   /internal/* -> server-to-server
      #   /v1/webhooks/* -> hanya router api-webhook-payments di bawah (POST saja)
      traefik.http.routers.api.rule: >-
        Host(`api.${TRAEFIK_DOMAIN:-efn.local}`) && !PathPrefix(`/metrics`)
        && !PathPrefix(`/v1/pos`) && !PathPrefix(`/internal`) && !PathPrefix(`/v1/webhooks`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.routers.api.middlewares: secure-headers@file,ratelimit-api@file
      traefik.http.routers.api.service: api
      # Webhook payment provider (docs/04 §8.3): publik, POST saja, bucket rate limit terpisah. Verifikasi
      # signature/HMAC + replay window + idempotensi di BFF.
      traefik.http.routers.api-webhook-payments.rule: >-
        Host(`api.${TRAEFIK_DOMAIN:-efn.local}`) && Method(`POST`) && PathPrefix(`/v1/webhooks/payments/`)
      traefik.http.routers.api-webhook-payments.priority: "200"
      traefik.http.routers.api-webhook-payments.entrypoints: websecure
      traefik.http.routers.api-webhook-payments.tls.certresolver: letsencrypt
      traefik.http.routers.api-webhook-payments.middlewares: secure-headers@file,ratelimit-webhook@file
      traefik.http.routers.api-webhook-payments.service: api
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.server.scheme: https
      traefik.http.services.api.loadbalancer.serversTransport: efn-api-gateway@file
    healthcheck:
      # healthcheck.js image BFF: HTTPS loopback, verifikasi CA (HEALTHCHECK_CA_FILE) + servername api-gateway
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ───────────────────────── WEB ─────────────────────────
  # Satu app Next.js melayani beberapa host: app (super-app), mart (supermarket), kitchen (F&B).
  # Next.js standalone listen 127.0.0.1:3001; TLS oleh sidecar superapp-web-tls (:3443).
  superapp-web:
    <<: *common
    image: ${IMAGE_SUPERAPP_WEB:-ghcr.io/${EFN_STACK:-efn}/superapp-web:dev}
    build:
      context: ../../services/superapp-web
    profiles: ["core"]
    depends_on: [api-gateway]
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      HOSTNAME: 127.0.0.1
      PORT: "3001"
      # Browser tidak memanggil BFF langsung; Next.js server-side meneruskan request lewat HTTPS terverifikasi.
      # CSP dikirim oleh Next.js sendiri; middleware Traefik secure-headers@file sengaja tidak menyetel CSP.
      BFF_INTERNAL_URL: https://api-gateway:3000
      NODE_EXTRA_CA_CERTS: /run/secrets/efn_ca_crt
      # G17: simulator pembayaran (tombol "simulasikan bayar", lib/orders-server.ts) - nilai TETAP false (bukan ${..}),
      # hanya docker-compose.dev.yml menyalakannya. check-encryption.sh menolak nilai lain di render prod.
      EFN_PAYMENT_SIMULATOR: "false"
    secrets: [efn_ca_crt]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: superapp-web
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      traefik.http.routers.web.rule: >-
        Host(`app.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`${TRAEFIK_DOMAIN:-efn.local}`)
        || Host(`grandlucky.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`parisbaguette.${TRAEFIK_DOMAIN:-efn.local}`)
        || Host(`bacha.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`wetzels.${TRAEFIK_DOMAIN:-efn.local}`)
        || Host(`supermarket.${TRAEFIK_DOMAIN:-efn.local}`)
        || Host(`mart.${TRAEFIK_DOMAIN:-efn.local}`) || Host(`kitchen.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: letsencrypt
      traefik.http.routers.web.middlewares: secure-headers@file
      traefik.http.services.web.loadbalancer.server.port: "3443"
      traefik.http.services.web.loadbalancer.server.scheme: https
      traefik.http.services.web.loadbalancer.serversTransport: efn-superapp-web@file
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  superapp-web-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:superapp-web"
    depends_on: [superapp-web]
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3001
      - --cert=/run/secrets/tls_superapp_web_crt
      - --key=/run/secrets/tls_superapp_web_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6063
      - --quiet=conns
    secrets: [efn_ca_crt, tls_superapp_web_crt, tls_superapp_web_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6063/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: superapp-web-tls

  # ───────────────────────── ANALYTICS ─────────────────────────
  # ClickHouse: HTTPS 8443 + native TLS 9440 saja (config.d/tls.xml), disk terenkripsi (config.d/encrypted-storage.xml,
  # kunci clickhouse_disk_key). Skema/user/grant dipasang one-shot `clickhouse-init` lewat TLS (bukan initdb.d
  # bawaan yang memakai port native plaintext).
  # Tidak cap_drop/read_only: entrypoint ClickHouse butuh chown + IPC_LOCK/SYS_NICE dan menulis /etc/clickhouse-server.
  clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    profiles: ["data"]
    # image tidak mendukung *_FILE: baca secret di entrypoint wrapper
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export CLICKHOUSE_PASSWORD="$$(cat /run/secrets/clickhouse_password)"
        CLICKHOUSE_DISK_KEY_HEX="$$(cat /run/secrets/clickhouse_disk_key)";
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-efn}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [clickhouse_password, clickhouse_disk_key, efn_ca_crt, tls_clickhouse_crt, tls_clickhouse_key]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/config.d/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro
      - ../clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config.d/encrypted-storage.xml:/etc/clickhouse-server/config.d/encrypted-storage.xml:ro
      - ../clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
      - ../clickhouse/client-config.xml:/etc/clickhouse-client/config.xml:ro
    # insight-data (G42): klien insight-web saja (user efn_insight, HTTPS 8443); sertifikat ber-SAN `clickhouse` berlaku
    # di network mana pun. Overlay docker-compose.esb.yml menambah `esb` (union).
    networks: [data, insight-data]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    deploy:
      resources:
        limits: { memory: 4G }
    healthcheck:
      # Liveness loopback di namespace sendiri (bukan transaksi data); busybox wget tidak punya opsi CA.
      # Verifikasi TLS penuh dilakukan clickhouse-init dan probe-internal-tls Prometheus.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      service: clickhouse

  clickhouse-init:
    <<: *common
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    profiles: ["data"]
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "101:101"
    entrypoint: ["/bin/sh", "/efn/clickhouse-init.sh"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-efn}
      # TTL (W-19, keputusan 10 Okt 2026): baris mart 10 th; kolom pseudonim (user_hash/member_hash/customer_id) 5 th;
      # koordinat Price Hunter 90 h. Rentang: deploy-validate (mart 1..30, pseudonim 1..mart, geo 1..3650).
      CH_MART_RETENTION_YEARS: ${CH_MART_RETENTION_YEARS:-10}
      CH_PSEUDONYM_RETENTION_YEARS: ${CH_PSEUDONYM_RETENTION_YEARS:-5}
      CH_GEO_RETENTION_DAYS: ${CH_GEO_RETENTION_DAYS:-90}
      # SEC-215 (G44): user efn_forecast_reader hanya boleh login dari subnet network forecast-ch (overlay
      # docker-compose.forecast.yml). WAJIB sama dengan ipam forecast-ch (dicek scripts/check-encryption.sh); antar-mesin
      # (K25-02, belum dibangun) = subnet WireGuard mesin data. Divalidasi clickhouse-init (CIDR privat /24../32, SEC-223).
      # K25-06: default = <EFN_SUBNET_BASE>.11.0/24 (ipam forecast-ch).
      CH_FORECAST_READER_HOST_CIDR: ${CH_FORECAST_READER_HOST_CIDR:-${EFN_SUBNET_BASE:-172.30}.11.0/24}
      # K25-06 + pola SEC-215: user efn_segment_reader hanya dari subnet network segment-ch (overlay
      # docker-compose.segment.yml, <EFN_SUBNET_BASE>.17.0/24). WAJIB sama dengan ipam segment-ch (check-encryption).
      CH_SEGMENT_READER_HOST_CIDR: ${CH_SEGMENT_READER_HOST_CIDR:-${EFN_SUBNET_BASE:-172.30}.17.0/24}
    secrets:
      - clickhouse_password
      - clickhouse_password_etl
      - clickhouse_password_text2sql
      - clickhouse_password_metabase
      - clickhouse_password_esb   # G41: user efn_esb (docs/04 §25); service esb-extract di overlay docker-compose.esb.yml
      - clickhouse_password_forecast   # G44: user efn_forecast_reader (docs/04 §28.2); forecast-worker di overlay forecast
      - clickhouse_password_segment    # G50: user efn_segment_reader (docs/04 §28.7); segment-worker di overlay segment
      - text2sql_scope_key   # G38: kunci row policy cakupan PT efn_t2s (docs/04 §23.3)
      # G42 (docs/04 §26.7): user efn_insight + row policy efn_insight_scope. WAJIB di setiap env: clickhouse-init gagal
      # (fail closed) bila salah satu tidak terbaca, sehingga profil `data` tidak naik.
      - clickhouse_password_insight
      - insight_scope_key
      # G43 (docs/04 §27.10): user efn_mig (role mig_rw) HANYA bila secret bukan placeholder `disabled`; selain itu
      # clickhouse-init menghapus user (migrasi nonaktif). Jendela migrasi: isi secret di host lalu jalankan ulang init.
      - clickhouse_password_mig
      - efn_ca_crt
    volumes:
      - ../clickhouse/clickhouse-init.sh:/efn/clickhouse-init.sh:ro
      - ../clickhouse/init:/init/schema:ro
      - ../clickhouse/access:/init/access:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    labels:
      service: clickhouse-init

  # Metabase: Jetty listen 127.0.0.1:3000, TLS oleh sidecar metabase-tls (:3443). DB aplikasi: user efn_metabase
  # lewat JDBC sslmode=verify-full. Koneksi ke ClickHouse (HTTPS 8443, user efn_metabase, CA internal) dibuat oleh
  # metabase-provision lewat API dan disimpan TERENKRIPSI di DB `metabase` (G16b) -> service ini TIDAK me-mount
  # clickhouse_password_metabase (SEC-85, least privilege).
  # Capability (SEC-85, diuji di stack dev 9 Okt 2026): cap_drop ALL + minimum untuk run_metabase.sh resmi yang mulai
  # sebagai root: adduser/addgroup + chown /metabase.db & home (CHOWN), `su metabase` busybox (SETUID, SETGID).
  # no-new-privileges (x-common) kompatibel: su dijalankan oleh root (tanpa elevasi setuid). Log start memuat
  # "adduser: /home/metabase: Operation not permitted" (chmod g+s home tanpa FOWNER): diharapkan, home tidak dipakai;
  # hasil uji: healthy, "MB_ENCRYPTION_SECRET_KEY correctly configured", metabase-provision exit 0. Tidak read_only:
  # run_metabase.sh menulis /etc/passwd, /metabase.db dan Metabase menulis /plugins (sample DB) saat start.
  metabase:
    <<: *common
    # G13/G16: image sendiri = metabase v0.58.41 LTS (digest; driver ClickHouse bawaan) - infra/metabase/Dockerfile.
    # Staging/prod: by digest dari manifest rilis bertanda tangan (IMAGE_METABASE, SEC-42).
    image: ${IMAGE_METABASE:-ghcr.io/${EFN_STACK:-efn}/metabase:dev}
    build:
      context: ../metabase
    profiles: ["data"]
    depends_on:
      postgres:
        condition: service_healthy
    # G16b: ENTRYPOINT image = efn-metabase-entrypoint (infra/metabase/efn-entrypoint.sh): membaca
    # metabase_encryption_key -> MB_ENCRYPTION_SECRET_KEY (enkripsi at rest detail koneksi di DB `metabase`;
    # FAIL-CLOSED bila secret tidak ada/pendek). JANGAN override `entrypoint:` di sini (dicek check-encryption.sh).
    # Password DB: MB_DB_PASS_FILE didukung run_metabase.sh resmi (file_env).
    environment:
      MB_JETTY_HOST: 127.0.0.1
      MB_JETTY_PORT: "3000"
      MB_DB_TYPE: postgres
      MB_DB_CONNECTION_URI: "jdbc:postgresql://postgres:5432/metabase?ssl=true&sslmode=verify-full&sslrootcert=/run/secrets/efn_ca_crt"
      MB_DB_USER: efn_metabase
      MB_DB_PASS_FILE: /run/secrets/pg_password_metabase
      # W-19 (Q-P14, 10 Okt 2026): riwayat query (query_execution) 10 tahun - setting internal Metabase, hanya lewat env
      MB_AUDIT_MAX_RETENTION_DAYS: ${MB_AUDIT_MAX_RETENTION_DAYS:-3650}
      JAVA_TIMEZONE: Asia/Jakarta
    secrets: [pg_password_metabase, metabase_encryption_key, efn_ca_crt]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - metabase-data:/metabase-data
    networks: [internal, data]
    deploy:
      resources:
        limits: { memory: 2G }
    labels:
      service: metabase
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      traefik.http.routers.bi.rule: Host(`bi.${TRAEFIK_DOMAIN:-efn.local}`)
      # ADR-023/SEC-21: hanya wg-https + subnet staf (bukan LAN outlet)
      traefik.http.routers.bi.entrypoints: wg-https
      traefik.http.routers.bi.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.bi.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.bi.loadbalancer.server.port: "3443"
      traefik.http.services.bi.loadbalancer.server.scheme: https
      traefik.http.services.bi.loadbalancer.serversTransport: efn-metabase@file
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]   # loopback namespace sendiri
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  metabase-tls:
    <<: *ghostunnel
    profiles: ["data"]
    network_mode: "service:metabase"
    depends_on: [metabase]
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3000
      - --cert=/run/secrets/tls_metabase_crt
      - --key=/run/secrets/tls_metabase_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --allow-cn=metabase-provision   # G13: one-shot provision.py (setup admin segera setelah sehat)
      - --status=http://127.0.0.1:6064
      - --quiet=conns
    secrets: [efn_ca_crt, tls_metabase_crt, tls_metabase_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6064/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: metabase-tls

  # G42 (docs/04 §26, ADR-041 Proposed, K25-02): dashboard staf "Insight" (Next.js standalone, READ-ONLY) di atas mart
  # ESB. Login dari Odoo (efn_insight) lewat token eit1 POST form; sesi = cookie eis1; data dibatasi PT lewat row policy
  # ClickHouse efn_insight_scope bertanda tangan. Runbook: docs/runbooks/insight-web.md.
  # Next.js listen 127.0.0.1:3002 (plaintext hanya di loopback namespace ini); TLS + mTLS oleh sidecar insight-web-tls
  # (:3443, CN traefik + blackbox-exporter). Network least privilege (C7): insight-ingress (Traefik/blackbox) +
  # insight-data (ClickHouse) saja - TANPA egress, internal, data (PostgreSQL/RabbitMQ/Odoo tidak terjangkau).
  # Replika 1 (L-124: cache jti + rate limit di memori; sidecar menempel ke satu container).
  # Non-root: USER image (services/insight-web/Dockerfile target runtime; gate Trivy DS-0002 di build-push).
  insight-web:
    <<: *common
    image: ${IMAGE_INSIGHT_WEB:-ghcr.io/${EFN_STACK:-efn}/insight-web:dev}
    build:
      context: ../../services/insight-web
      target: runtime
    profiles: ["data"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      HOSTNAME: 127.0.0.1
      PORT: "3002"
      NEXT_TELEMETRY_DISABLED: "1"
      # Kill switch (L-125): hanya "true" persis yang aktif; selain itu /sso 404 dan semua halaman/route data menolak
      # (halaman -> /belum-aktif, route data 503; termasuk cookie yang masih berlaku). Satu saklar dengan Odoo.
      INSIGHT_ENABLED: ${INSIGHT_ENABLED:-false}
      # G47: INSIGHT_ACCEPT_EIT1=false setelah semua Odoo menerbitkan eit2 (tutup jalur downgrade, SEC-G47-02).
      INSIGHT_ACCEPT_EIT1: ${INSIGHT_ACCEPT_EIT1:-true}
      # G52 (docs/04 §28.15.10): eit2/eis2 diterima selama true (rollout); set false setelah Odoo 19.0.3.0.0 di semua env.
      INSIGHT_ACCEPT_EIT2: ${INSIGHT_ACCEPT_EIT2:-true}
      # G47 (docs/04 §28.13.12): halaman/query supermarket; hanya "true" persis, default false (satu saklar dengan Odoo).
      INSIGHT_SM_ENABLED: ${INSIGHT_SM_ENABLED:-false}
      # G52 (docs/04 §28.15.10): halaman /fnb/*; hanya "true" persis, default false (satu saklar dengan Odoo).
      INSIGHT_FNB_PERSONA_ENABLED: ${INSIGHT_FNB_PERSONA_ENABLED:-false}
      # Forecast F&B: kode gudang pusat (agregat outlet; samakan dengan FORECAST_DC_CODES) dikeluarkan dari total; dipisah koma, default kosong.
      INSIGHT_FNB_DC_CODES: ${INSIGHT_FNB_DC_CODES:-}
      # ClickHouse HTTPS terverifikasi CA internal (NODE_EXTRA_CA_CERTS); APP_ENV=production menolak non-https.
      CH_URL: https://clickhouse:8443
      CH_USER: efn_insight
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_insight
      INSIGHT_SCOPE_KEY_FILE: /run/secrets/insight_scope_key
      INSIGHT_SSO_KEY_FILE: /run/secrets/insight_sso_key
      INSIGHT_SESSION_KEY_FILE: /run/secrets/insight_session_key
      # Tautan kembali ke Odoo + origin yang diizinkan untuk POST /sso (C1). Dev: :9443 (docker-compose.dev.yml).
      EFN_INSIGHT_ODOO_URL: https://erp.${TRAEFIK_DOMAIN:-efn.local}
      NODE_EXTRA_CA_CERTS: /run/secrets/efn_ca_crt
    secrets:
      - insight_sso_key
      - insight_session_key
      - insight_scope_key
      - clickhouse_password_insight
      - efn_ca_crt
    networks: [insight-ingress, insight-data]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: insight-web
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_insight-ingress
      # ADR-023/ADR-041: HANYA wg-https + subnet staf (internal-ops) sampai Q-INS4 dijawab (docs/04 §26.11/§26.12).
      # secure-headers-insight = secure-headers + Referrer-Policy no-referrer (§26.6); CSP dari Next.js sendiri.
      traefik.http.routers.insight.rule: Host(`insight.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.insight.entrypoints: wg-https
      traefik.http.routers.insight.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.insight.middlewares: internal-ops@file,secure-headers-insight@file,ratelimit-insight@file
      traefik.http.services.insight.loadbalancer.server.port: "3443"
      traefik.http.services.insight.loadbalancer.server.scheme: https
      traefik.http.services.insight.loadbalancer.serversTransport: efn-insight-web@file
    healthcheck:
      # Loopback namespace sendiri; /api/health tidak menyentuh ClickHouse (§26.6)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  insight-web-tls:
    <<: *ghostunnel
    profiles: ["data"]
    network_mode: "service:insight-web"
    depends_on: [insight-web]
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3002
      - --cert=/run/secrets/tls_insight_web_crt
      - --key=/run/secrets/tls_insight_web_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6065
      - --quiet=conns
    secrets: [efn_ca_crt, tls_insight_web_crt, tls_insight_web_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6065/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: insight-web-tls

  # G62 (docs/04 §29, ADR-050): halaman masuk staf bermerek EFN (Next.js standalone). Memilih tujuan (ERP / Insight) lalu
  # redirect (GET /go/<tujuan>) ke URL dari allowlist env (LOGIN_GATEWAY_*_URL); TIDAK menerima password, tanpa cookie sesi, TANPA secret.
  # Runbook: docs/runbooks/login-gateway.md. Pola sama dengan insight-web: Next.js listen 127.0.0.1:3005 (plaintext hanya
  # di loopback namespace ini), TLS + mTLS oleh sidecar login-gateway-tls (:3443, CN traefik + blackbox-exporter).
  # Network: login-ingress saja (Traefik/blackbox) - tanpa egress/internal/data/insight-*. Profil core: pintu masuk ERP
  # (staf + kasir outlet) tidak boleh bergantung pada stack data (K25-02); tujuan Insight nonaktif bila URL kosong.
  # Non-root: USER image (services/login-gateway/Dockerfile target runtime; gate Trivy DS-0002 di build-push).
  # Replika 1: sidecar menempel ke satu container (pola superapp-web/insight-web).
  login-gateway:
    <<: *common
    image: ${IMAGE_LOGIN_GATEWAY:-ghcr.io/${EFN_STACK:-efn}/login-gateway:dev}
    build:
      context: ../../services/login-gateway
      target: runtime
    profiles: ["core"]
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3005"
      NEXT_TELEMETRY_DISABLED: "1"
      # Allowlist tujuan redirect (satu-satunya sumber URL; parameter browser tidak pernah menjadi tujuan). Wajib https
      # absolut (aplikasi menolak selain itu -> tujuan nonaktif). Dev: :9443 (docker-compose.dev.yml); gladi lokal
      # prod di port non-443: set di .env (lihat .env.example).
      LOGIN_GATEWAY_ERP_URL: ${LOGIN_GATEWAY_ERP_URL:-https://erp.${TRAEFIK_DOMAIN:-efn.local}/web/login}
      LOGIN_GATEWAY_INSIGHT_URL: ${LOGIN_GATEWAY_INSIGHT_URL:-https://insight.${TRAEFIK_DOMAIN:-efn.local}/}
    networks: [login-ingress]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    labels:
      service: login-gateway
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_login-ingress
      # ADR-023/ADR-050: HANYA wg-https + internal-only (subnet outlet + staf, sama dengan erp.: kasir outlet juga masuk
      # ERP lewat halaman ini). secure-headers-insight = secure-headers + Referrer-Policy no-referrer, tanpa kamera/lokasi;
      # CSP dari Next.js sendiri (lib/csp.ts).
      traefik.http.routers.login.rule: Host(`login.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.login.entrypoints: wg-https
      traefik.http.routers.login.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.login.middlewares: internal-only@file,secure-headers-insight@file,ratelimit-login@file
      traefik.http.services.login.loadbalancer.server.port: "3443"
      traefik.http.services.login.loadbalancer.server.scheme: https
      traefik.http.services.login.loadbalancer.serversTransport: efn-login-gateway@file
    healthcheck:
      # Loopback namespace sendiri; /healthz tanpa detail dan tanpa dependensi
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Gotcha operasional (G62): sidecar `network_mode: service:<app>` harus di-recreate setiap kali app di-recreate
  # (namespace lama hilang -> Traefik 502). depends_on dengan `restart: true` membuat compose me-restart sidecar ini saat
  # login-gateway di-recreate/restart lewat compose.
  login-gateway-tls:
    <<: *ghostunnel
    profiles: ["core"]
    network_mode: "service:login-gateway"
    depends_on:
      login-gateway:
        condition: service_started
        restart: true
    command:
      - server
      - --listen=0.0.0.0:3443
      - --target=127.0.0.1:3005
      - --cert=/run/secrets/tls_login_gateway_crt
      - --key=/run/secrets/tls_login_gateway_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=traefik
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6077
      - --quiet=conns
    secrets: [efn_ca_crt, tls_login_gateway_crt, tls_login_gateway_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6077/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: login-gateway-tls

  # ETL: user efn_etl (PostgreSQL, grant level kolom) dan efn_etl (ClickHouse, INSERT/SELECT mart).
  # Tidak membaca otp_pepper (SEC-16): hash member sudah dihitung BFF di PostgreSQL.
  # G13 (data-AI infra/metabase/provision.py): setup awal Metabase (admin dari secret), koneksi ClickHouse TLS strict,
  # dashboard sebagai kode. Jalan OTOMATIS begitu metabase-tls sehat: instance yang belum di-setup bisa diklaim siapa
  # pun di subnet staf, jadi tidak boleh ada jeda manual. Idempoten (run ulang = update). Lewat sidecar metabase-tls
  # (HTTPS + mTLS CN metabase-provision, CA internal), tanpa network egress. deploy.sh memeriksa exit code-nya.
  metabase-provision:
    <<: *common
    image: python:3.15-bookworm@sha256:6f060cab421d9509c6c6a6a7762c651baf03c3f1d0145befe16b688762b7fe81
    profiles: ["data"]
    restart: "no"
    depends_on:
      metabase:
        condition: service_healthy
      metabase-tls:
        condition: service_healthy
    user: "65534:65534"
    entrypoint: ["python", "-I", "-B", "/opt/efn-metabase/provision.py"]
    command:
      - --url=https://metabase:3443
      - --ca-file=/run/secrets/efn_ca_crt
      - --client-cert=/run/secrets/tls_metabase_provision_crt
      - --client-key=/run/secrets/tls_metabase_provision_key
      - --admin-email=${METABASE_ADMIN_EMAIL:-admin@efn.local}
      - --admin-password-file=/run/secrets/metabase_admin_password
      - --ch-password-file=/run/secrets/clickhouse_password_metabase
    secrets: [efn_ca_crt, tls_metabase_provision_crt, tls_metabase_provision_key, metabase_admin_password,
              clickhouse_password_metabase]
    volumes:
      - ../metabase:/opt/efn-metabase:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    labels:
      service: metabase-provision

  etl:
    <<: *common
    image: ${IMAGE_ETL:-ghcr.io/${EFN_STACK:-efn}/etl:dev}
    build:
      context: ../../services/etl
    profiles: ["data"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: efn_etl
      PG_PASSWORD_FILE: /run/secrets/pg_password_etl
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      PG_DB: ${PG_DB:-efn_platform}
      ODOO_DB: ${ODOO_DB:-efn_odoo}
      ODOO_PG_HOST: postgres
      ODOO_PG_PORT: "5432"
      ODOO_PG_USER: efn_etl
      ODOO_PG_PASSWORD_FILE: /run/secrets/pg_password_etl
      CH_HOST: clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      CH_CA_FILE: /run/secrets/efn_ca_crt
      CH_DATABASE: efn_dwh
      CH_USER: efn_etl
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_etl
      ETL_INTERVAL_SECONDS: "900"
      # R5: job fact_sales_line dari DB Odoo (butuh services/etl/sql/odoo-readonly-grants.sql; deploy.sh menerapkan
      # grant lalu mengaktifkan otomatis). Dev override: true.
      ETL_ENABLE_ODOO: ${ETL_ENABLE_ODOO:-false}
      # G12: mart GL + salinan audit tamper-evident (services/etl/README.md). Grant yang sama (efn_audit >= 19.0.1.2.0);
      # deploy.sh mengaktifkan otomatis setelah grant sukses. Dev override: true.
      ETL_ENABLE_GL: ${ETL_ENABLE_GL:-false}
      ETL_AUDIT_COPY_ENABLED: ${ETL_AUDIT_COPY_ENABLED:-false}
      # G18 (data-AI, epoch rantai): ETL_AUDIT_EPOCH_AUTO TETAP false di base/prod (restore produksi = penanda
      # efn_audit.chain_epoch lewat ORM, backup-restore.md §4); jumlah log terbaru yang dicek identitasnya (1..1000).
      ETL_AUDIT_EPOCH_AUTO: "false"
      ETL_AUDIT_EPOCH_ANCHORS: ${ETL_AUDIT_EPOCH_ANCHORS:-20}
      # G14: rekonsiliasi ledger poin vs pos.order mulai dari go-live loyalty POS (UTC, YYYY-MM-DDTHH:MM:SSZ). Nilai dari
      # manifest rilis bertanda tangan (SEC-50, deploy-validate.sh); kosong = semua order dalam jendela lookback.
      ETL_LOYALTY_RECON_NOT_BEFORE: ${ETL_LOYALTY_RECON_NOT_BEFORE:-}
      # SEC-114 (L-25b): default payment (E-30 = desain G18); product hanya data historis (ditolak deploy-validate di production)
      ETL_LOYALTY_POINTS_MODE: ${ETL_LOYALTY_POINTS_MODE:-payment}
      # G21/G22 (QA G22 P2-3, services/etl/README.md): job opsional, default MATI. Prasyarat dicek efn_etl/config.py
      # (gagal start bila dilanggar) dan deploy-validate.sh: REGION & KDS butuh ETL_ENABLE_ODOO + grant terbaru
      # (efn_region / efn_pos_kds terpasang); KDS_ONLINE butuh ETL_ENABLE_KDS (setelah E-29a efn_online_kds_bridge);
      # RECON_ONLINE butuh rekonsiliasi aktif (ETL_ENABLE_ODOO) + ETL_LOYALTY_POINTS_MODE=payment + view G22.
      ETL_PARTNER_REGION_ENABLED: ${ETL_PARTNER_REGION_ENABLED:-false}
      ETL_LOYALTY_RECON_ONLINE_ENABLED: ${ETL_LOYALTY_RECON_ONLINE_ENABLED:-false}
      ETL_ENABLE_KDS: ${ETL_ENABLE_KDS:-false}
      ETL_KDS_ONLINE_ENABLED: ${ETL_KDS_ONLINE_ENABLED:-false}
      # G32 (docs/04 §21, K25-08): mart waste & yield CK; butuh ETL_ENABLE_ODOO + efn_ck_production + grant G32.
      ETL_ENABLE_WASTE: ${ETL_ENABLE_WASTE:-false}
      # G44 (docs/04 §28.1): mart forecast; butuh ETL_ENABLE_ODOO + model v2 efn_demand_forecast + grant G44.
      # G46 (§28.2a, L-165): histori penjualan ESB pra-cutover -> v_fc_sales_daily; butuh ETL_ENABLE_FORECAST +
      # efn_legacy_history + grant G46.
      ETL_ENABLE_FORECAST: ${ETL_ENABLE_FORECAST:-false}
      ETL_ENABLE_FORECAST_LEGACY: ${ETL_ENABLE_FORECAST_LEGACY:-false}
      # G51 (A6): minggu akurasi forecast yang dihitung ulang (1..12); demo histori as-of 8 minggu = 8.
      ETL_FORECAST_ACCURACY_WEEKS: ${ETL_FORECAST_ACCURACY_WEEKS:-2}
      # Interval minimum hitung ulang akurasi (900..604800 s); demo boleh 900 sementara agar run as-of segera terhitung.
      ETL_FORECAST_ACCURACY_INTERVAL_SECONDS: ${ETL_FORECAST_ACCURACY_INTERVAL_SECONDS:-86400}
      # G47 (docs/04 §28.13): mart Insight supermarket; butuh ETL_ENABLE_ODOO + grant G47 (stok: + ETL_ENABLE_STOCK).
      # EXPIRY/CAMPAIGN butuh ETL_ENABLE_SM; CAMPAIGN ditolak di production selama PROMO_CAMPAIGN_ENABLED != true.
      ETL_ENABLE_SM: ${ETL_ENABLE_SM:-false}
      ETL_SM_COMPANIES: ${ETL_SM_COMPANIES:-SMD}
      ETL_ENABLE_SM_EXPIRY: ${ETL_ENABLE_SM_EXPIRY:-false}
      ETL_ENABLE_SM_CAMPAIGN: ${ETL_ENABLE_SM_CAMPAIGN:-false}
      ETL_SM_FILL_RECALC_DAYS: ${ETL_SM_FILL_RECALC_DAYS:-14}
      ETL_SM_CAMPAIGN_ATTR_DAYS: ${ETL_SM_CAMPAIGN_ATTR_DAYS:-30}
      ETL_SM_STOCK_BACKFILL_DAYS: ${ETL_SM_STOCK_BACKFILL_DAYS:-90}
      # G51 B6: rekonstruksi stok harian historis dari stock_move (0 = mati; demo 90; 0..400; butuh ETL_ENABLE_SM).
      ETL_SM_STOCK_RECONSTRUCT_DAYS: ${ETL_SM_STOCK_RECONSTRUCT_DAYS:-0}
      PROMO_CAMPAIGN_ENABLED: ${PROMO_CAMPAIGN_ENABLED:-false}
      # G50 (docs/04 §28.6/§28.7, ADR-047 Proposed): behavior.event_raw (PG platform) -> efn_dwh.fact_visitor_event +
      # agregat anonim. Default MATI di semua env; production ditolak deploy-validate selama BEHAVIOR_TRACKING_ENABLED
      # mati. Prasyarat: grant services/etl/sql/platform-behavior-grants.sql (skema PG harus cocok, lihat laporan G50).
      ETL_ENABLE_BEHAVIOR: ${ETL_ENABLE_BEHAVIOR:-false}
      ETL_BEHAVIOR_AGG_DAYS: ${ETL_BEHAVIOR_AGG_DAYS:-3}
      ETL_BEHAVIOR_AGG_INTERVAL_SECONDS: ${ETL_BEHAVIOR_AGG_INTERVAL_SECONDS:-3600}
      ETL_BEHAVIOR_K_MIN: ${ETL_BEHAVIOR_K_MIN:-10}
      ETL_BEHAVIOR_ERASURE_RECHECK_HOURS: ${ETL_BEHAVIOR_ERASURE_RECHECK_HOURS:-24}
      ETL_BEHAVIOR_ERASURE_BATCH_SIZE: ${ETL_BEHAVIOR_ERASURE_BATCH_SIZE:-500}
      LOYALTY_POINT_VALUE_IDR: ${LOYALTY_POINT_VALUE_IDR:-100}   # SEC-118: wajib sama dengan api-gateway
      # W-19: harus sama dengan clickhouse-init (TTL kolom pseudonim / geo; ETL gagal start bila di luar rentang)
      CH_PSEUDONYM_RETENTION_YEARS: ${CH_PSEUDONYM_RETENTION_YEARS:-5}
      CH_GEO_RETENTION_DAYS: ${CH_GEO_RETENTION_DAYS:-90}
      # DSAR ClickHouse (docs/04 §8.4): publish privacy.erasure.completed sebagai efn-etl (write amq.default saja)
      AMQP_URL: amqps://efn-etl@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_etl
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      # SEC-51/52 (G13): verifikasi HMAC baris sink audit Odoo dari Loki (query_range lewat loki-tls, mTLS CN etl).
      # Disiapkan devsecops; dipakai services/etl/efn_etl/sink.py (data-AI) bila sudah diaktifkan.
      EFN_AUDIT_SINK_KEY_FILE: /run/secrets/efn_audit_sink_key
      LOKI_URL: https://loki:3100
      LOKI_CA_FILE: /run/secrets/efn_ca_crt
      LOKI_CLIENT_CERT_FILE: /run/secrets/tls_etl_crt
      LOKI_CLIENT_KEY_FILE: /run/secrets/tls_etl_key
    secrets: [pg_password_etl, clickhouse_password_etl, rabbitmq_password_etl, efn_audit_sink_key, tls_etl_crt, tls_etl_key,
              efn_ca_crt]
    networks: [data]   # rabbitmq, postgres, clickhouse, loki (G13) semuanya di network data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    # ETL tidak punya port HTTP: healthcheck hanya memastikan proses utama hidup.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      service: etl

  # ───────────────────────── AI ─────────────────────────
  # Ollama listen 127.0.0.1:11435; TLS oleh sidecar ollama-tls di :11434 (OLLAMA_URL=https://ollama:11434).
  # Network `egress` hanya untuk `ollama pull` model. Tidak read_only: runner diekstrak ke direktori tmp besar.
  ollama:
    <<: *common
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["ai"]
    # Ollama yang bind ke loopback menolak (403) Host selain localhost/os.Hostname()/*.local|.internal (proteksi DNS
    # rebinding). Klien datang lewat sidecar ollama-tls dengan `Host: ollama:11434`; tanpa hostname eksplisit
    # (default = id container) semua panggilan VLM ocr-worker -> 403 -> flagged/vlm_unavailable (G8 E2E).
    hostname: ollama
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal, egress]
    environment:
      OLLAMA_HOST: 127.0.0.1:11435
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "2"
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 12G }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      service: ollama
    # GPU: aktifkan di docker-compose.prod.yml (deploy.resources.reservations.devices)

  ollama-tls:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ollama"
    depends_on: [ollama]
    command:
      - server
      - --listen=0.0.0.0:11434
      - --target=127.0.0.1:11435
      - --cert=/run/secrets/tls_ollama_crt
      - --key=/run/secrets/tls_ollama_key
      # SEC-20: Ollama tanpa autentikasi sendiri -> hanya ocr-worker (+ probe handshake blackbox) yang boleh masuk.
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=ocr-worker
      - --allow-cn=text2sql          # G38: Text-to-SQL (docs/04 §23.4)
      - --allow-cn=blackbox-exporter
      - --status=http://127.0.0.1:6065
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ollama_crt, tls_ollama_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6065/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ollama-tls

  # Worker: amqps (user efn-ocr), PostgreSQL efn_ocr verify-full, MinIO efn-ocr (GetObject saja), Ollama HTTPS,
  # metrik Prometheus HTTPS di :9100.
  ocr-worker:
    <<: *common
    image: ${IMAGE_AI_OCR_WORKER:-ghcr.io/${EFN_STACK:-efn}/ai-ocr-worker:dev}
    build:
      context: ../../services/ai-ocr-worker
    profiles: ["ai"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      AMQP_URL: amqps://efn-ocr@rabbitmq:5671
      RABBITMQ_URL: amqps://efn-ocr@rabbitmq:5671
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_ocr
      AMQP_TLS_CA_FILE: /run/secrets/efn_ca_crt
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-efn_platform}
      PG_USER: efn_ocr
      PG_PASSWORD_FILE: /run/secrets/pg_password_ocr
      PG_SSLMODE: verify-full
      PG_SSLROOTCERT: /run/secrets/efn_ca_crt
      OLLAMA_URL: https://ollama:11434
      OLLAMA_CA_FILE: /run/secrets/efn_ca_crt
      # mTLS ke sidecar ollama-tls (--allow-cn=ocr-worker, docs/04 §8.5): sertifikat tls_ocr_worker (EKU server+client)
      OLLAMA_CLIENT_CERT_FILE: /run/secrets/tls_ocr_worker_crt
      OLLAMA_CLIENT_KEY_FILE: /run/secrets/tls_ocr_worker_key
      OLLAMA_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      # Lewat filter L7 s3-gateway (ADR-030); access key = secret acak (docs/04 §8.12/§8.13)
      MINIO_ENDPOINT: s3-gateway
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "true"
      MINIO_CA_FILE: /run/secrets/efn_ca_crt
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_ocr_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_ocr_secret
      MINIO_BUCKET_MARKET_SCOUT: market-scout
      OCR_CONFIDENCE_THRESHOLD: "0.80"
      NAME_SIMILARITY_THRESHOLD: "0.75"
      # E12 ditutup (gel. 12): worker tetap HTTPS+mTLS tetapi HANYA di loopback :9101 (prometheus-client tidak bisa
      # membatasi CN). Dari network: ocr-worker-metrics-tls :9100 (--allow-cn=prometheus) -> 127.0.0.1:9102
      # ocr-worker-metrics-bridge (ghostunnel client, TLS ke worker, verify-cn ocr-worker) -> 127.0.0.1:9101.
      # Healthcheck worker tetap ke 127.0.0.1:${METRICS_PORT}.
      METRICS_PORT: "9101"
      METRICS_BIND_ADDRESS: 127.0.0.1
      METRICS_TLS_CERT_FILE: /run/secrets/tls_ocr_worker_crt
      METRICS_TLS_KEY_FILE: /run/secrets/tls_ocr_worker_key
      METRICS_TLS_CA_FILE: /run/secrets/efn_ca_crt
      METRICS_TLS_CLIENT_CA_FILE: /run/secrets/efn_ca_crt
    secrets:
      - rabbitmq_password_ocr
      - minio_ocr_access_key
      - minio_ocr_secret
      - pg_password_ocr
      - efn_ca_crt
      - tls_ocr_worker_crt
      - tls_ocr_worker_key
    # K25-06: alias `ocr-worker-metrics` HANYA di network `internal` (dns_sd Prometheus, lihat api-gateway).
    networks:
      internal:
        aliases: [ocr-worker-metrics]
      data:
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2G }
    healthcheck:
      test: ["CMD", "python", "-m", "efn_ocr.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      service: ocr-worker

  # G38 (docs/04 §23, K25-01, Q-48): Text-to-SQL "Tanya Data". Dipanggil Odoo (HTTPS 8443, X-EFN-Service-Key);
  # LLM Ollama lokal (mTLS CN text2sql) atau 9router (overlay docker-compose.llm-text2sql.yml: egress + key);
  # ClickHouse HTTPS 8443 user efn_text2sql (readonly=2, database efn_t2s, row policy per PT bertanda tangan).
  # Kill switch TEXT2SQL_ENABLED (default false). Tanpa egress di base (ADR-014).
  text2sql:
    <<: *common
    image: ${IMAGE_TEXT2SQL:-ghcr.io/${EFN_STACK:-efn}/text2sql:dev}
    build:
      context: ../../services/text2sql
    profiles: ["ai"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-production}
      TEXT2SQL_ENABLED: ${TEXT2SQL_ENABLED:-false}
      TEXT2SQL_PORT: "8443"
      TLS_CERT_FILE: /run/secrets/tls_text2sql_crt
      TLS_KEY_FILE: /run/secrets/tls_text2sql_key
      TEXT2SQL_API_KEY_FILE: /run/secrets/text2sql_api_key
      TEXT2SQL_SCOPE_KEY_FILE: /run/secrets/text2sql_scope_key
      CH_HOST: clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      CH_CA_FILE: /run/secrets/efn_ca_crt
      CH_USER: efn_text2sql
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_text2sql
      TEXT2SQL_LLM_PROVIDER: ollama
      OLLAMA_URL: https://ollama:11434
      OLLAMA_CA_FILE: /run/secrets/efn_ca_crt
      OLLAMA_CLIENT_CERT_FILE: /run/secrets/tls_text2sql_crt
      OLLAMA_CLIENT_KEY_FILE: /run/secrets/tls_text2sql_key
      TEXT2SQL_OLLAMA_MODEL: ${TEXT2SQL_OLLAMA_MODEL:-qwen2.5-coder:7b}
      # G39 (docs/04 §24): Analisis bertahap. Ringkasan = angka hasil agregat dikirim ke LLM; di base hanya
      # none/ollama yang bisa jalan (9router butuh overlay llm-text2sql + TEXT2SQL_AGENT_RESULTS_CROSS_BORDER_OK).
      TEXT2SQL_AGENT_ENABLED: ${TEXT2SQL_AGENT_ENABLED:-false}
      TEXT2SQL_AGENT_SUMMARY_PROVIDER: ${TEXT2SQL_AGENT_SUMMARY_PROVIDER:-none}
    secrets:
      - text2sql_api_key
      - text2sql_scope_key
      - clickhouse_password_text2sql
      - tls_text2sql_crt
      - tls_text2sql_key
      - efn_ca_crt
    networks: [internal, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "python", "-m", "efn_text2sql.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      service: text2sql

  # E12 (ADR-022) ditutup: /metrics worker dari network hanya untuk CN prometheus. Dua sidecar di namespace worker
  # (di-recreate bersama ocr-worker): server mTLS :9100 -> loopback :9102 -> client TLS -> worker 127.0.0.1:9101.
  # Hop plaintext hanya 127.0.0.1:9102 di namespace worker (pola E1). Worker sendiri tetap mewajibkan sertifikat
  # klien CA internal; bridge memakai sertifikat ocr-worker (EKU server+client) dan memverifikasi CN ocr-worker.
  ocr-worker-metrics-tls:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ocr-worker"
    depends_on: [ocr-worker-metrics-bridge]
    command:
      - server
      - --listen=0.0.0.0:9100
      - --target=127.0.0.1:9102
      - --cert=/run/secrets/tls_ocr_worker_crt
      - --key=/run/secrets/tls_ocr_worker_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6075
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ocr_worker_crt, tls_ocr_worker_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6075/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ocr-worker-metrics-tls

  ocr-worker-metrics-bridge:
    <<: *ghostunnel
    profiles: ["ai"]
    network_mode: "service:ocr-worker"
    depends_on: [ocr-worker]
    command:
      - client
      - --listen=127.0.0.1:9102
      - --target=127.0.0.1:9101
      - --override-server-name=ocr-worker
      - --cert=/run/secrets/tls_ocr_worker_crt
      - --key=/run/secrets/tls_ocr_worker_key
      - --cacert=/run/secrets/efn_ca_crt
      - --verify-cn=ocr-worker
      - --status=http://127.0.0.1:6076
      - --quiet=conns
    secrets: [efn_ca_crt, tls_ocr_worker_crt, tls_ocr_worker_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6076/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: ocr-worker-metrics-bridge

  # ───────────────────────── OBSERVABILITY ─────────────────────────
  # Endpoint HTTP komponen exporter-toolkit hanya TLS (infra/observability/web-config.yml). Image busybox tidak
  # bisa memverifikasi TLS di healthcheck -> healthcheck Docker dinonaktifkan untuk komponen ber-TLS tanpa klien
  # yang sesuai; kesehatannya dipantau Prometheus (`up`, EfnServiceDown) dan Uptime Kuma.
  prometheus:
    <<: *common
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web-config.yml
      - --storage.tsdb.retention.time=30d
    # tls_server_crt/key = sertifikat `prometheus` (EKU server+client): server web UI/API (mTLS: klien prometheus,
    # grafana) DAN sertifikat klien untuk semua scrape/alerting (docs/04 §8.5).
    secrets:
      - efn_ca_crt
      - minio_prometheus_token
      - source: tls_prometheus_crt
        target: tls_server_crt
      - source: tls_prometheus_key
        target: tls_server_key
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/web-config-ui.yml:/etc/prometheus/web-config.yml:ro
      - ../observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ../observability/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks: [internal, data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      disable: true
    labels:
      service: prometheus

  # Image Loki 3.x tidak membawa shell/wget -> healthcheck Docker tidak tersedia;
  # kesehatan Loki dipantau Prometheus (job `loki`, alert EfnServiceDown).
  # SEC-35 (gelombang 9): Loki tidak mendukung allowlist CN klien -> Loki listen 127.0.0.1:3101 (pola E1) dan
  # sidecar loki-tls (:3100) hanya menerima mTLS CN promtail (push), grafana (query), prometheus (metrik).
  # Sertifikat klien lain (mis. ocr-worker, blackbox) ditolak -> log tidak bisa dibaca/dipalsukan dari sana.
  loki:
    <<: *common
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki.yml
    # Gelombang 11: ruler Loki mengirim alert sink audit Odoo (SEC-43) ke Alertmanager lewat mTLS (sertifikat loki,
    # EKU server+client; Alertmanager allowlist SAN loki di web-config-alertmanager.yml).
    secrets: [efn_ca_crt, tls_loki_crt, tls_loki_key]
    volumes:
      - ../observability/loki.yml:/etc/loki/loki.yml:ro
      - ../observability/loki-rules:/etc/loki/rules/fake:ro
      - loki-data:/loki
    networks: [internal, data]   # data: klien etl (G13, mTLS CN etl di loki-tls)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      disable: true
    labels:
      service: loki

  loki-tls:
    <<: *ghostunnel
    profiles: ["observability"]
    network_mode: "service:loki"
    depends_on: [loki]
    command:
      - server
      - --listen=0.0.0.0:3100
      - --target=127.0.0.1:3101
      - --cert=/run/secrets/tls_loki_crt
      - --key=/run/secrets/tls_loki_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=promtail
      - --allow-cn=grafana
      - --allow-cn=prometheus
      - --allow-cn=etl          # G13: baca baris sink audit untuk verifikasi HMAC (SEC-51)
      - --status=http://127.0.0.1:6067
      - --quiet=conns
    secrets: [efn_ca_crt, tls_loki_crt, tls_loki_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6067/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: loki-tls

  promtail:
    <<: *common
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    profiles: ["observability"]
    # K25-06: docker_sd melihat SEMUA container host (lewat docker-socket-proxy); filter label project compose
    # (@EFN_STACK@ di promtail.yml) dirender infra/stack/render-config.sh ke /tmp (tmpfs) agar log stack lain (dev/stg,
    # project non-EFN) tidak masuk Loki stack ini. Bukan -config.expand-env: itu mengubah backslash regex redaksi.
    entrypoint: ["/bin/sh", "/efn/render-config.sh", "/etc/promtail/promtail.yml", "/tmp/promtail.yml", "/usr/bin/promtail"]
    command: -config.file=/tmp/promtail.yml
    environment:
      EFN_STACK: ${EFN_STACK:-efn}
    secrets: [efn_ca_crt, tls_promtail_crt, tls_promtail_key]
    volumes:
      - ../observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - ../stack/render-config.sh:/efn/render-config.sh:ro
      - promtail-positions:/var/lib/promtail
    networks: [internal, socket-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: promtail

  grafana:
    <<: *common
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://ops.${TRAEFIK_DOMAIN:-efn.local}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /run/secrets/tls_grafana_crt
      GF_SERVER_CERT_KEY: /run/secrets/tls_grafana_key
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password, efn_ca_crt, tls_grafana_crt, tls_grafana_key]
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      disable: true   # dipantau probe-internal-tls (grafana:3000) + Uptime Kuma
    labels:
      service: grafana
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      traefik.http.routers.ops.rule: Host(`ops.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.ops.entrypoints: wg-https
      traefik.http.routers.ops.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.ops.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.ops.loadbalancer.server.port: "3000"
      traefik.http.services.ops.loadbalancer.server.scheme: https
      traefik.http.services.ops.loadbalancer.serversTransport: efn-grafana@file

  # HTTPS native (UPTIME_KUMA_SSL_*); healthcheck bawaan image (extra/healthcheck) mengikuti mode SSL.
  # Tidak cap_drop: entrypoint melakukan chown data.
  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:1.23.16@sha256:431fee3be822b04861cf0e35daf4beef6b7cb37391c5f26c3ad6e12ce280fe18
    profiles: ["observability"]
    environment:
      UPTIME_KUMA_SSL_CERT: /run/secrets/tls_uptime_kuma_crt
      UPTIME_KUMA_SSL_KEY: /run/secrets/tls_uptime_kuma_key
      NODE_EXTRA_CA_CERTS: /run/secrets/efn_ca_crt
    secrets: [efn_ca_crt, tls_uptime_kuma_crt, tls_uptime_kuma_key]
    volumes:
      - uptime-kuma-data:/app/data
    networks: [internal, egress]
    deploy:
      resources:
        limits: { memory: 512M }
    labels:
      service: uptime-kuma
      traefik.enable: "true"
      traefik.docker.network: ${EFN_STACK:-efn}_internal
      traefik.http.routers.status.rule: Host(`status.${TRAEFIK_DOMAIN:-efn.local}`)
      traefik.http.routers.status.entrypoints: wg-https
      traefik.http.routers.status.tls: "true"   # sertifikat dari acme-dns (SEC-37), bukan resolver Traefik
      traefik.http.routers.status.middlewares: internal-ops@file,secure-headers@file
      traefik.http.services.status.loadbalancer.server.port: "3001"
      traefik.http.services.status.loadbalancer.server.scheme: https
      traefik.http.services.status.loadbalancer.serversTransport: efn-uptime-kuma@file

  # ───────────────────────── OPS (alerting + exporter) ─────────────────────────
  # Cluster gossip (9094) dimatikan: single instance, tidak ada listener plaintext.
  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    profiles: ["ops"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.config.file=/etc/alertmanager/web-config.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.external-url=https://ops.${TRAEFIK_DOMAIN:-efn.local}/alertmanager
    secrets:
      - alertmanager_webhook_url
      - efn_ca_crt
      - source: tls_alertmanager_crt
        target: tls_server_crt
      - source: tls_alertmanager_key
        target: tls_server_key
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../observability/web-config-alertmanager.yml:/etc/alertmanager/web-config.yml:ro
      - alertmanager-data:/alertmanager
    networks: [internal, egress]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: alertmanager

  # Metrik host (disk, CPU, memori) + textfile collector untuk status backup/restore-test & masa berlaku
  # sertifikat internal (ditulis scripts/backup.sh, restore-test.sh, deploy.sh ke ${NODE_EXPORTER_TEXTFILE_DIR}).
  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: ["ops"]
    command:
      - --path.rootfs=/host
      - --web.config.file=/etc/node-exporter/web-config.yml
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    pid: host
    secrets:
      - efn_ca_crt
      - source: tls_node_exporter_crt
        target: tls_server_crt
      - source: tls_node_exporter_key
        target: tls_server_key
    volumes:
      - /:/host:ro,rslave
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/efn/node-exporter}:/textfile:ro
      - ../observability/web-config.yml:/etc/node-exporter/web-config.yml:ro
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: node-exporter

  # cAdvisor (SEC-09): tanpa docker.sock, tanpa rootfs host. Metadata container lewat docker-socket-proxy (mTLS,
  # read-only GET), statistik dari /sys/fs/cgroup (cgroup namespace host) + /var/lib/docker/image (metadata layer
  # saja, bukan volume). cap_drop ALL. Listen 127.0.0.1:8080; TLS oleh sidecar cadvisor-tls :8443.
  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    profiles: ["ops"]
    cgroup: host
    command:
      - --listen_ip=127.0.0.1
      - --port=8080
      - --docker=tcp://docker-socket-proxy:2376
      - --docker-tls
      - --docker-tls-ca=/run/secrets/efn_ca_crt
      - --docker-tls-cert=/run/secrets/tls_cadvisor_crt
      - --docker-tls-key=/run/secrets/tls_cadvisor_key
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    secrets: [efn_ca_crt, tls_cadvisor_crt, tls_cadvisor_key]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/image:/var/lib/docker/image:ro
    networks: [internal, socket-proxy]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: cadvisor

  cadvisor-tls:
    <<: *ghostunnel
    profiles: ["ops"]
    network_mode: "service:cadvisor"
    depends_on: [cadvisor]
    command:
      - server
      - --listen=0.0.0.0:8443
      - --target=127.0.0.1:8080
      - --cert=/run/secrets/tls_cadvisor_crt
      - --key=/run/secrets/tls_cadvisor_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6066
      - --quiet=conns
    secrets: [efn_ca_crt, tls_cadvisor_crt, tls_cadvisor_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6066/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: cadvisor-tls

  # postgres-exporter: user efn_exporter (pg_monitor), TLS verify-full ke PostgreSQL, endpoint metrik TLS.
  postgres-exporter:
    <<: *common
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
    profiles: ["ops"]
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yml
      - --web.config.file=/etc/postgres-exporter/web-config.yml
    environment:
      DATA_SOURCE_URI: postgres:5432/${PG_DB:-efn_platform}?sslmode=verify-full&sslrootcert=/run/secrets/efn_ca_crt
      DATA_SOURCE_USER: efn_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_password_exporter
    secrets:
      - pg_password_exporter
      - efn_ca_crt
      - source: tls_postgres_exporter_crt
        target: tls_server_crt
      - source: tls_postgres_exporter_key
        target: tls_server_key
    volumes:
      - ../observability/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
      - ../observability/web-config.yml:/etc/postgres-exporter/web-config.yml:ro
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 128M }
    healthcheck:
      disable: true
    labels:
      service: postgres-exporter

  # redis_exporter: rediss + ACL efn-exporter. Password dari secret lewat wrapper (env REDIS_PASSWORD hanya di proses
  # exporter). SEC-35 (gelombang 9): redis_exporter tidak mendukung allowlist CN -> endpoint metrik di loopback
  # 127.0.0.1:9122 (pola E1) dan sidecar redis-exporter-tls (:9121) hanya menerima mTLS CN prometheus.
  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.97.0-alpine@sha256:ae30be386ab25600a8b222538a868d1b156b7e411073f7d2d5208fe79cc98d81
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "-c", "export REDIS_PASSWORD=\"$$(cat /run/secrets/redis_password_exporter)\"; exec /redis_exporter"]
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_USER: efn-exporter
      # CA untuk koneksi KLIEN exporter -> Redis (TLS terverifikasi)
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /run/secrets/efn_ca_crt
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 127.0.0.1:9122
    secrets: [redis_password_exporter, efn_ca_crt]
    networks: [cache, data]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      disable: true
    labels:
      service: redis-exporter

  redis-exporter-tls:
    <<: *ghostunnel
    profiles: ["ops"]
    network_mode: "service:redis-exporter"
    depends_on: [redis-exporter]
    command:
      - server
      - --listen=0.0.0.0:9121
      - --target=127.0.0.1:9122
      - --cert=/run/secrets/tls_redis_exporter_crt
      - --key=/run/secrets/tls_redis_exporter_key
      - --cacert=/run/secrets/efn_ca_crt
      - --allow-cn=prometheus
      - --status=http://127.0.0.1:6068
      - --quiet=conns
    secrets: [efn_ca_crt, tls_redis_exporter_crt, tls_redis_exporter_key]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6068/_status"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      service: redis-exporter-tls

  # Probe health (HTTPS internal), handshake TLS semua listener internal, dan HTTPS publik (sertifikat ACME).
  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    profiles: ["ops"]
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.config.file=/etc/blackbox/web-config.yml
    secrets:
      - efn_ca_crt
      - source: tls_blackbox_exporter_crt
        target: tls_server_crt
      - source: tls_blackbox_exporter_key
        target: tls_server_key
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ../observability/web-config.yml:/etc/blackbox/web-config.yml:ro
    # insight-ingress (G42): probe https://insight-web:3443/api/health (mTLS CN blackbox-exporter)
    # login-ingress (G62): probe https://login-gateway:3443/healthz (mTLS CN blackbox-exporter)
    networks: [internal, data, cache, egress, insight-ingress, login-ingress]
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 64M }
    healthcheck:
      disable: true
    labels:
      service: blackbox-exporter

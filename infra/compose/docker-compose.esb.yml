# G41 (docs/04 §25, ADR-040 Proposed, K25-02): ekstraksi ESB Core API (POS ESB yang dipakai brand) -> ClickHouse
# (raw efn_esb.* + mart efn_dwh.*esb*). Runbook: docs/runbooks/esb-extract.md.
#
# Mengapa overlay, bukan service di base:
#   - Pola repo untuk fitur opsional yang memakai kredensial pihak ketiga dan egress (docker-compose.llm.yml G37,
#     docker-compose.payment.yml): tanpa overlay TIDAK ada service yang memegang password ESB maupun jalur keluar ke ESB.
#   - Image esb-extract belum masuk rantai rilis bertanda tangan (IMAGE_* di deploy.yml/efn-deploy/deploy.sh, SEC-42).
#     Bila service ada di base, deploy produksi profil `data` akan mencoba menarik ghcr.io/efn/esb-extract:dev -> gagal.
#     Wiring rilis (IMAGE_ESB_EXTRACT, ESB_* di EFN_RELEASE_CONFIG_VARS, deploy.sh menyertakan overlay bila
#     ESB_ENABLED=true) = tindak lanjut, lihat runbook §8.
#   Dev/staging lokal: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.esb.yml \
#                        --profile core --profile data up -d esb-extract
#
# Jaringan (least privilege):
#   - `esb` (internal, baru): HANYA clickhouse <-> esb-extract (+ G43 esb-migrate, profil `migrate`, sekali jalan).
#     esb-extract TIDAK di network `data` (PostgreSQL, RabbitMQ, MinIO-gateway, Loki): service ini memproses JSON dari
#     internet, jadi bila disusupi tidak bisa menjangkau DB lain. esb-migrate tidak punya egress sama sekali.
#   - `egress-esb` (SEC-183): jalur keluar internet KHUSUS esb-extract (bukan `egress` bersama BFF/acme-dns/ollama),
#     subnet sendiri, enable_icc=false. Bila esb-extract disusupi tidak ada jalur L3 ke container lain lewat egress.
#     Repo TIDAK punya egress proxy/firewall per host (sama dengan 9router G37 dan WhatsApp): allowlist
#     `services.esb.co.id:443` (+ G69: `esbcore.co.id:443`, ESB OMS, POST-baca path persis) ditegakkan DI APLIKASI (klien HTTP efn_esb: host tetap, https saja, tanpa redirect lintas
#     host, tanpa proxy dari env). Allowlist tingkat jaringan (nftables subnet egress-esb -> IP ESB:443) = sisa risiko
#     (runbook §9).
#
# Secret: password ESB per brand (esb_core_password_<brand>, `host:disabled` di scripts/secrets.list, diisi operator di
# host; tidak di GitHub Environment) + clickhouse_password_esb (random; juga di-mount clickhouse-init di base).
# Username API per brand (SEC-180): TIDAK ditulis di repo (repo publik; akun saat ini berhak admin). Diisi lewat
# `infra/compose/.env` lokal (gitignored) / config rilis; kosong = brand itu gagal start (fail-closed di config.py).
# Hanya GET ke ESB Core (kecuali POST /auth/login), ditegakkan kode efn_esb + test. ESB_ENABLED=false -> service idle.
# G69: ESB OMS = POST-baca allowlist 5 path persis (tanpa push/create/update), ESB_OMS_ENABLED=false default.
services:
  esb-extract:
    image: ${IMAGE_ESB_EXTRACT:-ghcr.io/${EFN_STACK:-efn}/esb-extract:dev}
    build:
      context: ../../services/esb-extract
    profiles: ["data"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service"
    security_opt:
      - no-new-privileges:true
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    # Non-root eksplisit (nobody). Kode di image milik root dan hanya dibaca; tidak ada tulisan di luar /tmp.
    user: "65534:65534"
    command: ["python", "-m", "efn_esb", "run"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Kill switch. false = proses tetap hidup (sleep) tanpa memanggil ESB/ClickHouse (jangan exit 0: restart loop).
      ESB_ENABLED: ${ESB_ENABLED:-false}
      # URL tetap (bukan dari .env): satu-satunya host egress yang diizinkan (dicek scripts/check-encryption.sh).
      ESB_BASE_URL: https://services.esb.co.id/core
      # Brand aktif (pb,wtz,bacha,imd,cup). Default pb saja: brand lain menyala setelah secret-nya diisi (runbook §2).
      ESB_BRANDS: ${ESB_BRANDS:-pb}
      # Username API ESB per brand (SEC-180): bukan secret, tetapi TIDAK boleh di repo publik. Akun yang dipakai saat ini
      # berhak ADMIN di ESB; user teknis read-only = permintaan Q-ESB1 (belum tersedia). Nilai dari .env lokal/config
      # rilis; default kosong (brand aktif tanpa user -> gagal start). Dicek scripts/check-encryption.sh. Password: secret.
      ESB_USER_PB: ${ESB_USER_PB:-}
      ESB_USER_WTZ: ${ESB_USER_WTZ:-}
      ESB_USER_BACHA: ${ESB_USER_BACHA:-}
      ESB_USER_IMD: ${ESB_USER_IMD:-}
      ESB_USER_CUP: ${ESB_USER_CUP:-}
      ESB_PASSWORD_PB_FILE: /run/secrets/esb_core_password_pb
      ESB_PASSWORD_WTZ_FILE: /run/secrets/esb_core_password_wtz
      ESB_PASSWORD_BACHA_FILE: /run/secrets/esb_core_password_bacha
      ESB_PASSWORD_IMD_FILE: /run/secrets/esb_core_password_imd
      ESB_PASSWORD_CUP_FILE: /run/secrets/esb_core_password_cup
      # Etika beban ke API produksi ESB (per brand): token bucket, paralel, batas panggilan per run.
      ESB_RATE_PER_SEC: ${ESB_RATE_PER_SEC:-2.0}
      ESB_WORKERS: ${ESB_WORKERS:-4}
      ESB_MAX_CALLS_PER_RUN: ${ESB_MAX_CALLS_PER_RUN:-20000}
      # Backfill hanya di jendela malam WIB (kecuali --ignore-window); loop incremental tiap N detik.
      ESB_BACKFILL_WINDOW: ${ESB_BACKFILL_WINDOW:-22:00-05:00}
      # SEC-185: --ignore-window di production ditolak kecuali true (dan rentang <= 1 hari, ditegakkan kode).
      # Default false (dicek check-encryption render prod-esb); nyalakan sementara saja, lalu kembalikan false.
      ESB_ALLOW_IGNORE_WINDOW: ${ESB_ALLOW_IGNORE_WINDOW:-false}
      # SEC-187: batas ukuran body respons ESB (byte, default 32 MiB) - container dibatasi 512M.
      ESB_MAX_RESPONSE_BYTES: ${ESB_MAX_RESPONSE_BYTES:-33554432}
      ESB_INTERVAL_SECONDS: ${ESB_INTERVAL_SECONDS:-3600}
      # Cabang Central Kitchen per brand (brand:id|id;...) dan override PT per cabang (brand:branch=KODE,...).
      # G43: default = default config.py (pb 4|38, wtz 5|6, imd 2, cup 4|6). Override PT Bacha yang sudah diketahui:
      # ESB_BRANCH_COMPANY_OVERRIDES=bacha:6=BCR (cabang 6 = Bacha Coffee Retail; cabang 10 menunggu Q-ESB10) - diisi
      # di .env setelah dikonfirmasi klien, BUKAN default di sini (tanpa override semua cabang Bacha = ESB_COMPANY_BACHA).
      ESB_CK_BRANCHES: ${ESB_CK_BRANCHES:-pb:4|38,wtz:5|6,imd:2,cup:4|6}
      ESB_BRANCH_COMPANY_OVERRIDES: ${ESB_BRANCH_COMPANY_OVERRIDES:-}
      # Parameter lain docs/04 §25.2 (QA G41: sebelumnya tidak diteruskan -> nilai di .env tidak berpengaruh).
      # Default = default config.py; kosong = pakai default kode.
      ESB_NON_STORE_BRANCHES: ${ESB_NON_STORE_BRANCHES:-}
      ESB_ENTITIES: ${ESB_ENTITIES:-branch,master,sales,fin_sold,payment,production,delivery,transfer}
      ESB_MAX_RETRIES: ${ESB_MAX_RETRIES:-5}
      ESB_BACKFILL_MAX_CALLS: ${ESB_BACKFILL_MAX_CALLS:-60000}
      ESB_SALES_READY_HOUR_WIB: ${ESB_SALES_READY_HOUR_WIB:-3}
      ESB_CORRECTION_DAYS: ${ESB_CORRECTION_DAYS:-1,7}
      ESB_GAP_FILL_DAYS: ${ESB_GAP_FILL_DAYS:-7}
      ESB_BACKFILL_INCLUDE_INACTIVE: ${ESB_BACKFILL_INCLUDE_INACTIVE:-true}
      ESB_HTTP_TIMEOUT_SECONDS: ${ESB_HTTP_TIMEOUT_SECONDS:-60}
      ESB_MAX_PAGES: ${ESB_MAX_PAGES:-500}
      ESB_COMPANY_BACHA: ${ESB_COMPANY_BACHA:-BCF}
      # G67 margin bahan (docs/04 §31.2): kosong = fitur mati; brand wajib di ESB_BRANDS + purchase_line di ESB_ENTITIES.
      ESB_MARGIN_BRANDS: ${ESB_MARGIN_BRANDS:-}
      ESB_MARGIN_MONTHS: ${ESB_MARGIN_MONTHS:-13}
      ESB_MARGIN_WEEKDAY: ${ESB_MARGIN_WEEKDAY:-0}
      ESB_MARGIN_HOUR_WIB: ${ESB_MARGIN_HOUR_WIB:-2}
      # G69 (amandemen ADR-040 §6b, docs/04 §33): sumber kedua ESB OMS (penjualan level struk). Klien terpisah dari Core:
      # POST-baca allowlist path persis (ditegakkan kode efn_esb + test), Basic auth dengan ESB_USER_<BRAND> + secret
      # esb_core_password_<brand> yang SAMA (tidak ada secret baru). Kill switch sendiri, terpisah dari ESB_ENABLED.
      # Runbook: docs/runbooks/esb-extract.md §10.
      ESB_OMS_ENABLED: ${ESB_OMS_ENABLED:-false}
      # URL tetap (bukan dari .env, pola ESB_BASE_URL): host egress kedua yang diizinkan; dicek persis oleh
      # scripts/check-encryption.sh (tanpa path/query/kredensial).
      ESB_OMS_BASE_URL: https://esbcore.co.id
      # Subset ESB_BRANDS (brand di luar ESB_BRANDS ditolak kode). Default pb saja.
      ESB_OMS_BRANDS: ${ESB_OMS_BRANDS:-pb}
      # Token bucket OMS per brand, terpisah dari bucket Core.
      ESB_OMS_RATE_PER_SEC: ${ESB_OMS_RATE_PER_SEC:-2.0}
      # Tarik ulang hari ini tiap N detik, hanya di jam WIB ESB_OMS_INTRADAY_HOURS; koreksi H-1/H-7.
      ESB_OMS_INTERVAL_SECONDS: ${ESB_OMS_INTERVAL_SECONDS:-900}
      ESB_OMS_INTRADAY_HOURS: ${ESB_OMS_INTRADAY_HOURS:-07-23}
      ESB_OMS_CORRECTION_DAYS: ${ESB_OMS_CORRECTION_DAYS:-1,7}
      # Rem darurat panggilan OMS per run loop / per proses oms-backfill.
      ESB_OMS_MAX_CALLS_PER_RUN: ${ESB_OMS_MAX_CALLS_PER_RUN:-5000}
      ESB_OMS_BACKFILL_MAX_CALLS: ${ESB_OMS_BACKFILL_MAX_CALLS:-60000}
      # Batas keras halaman sales-head per slice (cabang × hari); slice yang menyentuhnya = partial, tanpa checkpoint.
      ESB_OMS_MAX_PAGES: ${ESB_OMS_MAX_PAGES:-500}
      # SEC-OMS-04: OMS aktif di APP_ENV production hanya bila true. HANYA di override lokal efn-prod pra-go-live
      # (keputusan pemilik proyek 25 Nov 2026); default false, check-encryption menolak nilai lain di render repo.
      ESB_OMS_ALLOW_PRODUCTION: ${ESB_OMS_ALLOW_PRODUCTION:-false}
      # ClickHouse HTTPS 8443, CA internal, user efn_esb (role esb_writer: SELECT/INSERT efn_esb.* + efn_dwh.*esb*).
      CH_HOST: clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      CH_CA_FILE: /run/secrets/efn_ca_crt
      CH_DATABASE: efn_dwh
      CH_USER: efn_esb
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_esb
    secrets:
      - esb_core_password_pb
      - esb_core_password_wtz
      - esb_core_password_bacha
      - esb_core_password_imd
      - esb_core_password_cup
      - clickhouse_password_esb
      - efn_ca_crt
    networks: [esb, egress-esb]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    # Tanpa port HTTP (pola etl): healthcheck hanya memastikan proses utama hidup. Kesegaran data dipantau lewat
    # efn_esb.extract_run / v_esb_data_quality (runbook §5).
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      service: esb-extract

  # G43 (docs/04 §27.2, ADR-042 Accepted 18 Nov 2026): mesin migrasi ESB -> Odoo sisi data (export bundel terenkripsi,
  # validate, writeback map_esb_odoo, reconcile). Runbook: docs/runbooks/migrasi-esb-odoo.md.
  #   - Profil `migrate` (bukan `data`): TIDAK pernah ikut `up`; dijalankan eksplisit sekali jalan:
  #       docker compose -f docker-compose.yml -f docker-compose.<env>.yml -f docker-compose.esb.yml \
  #         --profile data --profile migrate run --rm esb-migrate python esb_to_odoo.py export --brand pb ...
  #   - Network HANYA `esb` (internal: tanpa egress, tanpa data/internal): satu-satunya tujuan = clickhouse:8443 (HTTPS,
  #     CA internal, user efn_mig role mig_rw: SELECT dim/fact/view ESB + INSERT map_esb_odoo, tanpa DDL). Tidak ada
  #     jalur jaringan ke Odoo (L-129): pertukaran lewat berkas di MIG_EXCHANGE_DIR.
  #   - Plaintext hanya di tmpfs /work (TMPDIR); bundel di /out selalu AES-256-GCM (kunci migration_bundle_key).
  #   - uid/gid = user `odoo` di image Odoo (EFN_MIG_UID/EFN_MIG_GID, runbook §2): bundel ditulis 0600 dan importer Odoo
  #     (docker-compose.migration.yml) harus bisa membacanya; hasil impor (0600 milik odoo) dibaca balik oleh writeback.
  #     Default 65534 (nobody) = aman tetapi pertukaran dengan Odoo gagal terlihat sampai diisi.
  esb-migrate:
    image: ${IMAGE_ESB_MIGRATE:-ghcr.io/${EFN_STACK:-efn}/esb-migrate:dev}
    build:
      context: ../../scripts/migration
    profiles: ["migrate"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "service"
    security_opt:
      - no-new-privileges:true
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "${EFN_MIG_UID:-65534}:${EFN_MIG_GID:-65534}"
    command: ["python", "esb_to_odoo.py", "--help"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      # ClickHouse HTTPS 8443, CA internal (verify-full), user efn_mig. CH_SECURE wajib true (check-encryption).
      CH_HOST: clickhouse
      CH_PORT: "8443"
      CH_SECURE: "true"
      CH_CA_FILE: /run/secrets/efn_ca_crt
      CH_USER: efn_mig
      CH_PASSWORD_FILE: /run/secrets/clickhouse_password_mig
      MIG_BUNDLE_KEY_FILE: /run/secrets/migration_bundle_key
      MIG_WORKDIR: /work
      MIG_OUT_DIR: /out
      TMPDIR: /work
      # Parameter docs/04 §27.2 (rentang ditegakkan efn_mig/settings.py; di luar rentang -> exit 2).
      EFN_MIG_SALDO_BLOCKED: ${EFN_MIG_SALDO_BLOCKED:-IMD,CUP}
      EFN_MIG_LEGACY_DAYS: ${EFN_MIG_LEGACY_DAYS:-400}
      EFN_MIG_SALES_LINE_MONTHS: ${EFN_MIG_SALES_LINE_MONTHS:-24}
      EFN_MIG_SEGMENT_MAX_ROWS: ${EFN_MIG_SEGMENT_MAX_ROWS:-500000}
      # Masuk manifest (tool.git_sha) untuk jejak berita acara; isi dengan `git rev-parse HEAD` saat menjalankan.
      EFN_GIT_SHA: ${EFN_GIT_SHA:-unknown}
    secrets:
      - clickhouse_password_mig
      - migration_bundle_key
      - efn_ca_crt
    networks: [esb]
    read_only: true
    # /work = MIG_WORKDIR (segmen histori terbesar terdekompresi + tar, docs/04 §27.2 >= 768 MB). tmpfs dihitung ke
    # batas memori cgroup -> limit 1536M (bukan 1 GB di §27.2: 768 MB tmpfs penuh + bundel di memori saat enkripsi).
    tmpfs:
      - /work:size=768m,mode=1777
      - /tmp:size=64m,mode=1777
    volumes:
      # Direktori host di disk terenkripsi (LUKS, docs/04 §27.2), dibuat operator (runbook §2) - tidak dibuat otomatis
      # (create_host_path: false) agar tidak muncul direktori milik root di lokasi salah.
      - type: bind
        source: ${MIG_EXCHANGE_DIR:-/var/lib/efn/migration/exchange}
        target: /out
        bind:
          create_host_path: false
      # Tabel pemetaan klien (branch_map.csv, uom_map.csv, ...) - data klien di luar repo, hanya-baca.
      - type: bind
        source: ${MIG_MAPS_DIR:-/var/lib/efn/migration/maps}
        target: /maps
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536M }
    # Sekali jalan: healthcheck tidak bermakna (proses selesai dengan exit code 0..4, docs/04 §27.2).
    healthcheck:
      disable: true
    labels:
      service: esb-migrate

  # ClickHouse ikut network `esb` agar esb-extract tidak perlu berada di network `data`. Daftar network digabung
  # (union) dengan base; sertifikat tls_clickhouse ber-SAN `clickhouse` berlaku di network mana pun.
  clickhouse:
    networks: [data, esb]

# K25-06: nama `<EFN_STACK>_<key>` + subnet <EFN_SUBNET_BASE>.7/.8 (peta oktet di docker-compose.yml).
networks:
  esb:           # hanya clickhouse <-> esb-extract / esb-migrate (dicek scripts/check-encryption.sh)
    name: ${EFN_STACK:-efn}_esb
    internal: true
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.7.0/24" }]
  egress-esb:    # SEC-183: keluar internet HANYA esb-extract (dicek check-encryption); tanpa komunikasi antar-container
    name: ${EFN_STACK:-efn}_egress-esb
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config: [{ subnet: "${EFN_SUBNET_BASE:-172.30}.8.0/24" }]

secrets:
  esb_core_password_pb: { file: ../../secrets/esb_core_password_pb.txt }
  esb_core_password_wtz: { file: ../../secrets/esb_core_password_wtz.txt }
  esb_core_password_bacha: { file: ../../secrets/esb_core_password_bacha.txt }
  esb_core_password_imd: { file: ../../secrets/esb_core_password_imd.txt }
  esb_core_password_cup: { file: ../../secrets/esb_core_password_cup.txt }

# Override kanal online RTL-GL (Grand Lucky, PT Retail; docs/04 §11.3, G19 W-21). Pola docker-compose.online-fnb.yml:
# API key Odoo kanal ini (`odoo_api_key_online_rtl_gl`, user teknis efn_online_rtl_gl) HANYA di-mount ke BFF saat
# ONLINE_CHANNELS memuat RTL-GL (scripts/deploy.sh). Selama kanal mati file ini TIDAK disertakan -> key tidak ada di
# container mana pun. Pembuatan & rotasi key: docs/runbooks/odoo-online-api-key.md (efn-rotate-online-key).
# CI (job infra) menyertakan file ini saat membandingkan secrets compose dengan scripts/secrets.list.
services:
  api-gateway:
    environment:
      ODOO_API_KEY_ONLINE_RTL_GL_FILE: /run/secrets/odoo_api_key_online_rtl_gl
    secrets:
      - odoo_api_key_online_rtl_gl

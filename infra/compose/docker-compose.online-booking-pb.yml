# Override reservasi meja PB (PT Paris Baguette; docs/04 §15.3/§15.9 L-85, G23 W-35). Pola docker-compose.online-qr-<pt>.yml:
# API key Odoo user teknis reservasi `efn_booking_pb` (secret `odoo_api_key_booking_pb`, grup
# efn_table_booking.group_booking_bff, satu company, tanpa ACL dokumen) HANYA di-mount ke BFF saat BOOKING_ENABLED=true dan
# BOOKING_COMPANIES memuat PB (scripts/deploy.sh). Selama reservasi mati file ini TIDAK disertakan -> key tidak ada di
# container mana pun dan BFF memperlakukan PT ini sebagai "reservasi tidak dikonfigurasi". Nama file sengaja
# `online-booking-<pt>` agar efn-rotate-online-key --channel=BOOKING-PB --bootstrap, CI (job infra, glob online-*) dan
# scripts/check-encryption.sh ikut memakainya. Pembuatan & rotasi key: docs/runbooks/odoo-booking-api-key.md.
services:
  api-gateway:
    environment:
      ODOO_API_KEY_BOOKING_PB_FILE: /run/secrets/odoo_api_key_booking_pb
    secrets:
      - odoo_api_key_booking_pb

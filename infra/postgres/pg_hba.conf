# pg_hba.conf EFN (docs/04 §7.1 + §7.3, ADR-022). Di-mount read-only ke /etc/postgresql/pg_hba.conf dan
# diaktifkan lewat `-c hba_file=...` (compose). File di PGDATA tidak dipakai.
#
# Aturan:
#  - TCP HANYA lewat TLS (`hostssl`) + SCRAM-SHA-256, dan hanya kombinasi database/role yang memang dipakai
#    service tersebut. Semua `hostnossl` ditolak eksplisit -> tidak ada fallback plaintext.
#  - Superuser (POSTGRES_USER, default `postgres`) TIDAK boleh login lewat TCP; hanya socket unix lokal di dalam
#    container postgres (entrypoint init, efn-walg/backup, ops `docker exec`). Socket tidak dibagikan ke container lain.
#  - Urutan penting: baris pertama yang cocok menang.
#  - ADDRESS = 172.30.2.0/24 (network compose `data`, di-pin di docker-compose.yml; SEC-30) - lapisan tambahan.

# TYPE      DATABASE                    USER            ADDRESS     METHOD
local       all                         all                         trust

# Odoo: DB efn_odoo (+ `postgres` untuk wait-loop/pembuatan DB oleh Odoo)
hostssl     efn_odoo,postgres           efn_odoo        172.30.2.0/24         scram-sha-256
# BFF (owner skema platform), ocr-worker
hostssl     efn_platform                efn_bff         172.30.2.0/24         scram-sha-256
hostssl     efn_platform                efn_ocr         172.30.2.0/24         scram-sha-256
# ETL: baca efn_platform + efn_odoo (grant level kolom oleh pemilik skema)
hostssl     efn_platform,efn_odoo       efn_etl         172.30.2.0/24         scram-sha-256
# Metabase: DB aplikasinya sendiri
hostssl     metabase                    efn_metabase    172.30.2.0/24         scram-sha-256
# postgres-exporter (pg_monitor)
hostssl     postgres,efn_platform       efn_exporter    172.30.2.0/24         scram-sha-256

# Selain di atas: tolak (termasuk superuser via TCP dan semua koneksi tanpa TLS)
hostssl     all                         all             all         reject
hostnossl   all                         all             all         reject

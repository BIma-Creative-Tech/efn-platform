# pg_hba.conf EFN (docs/04 §7.1 + §7.3, ADR-022). Di-mount read-only ke /etc/postgresql/pg_hba.conf dan
# diaktifkan lewat `-c hba_file=...` (compose). File di PGDATA tidak dipakai.
#
# Aturan:
#  - TCP HANYA lewat TLS (`hostssl`) + SCRAM-SHA-256, dan hanya kombinasi database/role yang memang dipakai
#    service tersebut. Semua `hostnossl` ditolak eksplisit -> tidak ada fallback plaintext.
#  - Superuser (POSTGRES_USER, default `postgres`) TIDAK boleh login lewat TCP; hanya socket unix lokal di dalam
#    container postgres (entrypoint init, efn-walg/backup, ops `docker exec`). Socket tidak dibagikan ke container lain.
#  - Urutan penting: baris pertama yang cocok menang.
#  - ADDRESS = `samenet` (K25-06): subnet interface server. Container postgres HANYA di network compose `data`
#    (<EFN_SUBNET_BASE>.2.0/24; dicek scripts/check-encryption.sh), jadi cakupannya sama dengan CIDR literal
#    172.30.2.0/24 sebelumnya (SEC-30) untuk EFN_SUBNET_BASE apa pun. `samenet` juga mencakup loopback container
#    postgres sendiri (127.0.0.0/8): hanya proses di dalam container ini, dan hanya role aplikasi di bawah (bukan
#    superuser). Menambah network ke service postgres = memperluas aturan ini -> ditolak check-encryption.sh.
#  - Pengecualian tunggal (G66, docs/04 §30.1, L-252 diterima ADR-051 §4.2): overlay docker-compose.prodplan.yml
#    menambah network `prodplan-db` (<EFN_SUBNET_BASE>.23.0/24) ke postgres. Selama overlay dipakai, `samenet` juga
#    mencakup subnet itu untuk SEMUA baris di bawah. Anggota prodplan-db dikunci {postgres, prodplan} oleh
#    check-encryption.sh, dan container prodplan hanya memegang password role efn_prodplan (SCRAM per role), jadi
#    perluasan efektifnya = satu container yang bisa mencoba login role lain tanpa passwordnya. CIDR literal per baris
#    (lebih sempit) tidak dipakai karena subnet bergantung pada EFN_SUBNET_BASE (K25-06). Tanpa overlay: tidak berubah.

# TYPE      DATABASE                    USER            ADDRESS     METHOD
local       all                         all                         trust

# Odoo: DB efn_odoo (+ `postgres` untuk wait-loop/pembuatan DB oleh Odoo)
hostssl     efn_odoo,postgres           efn_odoo        samenet     scram-sha-256
# BFF (owner skema platform), ocr-worker
hostssl     efn_platform                efn_bff         samenet     scram-sha-256
hostssl     efn_platform                efn_ocr         samenet     scram-sha-256
# ETL: baca efn_platform + efn_odoo (grant level kolom oleh pemilik skema)
hostssl     efn_platform,efn_odoo       efn_etl         samenet     scram-sha-256
# Metabase: DB aplikasinya sendiri
hostssl     metabase                    efn_metabase    samenet     scram-sha-256
# postgres-exporter (pg_monitor)
hostssl     postgres,efn_platform       efn_exporter    samenet     scram-sha-256
# G66 prodplan (docs/04 §30.6): DB efn_prodplan sendiri, role DML saja. Role hanya punya password bila overlay
# docker-compose.prodplan.yml me-mount secret-nya ke postgres (00-roles.sh); tanpa itu role NOLOGIN.
hostssl     efn_prodplan                efn_prodplan    samenet     scram-sha-256

# Selain di atas: tolak (termasuk superuser via TCP dan semua koneksi tanpa TLS)
hostssl     all                         all             all         reject
hostnossl   all                         all             all         reject

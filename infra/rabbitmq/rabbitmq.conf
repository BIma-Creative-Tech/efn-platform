# RabbitMQ EFN (docs/04 §7.1, §7.3, SEC-02/SEC-08). Di-mount MENIMPA /etc/rabbitmq/conf.d/10-defaults.conf
# bawaan image (yang membuka listener 5672 + user guest). Tidak ada listener plaintext.

# AMQP hanya TLS (amqps 5671)
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/efn_ca_crt
ssl_options.certfile   = /run/secrets/tls_rabbitmq_crt
ssl_options.keyfile    = /run/secrets/tls_rabbitmq_key
ssl_options.verify     = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Management UI/API hanya HTTPS (tidak diekspos Traefik; ops via VPN/port-forward)
management.ssl.port       = 15671
management.ssl.cacertfile = /run/secrets/efn_ca_crt
management.ssl.certfile   = /run/secrets/tls_rabbitmq_crt
management.ssl.keyfile    = /run/secrets/tls_rabbitmq_key
management.ssl.versions.1 = tlsv1.3
management.ssl.versions.2 = tlsv1.2

# Metrik Prometheus (SEC-35, gelombang 9): listener TLS 15691 bawaan plugin TIDAK dipakai lagi karena RabbitMQ tidak
# mendukung allowlist CN klien (E12). Plugin rabbitmq_prometheus hanya listen TCP di loopback container (15692; tidak
# bisa dimatikan lewat conf, gelombang 7), lalu sidecar ghostunnel `rabbitmq-metrics-tls` (network namespace yang
# sama) melayani https://rabbitmq:15691 dengan mTLS --allow-cn=prometheus (pola E1 ADR-022). Bonus: klien mTLS
# tidak lagi ke server Erlang (crash public_key pada SAN IP, gelombang 7 no. 8 tidak relevan untuk 15691).
prometheus.tcp.ip   = 127.0.0.1
prometheus.tcp.port = 15692

# User, vhost, permission dari definitions yang dibangkitkan rabbitmq-entrypoint.sh (password dari Docker secret).
# Diimpor setiap boot -> rotasi password = ganti secret + recreate container.
load_definitions = /tmp/efn-definitions.json
loopback_users = none
# User default `guest` tidak dibuat: RabbitMQ melewati pembuatan user default bila definitions dimuat saat boot.

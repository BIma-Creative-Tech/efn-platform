# s3-gateway: filter L7 di depan object storage (SILO/MinIO). ADR-030 Keputusan 2 (Proposed; diterapkan lead
# gelombang 9 karena CVE High aktif), docs/04 §7.1 (TLS), §8.12. Risiko: R-S02, R-T08 (proteksi object lock
# pg-backup), R-S06. Komponen: HAProxy LTS (GPL-2.0, open source).
#
# Jalur: klien (BFF, ocr-worker, WAL-G Postgres, Prometheus) --TLS(sertifikat s3-gateway, CA internal)--> HAProxy
#        --TLS re-encrypt (verify required, CA internal, SNI/verifyhost minio)--> minio:9000 di network `objstore`.
# Storage TIDAK ada di network klien; hanya s3-gateway dan minio-init (admin, bootstrap) yang bisa menjangkaunya.
#
# Yang ditolak (403) untuk SEMUA principal yang lewat gateway (aplikasi tidak pernah membutuhkannya):
#   - header x-amz-bypass-governance-retention                  (SN-2026-015: retensi GOVERNANCE pg-backup)
#   - header x-amz-object-lock-* (mode/retain-until/legal-hold) (pasang COMPLIANCE sembarang = DoS storage)
#   - query ?retention ?legal-hold ?object-lock ?versioning ?lifecycle ?policy ?encryption ?replication
#     ?notification ?acl dengan method tulis                    (konfigurasi bucket/objek hanya oleh minio-init)
#   - query ?select / ?select-type                              (CVE-2026-39414, S3 Select tidak dipakai)
#   - header x-amz-content-sha256: STREAMING-UNSIGNED-PAYLOAD-TRAILER (CVE-2026-41145). Diverifikasi: minio-js 8.x
#     dan minio-py 7.2.12 mengirim UNSIGNED-PAYLOAD/sha256, WAL-G v3.0.9 (aws-sdk-go v1) tidak memakai trailer.
#   - kredensial query-string (presigned, X-Amz-Credential) dengan method tulis (CVE-2026-41145; presigned PUT tidak dipakai)
#   - header x-minio-replication-* / x-minio-source-* / x-minio-internal-* (CVE-2026-34204), *snowball* (CVE-2026-40344)
#   - path /minio/* selain /minio/health/* dan /minio/v2/metrics/* (admin API, KMS, peer/storage REST); STS
#     (POST / atau ?Action=)                                    -> admin hanya dari minio-init lewat network objstore
#   - method selain GET/HEAD/PUT/POST/DELETE
# Kebijakan IAM per user (minio-init.sh) tetap berlaku di belakang filter ini (defense in depth).
global
    log stdout format raw local0 info
    maxconn 1024
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2
    # Tidak ada stats socket / runtime API.

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    timeout http-keep-alive 30s
    # Body (foto, segmen WAL, base backup) di-stream, tidak di-buffer.

frontend s3
    # Sertifikat s3-gateway (gen-pki.sh) digabung crt+key oleh entrypoint di tmpfs (HAProxy butuh satu PEM)
    bind :9000 ssl crt /tmp/haproxy/s3-gateway.pem alpn http/1.1
    # Bukti di log: jenis payload hash (bukan nilai rahasia; hanya UNSIGNED-PAYLOAD/sha256/STREAMING-*).
    # %Ta = waktu aktif request (tanpa idle keep-alive), %Tt = total sesi (temuan QA gelombang 10).
    http-request capture req.hdr(x-amz-content-sha256) len 40
    log-format "%ci %HM %HPO %ST %B %U %Ta %Tt cs256=%hr"

    # --- Normalisasi (SEC-41, gelombang 11) -------------------------------------------------------------------
    # Storage (router minio/mux turunan gorilla/mux) men-decode NAMA kunci query (url.QueryUnescape) dan memisah
    # pada ';' juga; sample `query` HAProxy mentah. Diverifikasi di stack dev (SILO): `PUT ?rete%6Etion` dirutekan
    # ke PutObjectRetention dan `PUT ?X-Amz-Cr%65dential=..` ke jalur presigned sebelum aturan ini. Karena itu:
    #  (1) tolak bentuk yang tidak bisa dinormalisasi aman: ';' literal di query (semua method; SDK sah selalu
    #      meng-encode ';' -> %3B), '%' di NAMA kunci query (semua method), dan '%' di mana pun pada query untuk
    #      method tulis (nilai query tulis yang sah hanya uploadId/partNumber/versionId URL-safe);
    #  (2) cocokkan daftar blok pada query yang SUDAH di-decode (url_dec), case-insensitive, pemisah '&' DAN ';'.
    #      (1) membuat double-encoding (%2572...) tidak relevan: query tulis ber-'%' sudah ditolak di (1).
    #  (3) path dibandingkan setelah decode + case-insensitive; segmen dot (/./, /../) dan '//' ditolak (kunci
    #      objek aplikasi tidak pernah memuatnya; mencegah /%6Dinio/admin, /minio/health/../admin).
    #  (4) header: nama header HTX selalu huruf kecil; ACL req.hdr() mengiterasi SEMUA kemunculan (header ganda
    #      ikut diperiksa), dan x-amz-content-sha256 ganda ditolak (Go Header.Get membaca kemunculan pertama).
    # Path-style saja: MINIO_DOMAIN tidak diset di storage, sehingga Host `<bucket>.s3-gateway` tetap dirutekan
    # path-style (diverifikasi). Aturan query/header tidak bergantung pada gaya alamat. Bila MINIO_DOMAIN kelak
    # diaktifkan, aturan p_root wajib ditinjau ulang (POST / pada virtual-host = operasi bucket).
    acl m_allowed      method GET HEAD PUT POST DELETE
    acl m_write        method PUT POST DELETE
    acl h_bypass       req.hdr_cnt(x-amz-bypass-governance-retention) gt 0
    acl h_lock         req.hdr_names -m reg -i (^|,)x-amz-object-lock-
    acl h_minio_int    req.hdr_names -m reg -i (^|,)x-minio-(replication|source|internal)
    acl h_snowball     req.hdr_names -m reg -i snowball
    acl h_trailer      req.hdr(x-amz-content-sha256) -m beg -i STREAMING-UNSIGNED-PAYLOAD-TRAILER
    acl h_sha_dup      req.hdr_cnt(x-amz-content-sha256) gt 1
    acl q_semicolon    query -m sub ;
    acl q_name_pct     query -m reg (^|&)[^=&]*%
    acl q_pct          query -m sub %
    acl q_cfg          query,url_dec -m reg -i (^|[&;])(retention|legal-hold|object-lock|versioning|lifecycle|policy|encryption|replication|notification|acl)(=|&|;|$)
    acl q_select       query,url_dec -m reg -i (^|[&;])(select|select-type)(=|&|;|$)
    acl q_sts          query,url_dec -m reg -i (^|[&;])action(=|&|;|$)
    acl q_presigned    query,url_dec -m reg -i (^|[&;])x-amz-(credential|signature|algorithm)(=|&|;|$)
    acl p_root         path,url_dec -m reg ^/+$
    acl p_dot          path,url_dec -m reg (^|/)\.\.?(/|$)
    acl p_dslash       path,url_dec -m sub //
    acl p_minio        path,url_dec -m beg -i /minio/
    acl p_minio_ok     path -m beg /minio/health/ /minio/v2/metrics/

    http-request deny deny_status 405 if !m_allowed
    http-request deny deny_status 403 if h_bypass
    http-request deny deny_status 403 if h_lock
    http-request deny deny_status 403 if h_minio_int
    http-request deny deny_status 403 if h_snowball
    http-request deny deny_status 403 if h_trailer
    http-request deny deny_status 403 if h_sha_dup
    http-request deny deny_status 403 if q_semicolon
    http-request deny deny_status 403 if q_name_pct
    http-request deny deny_status 403 if q_pct m_write
    http-request deny deny_status 403 if p_dot or p_dslash
    http-request deny deny_status 403 if q_cfg m_write
    http-request deny deny_status 403 if q_select
    http-request deny deny_status 403 if q_sts
    http-request deny deny_status 403 if p_root m_write
    http-request deny deny_status 403 if q_presigned m_write
    http-request deny deny_status 403 if p_minio !p_minio_ok
    default_backend minio

backend minio
    # Host header TIDAK diubah: tanda tangan SigV4 klien mencakup Host (s3-gateway:9000) dan diverifikasi storage.
    server minio minio:9000 ssl verify required ca-file /run/secrets/efn_ca_crt verifyhost minio sni str(minio) alpn http/1.1 check check-ssl inter 10s resolvers docker init-addr last,libc,none
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio

# Healthcheck Docker (loopback namespace sendiri, bukan transaksi data): 200 bila backend minio sehat.
frontend health
    bind 127.0.0.1:8405
    mode http
    acl minio_down nbsrv(minio) lt 1
    monitor-uri /healthz
    monitor fail if minio_down
